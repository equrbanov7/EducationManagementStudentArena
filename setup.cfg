[flake8]
max-line-length = 120
extend-ignore = E203, E266, E501, W503
exclude =
    .git,
    __pycache__,
    migrations,
    venv,
    .venv,
    env,
    .env,
    .claude,
    htmlcov,
    # İSTİNAD MATERİALI, məhsul kodu deyil: göndərilən sillabus JS-ini
    # Node+jsdom altında icra edən qoşqular və ölçmə skriptləri.
    # Pytest də onları toplamır (apps/syllabus/tests/e2e/conftest.py);
    # bax həmin qovluqdakı README.md.
    apps/syllabus/tests/e2e
per-file-ignores =
    # Django settings modules: imported names that appear unused to flake8 ARE
    # actually used by Django's settings loader (it reads the module namespace
    # directly).  F811 is expected when environment-specific files re-assign
    # settings from base (e.g. production EMAIL_HOST overrides base default).
    config/settings/*.py:F401,F811
    config/asgi.py:E402

[isort]
profile = black
line_length = 120
skip = migrations, venv, .venv
known_first_party = apps, core, config

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
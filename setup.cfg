[flake8]
max-line-length = 120
extend-ignore = E203, E266, E501, W503
exclude = 
    .git,
    __pycache__,
    migrations,
    venv,
    .venv,
    env,
    .env

[isort]
profile = black
line_length = 120
skip = migrations, venv, .venv
known_first_party = apps, core, config

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
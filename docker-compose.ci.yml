# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — CI Override for docker-compose.prod.yml
# ═══════════════════════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d
#
# Problems:
#   1. The Piston container requires `privileged: true` and kernel namespace
#      features (nsjail) that are unavailable or unreliable on GitHub Actions
#      runners. Its health check consistently fails in CI, blocking the app.
#   2. The production nginx config requires private origin TLS certificate
#      files for port 443. Those certs are not committed to the repo, so nginx
#      exits in CI before http://localhost/ping/ can respond.
#
# Solution: This override file disables the piston service in CI, removes the
# hard piston dependency from the app service, and swaps nginx to an HTTP-only
# config for localhost smoke tests. The Django app gracefully degrades when
# Piston is unreachable (CODING_EXECUTION_BACKEND is set to "auto" — Docker
# sandbox is preferred, Piston is optional).
# ═══════════════════════════════════════════════════════════════════════════

services:

  # Disable piston entirely in CI — scale to 0 replicas and remove
  # privileged mode so compose doesn't even attempt to start it.
  piston:
    deploy:
      replicas: 0
    privileged: false
    entrypoint: ["true"]
    healthcheck:
      disable: true

  # Mark the piston dependency as not required so compose won't block
  # the app waiting for a service that has 0 replicas.
  # Note: In Docker Compose v2, depends_on maps are merged (not replaced),
  # so we must override the piston entry specifically.
  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      piston:
        condition: service_started
        required: false
    # Override healthcheck to be more aggressive in CI so nginx starts sooner
    # and the /ping/ poll can succeed within the timeout window.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8000)); s.close()\""
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # CI runs only over http://localhost. The production nginx config also
  # requires private origin TLS certificate files for port 443, which are not
  # committed to the repo and would make nginx exit before /ping/ is reachable.
  nginx:
    volumes:
      - ./docker/nginx/nginx.ci.conf:/etc/nginx/conf.d/default.conf:ro

name: 🔐 Prod TLS sertifikatı (Let's Encrypt, certbot HTTP-01 / DNS-01)

# Sahib 2026-09-25: «ssl sertifikatı yarat certbot ilə». Publik A qeydi və 80-ci port hələ yoxdur,
# ona görə yalnız DNS-01 mümkündür (HostGator-da API yoxdur → TXT qeydini sahib əl ilə əlavə edir).
#
#   mode=issue   — certbot (docker, fonda `ems-certbot`) başlayır; TXT dəyəri bu run-ın logunda
#                  «HostGator TXT qeydi» kimi çıxır və run bitir (runner-i tutmur). Konteyner qeyd bütün
#                  authoritative NS-lərdə görünənə qədər (≤45 dəq) gözləyir. Heç bir xidmətə toxunmur.
#   mode=finish  — fondakı certbot bitənə qədər gözləyir, nəticəni və sertifikatı göstərir.
#                  Hesab e-poçtsuz qeydiyyatdan keçir (PII yox). Məlumat serverdə /home/wcu/letsencrypt-də (APP_DIR-dən kənar, rsync silmir).
#   mode=install — sertifikat validate_direct_tls.sh ilə yoxlanır → docker/nginx/certs/origin.{crt,key}
#                  (köhnələri .bak-<tarix>), .env HEALTHCHECK_HOST=<domen> (deploy TLS yoxlaması domeni
#                  yoxlayır), nginx -t + reload, blackbox yenidən; yoxlama zəncir doğrulaması ilə (-k YOX).
#                  confirm=INSTALL. Geri qaytarma: .bak faylları → origin.*, .env.bak-cert-* → .env, reload.
# 2026-09-30 (sahib: «Let's Encrypt şərtlərini qəbul et, sertifikatı qur»): publik A qeydi və 80-ci port
# NAT açıqdır → HTTP-01 (webroot):
#   mode=issue-http — nginx-in /.well-known/acme-challenge/ yolu yoxlanır (loopback), certbot --webroot
#                     sertifikatı alır (Let's Encrypt şərtləri --agree-tos ilə qəbul olunur). Xidmətə toxunmur.
#   mode=renew      — certbot renew (webroot); sertifikat dəyişibsə install skripti ilə nginx-ə qoyulur.
#                     Həftəlik cron (bazar gecəsi) da bunu edir → 90 günlük sertifikat avtomatik yenilənir.
# Quraşdırma məntiqi: scripts/ops/install_le_cert.sh (install və renew eyni qoruyucularla).
on:
  schedule:
    - cron: "17 22 * * 0"   # bazar 22:17 UTC (Bakı 02:17) — renew (lazım deyilsə heç nə etmir)
  workflow_dispatch:
    inputs:
      mode:
        description: "issue-http (HTTP-01 al) / renew (yenilə+qoy) / install (nginx-ə qoy) / issue, finish (DNS-01)"
        required: true
        type: choice
        options: [issue-http, renew, install, issue, finish]
        default: issue-http
      domain:
        description: "Domen"
        required: true
        type: string
        default: ems.wcu.edu.az
      confirm:
        description: "install üçün INSTALL yazın"
        required: false
        type: string
        default: ""

concurrency:
  # issue uzun gözləyir — deploy növbəsini tutmasın; install isə deploy ilə eyni növbədə.
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'install' || inputs.mode == 'renew') && 'production-deploy' || 'prod-cert' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cert:
    name: 🔐 prod-cert (${{ inputs.mode || 'renew' }})
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 60
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
      LE_DIR: /home/wcu/letsencrypt
      MODE: ${{ inputs.mode || 'renew' }}
      DOMAIN: ${{ inputs.domain || 'ems.wcu.edu.az' }}
      CONFIRM: ${{ inputs.confirm }}
      CERTBOT_IMAGE: certbot/certbot:v2.11.0
    steps:
      - name: 🔎 Giriş dəyərləri
        run: |
          set -euo pipefail
          if ! [[ "$DOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "::error::domen formatı yanlışdır"; exit 1
          fi
          if [ "$MODE" = "install" ] && [ "$CONFIRM" != "INSTALL" ]; then
            echo "::error::install üçün confirm=INSTALL lazımdır"; exit 1
          fi

      - name: 📜 certbot certonly (DNS-01, TXT gözlənilir)
        if: env.MODE == 'issue'
        run: |
          set -euo pipefail
          mkdir -p "$LE_DIR"/config "$LE_DIR"/work "$LE_DIR"/logs "$LE_DIR"/hooks
          chmod 700 "$LE_DIR"
          rm -f "$LE_DIR/hooks/challenge.txt"
          cat > "$LE_DIR/hooks/auth.sh" <<'HOOK'
          #!/bin/sh
          # certbot manual-auth-hook: TXT dəyərini fayla yazır (workflow onu loga çıxarır) və qeyd
          # domenin BÜTÜN authoritative NS-lərində görünənə qədər gözləyir.
          set -eu
          apk add --no-cache bind-tools >/dev/null 2>&1 || true
          NAME="_acme-challenge.${CERTBOT_DOMAIN}"
          printf '%s %s\n' "$NAME" "$CERTBOT_VALIDATION" > /hooks/challenge.txt
          ZONE="${CERTBOT_DOMAIN#*.}"
          deadline=$(( $(date +%s) + ${WAIT_SECONDS:-2700} ))
          while :; do
            NS=$(dig +short NS "$ZONE" @8.8.8.8 | sed 's/\.$//')
            ok=1; [ -n "$NS" ] || ok=0
            for ns in $NS; do
              dig +short TXT "$NAME" @"$ns" | tr -d '"' | grep -qx "$CERTBOT_VALIDATION" || ok=0
            done
            if [ "$ok" = 1 ]; then echo "TXT bütün NS-lərdə görünür: $NS"; sleep 30; exit 0; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "TXT vaxtında görünmədi" >&2; exit 1; fi
            sleep 20
          done
          HOOK
          chmod 755 "$LE_DIR/hooks/auth.sh"
          docker rm -f ems-certbot >/dev/null 2>&1 || true
          docker run -d --name ems-certbot -e WAIT_SECONDS=2700 \
            -v "$LE_DIR/config:/etc/letsencrypt" -v "$LE_DIR/work:/var/lib/letsencrypt" \
            -v "$LE_DIR/logs:/var/log/letsencrypt" -v "$LE_DIR/hooks:/hooks" \
            "$CERTBOT_IMAGE" certonly --manual --preferred-challenges dns \
            --manual-auth-hook /hooks/auth.sh -d "$DOMAIN" \
            --agree-tos --register-unsafely-without-email --non-interactive \
            --key-type ecdsa --keep-until-expiring >/dev/null
          for _ in $(seq 1 36); do [ -s "$LE_DIR/hooks/challenge.txt" ] && break; sleep 5; done
          if [ ! -s "$LE_DIR/hooks/challenge.txt" ]; then
            docker logs ems-certbot 2>&1 | tail -20
            echo "::error::certbot TXT dəyərini vermədi"; exit 1
          fi
          read -r name value < "$LE_DIR/hooks/challenge.txt"
          host="${name%.wcu.edu.az}"
          echo "::notice title=HostGator TXT qeydi::Host/Name: ${host}  |  Type: TXT  |  Value: ${value}  |  TTL: 300"
          echo "================ HostGator → DNS Zone Editor → wcu.edu.az → Add Record ================"
          echo "  Type : TXT"
          echo "  Name : ${host}        (tam ad: ${name})"
          echo "  Value: ${value}"
          echo "  TTL  : 300 (və ya ən kiçik icazə verilən)"
          echo "======================================================================================="
          echo "certbot fonda gözləyir (≤45 dəq). Qeyd əlavə olunandan sonra: mode=finish"

      - name: ⏳ certbot nəticəsi (finish)
        if: env.MODE == 'finish'
        run: |
          set -euo pipefail
          if docker inspect ems-certbot >/dev/null 2>&1; then
            for _ in $(seq 1 330); do
              [ "$(docker inspect -f '{{.State.Running}}' ems-certbot)" = "true" ] || break
              sleep 10
            done
            code=$(docker inspect -f '{{.State.ExitCode}}' ems-certbot)
            running=$(docker inspect -f '{{.State.Running}}' ems-certbot)
            [ "$running" = "true" ] && { echo "::error::certbot hələ gözləyir (TXT görünmür)"; exit 1; }
            docker logs ems-certbot 2>&1 | grep -vi "account\|private" | tail -25
            docker rm ems-certbot >/dev/null
          else
            code=0; echo "fonda certbot konteyneri yoxdur — mövcud sertifikat yoxlanır"
          fi
          # Fayllar root-a məxsus yaranıb — runner istifadəçisinə qaytar.
          docker run --rm -v "$LE_DIR:/le" alpine:3.20 chown -R "$(id -u):$(id -g)" /le
          if [ "$code" != 0 ]; then echo "::error::certbot uğursuz (exit $code) — loglar $LE_DIR/logs"; exit 1; fi
          openssl x509 -in "$LE_DIR/config/live/$DOMAIN/fullchain.pem" -noout -subject -issuer -enddate -ext subjectAltName

      - name: 🌐 certbot certonly (HTTP-01, webroot)
        if: env.MODE == 'issue-http'
        run: |
          set -euo pipefail
          mkdir -p "$LE_DIR"/config "$LE_DIR"/work "$LE_DIR"/logs "$LE_DIR"/www/.well-known/acme-challenge
          chmod 700 "$LE_DIR"
          chmod 755 "$LE_DIR/www" "$LE_DIR/www/.well-known" "$LE_DIR/www/.well-known/acme-challenge"
          # 1) nginx webroot-u verirmi? (loopback — server öz publik IP-sinə hairpin ilə çata bilmir)
          probe="ems-probe-$GITHUB_RUN_ID"
          echo ok > "$LE_DIR/www/.well-known/acme-challenge/$probe"; chmod 644 "$LE_DIR/www/.well-known/acme-challenge/$probe"
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' --resolve "$DOMAIN:80:127.0.0.1" "http://$DOMAIN/.well-known/acme-challenge/$probe" || true)
          rm -f "$LE_DIR/www/.well-known/acme-challenge/$probe"
          echo "nginx webroot yoxlaması: HTTP $code"
          [ "$code" = 200 ] || { echo "::error::nginx /.well-known/acme-challenge/ yolunu vermir (əvvəl deploy olunmalıdır)"; exit 1; }
          # 2) sertifikat (Let's Encrypt şərtləri sahibin icazəsi ilə qəbul olunur — 2026-09-30)
          docker run --rm \
            -v "$LE_DIR/config:/etc/letsencrypt" -v "$LE_DIR/work:/var/lib/letsencrypt" \
            -v "$LE_DIR/logs:/var/log/letsencrypt" -v "$LE_DIR/www:/webroot" \
            "$CERTBOT_IMAGE" certonly --webroot -w /webroot -d "$DOMAIN" \
            --agree-tos --register-unsafely-without-email --non-interactive \
            --key-type ecdsa --keep-until-expiring
          docker run --rm -v "$LE_DIR:/le" alpine:3.20 sh -c "chown -R $(id -u):$(id -g) /le && chmod 755 /le/www"
          openssl x509 -in "$LE_DIR/config/live/$DOMAIN/fullchain.pem" -noout -subject -issuer -enddate -ext subjectAltName
          echo "Sertifikat alındı. Növbəti addım: mode=install confirm=INSTALL"

      - name: 🔁 certbot renew (HTTP-01) + quraşdırma
        if: env.MODE == 'renew'
        run: |
          set -euo pipefail
          if [ ! -d "$LE_DIR/config/live/$DOMAIN" ]; then
            echo "Hələ sertifikat yoxdur (mode=issue-http) — yeniləmə atlanır."
            echo "SKIP_VERIFY=1" >> "$GITHUB_ENV"; exit 0
          fi
          docker run --rm \
            -v "$LE_DIR/config:/etc/letsencrypt" -v "$LE_DIR/work:/var/lib/letsencrypt" \
            -v "$LE_DIR/logs:/var/log/letsencrypt" -v "$LE_DIR/www:/webroot" \
            "$CERTBOT_IMAGE" renew --webroot -w /webroot --non-interactive
          docker run --rm -v "$LE_DIR:/le" alpine:3.20 sh -c "chown -R $(id -u):$(id -g) /le && chmod 755 /le/www"
          bash "$APP_DIR/scripts/ops/install_le_cert.sh" "$DOMAIN" "$LE_DIR" "$APP_DIR" --if-changed

      - name: 🧩 Sertifikatı nginx-ə qoy (install)
        if: env.MODE == 'install'
        run: |
          set -euo pipefail
          bash "$APP_DIR/scripts/ops/install_le_cert.sh" "$DOMAIN" "$LE_DIR" "$APP_DIR"

      - name: ✅ Yoxlama (zəncir doğrulaması, -k olmadan)
        if: (env.MODE == 'install' || env.MODE == 'renew') && env.SKIP_VERIFY != '1'
        run: |
          set +e -uo pipefail
          fail=0
          for path in /health/ /accounts/login/; do
            code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN$path")
            echo "  https://$DOMAIN$path → $code"; [[ "$code" =~ ^(200|302)$ ]] || fail=1
          done
          echo | openssl s_client -connect 127.0.0.1:443 -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate
          exit $fail

name: 🔑 Prod secret generate

# Təhlükəsizlik auditi 2026-10-07: exporter-lərin least-privilege girişləri üçün təsadüfi
# sirri SERVERİN ÖZÜNDƏ yaradır və APP_DIR/.env-ə yazır. Dəyər heç vaxt GitHub-a, run
# loguna və ya input-a düşmür (env-update.yml-dən fərqli olaraq — orada input logda görünür).
#   • açar .env-də artıq DOLUDURSA heç nə dəyişmir («already present»);
#   • yoxdursa (və ya boşdursa) 32 baytlıq urlsafe sirr yaradılır («generated»);
#   • .env əvvəlcə .env.bak.<ts>-ə kopyalanır (env-update.yml kimi, son 10 saxlanır), hər şey umask 077;
#   • MONITOR_DB_PASSWORD üçün sirr olmayan yoldaş açar MONITOR_DB_USER=emsarena_monitor da
#     (yoxdursa) yazılır — compose exporter-ləri ${MONITOR_DB_USER:-${POSTGRES_USER}} ilə seçir.
# Aktivləşmə növbəti deploy-dadır (remote_deploy.sh rolu/ACL-i yaradır, alınmasa köhnə girişə
# qayıdır). Ardıcıllıq: key=MONITOR_DB_PASSWORD (redeploy=false), sonra key=REDIS_MONITOR_PASSWORD
# (redeploy=true) — və ya hər ikisini redeploy=false ilə, sonra adi deploy.

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Yaradılacaq sirr (.env açarı)"
        required: true
        type: choice
        options:
          - MONITOR_DB_PASSWORD
          - REDIS_MONITOR_PASSWORD
      redeploy:
        description: "Sonra tam redeploy (remote_deploy.sh, APP_DIR-dəki mövcud kodla) işlət"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  generate:
    runs-on: [self-hosted]
    environment: production
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
      DEPLOY_TIMEOUT_SECONDS: "300"
      TARGET_KEY: ${{ inputs.key }}
    steps:
      - name: 🔑 Generate secret on the server (value is never printed)
        run: |
          set -euo pipefail
          umask 077
          case "$TARGET_KEY" in
            MONITOR_DB_PASSWORD|REDIS_MONITOR_PASSWORD) ;;
            *) echo "Unsupported key" >&2; exit 1 ;;
          esac
          cd "$APP_DIR"
          test -f .env || { echo "Missing $APP_DIR/.env" >&2; exit 1; }
          chmod 600 .env .env.bak.* 2>/dev/null || true

          backup_done=""
          backup_env() {
            [ -n "$backup_done" ] && return 0
            backup_done="$(date +%Y%m%d-%H%M%S)"
            cp .env ".env.bak.${backup_done}"
            # Yalnız son 10 backup qalsın (env-update.yml ilə eyni; adlar .env.bak.<ts>-dir).
            # shellcheck disable=SC2012
            ls -t .env.bak.* 2>/dev/null | tail -n +11 | xargs -r rm -- || true
            echo "backup: .env.bak.${backup_done}"
          }

          if grep -Eq "^${TARGET_KEY}=.+" .env; then
            echo "${TARGET_KEY}: already present"
          else
            backup_env
            # Boş `KEY=` sətri varsa çıxarılır; yeni sətir birbaşa fayla yazılır —
            # dəyər heç bir shell dəyişəninə, argv-yə və ya stdout-a düşmür.
            grep -v "^${TARGET_KEY}=" .env > .env.tmp || true
            mv .env.tmp .env
            { printf '%s=' "$TARGET_KEY"; head -c 32 /dev/urandom | base64 | tr -d '\n=' | tr '+/' '-_'; printf '\n'; } >> .env
            if [ "$(grep -Ec "^${TARGET_KEY}=[A-Za-z0-9_-]{43}$" .env)" != "1" ]; then
              cp ".env.bak.${backup_done}" .env
              echo "${TARGET_KEY}: generation failed, .env restored from backup" >&2
              exit 1
            fi
            echo "${TARGET_KEY}: generated"
          fi

          if [ "$TARGET_KEY" = "MONITOR_DB_PASSWORD" ]; then
            if grep -Eq '^MONITOR_DB_USER=.+' .env; then
              echo "MONITOR_DB_USER: already present"
            else
              backup_env
              grep -v '^MONITOR_DB_USER=' .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s\n' 'MONITOR_DB_USER=emsarena_monitor' >> .env
              echo "MONITOR_DB_USER: added (emsarena_monitor)"
            fi
          fi
          chmod 600 .env

      - name: 🚢 Redeploy (existing main code in APP_DIR)
        if: ${{ inputs.redeploy }}
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          bash scripts/deploy/remote_deploy.sh

      - name: 🔎 Exporter logins (user names only, no secrets)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          cd "$APP_DIR"
          for key in MONITOR_DB_PASSWORD REDIS_MONITOR_PASSWORD; do
            if grep -Eq "^${key}=.+" .env; then echo "${key}: present in .env"; else echo "${key}: absent from .env"; fi
          done
          envof() {
            id="$(docker compose -f docker-compose.prod.yml ps -q "$1" 2>/dev/null | head -n 1)"
            [ -n "$id" ] || { echo "<not running>"; return 0; }
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$id" 2>/dev/null | sed -n "s/^$2=//p" | head -n 1
          }
          echo "postgres_exporter user: $(envof postgres_exporter DATA_SOURCE_USER)"
          # `sed -n …p`: uyğun gəlməyən sətir (parollu connection string) HEÇ VAXT çap olunmur.
          echo "pgbouncer_exporter user: $(envof pgbouncer_exporter PGBOUNCER_EXPORTER_CONNECTION_STRING | sed -nE 's#^[a-z]+://([A-Za-z0-9_]*):.*#\1#p')"
          echo "redis_exporter user: $(envof redis_exporter REDIS_USER | sed 's/^$/default/')"

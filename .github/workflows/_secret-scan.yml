# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Secret Scan (Gitleaks)
# ═══════════════════════════════════════════════════════════════════════════
# Scans the repository for committed secrets / tokens using Gitleaks.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔑 Secret Scan (reusable)

on:
  workflow_call:

jobs:
  secret-scan:
    name: 🔑 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout code (full history for diff-aware scan)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # Təhlükəsizlik auditi 2026-10-07 (AD-14): binar əvvəl `curl | tar` ilə yoxlamasız
      # quraşdırılırdı. İndi tarball fayla yazılır və buraxılışın rəsmi
      # gitleaks_<v>_checksums.txt-dəki SHA-256 ilə (aşağıda pin-lənib) tutuşdurulur;
      # uyğunsuzluqda job dayanır. Versiyanı dəyişəndə checksum-u da yeniləyin.
      - name: 🔑 Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          GITLEAKS_SHA256="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: 🔑 Run Gitleaks secret scan
        run: |
          echo "::group::🔑 Gitleaks Secret Scan"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --log-level info || {
            echo "::error::❌ Gitleaks found secrets in the repository! Remove them before merging."
            exit 1
          }
          echo "✅ No secrets detected."
          echo "::endgroup::"

# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Secret Scan (Gitleaks)
# ═══════════════════════════════════════════════════════════════════════════
# Scans the repository for committed secrets / tokens using Gitleaks.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔑 Secret Scan (reusable)

on:
  workflow_call:

jobs:
  secret-scan:
    name: 🔑 Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout code (full history for diff-aware scan)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔑 Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: 🔑 Run Gitleaks secret scan
        run: |
          echo "::group::🔑 Gitleaks Secret Scan"
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --log-level info || {
            echo "::error::❌ Gitleaks found secrets in the repository! Remove them before merging."
            exit 1
          }
          echo "✅ No secrets detected."
          echo "::endgroup::"

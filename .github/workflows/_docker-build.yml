# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Docker Production Build
# ═══════════════════════════════════════════════════════════════════════════
# Builds the production Docker image and caches the layers in GitHub Actions
# cache so downstream jobs (container-scan, prod-smoke, e2e-smoke) can
# restore it without a full rebuild.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🐳 Docker Prod Build (reusable)

on:
  workflow_call:

jobs:
  docker-prod-build:
    name: 🐳 Docker Prod Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build and push to GHA layer cache only (push: false).
      # Build ARGs supply dummy values so collectstatic can run at build
      # time without real runtime secrets (see Dockerfile.prod).
      - name: 🏗️ Build production Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          tags: emsarena-prod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SECRET_KEY=ci-build-placeholder-not-for-production
            BUILD_DATABASE_URL=sqlite:////tmp/build.db
            BUILD_ALLOWED_HOSTS=localhost,127.0.0.1
            BUILD_ADMIN_ALLOWED_IPS=127.0.0.1
            APT_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

name: 📈 Yük Testi (Locust)

# ops/loadtest-2026-10-05 — İZOLƏ TUTUM TESTİ. Canlı sistemə yük VERMİR:
# Codex-in `emsarena-capacity-20261004` izolə stack-i (internal şəbəkə, ayrıca
# Postgres/PgBouncer/Redis/nginx/4 app) CANLI image ilə qaldırılır, sintetik
# bazada ölçülür və dayandırılır. Canlı /health/ hər 10 s yoxlanır (qoruyucu).

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Pillələr: mode:users@window (login|exam|journal|cabinet|mixed|studentjournal|journalfinal|export|finalcenter)"
        required: true
        type: string
        default: "login:20@10,exam:20@20,journal:10@20,cabinet:20@20"
      teachers:
        description: "Seed ediləcək müəllim/jurnal sayı"
        required: true
        type: string
        default: "20"
      app_cpus:
        description: "Replikalar×CPU, məs. 4x1.0 və ya 6x1.0"
        required: true
        type: string
        default: "1.0"
      db_cpus:
        description: "Postgres CPU"
        required: true
        type: string
        default: "2.0"
      think:
        description: "Sual başına düşünmə vaxtı min:max saniyə"
        required: true
        type: string
        default: "8:20"
      preauth_rate:
        description: "Ön-giriş sürəti (VU/s)"
        required: true
        type: string
        default: "8"
      on_fail:
        description: "Keçməyən pillədə: continue | stop_mode (həmin rejimin qalanı ötürülür) | stop_all"
        required: true
        type: choice
        default: stop_mode
        options: [continue, stop_mode, stop_all]
      preauth:
        description: "İmtahan/kabinet ön-girişi: session (login yükü ayrıca ölçülür) | login"
        required: true
        type: choice
        default: session
        options: [session, login]
      overlay:
        description: "Branch kodunu canlı image üzərində mount et (optimallaşdırma sınağı)"
        required: true
        type: boolean
        default: false

concurrency:
  group: prod-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capacity:
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - name: 🧾 Girişləri yoxla
        env:
          PLAN: ${{ inputs.plan }}
          TEACHERS: ${{ inputs.teachers }}
          APP_CPUS: ${{ inputs.app_cpus }}
          DB_CPUS: ${{ inputs.db_cpus }}
          THINK: ${{ inputs.think }}
          PREAUTH: ${{ inputs.preauth_rate }}
        run: |
          set -euo pipefail
          echo "$PLAN" | grep -Eq '^((login|exam|journal|cabinet|mixed|studentjournal|journalfinal|export|finalcenter):[0-9]{1,5}(@[0-9]{1,4})?)(,(login|exam|journal|cabinet|mixed|studentjournal|journalfinal|export|finalcenter):[0-9]{1,5}(@[0-9]{1,4})?)*$' || { echo "::error::plan formatı"; exit 1; }
          case "$TEACHERS" in ''|*[!0-9]*) echo "::error::teachers rəqəm"; exit 1;; esac
          [ "$TEACHERS" -le 1000 ] || { echo "::error::teachers ≤ 1000"; exit 1; }
          echo "$APP_CPUS" | grep -Eq '^([0-9]{1,2}x)?[0-9.]+$' || { echo "::error::app_cpus"; exit 1; }
          echo "$DB_CPUS" | grep -Eq '^[0-9.]+$' || { echo "::error::db_cpus"; exit 1; }
          echo "$THINK" | grep -Eq '^[0-9.]+:[0-9.]+$' || { echo "::error::think"; exit 1; }
          echo "$PREAUTH" | grep -Eq '^[0-9.]+$' || { echo "::error::preauth"; exit 1; }
          CAP=/home/wcu/emsarena-capacity-20261004
          test -x "$CAP/toolenv/bin/locust" || { echo "::error::toolenv/locust yoxdur"; exit 1; }
          test -f "$CAP/compose.json" -a -f "$CAP/credentials.json" -a -f "$CAP/cert.pem" || { echo "::error::capacity fixture faylları yoxdur"; exit 1; }
          echo "edge nginx — müştəri IP xəritəsi:"; grep -o 'x_test_client[^;]*;\|X-Test-Client[^;]*;\|real_ip_header[^;]*;\|X-Forwarded-For[^;]*;' "$CAP/nginx.conf" | sort -u | head -10 || true

      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📈 Tutum testi
        env:
          PLAN: ${{ inputs.plan }}
          TEACHERS: ${{ inputs.teachers }}
          APP_CPUS: ${{ inputs.app_cpus }}
          DB_CPUS: ${{ inputs.db_cpus }}
          THINK: ${{ inputs.think }}
          PREAUTH: ${{ inputs.preauth_rate }}
          ON_FAIL: ${{ inputs.on_fail }}
          PREAUTH_MODE: ${{ inputs.preauth }}
          OVERLAY: ${{ inputs.overlay }}
        run: |
          set -euo pipefail
          RUN_ID="cap_$(date -u +%Y%m%d_%H%M)"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          EXTRA=(--preauth "$PREAUTH_MODE")
          [ "$ON_FAIL" = "stop_all" ] && EXTRA+=(--stop-on-fail)
          [ "$ON_FAIL" = "stop_mode" ] && EXTRA+=(--stop-mode-on-fail)
          [ "$OVERLAY" = "true" ] && EXTRA+=(--overlay --repo "$GITHUB_WORKSPACE")
          python3 scripts/loadtest/cap_run.py \
            --plan "$PLAN" --run-id "$RUN_ID" --harness "$GITHUB_WORKSPACE/scripts/loadtest" \
            --teachers "$TEACHERS" --replicas "$(case "$APP_CPUS" in *x*) echo "${APP_CPUS%%x*}";; *) echo 4;; esac)" \
            --app-cpus "${APP_CPUS##*x}" --db-cpus "$DB_CPUS" \
            --think-min "${THINK%%:*}" --think-max "${THINK##*:}" --preauth-rate "$PREAUTH" \
            --out "$RUNNER_TEMP/capout" "${EXTRA[@]}"

      - name: 📊 Xülasə
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/capout/summary.md" ]; then cat "$RUNNER_TEMP/capout/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          docker ps --format '{{.Names}}' | grep -E 'cap-gen-|emsarena-capacity' && echo "::warning::test konteynerləri hələ işləyir" || echo "test konteynerləri dayandırılıb"
          curl -sS --max-time 8 --resolve ems.wcu.edu.az:443:127.0.0.1 https://ems.wcu.edu.az/health/ | head -c 300; echo

      - name: 📦 Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-${{ env.RUN_ID }}
          path: ${{ runner.temp }}/capout
          retention-days: 14
          if-no-files-found: warn

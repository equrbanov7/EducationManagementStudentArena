name: 📈 Yük Testi (Locust)

# ops/loadtest-2026-10-05 branch — KƏŞFİYYAT (oxu-yalnız). Heç nə dəyişmir:
# Codex-in 2026-10-04 tutum mühitini, işləyən prosesləri və hostun yükünü göstərir.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon"
        required: true
        type: string
        default: "recon"

concurrency:
  group: prod-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recon:
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - name: 🔎 Kəşfiyyat
        run: |
          set -uo pipefail
          CAP=/home/wcu/emsarena-capacity-20261004
          mask() { sed -E 's/((PASSWORD|PASS|SECRET|TOKEN|KEY|DATABASE_URL|REDIS_URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***MASKED***/Ig; s#(postgres(ql)?://[^:]+:)[^@]+@#\1***@#g'; }
          echo "== whoami / host"; whoami; hostname; date; uptime; nproc; free -g; df -h / /var/lib/docker 2>/dev/null | sort -u
          echo; echo "== running runners / locust"; pgrep -af 'phase[0-9]|runner\.py|locust|k6 ' | grep -v pgrep || echo "(none)"
          echo; echo "== docker compose projects"; docker compose ls -a 2>&1 | head -20
          echo; echo "== capacity containers"; docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' | grep -i capac || echo "(none)"
          echo; echo "== docker stats (live)"; docker stats --no-stream --format '{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' | sort -k2 -rn | head -25
          echo; echo "== capacity dir tree"; ls -la "$CAP" 2>&1 | head -80
          echo; echo "== subdirs"; find "$CAP" -maxdepth 3 -type f -printf '%10s %TY-%Tm-%Td %TH:%TM %p\n' 2>/dev/null | sort -k4 | head -200
          echo; echo "== volumes"; docker volume ls --format '{{.Name}}' | grep -i capac || true
      - name: 📄 Skriptlər (maskalı)
        run: |
          set -uo pipefail
          CAP=/home/wcu/emsarena-capacity-20261004
          mask() { sed -E 's/((PASSWORD|PASS|SECRET|TOKEN|KEY|DATABASE_URL|REDIS_URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***MASKED***/Ig; s#(postgres(ql)?://[^:]+:)[^@]+@#\1***@#g'; }
          find "$CAP" -maxdepth 3 -type f \( -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name '*.sh' -o -name '*.md' -o -name '*.conf' -o -name '*.ini' -o -name '*.txt' -o -name '*.json' \) -size -200k 2>/dev/null | sort | while read -r f; do
            echo; echo "################ $f ($(wc -l < "$f") lines)"
            head -c 60000 "$f" | mask
          done
      - name: 🧾 Log quyruqları
        run: |
          set -uo pipefail
          CAP=/home/wcu/emsarena-capacity-20261004
          mask() { sed -E 's/((PASSWORD|PASS|SECRET|TOKEN|KEY|DATABASE_URL|REDIS_URL)[A-Z_]*[=:][[:space:]]*)[^[:space:]]+/\1***MASKED***/Ig; s#(postgres(ql)?://[^:]+:)[^@]+@#\1***@#g'; }
          find "$CAP" -maxdepth 3 -type f \( -name '*.log' -o -name '*.csv' \) 2>/dev/null | sort | while read -r f; do
            echo; echo "################ $f ($(wc -l < "$f") lines)"
            tail -n 60 "$f" | cut -c1-400 | mask
          done

# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Build Check
# ═══════════════════════════════════════════════════════════════════════════
# Runs collectstatic and checks for missing Django migrations.
# Called by ci.yml via workflow_call.
#
# FAZA 5: this job now runs against PostgreSQL instead of SQLite. The project
# relies on PostgreSQL-only features (Row-Level Security policies in
# organizations.0003/0004/0005, notifications.0003 backfill). On SQLite those
# migrations are silent no-ops, so `makemigrations --check` and migration
# integrity could not be trusted. Building against PostgreSQL closes that gap.
# ═══════════════════════════════════════════════════════════════════════════

name: 🏗️ Build Check (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.11"

jobs:
  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: build_user
          POSTGRES_PASSWORD: build_password
          POSTGRES_DB: build_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: 📦 Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('requirements/base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # base.txt has no PostgreSQL driver; add psycopg2-binary so the
          # build check can connect to the PostgreSQL service above.
          pip install -r requirements/base.txt psycopg2-binary==2.9.9

      - name: 📦 Collect static files
        env:
          SECRET_KEY: build-check-secret-key
          DEBUG: "False"
          DATABASE_URL: postgres://build_user:build_password@localhost:5432/build_db
        run: |
          echo "::group::📦 Collecting Static Files"
          python manage.py collectstatic --noinput --clear
          echo "::endgroup::"

      - name: 🔍 Check for missing migrations
        env:
          SECRET_KEY: build-check-secret-key
          DEBUG: "False"
          DATABASE_URL: postgres://build_user:build_password@localhost:5432/build_db
        run: |
          echo "::group::🔍 Migration Check"
          python manage.py makemigrations --check --dry-run || {
            echo "::error::❌ Missing migrations detected! Run 'python manage.py makemigrations' locally."
            exit 1
          }
          echo "✅ No missing migrations."
          echo "::endgroup::"

      - name: 🗃️ Apply migrations against PostgreSQL
        env:
          SECRET_KEY: build-check-secret-key
          DEBUG: "False"
          DATABASE_URL: postgres://build_user:build_password@localhost:5432/build_db
        run: |
          echo "::group::🗃️ Migration Apply (RLS policies included)"
          # Applying every migration on a real PostgreSQL instance verifies
          # that the RLS / backfill migrations execute cleanly end-to-end.
          python manage.py migrate --noinput
          echo "✅ All migrations apply cleanly on PostgreSQL."
          echo "::endgroup::"

name: Fixed English level identity evidence (encrypted, read-only)
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Aktiv təşkilat superadmini; sabit İngilis dili mənbəyi"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  export:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Capture fixed English metadata with deployed HEAD verification
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: python3 scripts/ops/english_level_evidence_export.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wcu-english-level-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.capture.outputs.artifact_dir }}/snapshot.enc.json
            ${{ steps.capture.outputs.artifact_dir }}/capture-manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove private temporary source and ciphertext
        if: always()
        run: |
          set -euo pipefail
          docker exec educationmanagementstudentarena-app-1 rm -rf -- "/tmp/wcu-english-level-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          rm -rf -- "$RUNNER_TEMP/english-level-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$RUNNER_TEMP/english-level-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

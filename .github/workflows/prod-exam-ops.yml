name: 🎓 Prod İmtahan Əməliyyatları

# Prod LAN-dadır (10.0.2.42) — kənardan SSH mümkün deyil. Bu workflow
# self-hosted runner (serverin özü) üzərindən DAR əhatəli imtahan-hazırlığı
# skriptlərini işlədir.
#
# NİYƏ `manage.py shell` + STDIN (management command yox):
#   Skript runner-in CHECKOUT-undan konteynerə stdin ilə ötürülür, yəni kodun
#   konteyner image-inə DEPLOY olunması tələb olunmur. Beləliklə imtahan
#   hazırlığı CI/deploy növbəsindən asılı qalmır (deploy bloklananda da işləyir).
#
# TƏHLÜKƏSİZLİK:
#   * Açıq shell YOXDUR — yalnız repo-dakı, review olunmuş skriptlər işləyir və
#     skript adı AĞ SİYAHI ilə yoxlanır (ixtiyari yol ötürülə bilmir).
#   * İstifadəçi girişləri `env:` ilə ötürülür və shell-də sitatlanmış dəyişən
#     kimi işlənir (`run:` bloğuna interpolasiya yoxdur → script injection yox).
#   * Yazan skript (`exam_day_seed`) DEFAULT DRY-RUN-dır; faktiki yazma üçün
#     `apply` girişi açıq şəkildə seçilməlidir.
#   * Parol `secrets.EXAM_TEMP_PASSWORD`-dandır — nə input, nə də logda görünür.
#   * Deploy ilə eyni concurrency qrupu — canlı deploy-la toqquşmur.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "İşlədiləcək skript"
        required: true
        type: choice
        default: exam_day_probe
        options:
          - exam_day_probe
          - exam_day_probe2
          - exam_day_probe3
          - exam_day_import_questions
          - exam_day_seed
      apply:
        description: "YALNIZ exam_day_seed üçün: faktiki yaz (işarələnməsə dry-run)"
        required: false
        type: boolean
        default: false
      org:
        description: "Təşkilat slug-ı"
        required: false
        type: string
        default: "qerbi-kaspi-universiteti"
      students:
        description: "probe: axtarılacaq tələbə adları — hər sətirdə bir"
        required: false
        type: string
        default: ""
      groups:
        description: "probe: axtarılacaq qrup adları — hər sətirdə bir"
        required: false
        type: string
        default: ""
      subjects:
        description: "probe: axtarılacaq fənn adları — hər sətirdə bir"
        required: false
        type: string
        default: ""
      group_teacher:
        description: "seed: qrup sahibi olacaq müəllimin username-i (boş = ilk müəllim)"
        required: false
        type: string
        default: ""
      az_exam_id:
        description: "seed: Az dili imtahanının id-si"
        required: false
        type: string
        default: "8"
      window_days:
        description: "seed: imtahan pəncərəsi neçə gün"
        required: false
        type: string
        default: "7"
      mm_exam_title:
        description: "import: sualların yazılacağı imtahanın adı"
        required: false
        type: string
        default: "Mülki müdafiə"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run-script:
    name: 🎓 prod-exam-ops
    runs-on: [self-hosted]
    environment: production
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
      SCRIPT_NAME: ${{ inputs.script }}
      ORG: ${{ inputs.org }}
      STUDENTS: ${{ inputs.students }}
      GROUPS: ${{ inputs.groups }}
      SUBJECTS: ${{ inputs.subjects }}
      GROUP_TEACHER: ${{ inputs.group_teacher }}
      AZ_EXAM_ID: ${{ inputs.az_exam_id }}
      WINDOW_DAYS: ${{ inputs.window_days }}
      MM_EXAM_TITLE: ${{ inputs.mm_exam_title }}
      APPLY_FLAG: ${{ inputs.apply && 'yes' || 'no' }}
      TEMP_PASSWORD: ${{ secrets.EXAM_TEMP_PASSWORD }}
    steps:
      - name: 📥 Checkout (skript mənbəyi)
        uses: actions/checkout@v6

      - name: 🎓 İşlət
        run: |
          set -euo pipefail

          # Ağ siyahı — ixtiyari yol/skript ötürülə bilməz.
          case "$SCRIPT_NAME" in
            exam_day_probe|exam_day_probe2|exam_day_probe3|exam_day_seed|exam_day_import_questions) ;;
            *) echo "İcazəsiz skript: $SCRIPT_NAME" >&2; exit 1 ;;
          esac

          ops="$GITHUB_WORKSPACE/scripts/prod_ops"
          script="$ops/${SCRIPT_NAME}.py"
          test -f "$script" || { echo "Skript tapılmadı: $script" >&2; exit 1; }

          # Sual idxalı data faylı ilə birlikdə gedir: `manage.py shell` stdin-i
          # bütöv exec etdiyi üçün iki faylı birləşdirmək kifayətdir — data
          # konteynerə köçürülməli deyil.
          payload="$script"
          if [ "$SCRIPT_NAME" = "exam_day_import_questions" ]; then
            data="$ops/data/mm_questions.py"
            test -f "$data" || { echo "Data tapılmadı: $data" >&2; exit 1; }
            payload="$RUNNER_TEMP/payload.py"
            cat "$data" "$script" > "$payload"
            echo "── data ($(wc -l < "$data") sətir) + skript birləşdirildi ──"
          fi

          if [ "$APPLY_FLAG" = "yes" ]; then
            echo "⚠️  FAKTİKİ YAZMA rejimi — prod verilənlər bazasına yazılacaq."
          fi

          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml exec -T \
            -e PROBE_ORG="$ORG" \
            -e PROBE_STUDENTS="$STUDENTS" \
            -e PROBE_GROUPS="$GROUPS" \
            -e PROBE_SUBJECTS="$SUBJECTS" \
            -e SEED_ORG="$ORG" \
            -e SEED_APPLY="$APPLY_FLAG" \
            -e SEED_GROUP_TEACHER="$GROUP_TEACHER" \
            -e SEED_AZ_EXAM_ID="$AZ_EXAM_ID" \
            -e SEED_WINDOW_DAYS="$WINDOW_DAYS" \
            -e MM_EXAM_TITLE="$MM_EXAM_TITLE" \
            -e EXAM_TEMP_PASSWORD="$TEMP_PASSWORD" \
            --index 1 app python manage.py shell < "$payload"

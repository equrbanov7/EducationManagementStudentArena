name: 🎓 Prod İmtahan Əməliyyatları

# Prod LAN-dadır (10.0.2.42) — kənardan SSH mümkün deyil. Bu workflow
# self-hosted runner (serverin özü) üzərindən DAR əhatəli imtahan-hazırlığı
# skriptlərini işlədir.
#
# NİYƏ `manage.py shell` + STDIN (əmr yox):
#   Skript runner-in CHECKOUT-undan konteynerə stdin ilə ötürülür, yəni kodun
#   konteyner image-inə DEPLOY olunması tələb olunmur. Beləliklə imtahan
#   hazırlığı CI/deploy növbəsindən asılı qalmır (deploy bloklananda da işləyir).
#
# TƏHLÜKƏSİZLİK:
#   * Açıq shell YOXDUR — yalnız repo-dakı yoxlanmış skript işlədilir.
#   * İstifadəçi girişləri `env:` ilə ötürülür və shell-də sitatlanmış dəyişən
#     kimi işlənir (`run:` bloğuna interpolasiya yoxdur → script injection yox).
#   * `probe` YALNIZ-OXU-dur. Yazı skriptləri ayrıca əlavə olunacaq.
#   * Deploy ilə eyni concurrency qrupu — canlı deploy-la toqquşmur.
#
# DİQQƏT: input dəyərləri run logunda GÖRÜNÜR. Parol kimi gizli dəyər input
# kimi YAZILMIR — repo secret-i işlədilir.

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Təşkilat slug-ı (boş = bütün təşkilatları sadala)"
        required: false
        type: string
        default: ""
      students:
        description: "Axtarılacaq tələbə adları — hər sətirdə bir"
        required: false
        type: string
        default: ""
      groups:
        description: "Axtarılacaq qrup adları — hər sətirdə bir"
        required: false
        type: string
        default: ""
      subjects:
        description: "Axtarılacaq fənn adları — hər sətirdə bir"
        required: false
        type: string
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  probe:
    name: 🔍 Vəziyyət hesabatı (yalnız-oxu)
    runs-on: [self-hosted]
    environment: production
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
      ORG: ${{ inputs.org }}
      STUDENTS: ${{ inputs.students }}
      GROUPS: ${{ inputs.groups }}
      SUBJECTS: ${{ inputs.subjects }}
    steps:
      - name: 📥 Checkout (skript mənbəyi)
        uses: actions/checkout@v6

      - name: 🔍 exam_day_probe
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/prod_ops/exam_day_probe.py"
          test -f "$script" || { echo "Skript tapılmadı: $script" >&2; exit 1; }

          cd "$APP_DIR"
          docker compose -f docker-compose.prod.yml exec -T \
            -e PROBE_ORG="$ORG" \
            -e PROBE_STUDENTS="$STUDENTS" \
            -e PROBE_GROUPS="$GROUPS" \
            -e PROBE_SUBJECTS="$SUBJECTS" \
            --index 1 app python manage.py shell < "$script"

name: Journal syllabus and QB audit (encrypted read-only)
on:
  push:
    branches: [codex/journal-syllabus-qb-audit-20261104]
    paths:
      - scripts/prod_ops/journal_integrity_snapshot.py
      - scripts/data/journal_audit_20261104_public.pem
      - .github/workflows/journal-integrity-audit.yml
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 20
    env:
      APP_CONTAINER: educationmanagementstudentarena-app-1
      AUDIT_OUTPUT: /tmp/journal-integrity-${{ github.run_id }}-${{ github.run_attempt }}.enc.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Capture fixed tenant in a database read-only transaction
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/journal-integrity"
          public_key=$(base64 -w0 scripts/data/journal_audit_20261104_public.pem)
          docker inspect --format '{{.Image}}' "$APP_CONTAINER" > "$RUNNER_TEMP/journal-integrity/image.txt"
          docker exec -i -e AUDIT_OUTPUT="$AUDIT_OUTPUT" -e AUDIT_PUBLIC_KEY_B64="$public_key" \
            "$APP_CONTAINER" python manage.py shell -c 'exec(__import__("sys").stdin.read())' \
            < scripts/prod_ops/journal_integrity_snapshot.py
          docker cp "$APP_CONTAINER:$AUDIT_OUTPUT" "$RUNNER_TEMP/journal-integrity/snapshot.enc.json"
          sha256sum "$RUNNER_TEMP/journal-integrity/snapshot.enc.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journal-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/journal-integrity/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove encrypted temporary copy
        if: always()
        run: |
          docker exec "$APP_CONTAINER" rm -f -- "$AUDIT_OUTPUT" || true
          rm -rf -- "$RUNNER_TEMP/journal-integrity"

# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Production Smoke Test
# ═══════════════════════════════════════════════════════════════════════════
# Restores the production Docker image from the GHA layer cache and starts
# the full docker-compose.prod.yml stack.  Polls /ping/ and /health/ to
# confirm the app is serving traffic before tearing down.
# Called by ci.yml via workflow_call (after docker-build).
# ═══════════════════════════════════════════════════════════════════════════

name: 🔥 Prod Smoke Test (reusable)

on:
  workflow_call:

jobs:
  prod-smoke:
    name: 🔥 Prod Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Exercise the real production split-role path. Fresh Postgres volumes
      # create this LOGIN NOSUPERUSER NOBYPASSRLS role via postgres-init.
      APP_DATABASE_USER: emsarena_app
      APP_DATABASE_PASSWORD: ci-smoke-app-role-password
      EMS_DB_ROLE_ENFORCE: error
      # `production.py` TLS məcburiyyəti söndürüləndə qalxmır (2026-09-10
      # təhlükəsizlik qapısı). Bu yığın CI-də DÜZ HTTP üzərindədir, ona görə
      # istisna AÇIQ bildirilir — prod hostda belə bir sətir olmamalıdır.
      # İŞ səviyyəsindədir ki, yığını qaldıran hər addım onu görsün.
      INSECURE_TRANSPORT_OK: "1"
      # 2026-09-25: repo private → GitHub runner-ləri 2 vCPU-dur; docker `cpus` host nüvəsindən çox
      # ola bilməz («range of CPUs is from 0.01 to 2.00»). Prod default-ları (nginx 4.0, redis/piston
      # 2.0) YALNIZ CI yığınında endirilir — prod host-da compose default-ları qüvvədə qalır.
      NGINX_CPU_LIMIT: "1.0"
      REDIS_CPU_LIMIT: "1.0"
      PISTON_CPU_LIMIT: "1.0"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Load production image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          load: true
          tags: emsarena-prod:ci
          cache-from: type=gha
          build-args: |
            BUILD_SECRET_KEY=ci-build-placeholder-not-for-production
            BUILD_DATABASE_URL=sqlite:////tmp/build.db
            BUILD_ALLOWED_HOSTS=localhost,127.0.0.1
            BUILD_ADMIN_ALLOWED_IPS=127.0.0.1
            APT_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      # Spin up the production stack with CI-safe dummy secrets.
      # SECURE_SSL_REDIRECT=False avoids HTTPS redirect inside plain HTTP CI.
      - name: 🚀 Start production stack
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
          # 2026-09-14 infra auditi (wave 2, P2-1 smoke): eyni token həm app-a
          # (x-app-env), həm Alertmanager şablonuna (WEBHOOK_TOKEN) gedir.
          ALERTMANAGER_WEBHOOK_TOKEN: ci-smoke-webhook-token
        run: |
          # Docker Hub anonim pull-lar paylaşılan CI IP-sində rate-limit-ə (toomanyrequests)
          # və ya keçici "unknown" manifest xətasına düşə bilir. Stack-i 3 dəfəyə qədər
          # geriçəkilmə (backoff) ilə qaldırmağa çalışırıq ki, keçici nasazlıq CI-ni sındırmasın.
          set -e
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "▶ Start production stack — cəhd $i/$ATTEMPTS"
            if docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --no-build; then
              echo "✅ Stack qalxdı (cəhd $i)."
              exit 0
            fi
            echo "⚠️ Cəhd $i uğursuz oldu. Stack sökülməzdən əvvəl container status/logları:"
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps || true
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --no-color app celery_worker nginx pgbouncer postgres redis || true
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v --remove-orphans || true
            if [ "$i" -lt "$ATTEMPTS" ]; then
              SLEEP=$((i * 15))
              echo "⏳ ${SLEEP}s gözləyib yenidən cəhd edirik..."
              sleep "$SLEEP"
            fi
          done
          echo "::error::❌ Production stack $ATTEMPTS cəhddən sonra qalxmadı."
          exit 1

      - name: 🔐 Verify restricted runtime DB role
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml exec -T app \
            python manage.py shell -c \
            "from django.db import connection; c=connection.cursor(); c.execute('SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user'); role, is_super, bypass=c.fetchone(); print(f'runtime_db_role={role} rolsuper={is_super} rolbypassrls={bypass}'); assert not is_super and not bypass"

      # Poll /health/ and /ping/ with retries (up to 120 s)
      - name: 🩺 Poll health and ping endpoints
        run: |
          echo "Waiting for the stack to be ready..."
          MAX=36
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ping/ 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ /ping/ returned HTTP 200 after $((i * 5))s"
              break
            fi
            echo "Attempt $i/$MAX — /ping/ returned HTTP $STATUS. Retrying in 5s..."
            sleep 5
            if [[ $i -eq $MAX ]]; then
              echo "::error::❌ /ping/ did not return 200 within 180 s."
              exit 1
            fi
          done

          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health/ 2>/dev/null || echo "000")
          if [[ "$HEALTH" != "200" && "$HEALTH" != "207" ]]; then
            echo "::error::❌ /health/ returned unexpected status: $HEALTH"
            exit 1
          fi
          echo "✅ /health/ returned HTTP $HEALTH — stack is serving traffic."

      # 2026-09-14 infra auditi (wave 2, P2-1 qalığı): Alertmanager → app webhook
      # yolu. Prod-da nginx-in daxili `location = …/alertmanager-webhook/` bloku
      # `Host localhost` + `X-Forwarded-Proto https` ötürür; burada həmin
      # başlıqlarla və Alertmanager konteynerinin özündən (render olunmuş
      # konfiqdəki eyni URL ilə) POST edilir. Gözlənilən: tokensiz 403,
      # token ilə 200 — 301 (SSL redirect) və 400 (DisallowedHost) reqressiyadır.
      # P3-8: konteyner /tmp/alertmanager.yml-i render-template.sh ilə qurub —
      # URL orada olmalıdır (render pozulsaydı Alertmanager heç qalxmazdı).
      - name: 🔔 Verify Alertmanager webhook path through nginx
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
          ALERTMANAGER_WEBHOOK_TOKEN: ci-smoke-webhook-token
        run: |
          set -euo pipefail
          WEBHOOK_PATH=/api/superadmin/monitoring/alertmanager-webhook/
          PAYLOAD='{"alerts":[],"status":"firing"}'
          probe() {
            curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost${WEBHOOK_PATH}" \
              -H 'Host: localhost' -H 'X-Forwarded-Proto: https' \
              -H 'Content-Type: application/json' --data "$PAYLOAD" "$@" || echo 000
          }
          NO_TOKEN=$(probe)
          if [ "$NO_TOKEN" != "403" ]; then
            echo "::error::❌ webhook without token returned HTTP $NO_TOKEN (expected 403; 301/400 = nginx headers/ALLOWED_HOSTS regression)."
            exit 1
          fi
          WITH_TOKEN=$(probe -H "Authorization: Bearer ${ALERTMANAGER_WEBHOOK_TOKEN}")
          if [ "$WITH_TOKEN" != "200" ]; then
            echo "::error::❌ webhook with token returned HTTP $WITH_TOKEN (expected 200)."
            exit 1
          fi
          echo "✅ webhook via nginx: no token → 403, token → 200."

          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml"
          $COMPOSE exec -T alertmanager sh -c "grep -q 'http://nginx${WEBHOOK_PATH}' /tmp/alertmanager.yml" || {
            echo "::error::❌ rendered /tmp/alertmanager.yml does not contain the nginx webhook URL."
            exit 1
          }
          $COMPOSE exec -T alertmanager wget -q -O /dev/null \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${ALERTMANAGER_WEBHOOK_TOKEN}" \
            --post-data "$PAYLOAD" "http://nginx${WEBHOOK_PATH}" || {
            echo "::error::❌ POST from the alertmanager container to http://nginx${WEBHOOK_PATH} failed."
            exit 1
          }
          echo "✅ alertmanager container → nginx → app webhook: 200."

      # 2026-09-14 infra auditi P3-3: Redis parolu argv-də olmamalıdır —
      # entrypoint.sh şablonu /tmp/redis.conf-a render edir; PID 1 komanda
      # sətrində yalnız `redis-server /tmp/redis.conf` görünməlidir.
      - name: 🔒 Verify Redis password is not on the process command line
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml"
          CMDLINE=$($COMPOSE exec -T redis sh -c "tr '\0' ' ' < /proc/1/cmdline")
          echo "redis PID 1 cmdline: $CMDLINE"
          case "$CMDLINE" in
            *"$REDIS_PASSWORD"*|*requirepass*)
              echo "::error::❌ Redis password / --requirepass is visible on the command line."
              exit 1
              ;;
          esac
          $COMPOSE exec -T redis sh -c 'redis-cli ping' | grep -q PONG
          echo "✅ Redis argv is clean and AUTH via REDISCLI_AUTH works."

      # Always dump container logs for debugging, then tear down
      - name: 📋 Dump container logs
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          echo "=== Container logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --no-color || true

      - name: 🧹 Tear down production stack
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-smoke-grafana-password
          ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v --remove-orphans || true

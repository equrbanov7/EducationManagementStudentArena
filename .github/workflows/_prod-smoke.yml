# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Production Smoke Test
# ═══════════════════════════════════════════════════════════════════════════
# Restores the production Docker image from the GHA layer cache and starts
# the full docker-compose.prod.yml stack.  Polls /ping/ and /health/ to
# confirm the app is serving traffic before tearing down.
# Called by ci.yml via workflow_call (after docker-build).
# ═══════════════════════════════════════════════════════════════════════════

name: 🔥 Prod Smoke Test (reusable)

on:
  workflow_call:

jobs:
  prod-smoke:
    name: 🔥 Prod Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Load production image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          load: true
          tags: emsarena-prod:ci
          cache-from: type=gha
          build-args: |
            BUILD_SECRET_KEY=ci-build-placeholder-not-for-production
            BUILD_DATABASE_URL=sqlite:////tmp/build.db
            BUILD_ALLOWED_HOSTS=localhost,127.0.0.1
            BUILD_ADMIN_ALLOWED_IPS=127.0.0.1
            APT_SECURITY_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      # Spin up the production stack with CI-safe dummy secrets.
      # SECURE_SSL_REDIRECT=False avoids HTTPS redirect inside plain HTTP CI.
      - name: 🚀 Start production stack
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --no-build

      # Poll /health/ and /ping/ with retries (up to 120 s)
      - name: 🩺 Poll health and ping endpoints
        run: |
          echo "Waiting for the stack to be ready..."
          MAX=24
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ping/ 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ /ping/ returned HTTP 200 after $((i * 5))s"
              break
            fi
            echo "Attempt $i/$MAX — /ping/ returned HTTP $STATUS. Retrying in 5s..."
            sleep 5
            if [[ $i -eq $MAX ]]; then
              echo "::error::❌ /ping/ did not return 200 within 120 s."
              exit 1
            fi
          done

          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health/ 2>/dev/null || echo "000")
          if [[ "$HEALTH" != "200" && "$HEALTH" != "207" ]]; then
            echo "::error::❌ /health/ returned unexpected status: $HEALTH"
            exit 1
          fi
          echo "✅ /health/ returned HTTP $HEALTH — stack is serving traffic."

      # Always dump container logs for debugging, then tear down
      - name: 📋 Dump container logs
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          echo "=== Container logs ==="
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --no-color || true

      - name: 🧹 Tear down production stack
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v --remove-orphans || true

name: Reviewed targeted pending credentials
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Aktiv təşkilat superadmini"
        type: string
        required: true
      batch:
        description: "Yalnız şəxsiyyəti təsdiqlənmiş müraciət siyahısı"
        type: choice
        options: [magistr-two, staff-seven, behruz-one]
        required: true
      baseline:
        description: "Təzə dry-run SHA256"
        type: string
        default: ""
      apply:
        description: "Yalnız aktivləşməmiş aktiv hesabların ilkin parolunu yarat"
        type: boolean
        default: false
      confirm:
        description: "Tətbiq üçün APPLY"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  reviewed:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exact pending accounts and encrypted result only
        run: python3 scripts/ops/reviewed_targeted_credentials.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && inputs.apply
        with:
          name: targeted-credentials-encrypted
          path: ${{ runner.temp }}/targeted-credentials/*.enc.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove runner ciphertext
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/targeted-credentials" "$RUNNER_TEMP/targeted-credentials-quarantine"

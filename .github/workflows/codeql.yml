# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — GitHub CodeQL Static Security Analysis
# ═══════════════════════════════════════════════════════════════════════════
# Performs deep semantic analysis of the Python codebase using GitHub's
# CodeQL engine with the default security query pack.
#
# Results appear in the repository "Security → Code scanning alerts" tab and
# are surfaced as inline annotations on Pull Requests.
#
# Reference:
#   https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors
# ═══════════════════════════════════════════════════════════════════════════

name: 🔬 CodeQL Security Analysis

on:
  # Run on every push to the main branches so alerts stay up-to-date.
  push:
    branches:
      - main
      - Staging
      - Develop

  # Run on PRs so security regressions block merge.
  pull_request:
    branches:
      - main
      - Staging
      - Develop

  # Weekly scheduled scan to catch newly published CVE-based queries.
  schedule:
    - cron: "30 1 * * 1"   # Every Monday at 01:30 UTC

  # Allow manual trigger for ad-hoc analysis.
  workflow_dispatch:

jobs:
  analyze:
    name: 🔬 Analyze Python (CodeQL)
    runs-on: ubuntu-latest

    # Required permissions for CodeQL to upload SARIF results to the
    # "Security" tab and annotate Pull Requests.
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is required for accurate blame information in results.
          fetch-depth: 0

      # ── 2. Initialise CodeQL ──────────────────────────────────────────
      # The "python" language selector auto-detects all Python source files.
      # The "security-extended" query pack includes the default security
      # queries plus additional experimental/beta queries for broader coverage.
      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Use the security-extended suite for deeper analysis while keeping
          # the default pack's precision as the primary signal.
          queries: security-extended

      # ── 3. Auto-build (Python — no compilation needed) ────────────────
      # For interpreted languages CodeQL auto-traces imports during a build
      # step to improve dependency resolution.  The autobuild action handles
      # this transparently for Python.
      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      # ── 4. Run analysis (SARIF lokal) ─────────────────────────────────
      # 2026-09-25: repo PRIVATE-dir — «Code scanning» (GitHub Code Security lisenziyası)
      # aktiv deyil, SARIF yükləməsi «Code scanning is not enabled» ilə job-u yıxırdı.
      # Analiz eyni qalır; nəticə Security tab-ı əvəzinə artifakt + job xülasəsidir.
      # Code scanning yenidən açılsa `upload: never`-i silmək kifayətdir.
      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          upload: never
          output: sarif-results

      # ── 5. Xülasə: tapıntılar ciddiliyə görə (kritik ≥ 9.0 job-u yıxır) ──
      - name: 📋 CodeQL xülasəsi
        run: |
          python3 - <<'PY'
          import glob, json, os

          rows, critical = [], 0
          for path in glob.glob("sarif-results/*.sarif"):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              for run in data.get("runs", []):
                  rules = {}
                  driver = run.get("tool", {}).get("driver", {})
                  for rule in driver.get("rules", []):
                      rules[rule.get("id")] = rule
                  for ext in run.get("tool", {}).get("extensions", []):
                      for rule in ext.get("rules", []):
                          rules[rule.get("id")] = rule
                  for res in run.get("results", []):
                      rule = rules.get(res.get("ruleId"), {})
                      props = rule.get("properties", {})
                      try:
                          sev = float(props.get("security-severity") or 0)
                      except ValueError:
                          sev = 0.0
                      loc = (res.get("locations") or [{}])[0].get("physicalLocation", {})
                      where = "%s:%s" % (
                          loc.get("artifactLocation", {}).get("uri", "?"),
                          loc.get("region", {}).get("startLine", "?"),
                      )
                      rows.append((sev, res.get("ruleId", "?"), where))
                      critical += sev >= 9.0
          rows.sort(reverse=True)
          lines = ["## 🔬 CodeQL (security-extended)", "", f"Tapıntı: **{len(rows)}**, kritik (≥ 9.0): **{critical}**", ""]
          if rows:
              lines += ["| Ciddilik | Qayda | Yer |", "|---|---|---|"]
              lines += [f"| {sev:.1f} | `{rule}` | `{where}` |" for sev, rule, where in rows[:100]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(1 if critical else 0)
          PY

      - name: 📦 SARIF artifakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results/
          retention-days: 14

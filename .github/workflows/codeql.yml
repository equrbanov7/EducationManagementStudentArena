# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — GitHub CodeQL Static Security Analysis
# ═══════════════════════════════════════════════════════════════════════════
# Performs deep semantic analysis of the Python codebase using GitHub's
# CodeQL engine with the default security query pack.
#
# Results appear in the repository "Security → Code scanning alerts" tab and
# are surfaced as inline annotations on Pull Requests.
#
# Reference:
#   https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors
# ═══════════════════════════════════════════════════════════════════════════

name: 🔬 CodeQL Security Analysis

on:
  # Run on every push to the main branches so alerts stay up-to-date.
  push:
    branches:
      - main
      - Staging
      - Develop

  # Run on PRs so security regressions block merge.
  pull_request:
    branches:
      - main
      - Staging
      - Develop

  # Weekly scheduled scan to catch newly published CVE-based queries.
  schedule:
    - cron: "30 1 * * 1"   # Every Monday at 01:30 UTC

  # Allow manual trigger for ad-hoc analysis.
  workflow_dispatch:

jobs:
  analyze:
    name: 🔬 Analyze Python (CodeQL)
    runs-on: ubuntu-latest

    # Required permissions for CodeQL to upload SARIF results to the
    # "Security" tab and annotate Pull Requests.
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          # Full history is required for accurate blame information in results.
          fetch-depth: 0

      # ── 2. Initialise CodeQL ──────────────────────────────────────────
      # The "python" language selector auto-detects all Python source files.
      # The "security-extended" query pack includes the default security
      # queries plus additional experimental/beta queries for broader coverage.
      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Use the security-extended suite for deeper analysis while keeping
          # the default pack's precision as the primary signal.
          queries: security-extended

      # ── 3. Auto-build (Python — no compilation needed) ────────────────
      # For interpreted languages CodeQL auto-traces imports during a build
      # step to improve dependency resolution.  The autobuild action handles
      # this transparently for Python.
      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v3

      # ── 4. Run analysis & upload SARIF results ────────────────────────
      # Results are published to the "Security → Code scanning" tab.
      # The action exits non-zero if any alerts of severity ERROR are found,
      # which blocks the PR check.
      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

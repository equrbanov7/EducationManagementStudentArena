# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Unit Tests
# ═══════════════════════════════════════════════════════════════════════════
# Runs the full pytest suite (excluding e2e) with PostgreSQL + Redis
# services, generates XML/HTML coverage reports, and uploads artifacts.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🧪 Unit Tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.11"

jobs:
  unit-tests:
    name: 🧪 Tests (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: "config.settings.test"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('requirements/test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements/test.txt

      - name: ✅ Django system check
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          echo "::group::✅ Django System Checks"
          python manage.py check --fail-level WARNING
          echo "::endgroup::"

      - name: 🗃️ Run migrations
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          echo "::group::🗃️ Database Migrations"
          python manage.py migrate --verbosity=2
          echo "::endgroup::"

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          echo "::group::🧪 Running Tests"
          pytest \
            --ds=config.settings.test \
            --ignore=tests/e2e \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            --tb=short \
            --timeout=300
          echo "::endgroup::"

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ inputs.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: 📈 Coverage Report to PR
        uses: orgoro/coverage@v3.2
        if: github.event_name == 'pull_request' && startsWith(inputs.python-version, '3.11')
        with:
          coverageFile: coverage.xml
          token: ${{ github.token }}
          thresholdAll: 0.0
          thresholdNew: 0.0
          thresholdModified: 0.0
        continue-on-error: true

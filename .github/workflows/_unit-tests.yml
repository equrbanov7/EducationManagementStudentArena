# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Unit Tests
# ═══════════════════════════════════════════════════════════════════════════
# Runs the full pytest suite (excluding e2e) with PostgreSQL + Redis
# services, generates XML/HTML coverage reports, and uploads artifacts.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🧪 Unit Tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.11"
      # Sahib 2026-09-21: 9400+ test tək job-da 30–38 dəq çəkirdi. `shards`>1 olanda
      # dəst pytest-split ilə hissələrə bölünür (hər shard öz Postgres/Redis-i ilə
      # paralel job-dur); `coverage=false` push-larda coverage yükünü atır.
      shard:
        description: "Bu job-un shard nömrəsi (1..shards)"
        type: string
        default: "1"
      shards:
        description: "Shard sayı (1 = bölmə yoxdur)"
        type: string
        default: "1"
      coverage:
        description: "Coverage hesabatı yığılsın (yalnız bölünməmiş dəstdə mənalıdır)"
        type: boolean
        default: true

jobs:
  unit-tests:
    name: 🧪 Tests (Python ${{ inputs.python-version }}${{ inputs.shards != '1' && format(' · shard {0}/{1}', inputs.shard, inputs.shards) || '' }})
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: "config.settings.test"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      # Audit 2026-09-13 F-T6 (düzəliş 2026-09-14): 3 OCR testi
      # (`exams/tests/test_services.py::test_ocr_extracts_questions_from_scanned_pdf`,
      # `test_pdf_layout.py::test_image_only_pdf_*`) tesseract olmadığı üçün HEÇ BİR
      # mühitdə işləmirdi (`parsing/extraction/ocr.py` 37 %). apt ~20-30 s çəkir;
      # PyMuPDF (`fitz`) OCR-ı yalnız tessdata qovluğuna ehtiyac duyur —
      # `ocr.py._ensure_tessdata_prefix` onu özü tapır, amma dəqiqlik üçün
      # `TESSDATA_PREFIX` də ixrac olunur. `aze` + `eng` dilləri testlərin tələbidir.
      - name: 🔤 Install Tesseract OCR (aze + eng)
        run: |
          echo "::group::🔤 Tesseract OCR"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-aze tesseract-ocr-eng
          # Pipe-da `head`/`grep -q` yox: GH Actions `bash -eo pipefail` — erkən
          # bağlanan pipe SIGPIPE ilə addımı sındıra bilər; əvvəl dəyişənə oxu.
          tesseract --version 2>&1 | sed -n 1p
          langs="$(tesseract --list-langs 2>&1)"
          grep -qx aze <<<"$langs" && grep -qx eng <<<"$langs"
          eng_data="$(find /usr/share/tesseract-ocr -name eng.traineddata -print -quit)"
          test -n "$eng_data"
          echo "TESSDATA_PREFIX=$(dirname "$eng_data")" >> "$GITHUB_ENV"
          echo "TESSDATA_PREFIX=$(dirname "$eng_data")"
          echo "::endgroup::"

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('requirements/test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements/test.txt

      - name: ✅ Django system check
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          echo "::group::✅ Django System Checks"
          python manage.py check --fail-level WARNING
          echo "::endgroup::"

      - name: 🗃️ Run migrations
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          echo "::group::🗃️ Database Migrations"
          python manage.py migrate --verbosity=2
          echo "::endgroup::"

      - name: 🧪 Run tests with coverage
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          echo "::group::🧪 Running Tests (shard $SHARD/$SHARDS, coverage=$COVERAGE)"
          extra=()
          if [ "$SHARDS" != "1" ]; then
            # .test_durations varsa least_duration ilə balanslı, yoxdursa sayca bərabər bölgü.
            extra+=(--splits "$SHARDS" --group "$SHARD" --splitting-algorithm least_duration)
          fi
          if [ "$COVERAGE" = "true" ]; then
            extra+=(--cov=apps --cov=core --cov=config --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term-missing --cov-fail-under=68)
          fi
          pytest \
            -n 4 --dist loadfile \
            --ds=config.settings.test \
            --ignore=tests/e2e \
            "${extra[@]}" \
            -q \
            --tb=short \
            --timeout=300
          echo "::endgroup::"

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && inputs.coverage
        with:
          name: coverage-report-${{ inputs.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

      - name: 📈 Coverage Report to PR
        uses: orgoro/coverage@v3.2
        if: github.event_name == 'pull_request' && startsWith(inputs.python-version, '3.11')
        with:
          coverageFile: coverage.xml
          token: ${{ github.token }}
          thresholdAll: 0.0
          thresholdNew: 0.0
          thresholdModified: 0.0
        continue-on-error: true

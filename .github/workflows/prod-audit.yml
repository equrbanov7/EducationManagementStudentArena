name: 🔎 Prod Audit (oxu-yalnız)

# Sahib 2026-09-21: «serverə qoşulub real performans və təhlükəsizlik testləri
# apar». Self-hosted runner serverin özündədir — skript orada işləyir, HEÇ NƏ
# DƏYİŞMİR (heç bir POST, heç bir yazı), hesabat Actions summary + artefaktdır.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "full = bütün audit · logs = yalnız «Loglar» zənciri (promtail → Loki ← Django, ~40 s)"
        type: choice
        options: [full, logs]
        default: full

concurrency:
  group: prod-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: 🔎 prod-audit
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 20
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
    steps:
      - name: 📥 Checkout (skript mənbəyi)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 🔎 Audit
        env:
          AUDIT_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          set -uo pipefail
          # Skriptlər canlı APP_DIR-dəki köçürülmüş nüsxədən YOX, bu checkout-dan gəlir
          # (deploy olunmamış düzəlişi də sınamaq mümkün olsun); APP_DIR yalnız
          # compose/.env üçündür.
          cp "$GITHUB_WORKSPACE/scripts/ops/prod_perf_probe.py" "$APP_DIR/scripts/ops/prod_perf_probe.py" 2>/dev/null || true
          if [ "$AUDIT_SCOPE" = "logs" ]; then
            # 2026-10-17: «Sistem monitorinqi → Loglar» boşdur — yalnız log zənciri (oxu-yalnız, məzmunsuz).
            bash "$GITHUB_WORKSPACE/scripts/ops/prod_logs_diag.sh" | tee "$RUNNER_TEMP/prod-audit.md"
          else
            bash "$GITHUB_WORKSPACE/scripts/ops/prod_audit.sh" | tee "$RUNNER_TEMP/prod-audit.md"
          fi
          cat "$RUNNER_TEMP/prod-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 📎 Hesabat artefaktı
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-audit-report
          path: ${{ runner.temp }}/prod-audit.md
          retention-days: 30

name: Reviewed fixed Source58 QB recovery
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Aktiv təşkilat superadmini"
        type: string
        required: true
      baseline:
        description: "Tətbiq üçün təzə dry-run SHA256"
        type: string
        default: ""
      undo:
        description: "Yalnız source58 tətbiqinin source58-... qəbzi"
        type: string
        default: ""
      receipt_sha256:
        description: "Geri alma üçün ilkin tətbiq qəbzinin tam SHA256 izi"
        type: string
        default: ""
      apply:
        description: "Yalnız sabit58q/b və9dərs; cari tam sübut yoxdursa dayanır"
        type: boolean
        default: false
      confirm:
        description: "Tətbiq və geri alma üçün APPLY"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  reviewed:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fixed encrypted source and current evidence guarded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: python3 scripts/ops/reviewed_source58.py
      - name: Remove private temporary source
        if: always()
        run: |
          set -euo pipefail
          docker exec educationmanagementstudentarena-app-1 rm -rf -- "/tmp/wcu-source58-qb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          rm -rf -- "$RUNNER_TEMP/source58-qb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

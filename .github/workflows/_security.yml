# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Security Scan
# ═══════════════════════════════════════════════════════════════════════════
# Runs Safety / pip-audit, Bandit, and Django deployment security checks.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔒 Security Scan (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.11"

jobs:
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    # FAZA 5: PostgreSQL service so the Django deployment check runs against
    # the real production database engine instead of SQLite.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: security_user
          POSTGRES_PASSWORD: security_password
          POSTGRES_DB: security_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: 📦 Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('requirements/base.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-
            ${{ runner.os }}-pip-

      # ── Dependency vulnerability scanner ──────────────────────────────
      - name: 🛡️ Check dependencies for vulnerabilities
        run: |
          pip install safety pip-audit
          echo "::group::🛡️ Safety Check"
          safety check -r requirements/base.txt --full-report || true
          echo "::endgroup::"
          echo "::group::🔐 Pip Audit (known vulnerable dependencies — blocks merge)"
          pip-audit -r requirements/base.txt --desc on || {
            echo "::error::❌ pip-audit found vulnerable dependencies! Fix them before merging."
            exit 1
          }
          echo "✅ No known vulnerable dependencies found."
          echo "::endgroup::"

      # ── Bandit — Python static security linter ────────────────────────
      - name: 🔍 Scan code with Bandit
        run: |
          pip install bandit[toml]
          echo "::group::🔍 Bandit Security Scan (HIGH severity — blocks merge)"
          bandit -r . \
            -x ./tests,./venv,./.venv,./migrations \
            --severity-level high \
            --confidence-level high \
            --format txt || {
            echo "::error::❌ Bandit found HIGH/CRITICAL security issues! Fix them before merging."
            exit 1
          }
          echo "✅ No high-severity security issues found."
          echo "::endgroup::"
          echo "::group::🔍 Bandit Security Scan (MEDIUM severity — advisory)"
          bandit -r . \
            -x ./tests,./venv,./.venv,./migrations \
            --severity-level medium \
            --format txt || echo "⚠️ Bandit found medium-severity issues — review recommended."
          echo "::endgroup::"

      # ── Django deployment security check ──────────────────────────────
      - name: 🔐 Django deployment security check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-deploy-check-QzNyXk9mVpLsJeWuHqRtGdFbAcOiMnKlYhTgPwEv2x8j5f3z7a4r6s1o0uBCDIU
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          # The owner channel provisions a restricted runtime role below; the
          # deployment check itself must fail if that split regresses.
          EMS_DB_ROLE_ENFORCE: "error"
          # FAZA 5: run the deploy check against PostgreSQL so it matches the
          # real production database engine (psycopg2 ships in production.txt).
          OWNER_DATABASE_URL: postgres://security_user:security_password@localhost:5432/security_db
          DATABASE_URL: postgres://security_app:security_app_password@localhost:5432/security_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pip install -r requirements/production.txt
          python - <<'PY'
          import os

          import psycopg2

          connection = psycopg2.connect(os.environ["OWNER_DATABASE_URL"])
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute(
                  """
                  DO $$
                  BEGIN
                      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'security_app') THEN
                          CREATE ROLE security_app LOGIN NOSUPERUSER NOBYPASSRLS
                              PASSWORD 'security_app_password';
                      END IF;
                  END
                  $$;
                  ALTER ROLE security_app WITH LOGIN NOSUPERUSER NOBYPASSRLS
                      NOCREATEDB NOCREATEROLE NOREPLICATION;
                  GRANT CONNECT ON DATABASE security_db TO security_app;
                  """
              )
          connection.close()
          PY
          echo "::group::🔐 Django Deployment Check"
          python manage.py check --deploy --fail-level WARNING || {
            echo "::error::❌ Django deployment check found configuration issues. Fix them before merging."
            exit 1
          }
          echo "✅ Django deployment check passed!"
          echo "::endgroup::"

name: 🚀 CI Pipeline

on:
  pull_request:
    branches:
      - main
      - Staging
      - Develop
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - Staging
      - Develop

  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      python-version: "3.11.6"

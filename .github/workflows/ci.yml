# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — CI/CD Pipeline (Orchestrator)
# ═══════════════════════════════════════════════════════════════════════════
# This file is the thin orchestrator that calls the individual reusable
# workflows defined in _lint.yml, _unit-tests.yml, _build.yml,
# _security.yml, _secret-scan.yml, _docker-build.yml, _container-scan.yml,
# _prod-smoke.yml, and _e2e-smoke.yml.
#
# Dependency graph:
#
#   lint ──┬──► unit-tests (3.11 + 3.12)
#          ├──► build
#          ├──► security
#          ├──► secret-scan
#          └──► docker-build ──┬──► container-scan
#                              ├──► prod-smoke
#                              └──► e2e-smoke
#
#   ci-success (waits for all of the above)
# ═══════════════════════════════════════════════════════════════════════════

name: 🚀 CI Pipeline

on:
  pull_request:
    branches:
      - main
      - Staging
      - Develop
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - Staging
      - Develop

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Debug mode aktiv etmək"
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────
# JOBS — each delegates to a focused reusable workflow
# ─────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Code Quality / Lint ─────────────────────────────────────────────
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      python-version: "3.11"

  # ── 2a. Unit Tests (Python 3.11) ───────────────────────────────────────
  unit-tests-311:
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.11"

  # ── 2b. Unit Tests (Python 3.12) ───────────────────────────────────────
  unit-tests-312:
    needs: lint
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.12"

  # ── 2c. RLS Transaction-Pooling Gate (FAZA 4 / Task 3) ─────────────────
  # `pytest -m postgres` yalnız `RLS_TRANSACTION_SCOPED=True` altında —
  # tenant izolyasiyasının transaction-pooling rejimində qorunmasını yoxlayır.
  rls-txn-pool:
    needs: lint
    uses: ./.github/workflows/_rls-txn-pool.yml
    with:
      python-version: "3.11"

  # ── 3. Build Check (collectstatic + migration check) ───────────────────
  build:
    needs: lint
    uses: ./.github/workflows/_build.yml
    with:
      python-version: "3.11"

  # ── 4. Security Scan ───────────────────────────────────────────────────
  security:
    needs: lint
    uses: ./.github/workflows/_security.yml
    with:
      python-version: "3.11"

  # ── 5. Secret Scan (Gitleaks) ──────────────────────────────────────────
  secret-scan:
    needs: lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_secret-scan.yml

  # ── 6. Docker Production Build ─────────────────────────────────────────
  docker-build:
    needs: lint
    uses: ./.github/workflows/_docker-build.yml

  # ── 7. Container CVE Scan (Trivy) ──────────────────────────────────────
  container-scan:
    needs: docker-build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/_container-scan.yml

  # ── 8. Production Smoke Test ───────────────────────────────────────────
  prod-smoke:
    needs: docker-build
    uses: ./.github/workflows/_prod-smoke.yml

  # ── 9. E2E Smoke Tests (Playwright) ────────────────────────────────────
  e2e-smoke:
    needs: docker-build
    uses: ./.github/workflows/_e2e-smoke.yml
    with:
      python-version: "3.11"

  # ── Final gate — branch-protection check ───────────────────────────────
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests-311
      - unit-tests-312
      - rls-txn-pool
      - build
      - security
      - secret-scan
      - docker-build
      - container-scan
      - prod-smoke
      - e2e-smoke
    if: always()

    steps:
      - name: 📋 Check all jobs status
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Lint:             ${{ needs.lint.result }}"
          echo "Unit Tests 3.11:  ${{ needs.unit-tests-311.result }}"
          echo "Unit Tests 3.12:  ${{ needs.unit-tests-312.result }}"
          echo "RLS Txn-Pool:     ${{ needs.rls-txn-pool.result }}"
          echo "Build:            ${{ needs.build.result }}"
          echo "Security:         ${{ needs.security.result }}"
          echo "Secret Scan:      ${{ needs.secret-scan.result }}"
          echo "Docker Build:     ${{ needs.docker-build.result }}"
          echo "Container Scan:   ${{ needs.container-scan.result }}"
          echo "Prod Smoke:       ${{ needs.prod-smoke.result }}"
          echo "E2E Smoke:        ${{ needs.e2e-smoke.result }}"
          echo "=========================="

          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "❌ Lint job failed!"
            exit 1
          fi

          if [[ "${{ needs.unit-tests-311.result }}" == "failure" || "${{ needs.unit-tests-312.result }}" == "failure" ]]; then
            echo "❌ Unit Tests failed!"
            exit 1
          fi

          if [[ "${{ needs.rls-txn-pool.result }}" == "failure" ]]; then
            echo "❌ RLS Transaction-Pooling Gate failed!"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Build job failed!"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ Security scan failed!"
            exit 1
          fi

          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "❌ Secret Scan failed!"
            exit 1
          fi

          # ── Docker-dependent jobs are BLOCKING (audit PROJ-P1 #5) ──────
          # Əvvəllər advisory idi: build olunmayan, kritik CVE-li, prod
          # settings-də açılmayan və ya E2E-si qırılan kod `main`-ə keçib
          # deploy oluna bilirdi. Artıq bunlar da merge/deploy gate-ini
          # bloklayır. Docker Hub keçici problemləri (rate-limit/timeout)
          # üçün həll — job-u YENİDƏN İŞƏ SALMAQ, ətrafından keçmək yox.
          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "❌ Docker Build job failed!"
            exit 1
          fi

          if [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "❌ Container Scan (Trivy) failed! Review the report."
            exit 1
          fi

          if [[ "${{ needs.prod-smoke.result }}" == "failure" ]]; then
            echo "❌ Prod Smoke Test failed!"
            exit 1
          fi

          if [[ "${{ needs.e2e-smoke.result }}" == "failure" ]]; then
            echo "❌ E2E Smoke Test failed!"
            exit 1
          fi

          echo "✅ All jobs passed!"

  # ── 10. Production deploy (main only) ──────────────────────────────────
  # Runs ON the self-hosted GitHub Actions runner installed on the production
  # server (wcuserver). The job rsyncs the freshly-checked-out code into the
  # live app dir — preserving runtime data (.env, media/, TLS certs) via
  # scripts/deploy/rsync-excludes.txt — then runs the docker-compose deploy +
  # health gate (scripts/deploy/remote_deploy.sh). Because it executes locally
  # on the box, no SSH and no public IP are needed; the server's private LAN
  # address is irrelevant. Only fires on a push to `main`, after ci-success.
  deploy-production:
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      APP_DIR: /home/wcu/EducationManagementStudentArena
      HEALTHCHECK_HOST: emsarena.com
      DEPLOY_TIMEOUT_SECONDS: "300"
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚢 Deploy (docker-compose, in place)
        run: |
          set -euo pipefail
          if [ ! -d "$APP_DIR" ]; then
            echo "APP_DIR ($APP_DIR) does not exist on the runner host." >&2
            exit 1
          fi
          # Mirror the repo into the live app dir; runtime data (.env, media/,
          # docker/nginx/certs/) is preserved via rsync-excludes.txt.
          rsync -a --delete --exclude-from scripts/deploy/rsync-excludes.txt ./ "$APP_DIR/"
          cd "$APP_DIR"
          bash scripts/deploy/remote_deploy.sh

# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — CI/CD Pipeline (Orchestrator)
# ═══════════════════════════════════════════════════════════════════════════
# This file is the thin orchestrator that calls the individual reusable
# workflows defined in _lint.yml, _unit-tests.yml, _build.yml,
# _security.yml, _secret-scan.yml, _docker-build.yml, _container-scan.yml,
# _prod-smoke.yml, and _e2e-smoke.yml.
#
# Dependency graph:
#
#   lint ──┬──► unit-tests (3.11 + 3.12)
#          ├──► build
#          ├──► security
#          ├──► secret-scan
#          └──► docker-build ──┬──► container-scan
#                              ├──► prod-smoke
#                              └──► e2e-smoke
#
#   ci-success (waits for all of the above)
# ═══════════════════════════════════════════════════════════════════════════

name: 🚀 CI Pipeline

on:
  pull_request:
    branches:
      - main
      - Staging
      - Develop
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - Staging
      - Develop

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Debug mode aktiv etmək"
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────
# JOBS — each delegates to a focused reusable workflow
# ─────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Code Quality / Lint ─────────────────────────────────────────────
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      python-version: "3.11.6"

  # ── 2a. Unit Tests (Python 3.11) ───────────────────────────────────────
  unit-tests-311:
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.11"

  # ── 2b. Unit Tests (Python 3.12) ───────────────────────────────────────
  unit-tests-312:
    needs: lint
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.12"

  # ── 3. Build Check (collectstatic + migration check) ───────────────────
  build:
    needs: lint
    uses: ./.github/workflows/_build.yml
    with:
      python-version: "3.11.6"

  # ── 4. Security Scan ───────────────────────────────────────────────────
  security:
    needs: lint
    uses: ./.github/workflows/_security.yml
    with:
      python-version: "3.11.6"

  # ── 5. Secret Scan (Gitleaks) ──────────────────────────────────────────
  secret-scan:
    needs: lint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_secret-scan.yml

  # ── 6. Docker Production Build ─────────────────────────────────────────
  docker-build:
    needs: lint
    uses: ./.github/workflows/_docker-build.yml

  # ── 7. Container CVE Scan (Trivy) ──────────────────────────────────────
  container-scan:
    needs: docker-build
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/_container-scan.yml

  # ── 8. Production Smoke Test ───────────────────────────────────────────
  prod-smoke:
    needs: docker-build
    uses: ./.github/workflows/_prod-smoke.yml

  # ── 9. E2E Smoke Tests (Playwright) ────────────────────────────────────
  e2e-smoke:
    needs: docker-build
    uses: ./.github/workflows/_e2e-smoke.yml
    with:
      python-version: "3.11.6"

  # ── Final gate — branch-protection check ───────────────────────────────
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests-311
      - unit-tests-312
      - build
      - security
      - secret-scan
      - docker-build
      - container-scan
      - prod-smoke
      - e2e-smoke
    if: always()

    steps:
      - name: 📋 Check all jobs status
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Lint:             ${{ needs.lint.result }}"
          echo "Unit Tests 3.11:  ${{ needs.unit-tests-311.result }}"
          echo "Unit Tests 3.12:  ${{ needs.unit-tests-312.result }}"
          echo "Build:            ${{ needs.build.result }}"
          echo "Security:         ${{ needs.security.result }}"
          echo "Secret Scan:      ${{ needs.secret-scan.result }}"
          echo "Docker Build:     ${{ needs.docker-build.result }}"
          echo "Container Scan:   ${{ needs.container-scan.result }}"
          echo "Prod Smoke:       ${{ needs.prod-smoke.result }}"
          echo "E2E Smoke:        ${{ needs.e2e-smoke.result }}"
          echo "=========================="

          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "❌ Lint job failed!"
            exit 1
          fi

          if [[ "${{ needs.unit-tests-311.result }}" == "failure" || "${{ needs.unit-tests-312.result }}" == "failure" ]]; then
            echo "❌ Unit Tests failed!"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Build job failed!"
            exit 1
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ Security scan failed!"
            exit 1
          fi

          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "❌ Secret Scan failed!"
            exit 1
          fi

          if [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "❌ Docker Build job failed!"
            exit 1
          fi

          if [[ "${{ needs.container-scan.result }}" == "failure" ]]; then
            echo "⚠️ Container Scan reported issues. Review Trivy SARIF report."
          fi

          if [[ "${{ needs.prod-smoke.result }}" == "failure" ]]; then
            echo "❌ Prod Smoke Test failed!"
            exit 1
          fi

          if [[ "${{ needs.e2e-smoke.result }}" == "failure" ]]; then
            echo "❌ E2E Smoke Test failed!"
            exit 1
          fi

          echo "✅ All critical jobs passed!"

  # ── 10. Production deploy (main only) ──────────────────────────────────
  deploy-production:
    needs: ci-success
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/_deploy-linode.yml
    with:
      app-dir: "/opt/emsarena/app"
      venv-dir: "/opt/emsarena/venv"
      service-name: "emsarena.service"
      app-base-url: "http://127.0.0.1:8001"
      healthcheck-host: "emsarena.com"
      deploy-timeout-seconds: "180"
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

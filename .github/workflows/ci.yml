# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — CI/CD Pipeline (Orchestrator)
# ═══════════════════════════════════════════════════════════════════════════

name: 🚀 CI Pipeline

on:
  pull_request:
    branches:
      - main
      - Staging
      - Develop
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - Staging
      - Develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      python-version: "3.11.6"

  unit-tests-311:
    needs: lint
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.11"

  unit-tests-312:
    needs: lint
    uses: ./.github/workflows/_unit-tests.yml
    with:
      python-version: "3.12"

  build:
    needs: lint
    uses: ./.github/workflows/_build.yml
    with:
      python-version: "3.11.6"

  security:
    needs: lint
    uses: ./.github/workflows/_security.yml
    with:
      python-version: "3.11.6"

  secret-scan:
    needs: lint
    uses: ./.github/workflows/_secret-scan.yml

  ci-success:
    name: ✅ CI Success (Phase 1)
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests-311
      - unit-tests-312
      - build
      - security
      - secret-scan
    if: always()
    steps:
      - name: Check status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests 3.11: ${{ needs.unit-tests-311.result }}"
          echo "Unit Tests 3.12: ${{ needs.unit-tests-312.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"

name: 🛠 Prod host maintenance

# Audit 2026-09-28 (deploy sonrası): host səviyyəli baxım — sudo parolu OLMADAN.
# Self-hosted runner docker qrupundadır; `nsenter -t 1` host-un namespace-lərinə
# girir (postgres:16-alpine image-i serverdə artıq var, busybox nsenter).
#   status — ufw, reboot tələbi, runner/docker xidmətlərinin autostart vəziyyəti (yalnız oxuma)
#   reboot — qoruyucu yoxlamalardan sonra `shutdown -r +1` (job bitsin deyə 1 dəq gecikmə)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status / backup-status (yalnız oxuma), tune (sysctl + docker live-restore), prune (köhnə build keşi), bridge-fw (ufw: körpü → gateway 9100/8953) və ya reboot"
        required: true
        default: status
        type: choice
        options:
          - status
          - backup-status
          - tune
          - prune
          - bridge-fw
          - reboot
      confirm:
        description: "reboot üçün REBOOT yazın"
        required: false
        default: ""
      force:
        description: "Aktiv imtahan cəhdi olsa belə reboot et"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prod-host-maint
  cancel-in-progress: false

jobs:
  host:
    if: github.event.inputs.action != 'reboot' || github.event.inputs.confirm == 'REBOOT'
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 10
    env:
      APP_CONTAINER: educationmanagementstudentarena-app-1
      HOST_IMAGE: postgres:16-alpine
    steps:
      - name: 🔎 Host vəziyyəti
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
          host() { docker run --rm --privileged --pid=host --net=host "$HOST_IMAGE" nsenter -t 1 -m -u -i -n -p -- "$@"; }
          {
            echo "## 🛠 Host: $(host hostname)"
            echo '```'
            host uptime
            echo "--- ufw"
            host ufw status verbose || echo "ufw oxunmadı"
            echo "--- reboot tələbi"
            if host test -f /var/run/reboot-required; then
              echo "reboot-required: BƏLİ"
              host cat /var/run/reboot-required.pkgs 2>/dev/null | sort -u | head -40 || true
            else
              echo "reboot-required: yox"
            fi
            echo "--- xidmətlər (autostart)"
            host systemctl is-enabled docker || true
            # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
            host sh -c 'for u in $(systemctl list-unit-files "actions.runner*" --no-legend | cut -d" " -f1); do printf "%s: " "$u"; systemctl is-enabled "$u"; done'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 💾 Backup vəziyyəti (yalnız oxuma, 2026-10-02)
        if: github.event.inputs.action == 'backup-status'
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
          host() { docker run --rm --privileged --pid=host --net=host "$HOST_IMAGE" nsenter -t 1 -m -u -i -n -p -- "$@"; }
          APP_DIR=/home/wcu/EducationManagementStudentArena
          {
            echo "## 💾 Backup vəziyyəti"
            echo '```'
            echo "--- ./backups/postgres (sahib/icazə, ən yeni 12 fayl)"
            host sh -c "ls -la $APP_DIR/backups/postgres 2>&1 | head -20"
            host sh -c "find $APP_DIR/backups/postgres -type f -printf '%TY-%Tm-%Td %TH:%TM  %u:%g %m  %s  %p\n' 2>/dev/null | sort -r | head -12"
            echo "--- postgres-backup konteyneri"
            docker ps -a --filter name=emsarena-postgres-backup --format '{{.Names}}  {{.Status}}'
            docker logs --tail 15 emsarena-postgres-backup 2>&1 | cut -c1-200
            echo "--- celery_worker /backups görünüşü (monitorinq kollektoru buradan oxuyur)"
            w=$(docker ps --filter name=celery_worker-1 --format '{{.Names}}' | grep -v heavy | head -n1)
            echo "container: $w ($(docker exec "$w" id 2>&1))"
            docker exec "$w" sh -c 'ls -la /backups 2>&1 | head -12; find /backups -name "*.sql.gz" 2>&1 | head -5'
            echo "--- kollektor: worker-də birbaşa işlət + app keşdən oxu"
            docker exec "$w" python manage.py shell -c "from django.core.cache import cache; from apps.monitoring import collectors as c; print('worker cache before:', cache.get(c.BACKUP_CACHE_KEY)); print('collect_backup_age():', c.collect_backup_age()); print('BACKUP_DIR:', c.BACKUP_DIR)" 2>&1 | tail -4
            a=$(docker ps --filter name=app-1 --format '{{.Names}}' | head -n1)
            docker exec "$a" python manage.py shell -c "from django.core.cache import cache; from apps.monitoring import collectors as c; print('app cache:', cache.get(c.BACKUP_CACHE_KEY)); from django.conf import settings; print('cache backend:', settings.CACHES['default']['BACKEND'])" 2>&1 | tail -3
            echo "--- canlı baza sətir sayları (yalnız oxuma, bypass_rls)"
            docker exec "$a" python manage.py shell -c "from core.rls import bypass_rls; from django.apps import apps as A; ctx = bypass_rls(); ctx.__enter__(); [print(m, A.get_model(*m.split('.')).objects.count()) for m in ('exams.Exam', 'exams.ExamAttempt', 'exams.ExamAnswer', 'exams.FinalExamTicket', 'live_exam.LiveSession', 'live_exam.LiveAnswer', 'appeals.Appeal')]" 2>&1 | tail -8
            echo "--- beat / worker loqları (collect_backup_age)"
            b=$(docker ps --filter name=celery-beat --format '{{.Names}}' | head -n1)
            docker logs --since 2h "$b" 2>&1 | grep -i "backup_age" | tail -3 || true
            docker logs --since 2h "$w" 2>&1 | grep -i -E "backup_age|collect_backup" | tail -5 || true
            echo "--- nginx: son 20000 sətirdə 400 cavabları (yol / UA, IP-siz)"
            docker logs --tail 20000 emsarena-nginx 2>/dev/null | grep '" 400 ' | sed -E 's/^[^"]*"([A-Z]+) ([^ ?]*)[^"]*" 400 [0-9]+ "[^"]*" "([^"]{0,40})[^"]*".*/\1 \2 | \3/' | sed -E 's#/[0-9]+/#/N/#g' | sort | uniq -c | sort -rn | head -15 || true
            echo "--- nginx 400 nümunəsi (IP-lər maskalanıb)"
            docker logs --tail 20000 emsarena-nginx 2>/dev/null | grep '" 400 ' | grep Dalvik | tail -2 | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g' | cut -c1-400 || true
            grep -n "log_format" -A4 docker/nginx/*.conf docker/nginx/**/*.conf 2>/dev/null | head -12 || true
            echo "--- off-site / drill taymerləri (host)"
            host sh -c "systemctl list-timers --all --no-legend 2>/dev/null | grep -i -E 'backup|restic|drill|offsite' || echo 'taymer yoxdur'"
            host sh -c "ls -la /var/lib/node_exporter/textfile_collector 2>/dev/null | head; ls $APP_DIR/scripts/ops | grep -i -E 'backup|drill|restic'" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🧰 Host tuning — sysctl + docker live-restore (2026-10-04 tutum auditi)
        if: github.event.inputs.action == 'tune'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
          host() { docker run --rm --privileged --pid=host --net=host "$HOST_IMAGE" nsenter -t 1 -m -u -i -n -p -- "$@"; }
          {
            echo "## 🧰 Host tuning"
            echo '```'
            echo "--- əvvəl"
            host sysctl vm.overcommit_memory vm.swappiness
            echo "live-restore: $(docker info --format '{{.LiveRestoreEnabled}}')"
            # vm.overcommit_memory=1 — Redis AOF rewrite / RDB fork-u yaddaş doluluğunda uğursuz olmasın;
            # swappiness=10 — 31 GB RAM-lı DB serverində səhifə keşi swap-a getməsin. Fayl idempotentdir.
            host sh -c 'printf "vm.overcommit_memory = 1\nvm.swappiness = 10\n" > /etc/sysctl.d/99-emsarena.conf && sysctl -q -p /etc/sysctl.d/99-emsarena.conf'
            # daemon.json: live-restore=true — dockerd yenilənəndə/yenidən başlayanda konteynerlər dayanmasın.
            # Yalnız açar əlavə olunur (mövcud açarlara toxunulmur); SIGHUP ilə oxunur, konteynerlər restart olunmur.
            if host sh -c 'command -v python3 >/dev/null'; then
              host python3 -c 'import json, os; p = "/etc/docker/daemon.json"; d = json.load(open(p)) if os.path.exists(p) else {}; print("live-restore artıq true" if d.get("live-restore") is True else (d.__setitem__("live-restore", True), json.dump(d, open(p, "w"), indent=2), "daemon.json yeniləndi")[-1])'
              host systemctl reload docker
              sleep 3
            else
              echo "python3 yoxdur — daemon.json dəyişdirilmədi"
            fi
            echo "--- sonra"
            host sysctl vm.overcommit_memory vm.swappiness
            echo "live-restore: $(docker info --format '{{.LiveRestoreEnabled}}')"
            docker ps --format '{{.Names}} {{.Status}}' | grep -c Up | sed 's/^/işləyən konteynerlər: /'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Docker build keşi / dangling image-lər (7 gündən köhnə)
        if: github.event.inputs.action == 'prune'
        run: |
          set -euo pipefail
          {
            echo "## 🧹 Prune"
            echo '```'
            docker system df
            echo "--- builder prune (until=168h)"
            docker builder prune --force --filter until=168h | tail -n 2
            echo "--- dangling image prune (teqli release image-lərinə toxunmur)"
            docker image prune --force --filter until=168h | tail -n 1
            docker system df
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🔥 Host firewall — docker körpüsü → gateway servisləri (node_exporter 9100, arp-agent 8953)
        if: github.event.inputs.action == 'bridge-fw'
        run: |
          set -euo pipefail
          # 2026-10-04: ufw «deny incoming» körpüdən (172.18.0.0/16) host gateway-inə (172.18.0.1) gedən
          # trafiki də kəsir — host şəbəkəsindəki node_exporter (9100) Prometheus-a, arp-agent (8953)
          # app-a görünmürdü. Qaydalar yalnız körpü alt şəbəkəsindəndir; LAN-a heç nə açılmır.
          # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
          host() { docker run --rm --privileged --pid=host --net=host "$HOST_IMAGE" nsenter -t 1 -m -u -i -n -p -- "$@"; }
          APP_DIR=/home/wcu/EducationManagementStudentArena
          cd "$APP_DIR"
          probe() {
            docker compose -f docker-compose.prod.yml exec -T --index 1 app python -c "
          import socket
          s = socket.socket(); s.settimeout(3)
          try:
              s.connect(('172.18.0.1', $1)); print('open')
          except Exception as exc:
              print('blocked:', exc)
          " 2>/dev/null | tail -n1
          }
          {
            echo "## 🔥 Körpü → gateway firewall"
            echo '```'
            echo "--- node_exporter konteyneri"
            docker ps -a --filter name=emsarena-node-exporter --format '{{.Names}}  {{.Status}}'
            docker logs --tail 5 emsarena-node-exporter 2>&1 | cut -c1-200
            echo "--- host-da dinləyənlər (9100 / 8953)"
            host sh -c 'ss -ltnp 2>/dev/null | grep -E ":9100|:8953" || echo "dinləyən yoxdur"'
            echo "--- əvvəl: app konteynerindən 172.18.0.1"
            echo "9100: $(probe 9100)"
            echo "8953: $(probe 8953)"
            echo "--- ufw qaydaları (idempotent)"
            host ufw allow in from 172.18.0.0/16 to 172.18.0.1 port 9100 proto tcp comment 'emsarena node_exporter (Prometheus)'
            host ufw allow in from 172.18.0.0/16 to 172.18.0.1 port 8953 proto tcp comment 'emsarena arp-agent (imtahan MAC)'
            echo "--- sonra"
            echo "9100: $(probe 9100)"
            echo "8953: $(probe 8953)"
            docker compose -f docker-compose.prod.yml exec -T prometheus wget -qO- --timeout=5 http://172.18.0.1:9100/metrics 2>/dev/null | grep -c '^node_' | sed 's/^/prometheus → node_ metrik sətirləri: /' || true
            host sh -c 'ufw status | grep -E "9100|8953"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 🔁 Reboot (qoruyucu yoxlamalarla)
        if: github.event.inputs.action == 'reboot'
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # tək dırnaq qəsdəndir: ifadə HOST-da açılır
          host() { docker run --rm --privileged --pid=host --net=host "$HOST_IMAGE" nsenter -t 1 -m -u -i -n -p -- "$@"; }
          # 1) Reboot-dan sonra hər şey özü qalxmalıdır: docker və runner xidmətləri enabled olmalıdır.
          test "$(host systemctl is-enabled docker)" = "enabled" || { echo "docker autostart deyil — reboot ləğv" >&2; exit 1; }
          # shellcheck disable=SC2016
          runners="$(host sh -c 'systemctl list-unit-files "actions.runner*" --no-legend | cut -d" " -f1')"
          test -n "$runners" || { echo "runner systemd xidməti tapılmadı — reboot-dan sonra uzaq idarə itə bilər, ləğv" >&2; exit 1; }
          for u in $runners; do
            test "$(host systemctl is-enabled "$u")" = "enabled" || { echo "$u autostart deyil — reboot ləğv" >&2; exit 1; }
          done
          # 2) Gedən imtahan cəhdi varsa reboot etmə (force ilə keçilir).
          active="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from core.rls import bypass_rls; from apps.exams.models import ExamAttempt; ctx = bypass_rls(); ctx.__enter__(); print(ExamAttempt.objects.filter(status='in_progress').count())" | tail -n1)"
          echo "Aktiv (in_progress) imtahan cəhdləri: $active"
          if [ "$active" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "Aktiv imtahan cəhdi var — reboot ləğv (force=true ilə təkrarlayın)" >&2
            exit 1
          fi
          # 3) Container restart siyasətləri (unless-stopped/always) — reboot-dan sonra stack özü qalxır.
          docker ps --format '{{.Names}} {{.Status}}' | head -40
          host shutdown -r +1 "EMSArena: planlı kernel yeniləmə reboot-u (prod-host-maint)"
          echo "## 🔁 Reboot 1 dəqiqəyə planlaşdırıldı" >> "$GITHUB_STEP_SUMMARY"

# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: E2E Smoke Tests (Playwright)
# ═══════════════════════════════════════════════════════════════════════════
# Restores the production Docker image from the GHA layer cache, starts the
# full production stack, seeds CI test users, and runs the Playwright E2E
# suite against http://localhost.
# Called by ci.yml via workflow_call (after docker-build).
# ═══════════════════════════════════════════════════════════════════════════

name: 🎭 E2E Smoke Tests (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use for the Playwright runner"
        type: string
        default: "3.11.6"

jobs:
  e2e-smoke:
    name: 🎭 E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      BASE_URL: "http://localhost"
      E2E_USERNAME: "ci_university_e2e"
      E2E_PASSWORD: "CiE2EUniversity2026!"
      E2E_ROLE_PASSWORD: "CiE2ERoles2026!"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Load production image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          load: true
          tags: emsarena-prod:ci
          cache-from: type=gha
          build-args: |
            BUILD_SECRET_KEY=ci-build-placeholder-not-for-production
            BUILD_DATABASE_URL=sqlite:////tmp/build.db
            BUILD_ALLOWED_HOSTS=localhost,127.0.0.1
            BUILD_ADMIN_ALLOWED_IPS=127.0.0.1

      # Start the production stack with CI-safe dummy secrets.
      # SECURE_SSL_REDIRECT=False prevents HTTPS redirects inside plain-HTTP
      # CI so Playwright can reach the app on http://localhost.
      - name: 🚀 Start production stack
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"
        run: |
          docker compose -f docker-compose.prod.yml up -d --no-build

      - name: 🩺 Wait for stack to be ready
        run: |
          MAX=24
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ping/ 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Stack ready after $((i * 5))s"
              break
            fi
            echo "Attempt $i/$MAX — /ping/ = $STATUS. Retrying in 5s..."
            sleep 5
            if [[ $i -eq $MAX ]]; then
              echo "::error::❌ Stack did not become ready within 120 s."
              exit 1
            fi
          done

      # Seed a deterministic university user inside the running app container
      # so the authenticated smoke tests always run in CI.
      - name: 👤 Seed CI university E2E user
        env:
          E2E_USERNAME: ${{ env.E2E_USERNAME }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: |
          docker exec emsarena-app python manage.py seed_ci_e2e_user \
            --username "$E2E_USERNAME" \
            --password "$E2E_PASSWORD"

      - name: 🧪 Seed CI multi-role E2E scenario
        env:
          E2E_ROLE_PASSWORD: ${{ env.E2E_ROLE_PASSWORD }}
        run: |
          docker exec emsarena-app python manage.py seed_ci_e2e_scenario \
            --password "$E2E_ROLE_PASSWORD"

      # Install Python + Playwright for the E2E test runner.
      # Only the Chromium browser is installed to keep install time short.
      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: 📥 Install E2E test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install pytest-playwright playwright
          playwright install chromium --with-deps

      - name: 🎭 Run E2E smoke tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          E2E_USERNAME: ${{ env.E2E_USERNAME }}
          E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
          E2E_ROLE_PASSWORD: ${{ env.E2E_ROLE_PASSWORD }}
        run: |
          echo "::group::🎭 Playwright E2E Smoke Tests"
          pytest tests/e2e/ \
            -v \
            --tb=short \
            --timeout=60 \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure || {
            echo "::error::❌ E2E smoke tests failed! Critical UI regression detected."
            exit 1
          }
          echo "✅ E2E smoke tests passed!"
          echo "::endgroup::"

      - name: 📦 Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

      # Always dump container logs and tear down, even on failure.
      - name: 📋 Dump container logs
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: 🧹 Tear down production stack
        if: always()
        env:
          APP_IMAGE: emsarena-prod:ci
          SECRET_KEY: ci-smoke-secret-key-not-for-production-use
          POSTGRES_DB: emsarena
          POSTGRES_USER: emsarena
          POSTGRES_PASSWORD: ci-smoke-postgres-password
          REDIS_PASSWORD: ci-smoke-redis-password
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          ADMIN_ALLOWED_IPS: "127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "http://localhost"
          SITE_URL: "http://localhost"
        run: |
          docker compose -f docker-compose.prod.yml down -v --remove-orphans || true

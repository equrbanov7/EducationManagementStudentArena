# ═══════════════════════════════════════════════════════════════════════════
# 🧰 Prod məlumat əməliyyatları — AĞ SİYAHILI management əmrləri (serverdəki runner)
#
# Prod LAN-dadır; kənardan SSH yoxdur. Bu workflow deploy olunmuş app konteynerində
# YALNIZ aşağıdakı, review olunmuş, idempotent, DEFOLT DRY-RUN əmrləri işlədir:
#
#   normalize_interim_components — Midterm dövrlərində (2026/2027-dən) cari jurnalların boş
#       K1–K3 komponentlərini tək «Midterm» (0–20) komponentinə gətirir (bal olan jurnala toxunmur).
#   sync_plan_offerings — təsdiqlənmiş tədris planından qruplara açılış + tələbə yazılışı
#       (backfill; `--include-drafts` BURADA YOXDUR — qaralama planlar sahibin qərarıdır).
#   apply_org_structure — struktur planı (scripts/data/qku_structure_2026_09_27.json, yalnız vahid
#       adları): fakültə/kafedra adı və yeri, yeni vahidlər, ixtisas köçürməsi; köhnə ad/yer tarixçədə.
#   seed_staff_roster — heyət siyahısı (şəxs adları — repoya DÜŞMÜR): ŞİFRƏLİ release asset-i
#       (`roster_tag` → roster.xlsx.enc, açar `STAFF_PLAN_KEY` sirri) runner-də açılır, konteynerə
#       köçürülür, iş bitəndə silinir. Yeni hesabların parolları serverdə /home/wcu/creds/-də qalır və
#       eyni açarla şifrələnmiş artifakt kimi (1 gün) yüklənir.
#
# TƏHLÜKƏSİZLİK:
#   * Açıq shell / ixtiyari əmr YOXDUR — əmr adı `choice` ilə, arqumentlər sabit şablonla.
#   * Girişlər `env:` ilə ötürülür, `run:` bloğuna interpolasiya yoxdur (script injection yox).
#   * `apply` üçün `confirm` = APPLY; apply-dan əvvəl postgres-backup sidecar-ı ilə dump alınır.
#   * Deploy ilə eyni concurrency qrupu — canlı deploy-la toqquşmur.
# ═══════════════════════════════════════════════════════════════════════════
name: 🧰 Prod Data Ops

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Əmr (ağ siyahı)"
        required: true
        type: choice
        default: normalize_interim_components
        options:
          - normalize_interim_components
          - sync_plan_offerings
          - apply_org_structure
          - seed_staff_roster
          - surveys_shuffle_responses
          - superadmin_role_count
      apply:
        description: "Faktiki yaz (işarələnməsə dry-run)"
        required: false
        type: boolean
        default: false
      confirm:
        description: "apply üçün APPLY yazın"
        required: false
        default: ""
      year:
        description: "sync_plan_offerings: tədris ili (məs. 2026/2027)"
        required: false
        default: "2026/2027"
      roster_tag:
        description: "seed_staff_roster: şifrəli siyahının release tag-ı"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    if: github.event.inputs.apply != 'true' || github.event.inputs.confirm == 'APPLY'
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 30
    env:
      APP_CONTAINER: educationmanagementstudentarena-app-1
      BACKUP_CONTAINER: emsarena-postgres-backup
      ORG: qku
      COMMAND: ${{ github.event.inputs.command }}
      APPLY: ${{ github.event.inputs.apply }}
      YEAR: ${{ github.event.inputs.year }}
      ROSTER_TAG: ${{ github.event.inputs.roster_tag }}
    steps:
      - name: 📥 Checkout (struktur planı)
        if: github.event.inputs.command == 'apply_org_structure'
        uses: actions/checkout@v6
      - name: 🔐 Şifrəli heyət siyahısı
        if: github.event.inputs.command == 'seed_staff_roster'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          case "$ROSTER_TAG" in (staff-roster-[0-9a-z-]*) ;; (*) echo "roster_tag formatı: staff-roster-…" >&2; exit 1;; esac
          # Serverdə `gh` YOXDUR — release asset-i birbaşa yüklənir (şifrəlidir; token private repo üçün).
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/roster.xlsx.enc" \
            -o "$RUNNER_TEMP/roster.xlsx.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/roster.xlsx.enc" -out "$RUNNER_TEMP/roster.xlsx"
          # `docker cp` runner UID-sini saxlayır (umask 077 → app istifadəçisi oxuya bilmir) — stdin ilə
          # konteynerin ÖZ istifadəçisi yazır.
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/staff_roster_${GITHUB_RUN_ID}.xlsx" < "$RUNNER_TEMP/roster.xlsx"
          rm -f "$RUNNER_TEMP/roster.xlsx" "$RUNNER_TEMP/roster.xlsx.enc"
      - name: 🧰 Run
        run: |
          set -euo pipefail
          case "$YEAR" in (20[0-9][0-9]/20[0-9][0-9]) ;; (*) echo "year formatı YYYY/YYYY olmalıdır" >&2; exit 1;; esac
          args=()
          case "$COMMAND" in
            normalize_interim_components)
              args=(--organization "$ORG")
              ;;
            apply_org_structure)
              docker cp "$GITHUB_WORKSPACE/scripts/data/qku_structure_2026_09_27.json" "$APP_CONTAINER:/tmp/org_structure.json"
              args=(--org "$ORG" --plan /tmp/org_structure.json)
              ;;
            seed_staff_roster)
              args=(--org "$ORG" --file "/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx")
              ;;
            surveys_shuffle_responses)
              # Audit 2026-09-28 SV-3: köhnə sorğu cavablarının qəbzlə fiziki sıra əlaqəsini qırır.
              args=(--org "$ORG")
              ;;
            superadmin_role_count)
              # Audit 2026-09-28 SA-04: YALNIZ OXUMA — profile.role='superadmin' olub is_superuser olmayan hesab sayı.
              test "$APPLY" != "true" || { echo "superadmin_role_count yalnız oxumadır — apply=false seçin" >&2; exit 2; }
              count="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                "from core.rls import bypass_rls; from apps.accounts.models import UserProfile; ctx = bypass_rls(); ctx.__enter__(); print(UserProfile.objects.filter(role='superadmin', user__is_superuser=False).count())" | tail -n1)"
              echo "profile.role=superadmin AND NOT is_superuser: $count"
              echo "## 🔎 superadmin_role_count: $count" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            sync_plan_offerings)
              actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
              test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              # İstifadəçi adı loglarda görünməsin (təhlükəsizlik yoxlaması, info).
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              ;;
            *)
              echo "icazəsiz əmr: $COMMAND" >&2; exit 2
              ;;
          esac
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply)
            if [ "$COMMAND" = "seed_staff_roster" ]; then
              args+=(--credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv")
            fi
          fi
          echo "::group::▶ $COMMAND ${args[*]}"
          if [ "$COMMAND" = "seed_staff_roster" ]; then
            # Repo/loglar AÇIQDIR: heyət hesabatında şəxs adları var → loga yalnız saylar düşür,
            # tam hesabat şifrəli artifakt kimi yüklənir (aşağıdakı addımlar).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(Şəxs:|Yaradılacaq|✓|Vahidi tapılmayan|Təşkilatda OLMAYAN|DRY-RUN|   [a-z_]+ +[0-9]+$)' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/out.log" | grep -E 'Error|Exception' || true; exit "$status"; }
          else
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/out.log"
            tail -n 120 "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log"
          fi
          echo "::endgroup::"
          {
            echo "## 🧰 ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/summary.log"
      - name: 🔑 Hesabat + parollar (serverdə saxla, şifrəli artifakt)
        id: creds
        if: always() && github.event.inputs.command == 'seed_staff_roster'
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/staff-out"
          if [ -s "$RUNNER_TEMP/out.log" ]; then
            enc "$RUNNER_TEMP/out.log" "$RUNNER_TEMP/staff-out/report.log.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/out.log"
          if [ "$APPLY" = "true" ] && docker exec "$APP_CONTAINER" test -s "/tmp/staff_creds_${GITHUB_RUN_ID}.csv"; then
            mkdir -p "$HOME/creds" && chmod 700 "$HOME/creds"
            out="$HOME/creds/staff_$(date +%Y%m%d_%H%M%S).csv"
            docker exec "$APP_CONTAINER" cat "/tmp/staff_creds_${GITHUB_RUN_ID}.csv" > "$out" && chmod 600 "$out"
            enc "$out" "$RUNNER_TEMP/staff-out/staff_creds.csv.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
            echo "Parollar serverdə: $out" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 📦 Şifrəli hesabat/parol artifaktı
        if: always() && steps.creds.outputs.saved != ''
        uses: actions/upload-artifact@v4
        with:
          name: staff-roster-encrypted
          path: ${{ runner.temp }}/staff-out/
          retention-days: 1
      - name: 🧹 Konteynerdə müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'seed_staff_roster' || github.event.inputs.command == 'apply_org_structure')
        run: |
          # root kimi: fərqli UID-li qalıqlar (sticky /tmp) app istifadəçisi ilə silinmir.
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/staff_roster*.xlsx /tmp/staff_creds*.csv /tmp/org_structure.json' || true
          rm -rf "$RUNNER_TEMP/staff-out" "$RUNNER_TEMP/out.log" || true

#       (plan saxlanılır — jurnal saatı/sahibi dəyişmir); paylanmış sənəd yenidən təsdiqlənir (bildiriş yalnız
#       yükü dəyişənə). `batch` = `overcount-…` + apply → həmin paketi snapshot-dan GERİ QAYTARIR. `year` istifadə olunur.
#   fill_vacant_from_journals — semestrin VAKANT saatı jurnalda dərsi keçən müəllimə (sahib 2026-10-25: «payızda
#       vakantda olanlar olmamalıdır … datadan ki bunu kim keçir»). Sübut: yeni jurnalın müəllimli dərsləri, yoxdursa
#       köhnə sistemin cari semestr jurnalı — ŞİFRƏLİ release asset (`roster_tag` = `legacy-journals-…` →
#       journals.json.enc, lokal `legacy_journal_teachers_extract` çıxışı; ad/FİN yoxdur, açarlar prod-un id-ləridir).
#       Növ üzrə ayrıca, çoxluq ≥ 75 %; ziddiyyətli / sübutsuz / bloklanmış müəllim — toxunulmur (adlı «məlumat yoxdur»
#       siyahısı şifrəli hesabatda). `apply` — rəsmi düzəliş axını (səbəb «Jurnal datası: dərsi keçən müəllim»), kənar
#       müəllim kafedraya əlavə üzv + saathesabı, paylanmış sənəd yenidən təsdiqlənir: «Dərs yükü təyin edildi» yalnız
#       yükü dəyişənə bir dəfə; `create_missing` = bildiriş GÖNDƏRMƏ (--no-notify). `batch` = `vacantfill-…` + apply →
#       paketi GERİ QAYTARIR (bölgü + açılışın müəllimi + üzvlük). `year` istifadə olunur; loga YALNIZ saylar.
#   audit_staff_placement — heyət yerləşdirmə auditi (sahib 2026-10-25): ŞİFRƏLİ release asset (`roster_tag` =
#       `staff-placement-…` → bundle.zip.enc: Forma 7 + struktur siyahısı + kafedra yük faylları + manifest.json).
#       Dry-run: loga YALNIZ saylar, adlı hesabat/CSV şifrəli artifaktda. `apply` — Forma 7 kafedrasında ƏLAVƏ
#       müəllim üzvlüyü, əsas (ştat) kafedra düzəlişi, artıq (yüksüz) kafedra üzvlüyünün deaktivi (paket
#       `placement-…`); `create_missing` (apply ilə) → --block-inactive: Forma 7-də olmayan, dərs yükü/cari jurnalı
#       olmayan müəllim hesabları mövcud reconcile_teacher_roster mexanizmi ilə bloklanır (paket `roster-…`).
#       `batch` = placement-… → həmin paket geri qaytarılır (bloklama paketi: reconcile_teacher_roster + batch).
#   merge_chair_units — kafedra qovuşması (sahib 2026-10-25: «İngilis dili mərkəzi (Kafedra)» rəsmi olaraq «Xarici
#       dillər kafedrası»dır — vahid adları əmrdə sabitdir, yeni giriş yoxdur): `year` və sonrakı illərin dərs yükü
#       (sətirlər bölgüləri ilə; eyni sətir birləşir — saat ikiqat olmur; boşalan mənbə sənədi `cancelled`), aktiv
#       müəllim üzvlükləri (əsas üzvlük əsas qalır), fənn kataloqu, cari + dövrsüz sillabuslar hədəfə; köhnə il /
#       semestr / qeyri-aktiv üzvlük mənbədə qalır; mənbə ARXİVLƏNİR (`merged_into` tarixçəsi, köhnə ad hədəfin
#       `aliases`-ində). İki kafedrada bölgülü eyni sətir → apply rədd. Audit; idempotent. Loga YALNIZ saylar.
#   link_lesson_syllabus_weeks — jurnal dərsini sillabusun həftəlik plan SƏTRİNƏ bağlayır (sahib 2026-10-25): mövzu
#       mətni açılışın təsdiqlənmiş sillabus planındakı sətrin mövzusu ilə DƏQİQ (boşluq/registr normallaşdırılmış)
#       eynidirsə və `syllabus_week` boşdursa → sətir nömrəsi. Mövzuya toxunulmur; idempotent. Loga YALNIZ saylar.
#   backfill_notification_i18n — köhnə bildirişlərə dil-müstəqil deskriptor (metadata.i18n) əlavə edir (sahib 2026-10-25
#       «bildirişlərin dili hərəsi bir cür»): siyahı onları oxuyanın dilində göstərir. YALNIZ metadata-ya açar
#       əlavə olunur (başlıq/mətn/keçid/oxunma dəyişmir); idempotent. Giriş yoxdur. Loga YALNIZ saylar.
#   fix_group_education_form — təhsil forması qrup kodundan (sahib 2026-10-25: «4 rəqəm («2232 K») — QİYABİ,
#       3 rəqəm («234 KE») — ƏYANİ»): birmənalı bakalavr qrupunun `settings.education_form`-u düzəldilir/doldurulur,
#       qiyabi qrupdakı «əyani» tələbə qeydləri qiyabi olur, dərs yükü sətri (bütün qrupları eyni formadadırsa)
#       eyani/qiyabi olur. Magistr («409/6MBA»), kollec («1226 A», «1025»), «3/336 F» kimi adlar DƏYİŞMİR. Əyani
#       qrupdakı «qiyabi» tələbə qeydi (yerləşdirmə sualı) dəyişmir — yalnız sayılır. Audit; idempotent. Loga
#       YALNIZ saylar.
#   place_parent_group_students — ana qrupda qalmış tələbə → alt qrup (sahib 2026-10-26: «göndərişdə olana baxaraq
#       alt qrupa yığ»). Sübut: cari dövrün alt qrup jurnallarındakı xanalar (xarici dil SƏVİYYƏ fənləri xaric), ≥75 %
#       tək alt qrupda; ana qrupun ÖZ jurnalında datası olan / xanası olmayan tələbəyə toxunulmur. Yazı rəsmi köçürmə
#       xidməti ilə (reyestrin «Qrupu dəyiş»i); ana qrupun boş, alt qrupda açılışı olmayan qeydiyyatı «Jurnal təmizliyi»
#       qərarı ilə düşür (geri qaytarılır). Loga YALNIZ saylar.
#   fill_group_settings_gaps — qrup kartının BOŞ dil / forma xanaları (sahib 2026-10-26: «alt qrup ana qrupdan, boş
#       xana qalmasın»): köhnə datanın `sector` açarı → `language_sector`, alt qrup ana qrupdan, ana qrup alt
#       qrupların yekdil dəyərindən / koddan / tələbə qeydlərindən. Dolu dəyər dəyişmir. Audit; idempotent. Saylar.
#   unblock_legacy_journal_teachers — köhnə sistemdə bu semestr jurnal aparan müəllimin «Forma 7» bloku açılır
#       (sahib 2026-10-26: «adına nə isə aparıbsa bloklama»). ŞİFRƏLİ release asset (`roster_tag` = `legacy-teachers-…`
#       → teachers.json.enc; yalnız istifadəçi id-ləri + saylar). Yalnız «Forma 7» bloku + işi olan jurnal; əl ilə
#       qoyulan bloklar açılmır; `create_missing` → boş köhnə jurnalı olan da açılır. Rəsmi unblock_account (audit).
#       Loga YALNIZ saylar.
#   fix_master_groups — magistr qrupu (sahib 2026-10-26: «dərslər 18:40/20:00 varsa magistr say»): ŞİFRƏLİ release asset
#       (`roster_tag` = `master-groups-…` → plan.json.enc; yalnız id-lər). Qrupa degree_level=master, magistr ixtisasına
#       keçid, bakalavr proqramındakı qeyd → magistr proqramı + plan (hərəkət deyil, köçürmə xətasının düzəlişi; audit).
#       Loga YALNIZ saylar.
#   fix_master_students — bakalavrdan magistraturaya keçən tələbə (sahib 2026-10-26): ŞİFRƏLİ asset (`roster_tag` =
#       `master-students-…` → plan.json.enc; yalnız id-lər). Bakalavr qeydi məzun/qeyri-aktiv (hərəkətsiz), magistr
#       qrupunda yeni qeyd, arxiv hesabın girişi rəsmi bərpa səthi ilə; səhv qrupdakı magistr qeydi rəsmi köçürmə ilə.
#       Loga YALNIZ saylar.
#   diagnose_journal_access — YALNIZ OXU (sahib 2026-10-26: «müəllimdə yeni dərs yeri görünmür»): `batch` = jurnalın
#       (açılışın) UUID-i, `teacher` = yoxlanan istifadəçi adı (boş — jurnalın sahibi). «Yeni dərs»in hər şərti ayrıca
#       (açılış aktiv, sahib/aktiv/grade.input, jurnal bağlı, sillabus qapısı, bölgü əhatəsi). Loga YALNIZ bəli/xeyr.
#   apply_journal_shares — bölünmüş jurnal (sahib 2026-10-26: «fənn 2 müəllim arasında bölünübsə mühazirəçi mühazirəni,
#       seminarçı yalnız öz ballarını görsün»; səviyyə jurnalında müəllim yalnız öz tələbələrini). Köhnə sistemin jurnal
#       bölgüsü — ŞİFRƏLİ release asset (`roster_tag` = `journal-shares-…` → shares.json.enc, lokal qurulmuş
#       `journal-shares/1`; ad/FİN yoxdur, açarlar prod-un id-ləridir). Açılış × müəllim payı (növlər + tələbələr),
#       əl ilə yaradılan pay üzərinə yazılmır; datası olmayan səviyyə-artığı qeydiyyat «Jurnal təmizliyi» qərarı ilə
#       çıxır (tarixçədən geri qaytarılır). `batch` = `shares-…` + apply → paketin payları söndürülür. Loga YALNIZ saylar.
#   shrink_avatars — mövcud avatarlar ≤512 px WebP-yə (PERF-2 H5, 2026-10-17); orijinal fayllar SİLİNMİR,
#       `updated_at` dəyişmir. Loga yalnız yekun saylar.
#   sync_plan_offerings — təsdiqlənmiş tədris planından qruplara açılış + tələbə yazılışı
#       (backfill; `--include-drafts` BURADA YOXDUR — qaralama planlar sahibin qərarıdır).
#   apply_org_structure — struktur planı (scripts/data/qku_structure_2026_09_27.json, yalnız vahid
#       adları): fakültə/kafedra adı və yeri, yeni vahidlər, ixtisas köçürməsi; köhnə ad/yer tarixçədə.
#   seed_staff_roster — heyət siyahısı (şəxs adları — repoya DÜŞMÜR): ŞİFRƏLİ release asset-i
#       (`roster_tag` → roster.xlsx.enc, açar `STAFF_PLAN_KEY` sirri) runner-də açılır, konteynerə
#       köçürülür, iş bitəndə silinir. Yeni hesabların parolları serverdə /home/wcu/creds/-də qalır və
#       eyni açarla şifrələnmiş artifakt kimi (1 gün) yüklənir.
#
# TƏHLÜKƏSİZLİK:
#   * Açıq shell / ixtiyari əmr YOXDUR — əmr adı `choice` ilə, arqumentlər sabit şablonla.
#   * Girişlər `env:` ilə ötürülür, `run:` bloğuna interpolasiya yoxdur (script injection yox).
#   * `apply` üçün `confirm` = APPLY; apply-dan əvvəl postgres-backup sidecar-ı ilə dump alınır.
#   * Deploy ilə eyni concurrency qrupu — canlı deploy-la toqquşmur.
# ═══════════════════════════════════════════════════════════════════════════
name: 🧰 Prod Data Ops

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Əmr (ağ siyahı)"
        required: true
        type: choice
        default: normalize_interim_components
        options:
          - normalize_interim_components
          - sync_plan_offerings
          - apply_org_structure
          - seed_staff_roster
          - surveys_shuffle_responses
          - superadmin_role_count
          - recompute_syllabus_completion
          - syllabus_auto_approve_pending
          - fix_syllabus_plan_hours
          - journal_hygiene_report
          - reconcile_teacher_roster
          - import_teaching_task_workbook
          - import_teaching_load_form1
          - import_timetable_docx
          - assign_task_rows_from_timetable
          - backfill_teacher_lessons
          - fix_task_row_hours
          - resync_task_offerings
          - repair_group_leads
          - retire_qa_accounts
          - ensure_parent_groups
          - blocked_accounts_report
          - freeze_duplicate_accounts
          - dedupe_notifications
          - archive_junk_groups
          - shrink_avatars
          - issue_staff_credentials
          - purge_trial_exam
          - purge_exam_attempt
          - legacy_delta_apply
          - legacy_repair_empty_lessons
          - sync_midterm_scores
          - infer_timetable_from_lessons
          - audit_cross_chair_loads
          - fix_workload_overcount
          - fill_vacant_from_journals
          - audit_staff_placement
          - merge_chair_units
          - link_lesson_syllabus_weeks
          - backfill_notification_i18n
          - fix_group_education_form
          - place_parent_group_students
          - fill_group_settings_gaps
          - apply_journal_shares
          - unblock_legacy_journal_teachers
          - diagnose_journal_access
          - fix_master_groups
          - fix_master_students
      apply:
        description: "Faktiki yaz (işarələnməsə dry-run)"
        required: false
        type: boolean
        default: false
      confirm:
        description: "apply üçün APPLY yazın"
        required: false
        default: ""
      year:
        description: "sync_plan_offerings / resync_task_offerings / import_teaching_*: tədris ili (məs. 2026/2027)"
        required: false
        default: "2026/2027"
      roster_tag:
        description: "seed_staff_roster / reconcile_teacher_roster / audit_staff_placement (staff-placement-…) / import_teaching_* / *timetable* / backfill_teacher_lessons (lesson-slots-…) / legacy_delta_apply (legacy-delta-…) / fill_vacant_from_journals (legacy-journals-…) / apply_journal_shares (journal-shares-…) / unblock_legacy_journal_teachers (legacy-teachers-…) / fix_master_groups (master-groups-…) / fix_master_students (master-students-…): şifrəli faylın release tag-ı"
        required: false
        default: ""
      hygiene_category:
        description: "journal_hygiene_report: kateqoriya"
        required: false
        type: choice
        default: all
        options:
          - all
          - left
          - empty
          - not_held
      hygiene_code:
        description: "journal_hygiene_report: səbəb kodu və ya strong|review (boş = hamısı)"
        required: false
        default: ""
      batch:
        description: "reconcile_teacher_roster / audit_staff_placement (placement-…) / freeze_duplicate_accounts (dupacct-…) / fix_workload_overcount (overcount-…) / fill_vacant_from_journals (vacantfill-…) / apply_journal_shares (shares-…): geri qaytarılacaq paket id-si (undo) · legacy_delta_apply: paketin gözlənilən sha256-sı · purge_exam_attempt: cəhdin id-si (boş = ən son cəhd)"
        required: false
        default: ""
      create_missing:
        description: "reconcile_teacher_roster: «hesab yoxdur» sətirlərinə FİN-siz müəllim hesabı yarat · audit_staff_placement (apply ilə): aktiv olmayanları blokla (--block-inactive) · blocked_accounts_report (apply ilə): yükü olan bloklanmış müəllimlərin blokunu aç · assign_task_rows_from_timetable: dərs yükündə olmayan dərsə yeni tapşırıq sətri (--create-missing-rows) · fix_syllabus_plan_hours: plan saatı BOŞ olan təsdiqlənmiş versiyaları da doldur (--fill-empty) · fill_vacant_from_journals: bildiriş GÖNDƏRMƏ (--no-notify) · unblock_legacy_journal_teachers: boş köhnə jurnalı olanı da aç (--include-empty)"
        required: false
        type: boolean
        default: false
      task_sheet:
        description: "import_teaching_task_workbook: vərəq (prefiks)"
        required: false
        default: "Proqramlaşdırma"
      task_chair:
        description: "import_teaching_load_form1 / fix_task_row_hours: kafedra adı · resync_task_offerings: boş = bütün kafedralar · purge_trial_exam: imtahanın adı (təsdiq) · purge_exam_attempt: imtahanın slug-ı (təsdiq)"
        required: false
        default: ""
      row_group:
        description: "fix_task_row_hours: qrup işarə(lər)i, vergüllə (məs. 631/5K,631/5K ing)"
        required: false
        default: ""
      row_subject:
        description: "fix_task_row_hours: fənn adı (məs. Müasir proqramlaşdırma dilləri)"
        required: false
        default: ""
      row_activity:
        description: "fix_task_row_hours: fəaliyyət"
        required: false
        type: choice
        default: lab
        options:
          - lecture
          - seminar
          - lab
          - consult
          - exam
          - thesis
          - postgrad
          - practice_research
          - practice_production
      row_hours:
        description: "fix_task_row_hours: yeni cəm saat (0 = fəaliyyəti çıxar)"
        required: false
        default: "0"
      reassign:
        description: "import_teaching_*: fərqli müəllimi düzəliş axını ilə dəyiş · backfill_teacher_lessons: sonradan qoşulanları da iə işarələ"
        required: false
        type: boolean
        default: false
      choices:
        description: "import_teaching_*: işarəsiz seçmə bloku — SƏTİR=BƏND, vergüllə (məs. 144=1,145=1)"
        required: false
        default: ""
      teacher_map:
        description: "import_teaching_*: qeyri-müəyyən müəllim — AD=istifadəçi.adı, vergüllə"
        required: false
        default: ""
      allow_outside_chair:
        description: "import_teaching_* / assign_task_rows_from_timetable: kafedrada tapılmayan adı təşkilatda TƏK uyğun hesaba bağla"
        required: false
        type: boolean
        default: false
      period:
        description: "import_timetable_docx / assign_task_rows_from_timetable / backfill_teacher_lessons / infer_timetable_from_lessons: semestr (məs. Payız 2026/2027)"
        required: false
        default: "Payız 2026/2027"
      replace_group_slots:
        description: "import_timetable_docx: fayldakı qrupların DİGƏR slotlarını yumşaq sil"
        required: false
        type: boolean
        default: false
      teacher:
        description: "backfill_teacher_lessons / infer_timetable_from_lessons (boş = hamı): müəllimin istifadəçi adı (ad.soyad) · purge_trial_exam / sync_midterm_scores: imtahanın slug-ı · purge_exam_attempt: tələbənin istifadəçi adı"
        required: false
        default: ""
      date_from:
        description: "backfill_teacher_lessons / dedupe_notifications / infer_timetable_from_lessons (boş = semestr əvvəli): başlanğıc tarix (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "backfill_teacher_lessons / dedupe_notifications / infer_timetable_from_lessons: son tarix (YYYY-MM-DD, bu gündən sonra yox; dedupe / infer-də boş = bu gün) · legacy_delta_apply: --lessons-until"
        required: false
        default: ""
      replace_teacher_slots:
        description: "backfill_teacher_lessons: (spesifikasiya ilə) müəllimin DİGƏR slotlarını yumşaq sil"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    if: github.event.inputs.apply != 'true' || github.event.inputs.confirm == 'APPLY'
    runs-on: [self-hosted]
    environment: production
    # legacy_delta_apply (tək tranzaksiya, ~2 000 jurnal + dərs yükü) prod-da ~20 dəq + backup çəkir.
    timeout-minutes: 75
    env:
      APP_CONTAINER: educationmanagementstudentarena-app-1
      BACKUP_CONTAINER: emsarena-postgres-backup
      ORG: qku
      COMMAND: ${{ github.event.inputs.command }}
      APPLY: ${{ github.event.inputs.apply }}
      YEAR: ${{ github.event.inputs.year }}
      ROSTER_TAG: ${{ github.event.inputs.roster_tag }}
      HYGIENE_CATEGORY: ${{ github.event.inputs.hygiene_category }}
      HYGIENE_CODE: ${{ github.event.inputs.hygiene_code }}
      BATCH: ${{ github.event.inputs.batch }}
      CREATE_MISSING: ${{ github.event.inputs.create_missing }}
      TASK_SHEET: ${{ github.event.inputs.task_sheet }}
      TASK_CHAIR: ${{ github.event.inputs.task_chair }}
      ROW_GROUP: ${{ github.event.inputs.row_group }}
      ROW_SUBJECT: ${{ github.event.inputs.row_subject }}
      ROW_ACTIVITY: ${{ github.event.inputs.row_activity }}
      ROW_HOURS: ${{ github.event.inputs.row_hours }}
      REASSIGN: ${{ github.event.inputs.reassign }}
      CHOICES: ${{ github.event.inputs.choices }}
      TEACHER_MAP: ${{ github.event.inputs.teacher_map }}
      ALLOW_OUTSIDE_CHAIR: ${{ github.event.inputs.allow_outside_chair }}
      PERIOD: ${{ github.event.inputs.period }}
      REPLACE_GROUP_SLOTS: ${{ github.event.inputs.replace_group_slots }}
      TEACHER: ${{ github.event.inputs.teacher }}
      DATE_FROM: ${{ github.event.inputs.date_from }}
      DATE_TO: ${{ github.event.inputs.date_to }}
      REPLACE_TEACHER_SLOTS: ${{ github.event.inputs.replace_teacher_slots }}
    steps:
      - name: 📥 Checkout (struktur planı)
        if: github.event.inputs.command == 'apply_org_structure'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 🔐 Şifrəli heyət siyahısı / yük sənədi
        if: github.event.inputs.command == 'seed_staff_roster' || (github.event.inputs.command == 'reconcile_teacher_roster' && github.event.inputs.batch == '') || (github.event.inputs.command == 'audit_staff_placement' && github.event.inputs.batch == '') || startsWith(github.event.inputs.command, 'import_teaching_') || (github.event.inputs.command == 'issue_staff_credentials' && github.event.inputs.roster_tag != '') || (github.event.inputs.command == 'fill_vacant_from_journals' && github.event.inputs.batch == '' && github.event.inputs.roster_tag != '') || (github.event.inputs.command == 'apply_journal_shares' && github.event.inputs.batch == '') || github.event.inputs.command == 'unblock_legacy_journal_teachers' || github.event.inputs.command == 'fix_master_groups' || github.event.inputs.command == 'fix_master_students'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          # Asset adı və konteynerdəki fayl əmrdən asılıdır (tag prefiksi ilə birlikdə yoxlanılır).
          case "$COMMAND" in
            import_teaching_task_workbook)
              match "$ROSTER_TAG" '^teaching-task-[0-9a-z-]+$' || { echo "roster_tag formatı: teaching-task-…" >&2; exit 1; }
              asset=tapsiriq.xlsx.enc; target="/tmp/teaching_task_${GITHUB_RUN_ID}.xlsx" ;;
            import_teaching_load_form1)
              match "$ROSTER_TAG" '^teaching-load-[0-9a-z-]+$' || { echo "roster_tag formatı: teaching-load-…" >&2; exit 1; }
              asset=forma1.docx.enc; target="/tmp/teaching_load_${GITHUB_RUN_ID}.docx" ;;
            issue_staff_credentials)
              match "$ROSTER_TAG" '^(staff|student)-known-[0-9a-z-]+$' || { echo "roster_tag formatı: staff-known-… / student-known-…" >&2; exit 1; }
              asset=usernames.txt.enc; target="/tmp/staff_known_${GITHUB_RUN_ID}.txt" ;;
            audit_staff_placement)
              match "$ROSTER_TAG" '^staff-placement-[0-9a-z-]+$' || { echo "roster_tag formatı: staff-placement-…" >&2; exit 1; }
              asset=bundle.zip.enc; target="/tmp/staff_placement_${GITHUB_RUN_ID}.zip" ;;
            fill_vacant_from_journals)
              match "$ROSTER_TAG" '^legacy-journals-[0-9a-z-]+$' || { echo "roster_tag formatı: legacy-journals-…" >&2; exit 1; }
              asset=journals.json.enc; target="/tmp/legacy_journals_${GITHUB_RUN_ID}.json" ;;
            apply_journal_shares)
              match "$ROSTER_TAG" '^journal-shares-[0-9a-z-]+$' || { echo "roster_tag formatı: journal-shares-…" >&2; exit 1; }
              asset=shares.json.enc; target="/tmp/journal_shares_${GITHUB_RUN_ID}.json" ;;
            unblock_legacy_journal_teachers)
              match "$ROSTER_TAG" '^legacy-teachers-[0-9a-z-]+$' || { echo "roster_tag formatı: legacy-teachers-…" >&2; exit 1; }
              asset=teachers.json.enc; target="/tmp/legacy_teachers_${GITHUB_RUN_ID}.json" ;;
            fix_master_groups)
              match "$ROSTER_TAG" '^master-groups-[0-9a-z-]+$' || { echo "roster_tag formatı: master-groups-…" >&2; exit 1; }
              asset=plan.json.enc; target="/tmp/master_groups_${GITHUB_RUN_ID}.json" ;;
            fix_master_students)
              match "$ROSTER_TAG" '^master-students-[0-9a-z-]+$' || { echo "roster_tag formatı: master-students-…" >&2; exit 1; }
              asset=plan.json.enc; target="/tmp/master_students_${GITHUB_RUN_ID}.json" ;;
            *)
              match "$ROSTER_TAG" '^(staff|teacher)-roster-[0-9a-z-]+$' || { echo "roster_tag formatı: staff-roster-… / teacher-roster-…" >&2; exit 1; }
              asset=roster.xlsx.enc; target="/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx" ;;
          esac
          # Serverdə `gh` YOXDUR — release asset-i birbaşa yüklənir (şifrəlidir; token private repo üçün).
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/${asset}" \
            -o "$RUNNER_TEMP/input.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/input.enc" -out "$RUNNER_TEMP/input.bin"
          # `docker cp` runner UID-sini saxlayır (umask 077 → app istifadəçisi oxuya bilmir) — stdin ilə
          # konteynerin ÖZ istifadəçisi yazır.
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > $target" < "$RUNNER_TEMP/input.bin"
          # reconcile_teacher_roster eyni faylı oxuyur (ad fərqi yalnız aydınlıq üçün deyil — təmizlik eyni qlobdur).
          rm -f "$RUNNER_TEMP/input.bin" "$RUNNER_TEMP/input.enc"
      - name: 🧰 Run
        if: github.event.inputs.command != 'import_timetable_docx' && github.event.inputs.command != 'assign_task_rows_from_timetable' && github.event.inputs.command != 'backfill_teacher_lessons' && github.event.inputs.command != 'ensure_parent_groups' && github.event.inputs.command != 'blocked_accounts_report' && github.event.inputs.command != 'archive_junk_groups' && github.event.inputs.command != 'shrink_avatars' && github.event.inputs.command != 'legacy_delta_apply' && github.event.inputs.command != 'freeze_duplicate_accounts'
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          case "$YEAR" in (20[0-9][0-9]/20[0-9][0-9]) ;; (*) echo "year formatı YYYY/YYYY olmalıdır" >&2; exit 1;; esac
          args=()
          custom_apply=0
          superadmin_actor() {
            docker exec -i "$APP_CONTAINER" python manage.py shell -c \
              "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1
          }
          case "$COMMAND" in
            normalize_interim_components)
              args=(--organization "$ORG")
              ;;
            apply_org_structure)
              docker cp "$GITHUB_WORKSPACE/scripts/data/qku_structure_2026_09_27.json" "$APP_CONTAINER:/tmp/org_structure.json"
              args=(--org "$ORG" --plan /tmp/org_structure.json)
              ;;
            seed_staff_roster)
              args=(--org "$ORG" --file "/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx")
              ;;
            surveys_shuffle_responses)
              # Audit 2026-09-28 SV-3: köhnə sorğu cavablarının qəbzlə fiziki sıra əlaqəsini qırır.
              args=(--org "$ORG")
              ;;
            superadmin_role_count)
              # Audit 2026-09-28 SA-04: YALNIZ OXUMA — profile.role='superadmin' olub is_superuser olmayan hesab sayı.
              test "$APPLY" != "true" || { echo "superadmin_role_count yalnız oxumadır — apply=false seçin" >&2; exit 2; }
              count="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                "from core.rls import bypass_rls; from apps.accounts.models import UserProfile; ctx = bypass_rls(); ctx.__enter__(); print(UserProfile.objects.filter(role='superadmin', user__is_superuser=False).count())" | tail -n1)"
              echo "profile.role=superadmin AND NOT is_superuser: $count"
              echo "## 🔎 superadmin_role_count: $count" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            recompute_syllabus_completion)
              args=(--org "$ORG")
              ;;
            syllabus_auto_approve_pending)
              # Sahib 2026-10-25: yalnız saylar çap olunur (ad/FİN yoxdur); açar yandırılıbsa apply CommandError verir.
              args=(--org "$ORG")
              ;;
            fix_syllabus_plan_hours)
              args=(--org "$ORG")
              if [ "$CREATE_MISSING" = "true" ]; then
                args+=(--fill-empty)
              fi
              ;;
            journal_hygiene_report)
              case "$HYGIENE_CATEGORY" in (all|left|empty|not_held) ;; (*) echo "hygiene_category yanlışdır" >&2; exit 2;; esac
              test -z "$HYGIENE_CODE" || match "$HYGIENE_CODE" '^[a-z_]+$' || { echo "hygiene_code yalnız a-z və _" >&2; exit 2; }
              # Loga ŞƏXS ADI düşməsin: yalnız saylar (--show 0).
              args=(--organization "$ORG" --category "$HYGIENE_CATEGORY" --show 0)
              test -z "$HYGIENE_CODE" || args+=(--code "$HYGIENE_CODE")
              if [ "$APPLY" = "true" ]; then
                test "$HYGIENE_CATEGORY" != "all" || { echo "apply üçün konkret kateqoriya seçin" >&2; exit 2; }
                actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                if [ "$HYGIENE_CATEGORY" = "left" ]; then
                  reason="Jurnal təmizliyi: universitetdən ayrılmış tələbələr jurnaldan çıxarılır — sahibin 2026-10-11 tapşırığı"
                else
                  reason="Jurnal təmizliyi: qrupun keçmədiyi / boş fənlər nəticələrdən çıxarılır — sahibin 2026-10-11 tapşırığı"
                fi
                args+=(--apply --reason "$reason" --actor "$actor" --i-know-this-is-production)
                custom_apply=1
              fi
              ;;
            reconcile_teacher_roster)
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              if [ -n "$BATCH" ]; then
                match "$BATCH" '^roster-[0-9a-z-]+$' || { echo "batch formatı: roster-…" >&2; exit 2; }
                test "$APPLY" = "true" || { echo "undo yazır — apply=true + confirm=APPLY verin" >&2; exit 2; }
                args=(--organization "$ORG" --undo "$BATCH" --actor "$actor" --i-know-this-is-production)
              else
                args=("/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx" --organization "$ORG"
                      --report "/tmp/roster_report_${GITHUB_RUN_ID}.md" --details "/tmp/roster_details_${GITHUB_RUN_ID}.csv")
                if [ "$CREATE_MISSING" = "true" ]; then
                  args+=(--create-missing)
                fi
                if [ "$APPLY" = "true" ]; then
                  args+=(--apply --reason "Forma 7 (2026/2027) aktiv müəllim siyahısı — sahibin 2026-10-11 tapşırığı"
                         --actor "$actor" --i-know-this-is-production)
                  # Yeni hesabların birdəfəlik parolları: 0600 fayl → serverdə /home/wcu/creds + şifrəli artifakt
                  # (seed_staff_roster ilə eyni addım); loga DÜŞMÜR.
                  if [ "$CREATE_MISSING" = "true" ]; then
                    args+=(--credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv")
                  fi
                fi
              fi
              custom_apply=1
              ;;
            import_teaching_task_workbook|import_teaching_load_form1)
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              test -z "$CHOICES" || match "$CHOICES" '^[0-9]+=[0-9]+(,[0-9]+=[0-9]+)*$' \
                || { echo "choices formatı: 144=1,145=1" >&2; exit 2; }
              test -z "$TEACHER_MAP" || { [ "${#TEACHER_MAP}" -le 1000 ] && match "$TEACHER_MAP" '^[^=,]+=[A-Za-z0-9._-]+(,[^=,]+=[A-Za-z0-9._-]+)*$'; } \
                || { echo "teacher_map formatı: AD=istifadəçi.adı,…" >&2; exit 2; }
              report_dir="/tmp/teaching_report_${GITHUB_RUN_ID}"
              if [ "$COMMAND" = "import_teaching_task_workbook" ]; then
                test -n "$TASK_SHEET" && [ "${#TASK_SHEET}" -le 60 ] || { echo "task_sheet boş/uzundur" >&2; exit 2; }
                # Hesab YARADILMIR (sahib 2026-10-12) — --no-create-teachers həmişə.
                args=(--file "/tmp/teaching_task_${GITHUB_RUN_ID}.xlsx" --org "$ORG" --year "$YEAR" --actor "$actor"
                      --sheet "$TASK_SHEET" --report "$report_dir" --no-create-teachers)
              else
                test -n "$TASK_CHAIR" && [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair verilməlidir" >&2; exit 2; }
                args=(--file "/tmp/teaching_load_${GITHUB_RUN_ID}.docx" --org "$ORG" --year "$YEAR" --actor "$actor"
                      --chair "$TASK_CHAIR" --report "$report_dir")
              fi
              test -z "$CHOICES" || args+=(--choice "$CHOICES")
              test -z "$TEACHER_MAP" || args+=(--teacher "$TEACHER_MAP")
              test "$REASSIGN" != "true" || args+=(--reassign)
              test "$ALLOW_OUTSIDE_CHAIR" != "true" || args+=(--allow-outside-chair)
              ;;
            fix_task_row_hours)
              # Sahib 2026-10-15: kitabçanın səhv fəaliyyət xanası (631/5K «Laboratoriya» = sətrin cəmi). Arqumentlər
              # massivlə ötürülür (shell şərhi yoxdur); format yoxlaması yalnız ağlabatanlıq üçündür.
              test -n "$TASK_CHAIR" && [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair verilməlidir" >&2; exit 2; }
              for value in "$ROW_GROUP" "$ROW_SUBJECT"; do
                test -n "$value" && [ "${#value}" -le 200 ] || { echo "row_group / row_subject verilməlidir (≤200)" >&2; exit 2; }
                match "$value" '^[^[:cntrl:]"`$\\;|&<>]+$' || { echo "row_group / row_subject icazəsiz simvol" >&2; exit 2; }
              done
              case "$ROW_ACTIVITY" in (lecture|seminar|lab|consult|exam|thesis|postgrad|practice_research|practice_production) ;; (*) echo "row_activity yanlışdır" >&2; exit 2;; esac
              match "$ROW_HOURS" '^[0-9]{1,4}$' || { echo "row_hours 0..9999 tam ədəd olmalıdır" >&2; exit 2; }
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --chair "$TASK_CHAIR" --group "$ROW_GROUP" --subject "$ROW_SUBJECT"
                    --activity "$ROW_ACTIVITY" --hours "$ROW_HOURS" --actor "$actor"
                    --reason "TAPŞIRIQ kitabçasında fəaliyyət xanası səhvdir (sətrin cəmi yazılıb) — sahibin 2026-10-15 tapşırığı")
              ;;
            resync_task_offerings)
              # 2026-10-15: rəsmi seçmə blok seçimi → qrupun seçimi + açılış + qeydiyyat (offering_electives).
              # Arqumentlər massivlə ötürülür (shell şərhi yoxdur); format yoxlaması yalnız ağlabatanlıq üçündür.
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              if [ -n "$TASK_CHAIR" ]; then
                [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair uzundur (≤120)" >&2; exit 2; }
                match "$TASK_CHAIR" '^[^[:cntrl:]"`$\\;|&<>]+$' || { echo "task_chair icazəsiz simvol" >&2; exit 2; }
                args+=(--chair "$TASK_CHAIR")
              else
                args+=(--all-chairs)
              fi
              ;;
            sync_plan_offerings)
              actor="$(superadmin_actor)"
              test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              # İstifadəçi adı loglarda görünməsin (təhlükəsizlik yoxlaması, info).
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              ;;
            dedupe_notifications)
              # Sahib 2026-10-17: təkrar «Dərs yükü təyin edildi» bildirişləri oxunmuş edilir (silinmir). Tip sabitdir
              # (yalnız workload `assignment`); tarixlər `date_from` / `date_to` girişlərindən, format yoxlanılır.
              match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
              args=(--org "$ORG" --type assignment --since "$DATE_FROM" --window-minutes 120)
              if [ -n "$DATE_TO" ]; then
                match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
                args+=(--until "$DATE_TO")
              fi
              ;;
            repair_group_leads)
              # Starosta (lead_student) üzvlüklərinin təmiri — gecə 2026-10-13: köhnə rol axınları starostanı
              # scope_unit-siz yaradırdı. Defolt QURU QAÇIŞ; apply → konservativ düzəliş (ehtiyat nüsxədən sonra).
              args=(--org "$ORG")
              ;;
            retire_qa_accounts)
              # QA test hesablarını (qa.*, @qa.local) üzvlük reyestrindən çıxarır — silmir, geri qaytarıla bilər
              # (`manage.py retire_qa_accounts --undo`). Defolt QURU QAÇIŞ; apply → ehtiyat nüsxədən sonra.
              # Hesablar sintetikdir (şəxsi data yox) → istifadəçi adlarının loga düşməsi icazəlidir.
              args=(--org "$ORG")
              ;;
            issue_staff_credentials)
              # Fakültə adı (task_chair) və ad axtarışı (teacher): yalnız hərf/rəqəm/boşluq/nöqtə/tire, LF/CR yox.
              test -z "$TASK_CHAIR" || { [ "${#TASK_CHAIR}" -le 120 ] && match "$TASK_CHAIR" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .()-]+$'; } \
                || { echo "task_chair (fakültə) formatı yanlışdır" >&2; exit 2; }
              test -z "$TEACHER" || { [ "${#TEACHER}" -le 80 ] && match "$TEACHER" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .-]+$'; } \
                || { echo "teacher (ad axtarışı) formatı yanlışdır" >&2; exit 2; }
              # `student-known-…` tag-ı → tələbə rejimi (fakültə boşdursa bütün fakültələr; siyahıdakı parol yoxlanılır).
              students=0
              case "$ROSTER_TAG" in (student-known-*) students=1 ;; esac
              test "$students" = 1 || test -n "$TASK_CHAIR" || test -n "$TEACHER" || { echo "task_chair (fakültə) və ya teacher (ad) verin" >&2; exit 2; }
              args=(--org "$ORG" --report-out "/tmp/roster_details_${GITHUB_RUN_ID}.csv")
              test "$students" = 0 || args+=(--audience students)
              test -z "$TASK_CHAIR" || args+=(--faculty "$TASK_CHAIR")
              test -z "$TEACHER" || args+=(--find-name "$TEACHER")
              test -z "$ROSTER_TAG" || args+=(--known-usernames "/tmp/staff_known_${GITHUB_RUN_ID}.txt")
              if [ "$APPLY" = "true" ]; then
                test "$students" = 1 || test -n "$TASK_CHAIR" || { echo "apply üçün task_chair (fakültə) məcburidir" >&2; exit 2; }
                test -n "$ROSTER_TAG" || { echo "apply üçün roster_tag (staff-known-…) məcburidir" >&2; exit 2; }
                args+=(--apply --credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv"
                       --reason "Fakültə üzrə ilkin parol siyahısının tamamlanması — sahibin 2026-10-19 tapşırığı"
                       --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            purge_trial_exam)
              # Sahib 2026-10-21: sınaq midterm-in silinməsi. `teacher` = slug (dəqiq), `task_chair` = imtahanın adı
              # (əmr özü bərabərliyi yoxlayır). Yeni giriş yoxdur (25 limit) — mövcud girişlər təkrar istifadə olunur.
              { [ "${#TEACHER}" -le 220 ] && match "$TEACHER" '^[a-z0-9_-]{0,200}-[A-Za-z0-9]{6}$'; } \
                || { echo "teacher (imtahanın slug-ı) formatı: ad-XXXXXX" >&2; exit 2; }
              { [ "${#TASK_CHAIR}" -le 120 ] && match "$TASK_CHAIR" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .()-]+$'; } \
                || { echo "task_chair (imtahanın adı) formatı: hərf/rəqəm/boşluq" >&2; exit 2; }
              # `--x=dəyər` forması: tamamilə qeyri-latın adlı imtahanın slug-ı «-XXXXXX» ola bilər (argparse onu bayraq sanmasın).
              args=(--org "$ORG" "--slug=$TEACHER" "--expect-title=$TASK_CHAIR")
              if [ "$APPLY" = "true" ]; then
                args+=(--apply --reason "Sınaq midterm-in silinməsi — sahibin 2026-10-21 tapşırığı" --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            purge_exam_attempt)
              # Sahib 2026-10-25: tələbənin səhv imtahan cəhdi. `teacher` = tələbənin istifadəçi adı (dəqiq), `batch` = cəhdin
              # id-si (boş = ən son cəhd), `task_chair` = imtahanın slug-ı (apply üçün məcburi; əmr bərabərliyi yoxlayır).
              # Yeni giriş yoxdur (25 limit) — mövcud girişlər təkrar istifadə olunur.
              { [ "${#TEACHER}" -le 150 ] && match "$TEACHER" '^[A-Za-z0-9._-]{1,150}$'; } \
                || { echo "teacher (tələbənin istifadəçi adı) formatı: ad.soyad" >&2; exit 2; }
              args=(--org "$ORG" "--username=$TEACHER")
              if [ -n "$BATCH" ]; then
                match "$BATCH" '^[0-9]{1,12}$' || { echo "batch (cəhdin id-si) rəqəm olmalıdır" >&2; exit 2; }
                args+=("--attempt=$BATCH")
              else
                args+=(--latest)
              fi
              if [ -n "$TASK_CHAIR" ]; then
                { [ "${#TASK_CHAIR}" -le 220 ] && match "$TASK_CHAIR" '^[a-z0-9_-]{0,200}-[A-Za-z0-9]{6}$'; } \
                  || { echo "task_chair (imtahanın slug-ı) formatı: ad-XXXXXX" >&2; exit 2; }
                # `--x=dəyər` forması: «-XXXXXX» slug-ı argparse bayraq sanmasın.
                args+=("--expect-exam-slug=$TASK_CHAIR")
              fi
              if [ "$APPLY" = "true" ]; then

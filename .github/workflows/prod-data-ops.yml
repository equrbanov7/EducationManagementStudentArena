            sed -E -e 's/^[^ []+ (\[[a-z_]+\])/*** \1/' -e 's/\([^ ()]+\.[^ ()]+\)/(***)/g' "$RUNNER_TEMP/out.log" | cut -c1-200 | tail -n 200 > "$RUNNER_TEMP/summary.log"
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || exit "$status"
          elif [ "$COMMAND" = "audit_cross_chair_loads" ]; then
            # Loga YALNIZ «cross_chair: açar=say …» sətri (əmr ad çap etmir; yenə də süzülür) və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^cross_chair: [a-z_]+=[0-9a-z_]+( [a-z_]+=[0-9a-z_]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "fix_workload_overcount" ]; then
            # Loga YALNIZ «overcount: açar=say …» sətirləri və rədd kodu; adlı hesabat şifrəli artifakta gedir.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^overcount: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            docker exec "$APP_CONTAINER" cat "/tmp/overcount_report_${GITHUB_RUN_ID}.md" > "$RUNNER_TEMP/report.md" 2>/dev/null || true
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "fill_vacant_from_journals" ]; then
            # Loga YALNIZ «vacantfill: açar=say …» sətirləri və rədd kodu; adlı hesabat («məlumat yoxdur» siyahısı)
            # şifrəli artifakta gedir.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^vacantfill: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            docker exec "$APP_CONTAINER" cat "/tmp/vacant_fill_report_${GITHUB_RUN_ID}.md" > "$RUNNER_TEMP/report.md" 2>/dev/null || true
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "fix_master_groups" ] || [ "$COMMAND" = "fix_master_students" ]; then
            # Loga YALNIZ «master_groups: / master_students: açar=say …» sətirləri və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(master_groups|master_students): [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "diagnose_journal_access" ]; then
            # Loga YALNIZ «journal_access: açar=yes|no …» sətri və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^journal_access: [a-z_]+=[a-z]+( [a-z_]+=[a-z]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "unblock_legacy_journal_teachers" ]; then
            # Loga YALNIZ «legacy_teachers_unblock: açar=say …» sətirləri və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^legacy_teachers_unblock: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "apply_journal_shares" ]; then
            # Loga YALNIZ «journal_shares: açar=say …» sətirləri (əmr ad/id çap etmir; yenə də süzülür) və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^journal_shares: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "infer_timetable_from_lessons" ]; then
            # Loga YALNIZ «timetable_infer: açar=say …» sətirləri (əmr ad çap etmir; yenə də süzülür) və rədd kodu;
            # sətir-sətir CSV (müəllim adları) şifrəli artifakta gedir (aşağıdakı addım).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^timetable_infer: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            docker exec "$APP_CONTAINER" cat "/tmp/timetable_infer_${GITHUB_RUN_ID}.csv" > "$RUNNER_TEMP/details.csv" 2>/dev/null || true
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "place_parent_group_students" ] || [ "$COMMAND" = "fill_group_settings_gaps" ]; then
            # Loga YALNIZ «<prefiks>: açar=say …» sətirləri və rədd kodu (--list ötürülmür — adlar çap olunmur).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(subgroup_placement|group_settings_gaps): [a-z_]+=[0-9a-z_]+( [a-z_]+=[0-9a-z_]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "link_lesson_syllabus_weeks" ] || [ "$COMMAND" = "fix_group_education_form" ] || [ "$COMMAND" = "merge_chair_units" ]; then
            # Loga YALNIZ «<prefiks>: açar=say …» sətirləri və rədd kodu (əmrlər mövzu/ad çap etmir).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(syllabus_week_link|group_education_form|chair_merge): [a-z_]+=[0-9a-z_]+( [a-z_]+=[0-9a-z_]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "legacy_repair_empty_lessons" ] || [ "$COMMAND" = "sync_midterm_scores" ]; then
            # Loga YALNIZ saylar: aktor sətri atılır, xəta olarsa yalnız CommandError kodu.
            # Xülasə açarlarında «:» olmamalıdır (`  açar : dəyər`) — test: test_repair_empty_lessons.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(===.*===|  [^:]+ : .*|  \(DRY-RUN.*|(YAZILDI|DRY-RUN).*: rəsmi .*)$' "$RUNNER_TEMP/out.log" \
              | grep -v 'Aktor:' | cut -c1-300 > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: .{0,160}' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          else
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/out.log"
            tail -n 120 "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log"
          fi
          echo "::endgroup::"
          {
            echo "## 🧰 ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/summary.log"
      - name: 🔑 Hesabat + parollar (serverdə saxla, şifrəli artifakt)
        id: creds
        if: always() && (github.event.inputs.command == 'seed_staff_roster' || github.event.inputs.command == 'reconcile_teacher_roster' || github.event.inputs.command == 'audit_staff_placement' || startsWith(github.event.inputs.command, 'import_teaching_') || github.event.inputs.command == 'issue_staff_credentials' || github.event.inputs.command == 'infer_timetable_from_lessons' || github.event.inputs.command == 'fix_workload_overcount' || github.event.inputs.command == 'fill_vacant_from_journals')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/staff-out"
          if [ -s "$RUNNER_TEMP/out.log" ]; then
            enc "$RUNNER_TEMP/out.log" "$RUNNER_TEMP/staff-out/report.log.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
          fi
          for f in report.md details.csv; do
            if [ -s "$RUNNER_TEMP/$f" ]; then
              enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/staff-out/$f.enc"
              echo "saved=1" >> "$GITHUB_OUTPUT"
            fi
          done
          rm -f "$RUNNER_TEMP/out.log" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/details.csv"
          if [ "$APPLY" = "true" ] && docker exec "$APP_CONTAINER" test -s "/tmp/staff_creds_${GITHUB_RUN_ID}.csv"; then
            mkdir -p "$HOME/creds" && chmod 700 "$HOME/creds"
            out="$HOME/creds/staff_$(date +%Y%m%d_%H%M%S).csv"
            docker exec "$APP_CONTAINER" cat "/tmp/staff_creds_${GITHUB_RUN_ID}.csv" > "$out" && chmod 600 "$out"
            enc "$out" "$RUNNER_TEMP/staff-out/staff_creds.csv.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
            echo "Parollar serverdə: $out" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 📦 Şifrəli hesabat/parol artifaktı
        if: always() && steps.creds.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staff-roster-encrypted
          path: ${{ runner.temp }}/staff-out/
          retention-days: 1
      - name: 🧹 Konteynerdə müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'seed_staff_roster' || github.event.inputs.command == 'apply_org_structure' || github.event.inputs.command == 'reconcile_teacher_roster' || github.event.inputs.command == 'audit_staff_placement' || startsWith(github.event.inputs.command, 'import_teaching_') || github.event.inputs.command == 'issue_staff_credentials' || github.event.inputs.command == 'infer_timetable_from_lessons' || github.event.inputs.command == 'fix_workload_overcount' || github.event.inputs.command == 'fill_vacant_from_journals' || github.event.inputs.command == 'apply_journal_shares' || github.event.inputs.command == 'unblock_legacy_journal_teachers' || github.event.inputs.command == 'fix_master_groups' || github.event.inputs.command == 'fix_master_students')
        run: |
          # root kimi: fərqli UID-li qalıqlar (sticky /tmp) app istifadəçisi ilə silinmir.
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/staff_roster*.xlsx /tmp/staff_known_*.txt /tmp/staff_creds*.csv /tmp/org_structure.json /tmp/roster_report_*.md /tmp/roster_details_*.csv /tmp/teaching_task_*.xlsx /tmp/teaching_load_*.docx /tmp/timetable_infer_*.csv /tmp/staff_placement_*.zip /tmp/placement_report_*.md /tmp/placement_details_*.csv /tmp/overcount_report_*.md /tmp/vacant_fill_report_*.md /tmp/legacy_journals_*.json /tmp/journal_shares_*.json /tmp/legacy_teachers_*.json /tmp/master_groups_*.json /tmp/master_students_*.json; rm -rf /tmp/teaching_report_*' || true
          rm -rf "$RUNNER_TEMP/staff-out" "$RUNNER_TEMP/out.log" || true
      # ── import_timetable_docx / assign_task_rows_from_timetable (dərs cədvəli; öz addımları — digər əmrlərin
      #    axınına toxunmur). Hər ikisi eyni şifrəli timetable.docx.enc faylını oxuyur. ──────────────────────
      - name: 🗓️ Dərs cədvəli — şifrəli fayl + idxal
        if: github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          case "$COMMAND" in
            import_timetable_docx) report_csv=timetable_import.csv ;;
            assign_task_rows_from_timetable) report_csv=timetable_task_assign.csv ;;
            *) echo "icazəsiz əmr: $COMMAND" >&2; exit 2 ;;
          esac
          match "$ROSTER_TAG" '^timetable-[0-9a-z-]+$' || { echo "roster_tag formatı: timetable-…" >&2; exit 1; }
          match "$PERIOD" '^(Payız|Yaz|Yay) 20[0-9]{2}/20[0-9]{2}$' || { echo "period formatı: «Payız 2026/2027»" >&2; exit 2; }
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/timetable.docx.enc" \
            -o "$RUNNER_TEMP/timetable.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/timetable.enc" -out "$RUNNER_TEMP/timetable.docx"
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/timetable_${GITHUB_RUN_ID}.docx" < "$RUNNER_TEMP/timetable.docx"
          rm -f "$RUNNER_TEMP/timetable.docx" "$RUNNER_TEMP/timetable.enc"
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args=(--file "/tmp/timetable_${GITHUB_RUN_ID}.docx" --org "$ORG" --period "$PERIOD" --actor "$actor"
                --report "/tmp/timetable_report_${GITHUB_RUN_ID}")
          if [ "$COMMAND" = "import_timetable_docx" ]; then
            test "$CREATE_MISSING" != "true" || { echo "create_missing import_timetable_docx üçün deyil (assign_task_rows_from_timetable)" >&2; exit 2; }
            test "$REPLACE_GROUP_SLOTS" != "true" || args+=(--replace-group-slots)
          else
            # `create_missing` → dərs yükündə olmayan dərs üçün yeni tapşırıq sətri (+ tapşırıq / kataloq fənni).
            test "$CREATE_MISSING" != "true" || args+=(--create-missing-rows)
            # Tapşırığın tədris ili semestrdən götürülür; kafedradankənar müəllim yalnız açıq bayraqla.
            test "$ALLOW_OUTSIDE_CHAIR" != "true" || args+=(--allow-outside-chair)
            # Açıq müəllim xəritəsi (`teacher_map`): «Soyad İ.=istifadəçi.adı», vergüllə.
            test -z "$TEACHER_MAP" || { [ "${#TEACHER_MAP}" -le 1000 ] && match "$TEACHER_MAP" '^[^=,]+=[A-Za-z0-9._-]+(,[^=,]+=[A-Za-z0-9._-]+)*$'; } \
              || { echo "teacher_map formatı: AD=istifadəçi.adı,…" >&2; exit 2; }
            test -z "$TEACHER_MAP" || args+=(--teacher "$TEACHER_MAP")
          fi
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply)
            test "$COMMAND" != "import_timetable_docx" || args+=(--i-know-this-is-production)
          fi
          # Hesabat CSV-də şəxs adları var → loga YALNIZ saylar/səbəb kodları (əmr ad çap etmir; yenə də süzülür).
          docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/tt_out.log" 2>&1 || status=$?
          if docker exec "$APP_CONTAINER" test -s "/tmp/timetable_report_${GITHUB_RUN_ID}/${report_csv}"; then
            docker exec "$APP_CONTAINER" cat "/tmp/timetable_report_${GITHUB_RUN_ID}/${report_csv}" > "$RUNNER_TEMP/tt_details.csv"
          fi
          grep -E '^(DRY-RUN|YAZILDI): |^  ([a-z]+ +[0-9]+|[a-z_0-9]+=[0-9]+|oxunmayan sətir: [0-9]+|tapılmayan qrup başlığı: [0-9]+|tələbəsi görünməyən açılış: [0-9]+|yumşaq silinən köhnə slot: [0-9]+|yaradıldı: [0-9]+|səbəb\[[a-z]+\]: [a-z_0-9=, ]+)$' \
            "$RUNNER_TEMP/tt_out.log" | cut -c1-400 > "$RUNNER_TEMP/tt_summary.log" || true
          cat "$RUNNER_TEMP/tt_summary.log"
          {
            echo "## 🗓️ ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/tt_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/tt_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Dərs cədvəli hesabatı (şifrəli)
        id: tt_report
        if: always() && (github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/tt-out"
          for f in tt_out.log tt_details.csv; do
            if [ -s "$RUNNER_TEMP/$f" ]; then
              enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/tt-out/$f.enc"
              echo "saved=1" >> "$GITHUB_OUTPUT"
            fi
          done
          rm -f "$RUNNER_TEMP/tt_out.log" "$RUNNER_TEMP/tt_details.csv" "$RUNNER_TEMP/tt_summary.log"
      - name: 📦 Şifrəli dərs cədvəli hesabatı
        if: always() && steps.tt_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.inputs.command == 'assign_task_rows_from_timetable' && 'timetable-assign-encrypted' || 'timetable-import-encrypted' }}
          path: ${{ runner.temp }}/tt-out/
          retention-days: 1
      - name: 🧹 Dərs cədvəli — müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable')
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/timetable_*.docx; rm -rf /tmp/timetable_report_*' || true
          rm -rf "$RUNNER_TEMP/tt-out" "$RUNNER_TEMP/timetable.enc" "$RUNNER_TEMP/timetable.docx" || true
      # ── backfill_teacher_lessons (keçmiş dərslər + «iə»; öz addımları — digər əmrlərin axınına toxunmur).
      #    Spesifikasiya (istəyə bağlı) ŞİFRƏLİ release asset-dir: `lesson-slots-…` → slots.json.enc. ─────────
      - name: 📚 Keçmiş dərslər — cədvəldən bərpa
        if: github.event.inputs.command == 'backfill_teacher_lessons'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          match "$TEACHER" '^[A-Za-z0-9._-]{1,150}$' || { echo "teacher formatı: ^[A-Za-z0-9._-]+$" >&2; exit 2; }
          echo "::add-mask::$TEACHER"
          match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
          match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
          match "$PERIOD" '^(Payız|Yaz|Yay) 20[0-9]{2}/20[0-9]{2}$' || { echo "period formatı: «Payız 2026/2027»" >&2; exit 2; }
          umask 077
          spec_args=()
          if [ -n "$ROSTER_TAG" ]; then
            match "$ROSTER_TAG" '^lesson-slots-[0-9a-z-]+$' || { echo "roster_tag formatı: lesson-slots-…" >&2; exit 2; }
            test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/slots.json.enc" \
              -o "$RUNNER_TEMP/slots.enc"
            openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
              -in "$RUNNER_TEMP/slots.enc" -out "$RUNNER_TEMP/slots.json"
            docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/lesson_slots_${GITHUB_RUN_ID}.json" < "$RUNNER_TEMP/slots.json"
            rm -f "$RUNNER_TEMP/slots.json" "$RUNNER_TEMP/slots.enc"
            spec_args=(--slots-file "/tmp/lesson_slots_${GITHUB_RUN_ID}.json")
            test "$REPLACE_TEACHER_SLOTS" != "true" || spec_args+=(--replace-teacher-slots)
          else
            test "$REPLACE_TEACHER_SLOTS" != "true" || { echo "replace_teacher_slots yalnız spesifikasiya (roster_tag=lesson-slots-…) ilə" >&2; exit 2; }
          fi
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args=(--org "$ORG" --teacher "$TEACHER" --period "$PERIOD" --from "$DATE_FROM" --to "$DATE_TO" --mark present
                --actor "$actor" --report "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}" "${spec_args[@]}")
          test "$REASSIGN" != "true" || args+=(--include-late-joiners)
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply --i-know-this-is-production)
          fi
          # Loga YALNIZ saylar + açılış (fənn · qrup) sayları; tam hesabat şifrəli artifaktdadır.
          docker exec -i "$APP_CONTAINER" python manage.py backfill_teacher_lessons "${args[@]}" > "$RUNNER_TEMP/bf_out.log" 2>&1 || status=$?
          for f in lesson_backfill_lessons.csv lesson_backfill_slots.csv; do
            if docker exec "$APP_CONTAINER" test -s "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}/$f"; then
              docker exec "$APP_CONTAINER" cat "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}/$f" > "$RUNNER_TEMP/$f"
            fi
          done
          grep -E '^(DRY-RUN|YAZILDI): |^  (slot|dərs|işarə iə|səbəb\[skipped\]): |^  açılış \[|^Hesabat: ' \
            "$RUNNER_TEMP/bf_out.log" | cut -c1-400 > "$RUNNER_TEMP/bf_summary.log" || true
          cat "$RUNNER_TEMP/bf_summary.log"
          {
            echo "## 📚 backfill_teacher_lessons — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/bf_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/bf_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Keçmiş dərslər hesabatı (şifrəli)
        id: bf_report
        if: always() && github.event.inputs.command == 'backfill_teacher_lessons'
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/bf-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in bf_out.log lesson_backfill_lessons.csv lesson_backfill_slots.csv; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/bf-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
          rm -f "$RUNNER_TEMP/bf_out.log" "$RUNNER_TEMP/bf_summary.log" "$RUNNER_TEMP/lesson_backfill_lessons.csv" "$RUNNER_TEMP/lesson_backfill_slots.csv"
      - name: 📦 Şifrəli keçmiş dərslər hesabatı
        if: always() && steps.bf_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lesson-backfill-encrypted
          path: ${{ runner.temp }}/bf-out/
          retention-days: 1
      - name: 🧹 Keçmiş dərslər — müvəqqəti faylları sil
        if: always() && github.event.inputs.command == 'backfill_teacher_lessons'
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/lesson_slots_*.json; rm -rf /tmp/lesson_backfill_report_*' || true
          rm -rf "$RUNNER_TEMP/bf-out" "$RUNNER_TEMP/slots.enc" "$RUNNER_TEMP/slots.json" || true
      # ── legacy_delta_apply (köhnə sistem deltası; öz addımları). Paket ŞƏXSİ datadır: yalnız şifrəli gəlir,
      #    konteynerdə 0600, iş bitəndə silinir; loga YALNIZ saylar, adlı siyahı şifrəli artifaktdadır. ──
      - name: 🗃️ Köhnə sistem deltası
        if: github.event.inputs.command == 'legacy_delta_apply'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          match "$ROSTER_TAG" '^legacy-delta-[0-9a-z-]+$' || { echo "roster_tag formatı: legacy-delta-…" >&2; exit 2; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          args=(--organization "$ORG" --bundle "/tmp/legacy_delta_${GITHUB_RUN_ID}.json.gz"
                --report-out "/tmp/legacy_delta_report_${GITHUB_RUN_ID}.json"
                --names-out "/tmp/legacy_delta_names_${GITHUB_RUN_ID}.csv")
          if [ -n "$BATCH" ]; then
            match "$BATCH" '^[0-9a-f]{64}$' || { echo "batch = paketin sha256-sı (64 hex)" >&2; exit 2; }
            args+=(--expected-sha256 "$BATCH")
          fi
          if [ -n "$DATE_TO" ]; then
            match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
            args+=(--lessons-until "$DATE_TO")
          fi
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/delta.json.gz.enc" \
            -o "$RUNNER_TEMP/delta.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/delta.enc" -out "$RUNNER_TEMP/delta.json.gz"
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/legacy_delta_${GITHUB_RUN_ID}.json.gz" < "$RUNNER_TEMP/delta.json.gz"
          rm -f "$RUNNER_TEMP/delta.json.gz" "$RUNNER_TEMP/delta.enc"
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args+=(--actor "$actor")
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply --i-know-this-is-production)
          fi
          # Əmrin stdout-u YALNIZ saylardır (ad yoxdur) — loga və xülasəyə düşə bilər.
          docker exec -i "$APP_CONTAINER" python manage.py legacy_delta_apply "${args[@]}" > "$RUNNER_TEMP/delta_out.log" 2>&1 || status=$?
          for f in "legacy_delta_report_${GITHUB_RUN_ID}.json" "legacy_delta_names_${GITHUB_RUN_ID}.csv"; do
            if docker exec "$APP_CONTAINER" test -s "/tmp/$f"; then
              docker exec "$APP_CONTAINER" cat "/tmp/$f" > "$RUNNER_TEMP/$f"
            fi
          done
          grep -E '^(===|  [a-z_.]+ +[0-9]+$|  yaradılan: )' "$RUNNER_TEMP/delta_out.log" | cut -c1-200 > "$RUNNER_TEMP/delta_summary.log" || true
          cat "$RUNNER_TEMP/delta_summary.log"
          {
            echo "## 🗃️ legacy_delta_apply — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/delta_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/delta_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Köhnə sistem deltası — hesabat (şifrəli)
        id: delta_report
        if: always() && github.event.inputs.command == 'legacy_delta_apply'
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/delta-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in delta_out.log "legacy_delta_report_${GITHUB_RUN_ID}.json" "legacy_delta_names_${GITHUB_RUN_ID}.csv"; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/delta-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
          rm -f "$RUNNER_TEMP/delta_out.log" "$RUNNER_TEMP/delta_summary.log" "$RUNNER_TEMP"/legacy_delta_*
      - name: 📦 Şifrəli köhnə sistem deltası hesabatı
        if: always() && steps.delta_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-delta-encrypted
          path: ${{ runner.temp }}/delta-out/
          retention-days: 1
      - name: 🧹 Köhnə sistem deltası — müvəqqəti faylları sil
        if: always() && github.event.inputs.command == 'legacy_delta_apply'
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/legacy_delta_*' || true
          rm -rf "$RUNNER_TEMP/delta-out" "$RUNNER_TEMP/delta.enc" "$RUNNER_TEMP/delta.json.gz" || true
      # ── ensure_parent_groups / blocked_accounts_report (ortaq ana qruplar + bloklanmış hesablar; öz addımları —
      #    digər əmrlərin axınına toxunmur). CSV hesabat şifrəli artifaktdadır (blocked_accounts.csv ŞƏXSİ datadır). ──
      - name: 👥 Ortaq ana qruplar / bloklanmış hesablar
        if: github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars' || github.event.inputs.command == 'freeze_duplicate_accounts'
        run: |
          set -euo pipefail
          report_dir="/tmp/groups_accounts_report_${GITHUB_RUN_ID}"
          args=(--org "$ORG" --report "$report_dir")
          case "$COMMAND" in
            ensure_parent_groups)
              report_csv=parent_groups.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing yalnız blocked_accounts_report üçündür" >&2; exit 2; }
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            blocked_accounts_report)
              report_csv=blocked_accounts.csv
              # Yeganə yazı: yükü olan bloklanmış müəllimin bloku (create_missing) — apply + confirm=APPLY ilə.
              if [ "$APPLY" = "true" ] || [ "$CREATE_MISSING" = "true" ]; then
                test "$APPLY" = "true" && test "$CREATE_MISSING" = "true" \
                  || { echo "blokdan açmaq üçün apply=true + confirm=APPLY + create_missing=true verin" >&2; exit 2; }
                actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                  "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
                test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                args+=(--apply-unblock-teachers-with-load --actor "$actor")
              fi
              ;;
            archive_junk_groups)
              # QA-2 F-16 (2026-10-17): test / zibil qruplar — yalnız istifadə olunmayan deaktiv, heç nə silinmir.
              report_csv=junk_groups.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing bu əmr üçün deyil" >&2; exit 2; }
              # 2026-10-25: `task_chair` = fakültənin adı → onun alt-ağacında boş qruplar (--idle-under).
              if [ -n "$TASK_CHAIR" ]; then
                { [ "${#TASK_CHAIR}" -le 120 ] && printf '%s' "$TASK_CHAIR" | grep -Eq '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .()-]+$'; } \
                  || { echo "task_chair (vahidin adı) formatı: hərf/rəqəm/boşluq" >&2; exit 2; }
                args+=("--idle-under=$TASK_CHAIR")
              fi
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            shrink_avatars)
              # PERF-2 H5 (2026-10-17): mövcud avatarlar ≤512 px WebP; orijinallar SİLİNMİR (--delete-originals verilmir).
              report_csv=none.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing bu əmr üçün deyil" >&2; exit 2; }
              args=()
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            freeze_duplicate_accounts)
              # Sahib 2026-10-25: dublikat heyət hesabı — jurnal yazılan hesab saxlanılır, digərləri dondurulur.
              report_csv=duplicate_accounts.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing bu əmr üçün deyil" >&2; exit 2; }
              if [ "$APPLY" = "true" ] || [ -n "$BATCH" ]; then
                test "$APPLY" = "true" || { echo "yazı / undo üçün apply=true + confirm=APPLY verin" >&2; exit 2; }
                actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                  "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
                test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                args+=(--actor "$actor" --i-know-this-is-production)
                if [ -n "$BATCH" ]; then
                  [[ "$BATCH" =~ ^dupacct-[0-9a-z-]+$ ]] || { echo "batch formatı: dupacct-…" >&2; exit 2; }
                  args+=(--undo "$BATCH")
                else
                  args+=(--apply)
                fi
              fi
              ;;
            *) echo "icazəsiz əmr: $COMMAND" >&2; exit 2 ;;
          esac
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
          fi
          # Loga YALNIZ saylar (əmr ad çap etmir; yenə də süzülür); CSV şifrəli artifaktdadır.
          docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/ga_out.log" 2>&1 || status=$?
          if docker exec "$APP_CONTAINER" test -s "${report_dir}/${report_csv}"; then
            docker exec "$APP_CONTAINER" cat "${report_dir}/${report_csv}" > "$RUNNER_TEMP/ga_details.csv"
          fi
          grep -E '^(DRY-RUN \(heç nə yazılmadı\)|HESABAT \(heç nə yazılmadı\)|YAZILDI): [a-z_]+=[0-9]+( · [a-z_]+=[0-9]+)*$|^Hesabat: [a-z_]+\.csv \([0-9]+ sətir\)$|^Paket: dupacct-[0-9a-z-]+$|^(TƏTBİQ OLUNDU|QURU QAÇIŞ \(heç nə yazılmadı; --apply ilə yazılır\)): çevriləcək/çevrilən [0-9]+, ötürülən [0-9]+, fayl yoxdur [0-9]+, xəta [0-9]+; qənaət ≈ [0-9.]+ [KM]B$' \
            "$RUNNER_TEMP/ga_out.log" | cut -c1-600 > "$RUNNER_TEMP/ga_summary.log" || true
          cat "$RUNNER_TEMP/ga_summary.log"
          {
            echo "## 👥 ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/ga_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/ga_out.log" | head -n 1 || true; exit "$status"; }
      - name: 🔑 Ortaq ana qruplar / bloklanmış hesablar hesabatı (şifrəli)
        id: ga_report
        if: always() && (github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars' || github.event.inputs.command == 'freeze_duplicate_accounts')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/ga-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in ga_out.log ga_details.csv; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/ga-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            echo "STAFF_PLAN_KEY sirri yoxdur — hesabat yüklənmir" >&2
          fi
          rm -f "$RUNNER_TEMP/ga_out.log" "$RUNNER_TEMP/ga_summary.log" "$RUNNER_TEMP/ga_details.csv"
      - name: 📦 Şifrəli ortaq ana qruplar / bloklanmış hesablar hesabatı
        if: always() && steps.ga_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.inputs.command == 'blocked_accounts_report' && 'blocked-accounts-encrypted' || github.event.inputs.command == 'freeze_duplicate_accounts' && 'duplicate-accounts-encrypted' || 'parent-groups-encrypted' }}
          path: ${{ runner.temp }}/ga-out/
          retention-days: 1
      - name: 🧹 Ortaq ana qruplar / bloklanmış hesablar — müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars' || github.event.inputs.command == 'freeze_duplicate_accounts')
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -rf /tmp/groups_accounts_report_*' || true
          rm -rf "$RUNNER_TEMP/ga-out" "$RUNNER_TEMP/ga_out.log" "$RUNNER_TEMP/ga_details.csv" || true

# ═══════════════════════════════════════════════════════════════════════════
# 🧰 Prod məlumat əməliyyatları — AĞ SİYAHILI management əmrləri (serverdəki runner)
#
# Prod LAN-dadır; kənardan SSH yoxdur. Bu workflow deploy olunmuş app konteynerində
# YALNIZ aşağıdakı, review olunmuş, idempotent, DEFOLT DRY-RUN əmrləri işlədir:
#
#   normalize_interim_components — Midterm dövrlərində (2026/2027-dən) cari jurnalların boş
#       K1–K3 komponentlərini tək «Midterm» komponentinə gətirir; 2026-10-11-dən Midterm tavanını
#       sərbəst işsiz qaydaya görə 30-a QALDIRIR (mövcud ballar qalır).
#   recompute_syllabus_completion — açıq sillabus versiyalarının tamamlanma faizini cari qaydaya görə
#       yenidən hesablayır (sərbəst iş söndürülüb → 7 bölmə; təsdiqlənmişlərə toxunmur).
#   syllabus_auto_approve_pending — «Sillabus təsdiqi tələb olunur» açarı SÖNÜLÜ olanda (RİM «Sistem tənzimləmələri»,
#       sahib 2026-10-25) kafedra növbəsində qalmış submitted/review sillabusları EYNİ servislə (approval_source=auto)
#       təsdiqləyir; revision/rejected/draft toxunulmur; açar yandırılıbsa apply rədd edilir. Loga yalnız saylar.
#   fix_syllabus_plan_hours — sillabusun PLAN SAATI bir qrupun saatına (sahib 2026-10-25: «yük 105, sillabus 75»):
#       qrupun ixtisas planı → yükdə bir qrupa düşən pay (birgə mühazirə bir dəfə, seminar/lab bir qrupun payı) →
#       istənilən plan; kafedranın əl ilə düzəlişi üstündür. Arxivdən başqa versiyalar (təsdiqlənmiş DAXİL), YALNIZ
#       plan sahəsi — həftəlik bölgüyə toxunulmur. Plan saatı BOŞ təsdiqlənmiş versiyalar yalnız `create_missing`
#       (--fill-empty) ilə. Loga yalnız saylar; hər yazı audit jurnalındadır.
#   journal_hygiene_report — «Jurnal təmizliyi»: ayrılmış tələbələr (left) / boş fənlər (empty) /
#       qrupun keçmədiyi fənlər (not_held). Loga yalnız saylar düşür (--show 0); apply → DROPPED/SUSPENDED,
#       hər qərar ledger-dədir və «Bərpa et» ilə geri qayıdır.
#   reconcile_teacher_roster — «Forma 7» aktiv müəllim siyahısı (ŞİFRƏLİ release asset, `teacher-roster-…`):
#       tapılanlara elmi ad/dərəcə + ştat, siyahıda olmayan MÜƏLLİM hesablarını mövcud «Hesabı dayandır» ilə
#       bloklayır (inzibati rollar qorunur); `batch` verilsə həmin paketi geri qaytarır (--undo).
#       `create_missing` → YALNIZ «hesab yoxdur» sətirlərinə FİN-siz müəllim hesabı (--create-missing);
#       apply-da birdəfəlik parollar seed_staff_roster kimi şifrəli artifaktdadır, loga yalnız saylar düşür.
#   import_teaching_task_workbook — paylanmış TAPŞIRIQ kitabçası (ŞİFRƏLİ release asset, `teaching-task-…` →
#       tapsiriq.xlsx.enc): `task_sheet` vərəqi (defolt Proqramlaşdırma); seçmə blokunda QALIN/«+» seçim, işarəsiz
#       blok üçün `choices` («144=1,145=1»); mövcud sətirlər mətn dəyişsə də tapılır; `reassign` → fərqli müəllim
#       düzəliş axını ilə dəyişir (jurnal sahibi də); HƏMİŞƏ --no-create-teachers. `teacher_map` — qeyri-müəyyən ad
#       işarəsinin açıq həlli («MURAD=istifadəçi.adı»). Loga yalnız saylar; CSV hesabat şifrəli artifaktdadır.
#   import_teaching_load_form1 — kafedranın «Forma 1» dərs yükü (Word; ŞİFRƏLİ release asset, `teaching-load-…` →
#       forma1.docx.enc): `task_chair` kafedrasının mövcud tapşırıq sətirlərinə müəllim bölgüsü (tam adla, hesab
#       yaradılmır); `choices` (cədvəl sətri, 0-dan), `teacher_map` («Soyad Ad=istifadəçi.adı»), `reassign` eyni.
#   import_timetable_docx — məktəbin Word «əsas dərs cədvəli» (ŞİFRƏLİ release asset, `timetable-…` →
#       timetable.docx.enc) → canlı cədvəl slotları (`period`, məs. «Payız 2026/2027»). Açılış/qrup/fənn/hesab
#       YARADILMIR; tapılmayan/toqquşan hüceyrə yazılmır; idempotent. `replace_group_slots` → fayldakı qrupların
#       digər slotları yumşaq silinir (defolt sönülü). Loga yalnız saylar; CSV hesabat şifrəli artifaktdadır.
#   assign_task_rows_from_timetable — eyni ŞİFRƏLİ dərs cədvəli (`timetable-…` → timetable.docx.enc, `period`):
#       Forma 1 göndərməyən kafedraların tapşırıq sətirlərində BOŞ (bölgüsüz/«Vakant») fəaliyyətə cədvəldəki
#       «Soyad İ.» müəllimini plan saatı ilə yazır (RowPlanApplier → düzəliş axını, bölgü təsdiqi, açılış +
#       qeydiyyat) — sonra import_timetable_docx slotları yarada bilir. Real müəllimə toxunmur; qeyri-müəyyən /
#       toqquşan hüceyrə yazılmır; `allow_outside_chair` → təşkilatda TƏK hesab kafedraya ƏLAVƏ müəllim üzvü.
#       Hesab YARADILMIR; idempotent. `create_missing` (sahib 2026-10-17, magistratura) → --create-missing-rows:
#       heç bir sətrə uyğun gəlməyən dərs üçün (müəllim + qrup + fənn həll olunub) fənnin/müəllimin kafedrasında
#       tapşırıq + sətir («(N saat)» → mühazirə) + lazım olsa kataloq fənni, bölgü + açılış + qeydiyyat.
#       Loga yalnız saylar; CSV hesabat şifrəli artifaktdadır.
#   backfill_teacher_lessons — müəllimin (`teacher`, ad.soyad) keçmiş dərsləri [`date_from`, `date_to`] aralığında
#       cədvəl slotlarından yaranır (həftə günü + üst/alt paritet; mövcud dərs təkrarlanmır) və aktiv tələbələrə
#       «iə» yazılır (mövcud işarəyə toxunulmur). Slotlar: canlı cədvəl, və ya ŞİFRƏLİ spesifikasiya
#       (`roster_tag` = `lesson-slots-…` → slots.json.enc); `replace_teacher_slots` → müəllimin digər slotları
#       yumşaq silinir. Loga yalnız saylar (açılış = fənn · qrup); CSV hesabat şifrəli artifaktdadır.
#   fix_task_row_hours — tapşırıq sətrində BİR fəaliyyətin saatını düzəldir (sahib 2026-10-15: TAPŞIRIQ kitabçasında
#       «631/5K» / «631/5K ing» Laboratoriya xanasına sətrin cəmi yazılıb): `task_chair` + `row_group` (vergüllə bir
#       neçə işarə, hər biri fənn + qrup üzrə DƏQİQ bir sətir) + `row_subject` + `row_activity` + `row_hours`. UI ilə
#       EYNİ yol — düzəliş axını (səbəb «Texniki səhvin düzəlişi»), bölgü sığdırılır (0 → silinir), cəm yenidən
#       hesablanır, əvvəl təsdiqlənmiş sənəd yenidən təsdiqlənir (təkrar bildiriş yoxdur). Loga yalnız saylar.
#   resync_task_offerings — kafedraya ÇATMIŞ tapşırıqların açılış + qeydiyyat təkrar keçidi (2026-10-15): rəsmi
#       seçmə blok seçimi («ATMF … blok» sətrinin fənni) qrupun seçimi kimi yazılır (GroupElectiveChoice), açılış +
#       qrupun «elective» qeydiyyatı; qrupun BAŞQA qərarı əzilmir. `task_chair` boş → bütün kafedralar. Təyinata
#       toxunmur, «Vakant» yazmır, bildiriş yoxdur. Loga YALNIZ saylar.
#   ensure_parent_groups — alt qruplar («234 K-1», «234 K-2») üçün ORTAQ ana qrup («234 K az», sahib 2026-10-17):
#       çatışmayan ana qrup eyni ixtisas altında (kurs/qəbul ili, sektor, forma alt qrupdan) yaradılır, alt
#       qrupa `settings.parent_group` izi yazılır (group_split modeli; tələbə KÖÇÜRÜLMÜR). Qeyri-müəyyən hal
#       (fərqli ixtisas, arxiv qrupla ad toqquşması, eyni adlı iki ana qrup …) yazılmır. Loga yalnız saylar;
#       CSV (qrup adları) şifrəli artifaktdadır.
#   blocked_accounts_report — bloklanmış/deaktiv hesablar (sahib 2026-10-17): cari semestrdə yükü olan
#       bloklanmış MÜƏLLİM, aktiv qeydi olan bloklanmış TƏLƏBƏ; qa.* sayılmır. Defolt YALNIZ hesabat;
#       `apply` + `create_missing` → YALNIZ yükü olan bloklanmış müəllimlərin bloku rəsmi servislə açılır
#       (audit); tələbə heç vaxt avtomatik açılmır. Loga yalnız saylar; CSV (istifadəçi adları) şifrəlidir.
#   dedupe_notifications — təkrar «Dərs yükü təyin edildi» (tip `assignment`, sahib 2026-10-17 «İkinci bildirişləri
#       oxunmuş et»): `date_from` … `date_to` (YYYY-MM-DD, `date_to` boş = bu gün) aralığında eyni alıcı + başlıq +
#       mətn + keçid + metadata ilə 120 dəqiqə içində təkrarlanan OXUNMAMIŞ bildirişlərdən ən erkəni saxlanılır,
#       qalanları OXUNMUŞ edilir (silinmir). Yeni giriş yoxdur (25 limit) — tarix girişləri təkrar istifadə olunur.
#       Loga YALNIZ saylar (groups / duplicates_marked_read / users).
#   archive_junk_groups — test / zibil qrup və ixtisaslar («.», «test…», «Silinməli…», «aaa»; QA-2 F-16, 2026-10-17):
#       yalnız HEÇ BİR istinadı olmayanlar deaktiv olunur (`is_active=False` + `settings.junk_archived`), heç nə
#       silinmir; istifadə olunanlar CSV-də hansı əlaqə ilə bağlı olduğu ilə (RİM köçürmə xidməti ilə həll edir).
#   issue_staff_credentials — fakültə heyətinin ilkin parol siyahısını tamamlayır (sahib 2026-10-19): `task_chair` =
#       fakültə adı, `teacher` = ad axtarışı (fakültəni tapmaq üçün), `roster_tag` = `staff-known-…` (şifrəli, YALNIZ
#       artıq paylanmış istifadəçi adları — parol yox). Parol YALNIZ siyahıda olmayan VƏ aktivləşməmiş hesablara;
#       hesabat və yeni parollar şifrəli artifaktdadır, loga yalnız saylar düşür. `student-known-…` tag-ı (asset
#       sətirləri `username<TAB>parol`) → OXUYAN tələbələr; siyahıdakı parol hash ilə yoxlanılır, uyğun deyilsə yenisi.
#   purge_trial_exam — real olmayan SINAQ imtahanı (sahib 2026-10-21: «233IT ing üçün Cloud-dan sınaq midterm») hamıdan
#       silir: `teacher` = imtahanın slug-ı (DƏQİQ, məs. cloud-computing-51K75E), `task_chair` = imtahanın adı (BƏRABƏR
#       olmalıdır — təhlükəsizlik). Cəhdlər + cavablar, apellyasiyalar (+ qərar/sənəd), bilet/PIN, zal pozuntuları,
#       imtahandan avtomatik yazılmış jurnal «Midterm» xanaları, bildirişlər silinir; imtahan yumşaq silinir; audit
#       tarixçəsi qalır (+1 sətir). Final / append-only ledger (bal hadisəsi, 25% izi) / bağlı jurnal → RƏDD (heç nə
#       yazılmır). Səbəb sabitdir. Loga YALNIZ bir sayların sətri düşür. İdempotent.
#   legacy_delta_apply — köhnə sistemin (myedu) cutover-dən SONRAKI deltası (sahib 2026-10-23): ŞİFRƏLİ release
#       asset (`roster_tag` = `legacy-delta-…` → delta.json.gz.enc, `legacy_delta_extract` çıxışı; `batch` = paketin
#       sha256-sı, verilsə yoxlanılır). Yeni sistem qalibdir — yalnız BOŞ doldurulur (jurnal, dərs, q/b, i/e, bal,
#       təkrar imtahan, açılış müəllimi, təsdiqlənmiş sillabus); çatışmayan müəllim FİN-siz, tələbə/qrup/açılış
#       yaradılır; bütün fazalar BİR tranzaksiyadadır, idempotentdir. `date_to` → --lessons-until (boş = bu gün).
#       Loga YALNIZ saylar; adlı siyahı + hesabat şifrəli artifaktdadır.
#   legacy_repair_empty_lessons — real xanası (bal / iə / ü/q), mövzusu və düzəlişi olmayan KEÇMİŞ dərsləri (jurnalın
#       məzmunsuz sütunlarını) silir (sahib 2026-10-24: «boşdursa silinsin; bir neçə tələbəyə “qb” yazılıbsa belə
#       silinsin»): köçürülmüş tam boş sütun + yalnız balsız «qb» xanalı sütun (--include-absent-only; xanalar da
#       silinir, qayıb saatı yenidən hesablanır) + müəllimin yeni sistemdə açdığı keçmiş sütun
#       (--include-teacher-lessons) + bağlı jurnallar (--include-locked). Bu gün/gələcək dərsə və son 3 gündə
#       yaradılan / tarixli müəllim dərsinə (TEACHER_GRACE_DAYS) toxunulmur; hər dəstə açılış üzrə AuditLog
#       snapshot-u (silinən «qb» xanaları daxil) yazır.
#       Loga YALNIZ saylar (--show 0, aktor maskalanır).
#   sync_midterm_scores — midterm nəticələrini imtahanın jurnal bağlantısı ilə Midterm xanasına yazır, fənn
#       dəyişibsə köhnə jurnalda bu imtahanın yazdığı xanaları silir. `teacher` = imtahanın slug-ı (boş = bütün
#       midterm imtahanları). Bildiriş göndərilmir; idempotent. Loga yalnız sayların sətri.
#   infer_timetable_from_lessons — müəllimlərin FAKTİKİ keçdiyi dərslərdən (jurnal `Lesson`) canlı cədvəl slotları
#       (sahib 2026-10-24): müəllim × gün × saat × növ; eyni tarixdə birlikdə keçən qruplar = BİR axın (patok, bölünmür);
#       üst/alt həftə tarixlərin paritetindən; `period`, `teacher` (boş = hamı), `date_from` / `date_to` (boş = semestr
#       əvvəli / bu gün). Mövcud slot silinmir/dəyişmir, toqquşan yazılmır; idempotent. Loga YALNIZ saylar; CSV
#       hesabat (müəllim adları) şifrəli artifaktdadır. 2026-10-25 çoxluq qaydaları (defoltlar, input lazım deyil):
#       birgə məşğələ də axın, səviyyə qrupları (Dil-1(elementary)/(intermediate)) paralel, 3 üst + 1 alt = üst,
#       11:30 → 11:50 standart zəng, plan saatı dolubsa azlıq slot kompensasiya, yeni başlamış açılışın son dərsi.
#       Otaq: slot dərslərində ən çox otaq → müəllimin həmin saatda → ümumən ən çox otağı (toqquşursa boş); əmrin
#       ƏVVƏL yazdığı otaqsız slotlar doldurulur (rəsmi slotlara toxunulmur). Sıra: əvvəl Lesson.room köçürməsi, sonra bu.
#   audit_cross_chair_loads — kafedralar arası dərs yükü (sahib 2026-10-25: ştat bir kafedrada, saathesabı başqa
#       kafedranın tapşırığında). Dry-run YALNIZ saylar: kənar müəllim/bölgü/saat, ştatı yalnız əlavə üzvlükdən
#       gələn, iki kafedrada eyni fənn+qrup sətri, fənni kataloqda başqa kafedranın olan sətir (qərar siyahısı —
#       dəyişdirilmir). `apply` — YALNIZ başqa kafedrada bölgüsü olub orada üzvlüyü olmayan müəllimə ƏLAVƏ
#       (is_primary=False) müəllim üzvlüyü (ştat dəyişmir, audit); idempotent. `year` istifadə olunur.
#       hesabat (müəllim adları) şifrəli artifaktdadır.
#   link_lesson_syllabus_weeks — jurnal dərsini sillabusun həftəlik plan SƏTRİNƏ bağlayır (sahib 2026-10-25): mövzu
#       mətni açılışın təsdiqlənmiş sillabus planındakı sətrin mövzusu ilə DƏQİQ (boşluq/registr normallaşdırılmış)
#       eynidirsə və `syllabus_week` boşdursa → sətir nömrəsi. Mövzuya toxunulmur; idempotent. Loga YALNIZ saylar.
#   backfill_notification_i18n — köhnə bildirişlərə dil-müstəqil deskriptor (metadata.i18n) əlavə edir (sahib 2026-10-25
#       «bildirişlərin dili hərəsi bir cür»): siyahı onları oxuyanın dilində göstərir. YALNIZ metadata-ya açar
#       əlavə olunur (başlıq/mətn/keçid/oxunma dəyişmir); idempotent. Giriş yoxdur. Loga YALNIZ saylar.
#   fix_group_education_form — təhsil forması qrup kodundan (sahib 2026-10-25: «4 rəqəm («2232 K») — QİYABİ,
#       3 rəqəm («234 KE») — ƏYANİ»): birmənalı bakalavr qrupunun `settings.education_form`-u düzəldilir/doldurulur,
#       qiyabi qrupdakı «əyani» tələbə qeydləri qiyabi olur, dərs yükü sətri (bütün qrupları eyni formadadırsa)
#       eyani/qiyabi olur. Magistr («409/6MBA»), kollec («1226 A», «1025»), «3/336 F» kimi adlar DƏYİŞMİR. Əyani
#       qrupdakı «qiyabi» tələbə qeydi (yerləşdirmə sualı) dəyişmir — yalnız sayılır. Audit; idempotent. Loga
#       YALNIZ saylar.
#   shrink_avatars — mövcud avatarlar ≤512 px WebP-yə (PERF-2 H5, 2026-10-17); orijinal fayllar SİLİNMİR,
#       `updated_at` dəyişmir. Loga yalnız yekun saylar.
#   sync_plan_offerings — təsdiqlənmiş tədris planından qruplara açılış + tələbə yazılışı
#       (backfill; `--include-drafts` BURADA YOXDUR — qaralama planlar sahibin qərarıdır).
#   apply_org_structure — struktur planı (scripts/data/qku_structure_2026_09_27.json, yalnız vahid
#       adları): fakültə/kafedra adı və yeri, yeni vahidlər, ixtisas köçürməsi; köhnə ad/yer tarixçədə.
#   seed_staff_roster — heyət siyahısı (şəxs adları — repoya DÜŞMÜR): ŞİFRƏLİ release asset-i
#       (`roster_tag` → roster.xlsx.enc, açar `STAFF_PLAN_KEY` sirri) runner-də açılır, konteynerə
#       köçürülür, iş bitəndə silinir. Yeni hesabların parolları serverdə /home/wcu/creds/-də qalır və
#       eyni açarla şifrələnmiş artifakt kimi (1 gün) yüklənir.
#
# TƏHLÜKƏSİZLİK:
#   * Açıq shell / ixtiyari əmr YOXDUR — əmr adı `choice` ilə, arqumentlər sabit şablonla.
#   * Girişlər `env:` ilə ötürülür, `run:` bloğuna interpolasiya yoxdur (script injection yox).
#   * `apply` üçün `confirm` = APPLY; apply-dan əvvəl postgres-backup sidecar-ı ilə dump alınır.
#   * Deploy ilə eyni concurrency qrupu — canlı deploy-la toqquşmur.
# ═══════════════════════════════════════════════════════════════════════════
name: 🧰 Prod Data Ops

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Əmr (ağ siyahı)"
        required: true
        type: choice
        default: normalize_interim_components
        options:
          - normalize_interim_components
          - sync_plan_offerings
          - apply_org_structure
          - seed_staff_roster
          - surveys_shuffle_responses
          - superadmin_role_count
          - recompute_syllabus_completion
          - syllabus_auto_approve_pending
          - fix_syllabus_plan_hours
          - journal_hygiene_report
          - reconcile_teacher_roster
          - import_teaching_task_workbook
          - import_teaching_load_form1
          - import_timetable_docx
          - assign_task_rows_from_timetable
          - backfill_teacher_lessons
          - fix_task_row_hours
          - resync_task_offerings
          - repair_group_leads
          - retire_qa_accounts
          - ensure_parent_groups
          - blocked_accounts_report
          - dedupe_notifications
          - archive_junk_groups
          - shrink_avatars
          - issue_staff_credentials
          - purge_trial_exam
          - legacy_delta_apply
          - legacy_repair_empty_lessons
          - sync_midterm_scores
          - infer_timetable_from_lessons
          - audit_cross_chair_loads
          - link_lesson_syllabus_weeks
          - backfill_notification_i18n
          - fix_group_education_form
      apply:
        description: "Faktiki yaz (işarələnməsə dry-run)"
        required: false
        type: boolean
        default: false
      confirm:
        description: "apply üçün APPLY yazın"
        required: false
        default: ""
      year:
        description: "sync_plan_offerings / resync_task_offerings / import_teaching_*: tədris ili (məs. 2026/2027)"
        required: false
        default: "2026/2027"
      roster_tag:
        description: "seed_staff_roster / reconcile_teacher_roster / import_teaching_* / *timetable* / backfill_teacher_lessons (lesson-slots-…) / legacy_delta_apply (legacy-delta-…): şifrəli faylın release tag-ı"
        required: false
        default: ""
      hygiene_category:
        description: "journal_hygiene_report: kateqoriya"
        required: false
        type: choice
        default: all
        options:
          - all
          - left
          - empty
          - not_held
      hygiene_code:
        description: "journal_hygiene_report: səbəb kodu və ya strong|review (boş = hamısı)"
        required: false
        default: ""
      batch:
        description: "reconcile_teacher_roster: geri qaytarılacaq paket id-si (undo) · legacy_delta_apply: paketin gözlənilən sha256-sı"
        required: false
        default: ""
      create_missing:
        description: "reconcile_teacher_roster: «hesab yoxdur» sətirlərinə FİN-siz müəllim hesabı yarat · blocked_accounts_report (apply ilə): yükü olan bloklanmış müəllimlərin blokunu aç · assign_task_rows_from_timetable: dərs yükündə olmayan dərsə yeni tapşırıq sətri (--create-missing-rows) · fix_syllabus_plan_hours: plan saatı BOŞ olan təsdiqlənmiş versiyaları da doldur (--fill-empty)"
        required: false
        type: boolean
        default: false
      task_sheet:
        description: "import_teaching_task_workbook: vərəq (prefiks)"
        required: false
        default: "Proqramlaşdırma"
      task_chair:
        description: "import_teaching_load_form1 / fix_task_row_hours: kafedra adı · resync_task_offerings: boş = bütün kafedralar · purge_trial_exam: imtahanın adı (təsdiq)"
        required: false
        default: ""
      row_group:
        description: "fix_task_row_hours: qrup işarə(lər)i, vergüllə (məs. 631/5K,631/5K ing)"
        required: false
        default: ""
      row_subject:
        description: "fix_task_row_hours: fənn adı (məs. Müasir proqramlaşdırma dilləri)"
        required: false
        default: ""
      row_activity:
        description: "fix_task_row_hours: fəaliyyət"
        required: false
        type: choice
        default: lab
        options:
          - lecture
          - seminar
          - lab
          - consult
          - exam
          - thesis
          - postgrad
          - practice_research
          - practice_production
      row_hours:
        description: "fix_task_row_hours: yeni cəm saat (0 = fəaliyyəti çıxar)"
        required: false
        default: "0"
      reassign:
        description: "import_teaching_*: fərqli müəllimi düzəliş axını ilə dəyiş · backfill_teacher_lessons: sonradan qoşulanları da iə işarələ"
        required: false
        type: boolean
        default: false
      choices:
        description: "import_teaching_*: işarəsiz seçmə bloku — SƏTİR=BƏND, vergüllə (məs. 144=1,145=1)"
        required: false
        default: ""
      teacher_map:
        description: "import_teaching_*: qeyri-müəyyən müəllim — AD=istifadəçi.adı, vergüllə"
        required: false
        default: ""
      allow_outside_chair:
        description: "import_teaching_* / assign_task_rows_from_timetable: kafedrada tapılmayan adı təşkilatda TƏK uyğun hesaba bağla"
        required: false
        type: boolean
        default: false
      period:
        description: "import_timetable_docx / assign_task_rows_from_timetable / backfill_teacher_lessons / infer_timetable_from_lessons: semestr (məs. Payız 2026/2027)"
        required: false
        default: "Payız 2026/2027"
      replace_group_slots:
        description: "import_timetable_docx: fayldakı qrupların DİGƏR slotlarını yumşaq sil"
        required: false
        type: boolean
        default: false
      teacher:
        description: "backfill_teacher_lessons / infer_timetable_from_lessons (boş = hamı): müəllimin istifadəçi adı (ad.soyad) · purge_trial_exam / sync_midterm_scores: imtahanın slug-ı"
        required: false
        default: ""
      date_from:
        description: "backfill_teacher_lessons / dedupe_notifications / infer_timetable_from_lessons (boş = semestr əvvəli): başlanğıc tarix (YYYY-MM-DD)"
        required: false
        default: ""
      date_to:
        description: "backfill_teacher_lessons / dedupe_notifications / infer_timetable_from_lessons: son tarix (YYYY-MM-DD, bu gündən sonra yox; dedupe / infer-də boş = bu gün) · legacy_delta_apply: --lessons-until"
        required: false
        default: ""
      replace_teacher_slots:
        description: "backfill_teacher_lessons: (spesifikasiya ilə) müəllimin DİGƏR slotlarını yumşaq sil"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  run:
    if: github.event.inputs.apply != 'true' || github.event.inputs.confirm == 'APPLY'
    runs-on: [self-hosted]
    environment: production
    # legacy_delta_apply (tək tranzaksiya, ~2 000 jurnal + dərs yükü) prod-da ~20 dəq + backup çəkir.
    timeout-minutes: 75
    env:
      APP_CONTAINER: educationmanagementstudentarena-app-1
      BACKUP_CONTAINER: emsarena-postgres-backup
      ORG: qku
      COMMAND: ${{ github.event.inputs.command }}
      APPLY: ${{ github.event.inputs.apply }}
      YEAR: ${{ github.event.inputs.year }}
      ROSTER_TAG: ${{ github.event.inputs.roster_tag }}
      HYGIENE_CATEGORY: ${{ github.event.inputs.hygiene_category }}
      HYGIENE_CODE: ${{ github.event.inputs.hygiene_code }}
      BATCH: ${{ github.event.inputs.batch }}
      CREATE_MISSING: ${{ github.event.inputs.create_missing }}
      TASK_SHEET: ${{ github.event.inputs.task_sheet }}
      TASK_CHAIR: ${{ github.event.inputs.task_chair }}
      ROW_GROUP: ${{ github.event.inputs.row_group }}
      ROW_SUBJECT: ${{ github.event.inputs.row_subject }}
      ROW_ACTIVITY: ${{ github.event.inputs.row_activity }}
      ROW_HOURS: ${{ github.event.inputs.row_hours }}
      REASSIGN: ${{ github.event.inputs.reassign }}
      CHOICES: ${{ github.event.inputs.choices }}
      TEACHER_MAP: ${{ github.event.inputs.teacher_map }}
      ALLOW_OUTSIDE_CHAIR: ${{ github.event.inputs.allow_outside_chair }}
      PERIOD: ${{ github.event.inputs.period }}
      REPLACE_GROUP_SLOTS: ${{ github.event.inputs.replace_group_slots }}
      TEACHER: ${{ github.event.inputs.teacher }}
      DATE_FROM: ${{ github.event.inputs.date_from }}
      DATE_TO: ${{ github.event.inputs.date_to }}
      REPLACE_TEACHER_SLOTS: ${{ github.event.inputs.replace_teacher_slots }}
    steps:
      - name: 📥 Checkout (struktur planı)
        if: github.event.inputs.command == 'apply_org_structure'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 🔐 Şifrəli heyət siyahısı / yük sənədi
        if: github.event.inputs.command == 'seed_staff_roster' || (github.event.inputs.command == 'reconcile_teacher_roster' && github.event.inputs.batch == '') || startsWith(github.event.inputs.command, 'import_teaching_') || (github.event.inputs.command == 'issue_staff_credentials' && github.event.inputs.roster_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          # Asset adı və konteynerdəki fayl əmrdən asılıdır (tag prefiksi ilə birlikdə yoxlanılır).
          case "$COMMAND" in
            import_teaching_task_workbook)
              match "$ROSTER_TAG" '^teaching-task-[0-9a-z-]+$' || { echo "roster_tag formatı: teaching-task-…" >&2; exit 1; }
              asset=tapsiriq.xlsx.enc; target="/tmp/teaching_task_${GITHUB_RUN_ID}.xlsx" ;;
            import_teaching_load_form1)
              match "$ROSTER_TAG" '^teaching-load-[0-9a-z-]+$' || { echo "roster_tag formatı: teaching-load-…" >&2; exit 1; }
              asset=forma1.docx.enc; target="/tmp/teaching_load_${GITHUB_RUN_ID}.docx" ;;
            issue_staff_credentials)
              match "$ROSTER_TAG" '^(staff|student)-known-[0-9a-z-]+$' || { echo "roster_tag formatı: staff-known-… / student-known-…" >&2; exit 1; }
              asset=usernames.txt.enc; target="/tmp/staff_known_${GITHUB_RUN_ID}.txt" ;;
            *)
              match "$ROSTER_TAG" '^(staff|teacher)-roster-[0-9a-z-]+$' || { echo "roster_tag formatı: staff-roster-… / teacher-roster-…" >&2; exit 1; }
              asset=roster.xlsx.enc; target="/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx" ;;
          esac
          # Serverdə `gh` YOXDUR — release asset-i birbaşa yüklənir (şifrəlidir; token private repo üçün).
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/${asset}" \
            -o "$RUNNER_TEMP/input.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/input.enc" -out "$RUNNER_TEMP/input.bin"
          # `docker cp` runner UID-sini saxlayır (umask 077 → app istifadəçisi oxuya bilmir) — stdin ilə
          # konteynerin ÖZ istifadəçisi yazır.
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > $target" < "$RUNNER_TEMP/input.bin"
          # reconcile_teacher_roster eyni faylı oxuyur (ad fərqi yalnız aydınlıq üçün deyil — təmizlik eyni qlobdur).
          rm -f "$RUNNER_TEMP/input.bin" "$RUNNER_TEMP/input.enc"
      - name: 🧰 Run
        if: github.event.inputs.command != 'import_timetable_docx' && github.event.inputs.command != 'assign_task_rows_from_timetable' && github.event.inputs.command != 'backfill_teacher_lessons' && github.event.inputs.command != 'ensure_parent_groups' && github.event.inputs.command != 'blocked_accounts_report' && github.event.inputs.command != 'archive_junk_groups' && github.event.inputs.command != 'shrink_avatars' && github.event.inputs.command != 'legacy_delta_apply'
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          case "$YEAR" in (20[0-9][0-9]/20[0-9][0-9]) ;; (*) echo "year formatı YYYY/YYYY olmalıdır" >&2; exit 1;; esac
          args=()
          custom_apply=0
          superadmin_actor() {
            docker exec -i "$APP_CONTAINER" python manage.py shell -c \
              "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1
          }
          case "$COMMAND" in
            normalize_interim_components)
              args=(--organization "$ORG")
              ;;
            apply_org_structure)
              docker cp "$GITHUB_WORKSPACE/scripts/data/qku_structure_2026_09_27.json" "$APP_CONTAINER:/tmp/org_structure.json"
              args=(--org "$ORG" --plan /tmp/org_structure.json)
              ;;
            seed_staff_roster)
              args=(--org "$ORG" --file "/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx")
              ;;
            surveys_shuffle_responses)
              # Audit 2026-09-28 SV-3: köhnə sorğu cavablarının qəbzlə fiziki sıra əlaqəsini qırır.
              args=(--org "$ORG")
              ;;
            superadmin_role_count)
              # Audit 2026-09-28 SA-04: YALNIZ OXUMA — profile.role='superadmin' olub is_superuser olmayan hesab sayı.
              test "$APPLY" != "true" || { echo "superadmin_role_count yalnız oxumadır — apply=false seçin" >&2; exit 2; }
              count="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                "from core.rls import bypass_rls; from apps.accounts.models import UserProfile; ctx = bypass_rls(); ctx.__enter__(); print(UserProfile.objects.filter(role='superadmin', user__is_superuser=False).count())" | tail -n1)"
              echo "profile.role=superadmin AND NOT is_superuser: $count"
              echo "## 🔎 superadmin_role_count: $count" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            recompute_syllabus_completion)
              args=(--org "$ORG")
              ;;
            syllabus_auto_approve_pending)
              # Sahib 2026-10-25: yalnız saylar çap olunur (ad/FİN yoxdur); açar yandırılıbsa apply CommandError verir.
              args=(--org "$ORG")
              ;;
            fix_syllabus_plan_hours)
              args=(--org "$ORG")
              if [ "$CREATE_MISSING" = "true" ]; then
                args+=(--fill-empty)
              fi
              ;;
            journal_hygiene_report)
              case "$HYGIENE_CATEGORY" in (all|left|empty|not_held) ;; (*) echo "hygiene_category yanlışdır" >&2; exit 2;; esac
              test -z "$HYGIENE_CODE" || match "$HYGIENE_CODE" '^[a-z_]+$' || { echo "hygiene_code yalnız a-z və _" >&2; exit 2; }
              # Loga ŞƏXS ADI düşməsin: yalnız saylar (--show 0).
              args=(--organization "$ORG" --category "$HYGIENE_CATEGORY" --show 0)
              test -z "$HYGIENE_CODE" || args+=(--code "$HYGIENE_CODE")
              if [ "$APPLY" = "true" ]; then
                test "$HYGIENE_CATEGORY" != "all" || { echo "apply üçün konkret kateqoriya seçin" >&2; exit 2; }
                actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                if [ "$HYGIENE_CATEGORY" = "left" ]; then
                  reason="Jurnal təmizliyi: universitetdən ayrılmış tələbələr jurnaldan çıxarılır — sahibin 2026-10-11 tapşırığı"
                else
                  reason="Jurnal təmizliyi: qrupun keçmədiyi / boş fənlər nəticələrdən çıxarılır — sahibin 2026-10-11 tapşırığı"
                fi
                args+=(--apply --reason "$reason" --actor "$actor" --i-know-this-is-production)
                custom_apply=1
              fi
              ;;
            reconcile_teacher_roster)
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              if [ -n "$BATCH" ]; then
                match "$BATCH" '^roster-[0-9a-z-]+$' || { echo "batch formatı: roster-…" >&2; exit 2; }
                test "$APPLY" = "true" || { echo "undo yazır — apply=true + confirm=APPLY verin" >&2; exit 2; }
                args=(--organization "$ORG" --undo "$BATCH" --actor "$actor" --i-know-this-is-production)
              else
                args=("/tmp/staff_roster_${GITHUB_RUN_ID}.xlsx" --organization "$ORG"
                      --report "/tmp/roster_report_${GITHUB_RUN_ID}.md" --details "/tmp/roster_details_${GITHUB_RUN_ID}.csv")
                if [ "$CREATE_MISSING" = "true" ]; then
                  args+=(--create-missing)
                fi
                if [ "$APPLY" = "true" ]; then
                  args+=(--apply --reason "Forma 7 (2026/2027) aktiv müəllim siyahısı — sahibin 2026-10-11 tapşırığı"
                         --actor "$actor" --i-know-this-is-production)
                  # Yeni hesabların birdəfəlik parolları: 0600 fayl → serverdə /home/wcu/creds + şifrəli artifakt
                  # (seed_staff_roster ilə eyni addım); loga DÜŞMÜR.
                  if [ "$CREATE_MISSING" = "true" ]; then
                    args+=(--credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv")
                  fi
                fi
              fi
              custom_apply=1
              ;;
            import_teaching_task_workbook|import_teaching_load_form1)
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              test -z "$CHOICES" || match "$CHOICES" '^[0-9]+=[0-9]+(,[0-9]+=[0-9]+)*$' \
                || { echo "choices formatı: 144=1,145=1" >&2; exit 2; }
              test -z "$TEACHER_MAP" || { [ "${#TEACHER_MAP}" -le 1000 ] && match "$TEACHER_MAP" '^[^=,]+=[A-Za-z0-9._-]+(,[^=,]+=[A-Za-z0-9._-]+)*$'; } \
                || { echo "teacher_map formatı: AD=istifadəçi.adı,…" >&2; exit 2; }
              report_dir="/tmp/teaching_report_${GITHUB_RUN_ID}"
              if [ "$COMMAND" = "import_teaching_task_workbook" ]; then
                test -n "$TASK_SHEET" && [ "${#TASK_SHEET}" -le 60 ] || { echo "task_sheet boş/uzundur" >&2; exit 2; }
                # Hesab YARADILMIR (sahib 2026-10-12) — --no-create-teachers həmişə.
                args=(--file "/tmp/teaching_task_${GITHUB_RUN_ID}.xlsx" --org "$ORG" --year "$YEAR" --actor "$actor"
                      --sheet "$TASK_SHEET" --report "$report_dir" --no-create-teachers)
              else
                test -n "$TASK_CHAIR" && [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair verilməlidir" >&2; exit 2; }
                args=(--file "/tmp/teaching_load_${GITHUB_RUN_ID}.docx" --org "$ORG" --year "$YEAR" --actor "$actor"
                      --chair "$TASK_CHAIR" --report "$report_dir")
              fi
              test -z "$CHOICES" || args+=(--choice "$CHOICES")
              test -z "$TEACHER_MAP" || args+=(--teacher "$TEACHER_MAP")
              test "$REASSIGN" != "true" || args+=(--reassign)
              test "$ALLOW_OUTSIDE_CHAIR" != "true" || args+=(--allow-outside-chair)
              ;;
            fix_task_row_hours)
              # Sahib 2026-10-15: kitabçanın səhv fəaliyyət xanası (631/5K «Laboratoriya» = sətrin cəmi). Arqumentlər
              # massivlə ötürülür (shell şərhi yoxdur); format yoxlaması yalnız ağlabatanlıq üçündür.
              test -n "$TASK_CHAIR" && [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair verilməlidir" >&2; exit 2; }
              for value in "$ROW_GROUP" "$ROW_SUBJECT"; do
                test -n "$value" && [ "${#value}" -le 200 ] || { echo "row_group / row_subject verilməlidir (≤200)" >&2; exit 2; }
                match "$value" '^[^[:cntrl:]"`$\\;|&<>]+$' || { echo "row_group / row_subject icazəsiz simvol" >&2; exit 2; }
              done
              case "$ROW_ACTIVITY" in (lecture|seminar|lab|consult|exam|thesis|postgrad|practice_research|practice_production) ;; (*) echo "row_activity yanlışdır" >&2; exit 2;; esac
              match "$ROW_HOURS" '^[0-9]{1,4}$' || { echo "row_hours 0..9999 tam ədəd olmalıdır" >&2; exit 2; }
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --chair "$TASK_CHAIR" --group "$ROW_GROUP" --subject "$ROW_SUBJECT"
                    --activity "$ROW_ACTIVITY" --hours "$ROW_HOURS" --actor "$actor"
                    --reason "TAPŞIRIQ kitabçasında fəaliyyət xanası səhvdir (sətrin cəmi yazılıb) — sahibin 2026-10-15 tapşırığı")
              ;;
            resync_task_offerings)
              # 2026-10-15: rəsmi seçmə blok seçimi → qrupun seçimi + açılış + qeydiyyat (offering_electives).
              # Arqumentlər massivlə ötürülür (shell şərhi yoxdur); format yoxlaması yalnız ağlabatanlıq üçündür.
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              if [ -n "$TASK_CHAIR" ]; then
                [ "${#TASK_CHAIR}" -le 120 ] || { echo "task_chair uzundur (≤120)" >&2; exit 2; }
                match "$TASK_CHAIR" '^[^[:cntrl:]"`$\\;|&<>]+$' || { echo "task_chair icazəsiz simvol" >&2; exit 2; }
                args+=(--chair "$TASK_CHAIR")
              else
                args+=(--all-chairs)
              fi
              ;;
            sync_plan_offerings)
              actor="$(superadmin_actor)"
              test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              # İstifadəçi adı loglarda görünməsin (təhlükəsizlik yoxlaması, info).
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              ;;
            dedupe_notifications)
              # Sahib 2026-10-17: təkrar «Dərs yükü təyin edildi» bildirişləri oxunmuş edilir (silinmir). Tip sabitdir
              # (yalnız workload `assignment`); tarixlər `date_from` / `date_to` girişlərindən, format yoxlanılır.
              match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
              args=(--org "$ORG" --type assignment --since "$DATE_FROM" --window-minutes 120)
              if [ -n "$DATE_TO" ]; then
                match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
                args+=(--until "$DATE_TO")
              fi
              ;;
            repair_group_leads)
              # Starosta (lead_student) üzvlüklərinin təmiri — gecə 2026-10-13: köhnə rol axınları starostanı
              # scope_unit-siz yaradırdı. Defolt QURU QAÇIŞ; apply → konservativ düzəliş (ehtiyat nüsxədən sonra).
              args=(--org "$ORG")
              ;;
            retire_qa_accounts)
              # QA test hesablarını (qa.*, @qa.local) üzvlük reyestrindən çıxarır — silmir, geri qaytarıla bilər
              # (`manage.py retire_qa_accounts --undo`). Defolt QURU QAÇIŞ; apply → ehtiyat nüsxədən sonra.
              # Hesablar sintetikdir (şəxsi data yox) → istifadəçi adlarının loga düşməsi icazəlidir.
              args=(--org "$ORG")
              ;;
            issue_staff_credentials)
              # Fakültə adı (task_chair) və ad axtarışı (teacher): yalnız hərf/rəqəm/boşluq/nöqtə/tire, LF/CR yox.
              test -z "$TASK_CHAIR" || { [ "${#TASK_CHAIR}" -le 120 ] && match "$TASK_CHAIR" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .()-]+$'; } \
                || { echo "task_chair (fakültə) formatı yanlışdır" >&2; exit 2; }
              test -z "$TEACHER" || { [ "${#TEACHER}" -le 80 ] && match "$TEACHER" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .-]+$'; } \
                || { echo "teacher (ad axtarışı) formatı yanlışdır" >&2; exit 2; }
              # `student-known-…` tag-ı → tələbə rejimi (fakültə boşdursa bütün fakültələr; siyahıdakı parol yoxlanılır).
              students=0
              case "$ROSTER_TAG" in (student-known-*) students=1 ;; esac
              test "$students" = 1 || test -n "$TASK_CHAIR" || test -n "$TEACHER" || { echo "task_chair (fakültə) və ya teacher (ad) verin" >&2; exit 2; }
              args=(--org "$ORG" --report-out "/tmp/roster_details_${GITHUB_RUN_ID}.csv")
              test "$students" = 0 || args+=(--audience students)
              test -z "$TASK_CHAIR" || args+=(--faculty "$TASK_CHAIR")
              test -z "$TEACHER" || args+=(--find-name "$TEACHER")
              test -z "$ROSTER_TAG" || args+=(--known-usernames "/tmp/staff_known_${GITHUB_RUN_ID}.txt")
              if [ "$APPLY" = "true" ]; then
                test "$students" = 1 || test -n "$TASK_CHAIR" || { echo "apply üçün task_chair (fakültə) məcburidir" >&2; exit 2; }
                test -n "$ROSTER_TAG" || { echo "apply üçün roster_tag (staff-known-…) məcburidir" >&2; exit 2; }
                args+=(--apply --credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv"
                       --reason "Fakültə üzrə ilkin parol siyahısının tamamlanması — sahibin 2026-10-19 tapşırığı"
                       --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            purge_trial_exam)
              # Sahib 2026-10-21: sınaq midterm-in silinməsi. `teacher` = slug (dəqiq), `task_chair` = imtahanın adı
              # (əmr özü bərabərliyi yoxlayır). Yeni giriş yoxdur (25 limit) — mövcud girişlər təkrar istifadə olunur.
              { [ "${#TEACHER}" -le 220 ] && match "$TEACHER" '^[a-z0-9_-]{0,200}-[A-Za-z0-9]{6}$'; } \
                || { echo "teacher (imtahanın slug-ı) formatı: ad-XXXXXX" >&2; exit 2; }
              { [ "${#TASK_CHAIR}" -le 120 ] && match "$TASK_CHAIR" '^[[:alnum:]ƏəIıİiĞğŞşÇçÖöÜü .()-]+$'; } \
                || { echo "task_chair (imtahanın adı) formatı: hərf/rəqəm/boşluq" >&2; exit 2; }
              # `--x=dəyər` forması: tamamilə qeyri-latın adlı imtahanın slug-ı «-XXXXXX» ola bilər (argparse onu bayraq sanmasın).
              args=(--org "$ORG" "--slug=$TEACHER" "--expect-title=$TASK_CHAIR")
              if [ "$APPLY" = "true" ]; then
                args+=(--apply --reason "Sınaq midterm-in silinməsi — sahibin 2026-10-21 tapşırığı" --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            legacy_repair_empty_lessons)
              # Sahib 2026-10-24: məzmunsuz keçmiş sütunlar — bağlı jurnallar, yalnız «qb» xanalı və müəllimin
              # açdığı sütunlar da («boşdursa silinsin; “qb” yazılıbsa belə silinsin»).
              # Loga ŞƏXS ADI düşməsin: cədvəl yox (--show 0), aktor maskalanır.
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--organization "$ORG" --include-locked --include-absent-only --include-teacher-lessons
                    --show 0 --actor "$actor")
              # date_from → yalnız bu tarixdən sonrakı dərslər (2026-10-25: əvvəl cari semestr; tarixi semestrlərdə
              # köhnə xanası yeni sistemə gəlməmiş dərslər var — onlar ayrıca yoxlanılır).
              if [ -n "$DATE_FROM" ]; then
                match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
                args+=(--since "$DATE_FROM")
              fi
              if [ "$APPLY" = "true" ]; then
                args+=(--apply --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            sync_midterm_scores)
              # Sahib 2026-10-24: midterm → jurnal (fənn sonradan dəyişən «JS Loop» halı). `teacher` = imtahanın slug-ı.
              args=(--org "$ORG")
              if [ -n "$TEACHER" ]; then
                { [ "${#TEACHER}" -le 220 ] && match "$TEACHER" '^[a-z0-9_-]{0,200}-[A-Za-z0-9]{6}$'; } \
                  || { echo "teacher (imtahanın slug-ı) formatı: ad-XXXXXX" >&2; exit 2; }
                args+=("--exam=$TEACHER")
              fi
              ;;
            infer_timetable_from_lessons)
              # Sahib 2026-10-24: keçirilmiş dərslərdən cədvəl. CSV (müəllim adları) → şifrəli artifakt; loga yalnız saylar.
              match "$PERIOD" '^(Payız|Yaz|Yay) 20[0-9]{2}/20[0-9]{2}$' || { echo "period formatı: «Payız 2026/2027»" >&2; exit 2; }
              args=(--org "$ORG" --period "$PERIOD" --report "/tmp/timetable_infer_${GITHUB_RUN_ID}.csv")
              if [ -n "$TEACHER" ]; then
                match "$TEACHER" '^[A-Za-z0-9._-]{1,150}$' || { echo "teacher formatı: ^[A-Za-z0-9._-]+$" >&2; exit 2; }
                args+=("--teacher=$TEACHER")
              fi
              if [ -n "$DATE_FROM" ]; then
                match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
                args+=(--date-from "$DATE_FROM")
              fi
              if [ -n "$DATE_TO" ]; then
                match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
                args+=(--date-to "$DATE_TO")
              fi
              if [ "$APPLY" = "true" ]; then
                actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                args+=(--apply --actor "$actor" --i-know-this-is-production)
              fi
              custom_apply=1
              ;;
            audit_cross_chair_loads)
              # Sahib 2026-10-25: kafedralar arası yük — saylar; apply yalnız çatışmayan ƏLAVƏ üzvlük (ştat dəyişmir).
              actor="$(superadmin_actor)"; test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
              echo "::add-mask::$actor"
              args=(--org "$ORG" --year "$YEAR" --actor "$actor")
              ;;
            link_lesson_syllabus_weeks)
              # Sahib 2026-10-25: dərs ↔ sillabus plan sətri (mövzu mətni DƏQİQ uyğun gəlirsə). Loga yalnız saylar.
              args=(--org "$ORG")
              ;;
            backfill_notification_i18n)
              # Sahib 2026-10-25: köhnə bildirişlərə metadata.i18n (bütün təşkilatlar; giriş yoxdur). Loga yalnız saylar.
              args=()
              ;;
            fix_group_education_form)
              # Sahib 2026-10-25: 3 rəqəmli qrup kodu əyani, 4 rəqəmli qiyabi — qrup + tələbə qeydi + dərs yükü sətri.
              # Əyani qrupdakı «qiyabi» qeydlər (--align-part-to-full) BURADA YOXDUR — yerləşdirmə sahibin qərarıdır.
              args=(--org "$ORG" --task-rows)
              ;;
            *)
              echo "icazəsiz əmr: $COMMAND" >&2; exit 2
              ;;
          esac
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            test "$custom_apply" = 1 || args+=(--apply)
            if [ "$COMMAND" = "seed_staff_roster" ]; then
              args+=(--credentials-out "/tmp/staff_creds_${GITHUB_RUN_ID}.csv")
            fi
          fi
          # SEC-1 F7: loga arqument DƏYƏRLƏRİ düşmür (teacher_map → müəllim adları, aktor, fayl yolları) — yalnız
          # arqument sayı və bayraq adları.
          flags=()
          for arg in "${args[@]}"; do case "$arg" in (--[a-z]*) flags+=("${arg%%=*}") ;; esac; done
          echo "::group::▶ $COMMAND (${#args[@]} arqument; bayraqlar: ${flags[*]:-—})"
          if [ "$COMMAND" = "issue_staff_credentials" ]; then
            # Hesabatda şəxs adları var → loga YALNIZ sayların sətri; CSV şifrəli artifaktdadır.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            docker exec "$APP_CONTAINER" cat "/tmp/roster_details_${GITHUB_RUN_ID}.csv" > "$RUNNER_TEMP/details.csv" 2>/dev/null || true
            grep -E '^staff_credentials: [a-z_]+=[0-9A-Z-]+( [a-z_]+=[0-9A-Z-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || { grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true; exit "$status"; }
          elif [ "$COMMAND" = "purge_trial_exam" ]; then
            # Loga YALNIZ sayların sətri (əmr şəxs adı çap etmir; yenə də süzülür) və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^trial_exam_purge: [a-z_]+=[0-9A-Z-]+( [a-z_]+=[0-9A-Z-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+(: [a-z_,]+)?' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "reconcile_teacher_roster" ]; then
            # Hesabatda şəxs adları var → loga yalnız «Nümunələr»-ə qədərki saylar + paket id-si düşür;
            # tam hesabat/CSV şifrəli artifaktdadır (aşağıdakı addım).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            if docker exec "$APP_CONTAINER" test -s "/tmp/roster_report_${GITHUB_RUN_ID}.md"; then
              docker exec "$APP_CONTAINER" cat "/tmp/roster_report_${GITHUB_RUN_ID}.md" > "$RUNNER_TEMP/report.md"
              docker exec "$APP_CONTAINER" cat "/tmp/roster_details_${GITHUB_RUN_ID}.csv" > "$RUNNER_TEMP/details.csv" || true
              sed '/^## Nümunələr/,$d' "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/summary.log"
            fi
            grep -Eo 'roster-[0-9]{8}-[0-9]{6}-[0-9a-z]+' "$RUNNER_TEMP/out.log" | sort -u | sed 's/^/paket: /' >> "$RUNNER_TEMP/summary.log" || true
            grep -E '^(DRY-RUN|\(DRY-RUN|Bloklandı|Yeniləndi|Geri qaytarıldı|Paket|YAZILDI|GERİ QAYTARILDI|  YENİ HESAB|  yaradılmış hesablar)' "$RUNNER_TEMP/out.log" | cut -c1-160 >> "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/out.log" | grep -E 'Error|Exception' | cut -c1-200 || true; exit "$status"; }
          elif [ "$COMMAND" = "import_teaching_task_workbook" ] || [ "$COMMAND" = "import_teaching_load_form1" ]; then
            # Hesabat CSV-də şəxs adları var → loga YALNIZ saylar (əmr özü ad çap etmir; yenə də süzülür),
            # CSV şifrəli artifaktdadır (aşağıdakı addım).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            for f in tapsiriq_import.csv forma1_import.csv; do
              if docker exec "$APP_CONTAINER" test -s "/tmp/teaching_report_${GITHUB_RUN_ID}/$f"; then
                docker exec "$APP_CONTAINER" cat "/tmp/teaching_report_${GITHUB_RUN_ID}/$f" > "$RUNNER_TEMP/details.csv"
              fi
            done
            grep -E '^([a-z_]+=[0-9]+( · [a-z_]+=[0-9]+)*|Forma 1: [0-9]+ .*|  · vərəq → kafedra: .*|Yaradılan [^:]+: [0-9]+|Qeyri-müəyyən [^:]+: [0-9]+|DRY-RUN.*)$' \
              "$RUNNER_TEMP/out.log" | cut -c1-2000 > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
          elif [ "$COMMAND" = "seed_staff_roster" ]; then
            # Repo/loglar AÇIQDIR: heyət hesabatında şəxs adları var → loga yalnız saylar düşür,
            # tam hesabat şifrəli artifakt kimi yüklənir (aşağıdakı addımlar).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(Şəxs:|Yaradılacaq|✓|Vahidi tapılmayan|Təşkilatda OLMAYAN|DRY-RUN|   [a-z_]+ +[0-9]+$)' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/out.log" | grep -E 'Error|Exception' || true; exit "$status"; }
          elif [ "$COMMAND" = "resync_task_offerings" ] || [ "$COMMAND" = "dedupe_notifications" ] || [ "$COMMAND" = "backfill_notification_i18n" ]; then
            # Loga YALNIZ saylar: əmr yalnız say çap edir; xəbərdarlıq/traceback sətirləri süzülür.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(tasks=[0-9]+ · tasks_not_reached_chair=[0-9]+|(APPLY|DRY-RUN \(heç nə yazılmadı\)): [a-z_]+=[0-9]+( · [a-z_]+=[0-9]+)*)$' \
              "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "repair_group_leads" ]; then
            # Hər sətir istifadəçi adı (ad.soyad) ilə başlayır → loga adsız düşür (problem növü, qrup, əməl).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            sed -E -e 's/^[^ []+ (\[[a-z_]+\])/*** \1/' -e 's/\([^ ()]+\.[^ ()]+\)/(***)/g' "$RUNNER_TEMP/out.log" | cut -c1-200 | tail -n 200 > "$RUNNER_TEMP/summary.log"
            cat "$RUNNER_TEMP/summary.log"
            test "${status:-0}" = 0 || exit "$status"
          elif [ "$COMMAND" = "audit_cross_chair_loads" ]; then
            # Loga YALNIZ «cross_chair: açar=say …» sətri (əmr ad çap etmir; yenə də süzülür) və rədd kodu.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^cross_chair: [a-z_]+=[0-9a-z_]+( [a-z_]+=[0-9a-z_]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "infer_timetable_from_lessons" ]; then
            # Loga YALNIZ «timetable_infer: açar=say …» sətirləri (əmr ad çap etmir; yenə də süzülür) və rədd kodu;
            # sətir-sətir CSV (müəllim adları) şifrəli artifakta gedir (aşağıdakı addım).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^timetable_infer: [a-z_]+=[0-9a-z_-]+( [a-z_]+=[0-9a-z_-]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            docker exec "$APP_CONTAINER" cat "/tmp/timetable_infer_${GITHUB_RUN_ID}.csv" > "$RUNNER_TEMP/details.csv" 2>/dev/null || true
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "link_lesson_syllabus_weeks" ] || [ "$COMMAND" = "fix_group_education_form" ]; then
            # Loga YALNIZ «<prefiks>: açar=say …» sətirləri və rədd kodu (əmrlər mövzu/ad çap etmir).
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(syllabus_week_link|group_education_form): [a-z_]+=[0-9a-z_]+( [a-z_]+=[0-9a-z_]+)*$' "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          elif [ "$COMMAND" = "legacy_repair_empty_lessons" ] || [ "$COMMAND" = "sync_midterm_scores" ]; then
            # Loga YALNIZ saylar: aktor sətri atılır, xəta olarsa yalnız CommandError kodu.
            # Xülasə açarlarında «:» olmamalıdır (`  açar : dəyər`) — test: test_repair_empty_lessons.
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/out.log" 2>&1 || status=$?
            grep -E '^(===.*===|  [^:]+ : .*|  \(DRY-RUN.*|(YAZILDI|DRY-RUN).*: rəsmi .*)$' "$RUNNER_TEMP/out.log" \
              | grep -v 'Aktor:' | cut -c1-300 > "$RUNNER_TEMP/summary.log" || true
            cat "$RUNNER_TEMP/summary.log"
            if [ "${status:-0}" != 0 ]; then
              grep -Eo 'CommandError: .{0,160}' "$RUNNER_TEMP/out.log" | head -n 1 || true
              rm -f "$RUNNER_TEMP/out.log"
              exit "$status"
            fi
            rm -f "$RUNNER_TEMP/out.log"
          else
            docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/out.log"
            tail -n 120 "$RUNNER_TEMP/out.log" > "$RUNNER_TEMP/summary.log"
          fi
          echo "::endgroup::"
          {
            echo "## 🧰 ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/summary.log"
      - name: 🔑 Hesabat + parollar (serverdə saxla, şifrəli artifakt)
        id: creds
        if: always() && (github.event.inputs.command == 'seed_staff_roster' || github.event.inputs.command == 'reconcile_teacher_roster' || startsWith(github.event.inputs.command, 'import_teaching_') || github.event.inputs.command == 'issue_staff_credentials' || github.event.inputs.command == 'infer_timetable_from_lessons')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/staff-out"
          if [ -s "$RUNNER_TEMP/out.log" ]; then
            enc "$RUNNER_TEMP/out.log" "$RUNNER_TEMP/staff-out/report.log.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
          fi
          for f in report.md details.csv; do
            if [ -s "$RUNNER_TEMP/$f" ]; then
              enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/staff-out/$f.enc"
              echo "saved=1" >> "$GITHUB_OUTPUT"
            fi
          done
          rm -f "$RUNNER_TEMP/out.log" "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/details.csv"
          if [ "$APPLY" = "true" ] && docker exec "$APP_CONTAINER" test -s "/tmp/staff_creds_${GITHUB_RUN_ID}.csv"; then
            mkdir -p "$HOME/creds" && chmod 700 "$HOME/creds"
            out="$HOME/creds/staff_$(date +%Y%m%d_%H%M%S).csv"
            docker exec "$APP_CONTAINER" cat "/tmp/staff_creds_${GITHUB_RUN_ID}.csv" > "$out" && chmod 600 "$out"
            enc "$out" "$RUNNER_TEMP/staff-out/staff_creds.csv.enc"
            echo "saved=1" >> "$GITHUB_OUTPUT"
            echo "Parollar serverdə: $out" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 📦 Şifrəli hesabat/parol artifaktı
        if: always() && steps.creds.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staff-roster-encrypted
          path: ${{ runner.temp }}/staff-out/
          retention-days: 1
      - name: 🧹 Konteynerdə müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'seed_staff_roster' || github.event.inputs.command == 'apply_org_structure' || github.event.inputs.command == 'reconcile_teacher_roster' || startsWith(github.event.inputs.command, 'import_teaching_') || github.event.inputs.command == 'issue_staff_credentials' || github.event.inputs.command == 'infer_timetable_from_lessons')
        run: |
          # root kimi: fərqli UID-li qalıqlar (sticky /tmp) app istifadəçisi ilə silinmir.
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/staff_roster*.xlsx /tmp/staff_known_*.txt /tmp/staff_creds*.csv /tmp/org_structure.json /tmp/roster_report_*.md /tmp/roster_details_*.csv /tmp/teaching_task_*.xlsx /tmp/teaching_load_*.docx /tmp/timetable_infer_*.csv; rm -rf /tmp/teaching_report_*' || true
          rm -rf "$RUNNER_TEMP/staff-out" "$RUNNER_TEMP/out.log" || true
      # ── import_timetable_docx / assign_task_rows_from_timetable (dərs cədvəli; öz addımları — digər əmrlərin
      #    axınına toxunmur). Hər ikisi eyni şifrəli timetable.docx.enc faylını oxuyur. ──────────────────────
      - name: 🗓️ Dərs cədvəli — şifrəli fayl + idxal
        if: github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          case "$COMMAND" in
            import_timetable_docx) report_csv=timetable_import.csv ;;
            assign_task_rows_from_timetable) report_csv=timetable_task_assign.csv ;;
            *) echo "icazəsiz əmr: $COMMAND" >&2; exit 2 ;;
          esac
          match "$ROSTER_TAG" '^timetable-[0-9a-z-]+$' || { echo "roster_tag formatı: timetable-…" >&2; exit 1; }
          match "$PERIOD" '^(Payız|Yaz|Yay) 20[0-9]{2}/20[0-9]{2}$' || { echo "period formatı: «Payız 2026/2027»" >&2; exit 2; }
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/timetable.docx.enc" \
            -o "$RUNNER_TEMP/timetable.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/timetable.enc" -out "$RUNNER_TEMP/timetable.docx"
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/timetable_${GITHUB_RUN_ID}.docx" < "$RUNNER_TEMP/timetable.docx"
          rm -f "$RUNNER_TEMP/timetable.docx" "$RUNNER_TEMP/timetable.enc"
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args=(--file "/tmp/timetable_${GITHUB_RUN_ID}.docx" --org "$ORG" --period "$PERIOD" --actor "$actor"
                --report "/tmp/timetable_report_${GITHUB_RUN_ID}")
          if [ "$COMMAND" = "import_timetable_docx" ]; then
            test "$CREATE_MISSING" != "true" || { echo "create_missing import_timetable_docx üçün deyil (assign_task_rows_from_timetable)" >&2; exit 2; }
            test "$REPLACE_GROUP_SLOTS" != "true" || args+=(--replace-group-slots)
          else
            # `create_missing` → dərs yükündə olmayan dərs üçün yeni tapşırıq sətri (+ tapşırıq / kataloq fənni).
            test "$CREATE_MISSING" != "true" || args+=(--create-missing-rows)
            # Tapşırığın tədris ili semestrdən götürülür; kafedradankənar müəllim yalnız açıq bayraqla.
            test "$ALLOW_OUTSIDE_CHAIR" != "true" || args+=(--allow-outside-chair)
            # Açıq müəllim xəritəsi (`teacher_map`): «Soyad İ.=istifadəçi.adı», vergüllə.
            test -z "$TEACHER_MAP" || { [ "${#TEACHER_MAP}" -le 1000 ] && match "$TEACHER_MAP" '^[^=,]+=[A-Za-z0-9._-]+(,[^=,]+=[A-Za-z0-9._-]+)*$'; } \
              || { echo "teacher_map formatı: AD=istifadəçi.adı,…" >&2; exit 2; }
            test -z "$TEACHER_MAP" || args+=(--teacher "$TEACHER_MAP")
          fi
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply)
            test "$COMMAND" != "import_timetable_docx" || args+=(--i-know-this-is-production)
          fi
          # Hesabat CSV-də şəxs adları var → loga YALNIZ saylar/səbəb kodları (əmr ad çap etmir; yenə də süzülür).
          docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/tt_out.log" 2>&1 || status=$?
          if docker exec "$APP_CONTAINER" test -s "/tmp/timetable_report_${GITHUB_RUN_ID}/${report_csv}"; then
            docker exec "$APP_CONTAINER" cat "/tmp/timetable_report_${GITHUB_RUN_ID}/${report_csv}" > "$RUNNER_TEMP/tt_details.csv"
          fi
          grep -E '^(DRY-RUN|YAZILDI): |^  ([a-z]+ +[0-9]+|[a-z_0-9]+=[0-9]+|oxunmayan sətir: [0-9]+|tapılmayan qrup başlığı: [0-9]+|tələbəsi görünməyən açılış: [0-9]+|yumşaq silinən köhnə slot: [0-9]+|yaradıldı: [0-9]+|səbəb\[[a-z]+\]: [a-z_0-9=, ]+)$' \
            "$RUNNER_TEMP/tt_out.log" | cut -c1-400 > "$RUNNER_TEMP/tt_summary.log" || true
          cat "$RUNNER_TEMP/tt_summary.log"
          {
            echo "## 🗓️ ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/tt_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/tt_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Dərs cədvəli hesabatı (şifrəli)
        id: tt_report
        if: always() && (github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/tt-out"
          for f in tt_out.log tt_details.csv; do
            if [ -s "$RUNNER_TEMP/$f" ]; then
              enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/tt-out/$f.enc"
              echo "saved=1" >> "$GITHUB_OUTPUT"
            fi
          done
          rm -f "$RUNNER_TEMP/tt_out.log" "$RUNNER_TEMP/tt_details.csv" "$RUNNER_TEMP/tt_summary.log"
      - name: 📦 Şifrəli dərs cədvəli hesabatı
        if: always() && steps.tt_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.inputs.command == 'assign_task_rows_from_timetable' && 'timetable-assign-encrypted' || 'timetable-import-encrypted' }}
          path: ${{ runner.temp }}/tt-out/
          retention-days: 1
      - name: 🧹 Dərs cədvəli — müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'import_timetable_docx' || github.event.inputs.command == 'assign_task_rows_from_timetable')
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/timetable_*.docx; rm -rf /tmp/timetable_report_*' || true
          rm -rf "$RUNNER_TEMP/tt-out" "$RUNNER_TEMP/timetable.enc" "$RUNNER_TEMP/timetable.docx" || true
      # ── backfill_teacher_lessons (keçmiş dərslər + «iə»; öz addımları — digər əmrlərin axınına toxunmur).
      #    Spesifikasiya (istəyə bağlı) ŞİFRƏLİ release asset-dir: `lesson-slots-…` → slots.json.enc. ─────────
      - name: 📚 Keçmiş dərslər — cədvəldən bərpa
        if: github.event.inputs.command == 'backfill_teacher_lessons'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          # SEC-1 F7 (2026-10-17): TAM dəyər yoxlaması. `grep` sətir-sətir işləyir — API ilə göndərilən, sətir sonu
          # (LF/CR) olan dəyər «hər hansı sətir uyğundur» kimi keçə bilərdi. Əvvəlcə LF/CR rədd edilir, sonra bütün dəyər.
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          match "$TEACHER" '^[A-Za-z0-9._-]{1,150}$' || { echo "teacher formatı: ^[A-Za-z0-9._-]+$" >&2; exit 2; }
          echo "::add-mask::$TEACHER"
          match "$DATE_FROM" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_from formatı: YYYY-MM-DD" >&2; exit 2; }
          match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
          match "$PERIOD" '^(Payız|Yaz|Yay) 20[0-9]{2}/20[0-9]{2}$' || { echo "period formatı: «Payız 2026/2027»" >&2; exit 2; }
          umask 077
          spec_args=()
          if [ -n "$ROSTER_TAG" ]; then
            match "$ROSTER_TAG" '^lesson-slots-[0-9a-z-]+$' || { echo "roster_tag formatı: lesson-slots-…" >&2; exit 2; }
            test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/slots.json.enc" \
              -o "$RUNNER_TEMP/slots.enc"
            openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
              -in "$RUNNER_TEMP/slots.enc" -out "$RUNNER_TEMP/slots.json"
            docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/lesson_slots_${GITHUB_RUN_ID}.json" < "$RUNNER_TEMP/slots.json"
            rm -f "$RUNNER_TEMP/slots.json" "$RUNNER_TEMP/slots.enc"
            spec_args=(--slots-file "/tmp/lesson_slots_${GITHUB_RUN_ID}.json")
            test "$REPLACE_TEACHER_SLOTS" != "true" || spec_args+=(--replace-teacher-slots)
          else
            test "$REPLACE_TEACHER_SLOTS" != "true" || { echo "replace_teacher_slots yalnız spesifikasiya (roster_tag=lesson-slots-…) ilə" >&2; exit 2; }
          fi
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args=(--org "$ORG" --teacher "$TEACHER" --period "$PERIOD" --from "$DATE_FROM" --to "$DATE_TO" --mark present
                --actor "$actor" --report "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}" "${spec_args[@]}")
          test "$REASSIGN" != "true" || args+=(--include-late-joiners)
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply --i-know-this-is-production)
          fi
          # Loga YALNIZ saylar + açılış (fənn · qrup) sayları; tam hesabat şifrəli artifaktdadır.
          docker exec -i "$APP_CONTAINER" python manage.py backfill_teacher_lessons "${args[@]}" > "$RUNNER_TEMP/bf_out.log" 2>&1 || status=$?
          for f in lesson_backfill_lessons.csv lesson_backfill_slots.csv; do
            if docker exec "$APP_CONTAINER" test -s "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}/$f"; then
              docker exec "$APP_CONTAINER" cat "/tmp/lesson_backfill_report_${GITHUB_RUN_ID}/$f" > "$RUNNER_TEMP/$f"
            fi
          done
          grep -E '^(DRY-RUN|YAZILDI): |^  (slot|dərs|işarə iə|səbəb\[skipped\]): |^  açılış \[|^Hesabat: ' \
            "$RUNNER_TEMP/bf_out.log" | cut -c1-400 > "$RUNNER_TEMP/bf_summary.log" || true
          cat "$RUNNER_TEMP/bf_summary.log"
          {
            echo "## 📚 backfill_teacher_lessons — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/bf_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/bf_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Keçmiş dərslər hesabatı (şifrəli)
        id: bf_report
        if: always() && github.event.inputs.command == 'backfill_teacher_lessons'
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/bf-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in bf_out.log lesson_backfill_lessons.csv lesson_backfill_slots.csv; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/bf-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
          rm -f "$RUNNER_TEMP/bf_out.log" "$RUNNER_TEMP/bf_summary.log" "$RUNNER_TEMP/lesson_backfill_lessons.csv" "$RUNNER_TEMP/lesson_backfill_slots.csv"
      - name: 📦 Şifrəli keçmiş dərslər hesabatı
        if: always() && steps.bf_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lesson-backfill-encrypted
          path: ${{ runner.temp }}/bf-out/
          retention-days: 1
      - name: 🧹 Keçmiş dərslər — müvəqqəti faylları sil
        if: always() && github.event.inputs.command == 'backfill_teacher_lessons'
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/lesson_slots_*.json; rm -rf /tmp/lesson_backfill_report_*' || true
          rm -rf "$RUNNER_TEMP/bf-out" "$RUNNER_TEMP/slots.enc" "$RUNNER_TEMP/slots.json" || true
      # ── legacy_delta_apply (köhnə sistem deltası; öz addımları). Paket ŞƏXSİ datadır: yalnız şifrəli gəlir,
      #    konteynerdə 0600, iş bitəndə silinir; loga YALNIZ saylar, adlı siyahı şifrəli artifaktdadır. ──
      - name: 🗃️ Köhnə sistem deltası
        if: github.event.inputs.command == 'legacy_delta_apply'
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          match() { case "$1" in (*$'\n'*|*$'\r'*) return 1 ;; esac; printf '%s' "$1" | grep -Eq -- "$2"; }
          match "$ROSTER_TAG" '^legacy-delta-[0-9a-z-]+$' || { echo "roster_tag formatı: legacy-delta-…" >&2; exit 2; }
          test -n "$STAFF_PLAN_KEY" || { echo "STAFF_PLAN_KEY sirri yoxdur" >&2; exit 1; }
          args=(--organization "$ORG" --bundle "/tmp/legacy_delta_${GITHUB_RUN_ID}.json.gz"
                --report-out "/tmp/legacy_delta_report_${GITHUB_RUN_ID}.json"
                --names-out "/tmp/legacy_delta_names_${GITHUB_RUN_ID}.csv")
          if [ -n "$BATCH" ]; then
            match "$BATCH" '^[0-9a-f]{64}$' || { echo "batch = paketin sha256-sı (64 hex)" >&2; exit 2; }
            args+=(--expected-sha256 "$BATCH")
          fi
          if [ -n "$DATE_TO" ]; then
            match "$DATE_TO" '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "date_to formatı: YYYY-MM-DD" >&2; exit 2; }
            args+=(--lessons-until "$DATE_TO")
          fi
          umask 077
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ROSTER_TAG}/delta.json.gz.enc" \
            -o "$RUNNER_TEMP/delta.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -pass env:STAFF_PLAN_KEY \
            -in "$RUNNER_TEMP/delta.enc" -out "$RUNNER_TEMP/delta.json.gz"
          docker exec -i "$APP_CONTAINER" sh -c "umask 077; cat > /tmp/legacy_delta_${GITHUB_RUN_ID}.json.gz" < "$RUNNER_TEMP/delta.json.gz"
          rm -f "$RUNNER_TEMP/delta.json.gz" "$RUNNER_TEMP/delta.enc"
          actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
            "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
          test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
          echo "::add-mask::$actor"
          args+=(--actor "$actor")
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
            args+=(--apply --i-know-this-is-production)
          fi
          # Əmrin stdout-u YALNIZ saylardır (ad yoxdur) — loga və xülasəyə düşə bilər.
          docker exec -i "$APP_CONTAINER" python manage.py legacy_delta_apply "${args[@]}" > "$RUNNER_TEMP/delta_out.log" 2>&1 || status=$?
          for f in "legacy_delta_report_${GITHUB_RUN_ID}.json" "legacy_delta_names_${GITHUB_RUN_ID}.csv"; do
            if docker exec "$APP_CONTAINER" test -s "/tmp/$f"; then
              docker exec "$APP_CONTAINER" cat "/tmp/$f" > "$RUNNER_TEMP/$f"
            fi
          done
          grep -E '^(===|  [a-z_.]+ +[0-9]+$|  yaradılan: )' "$RUNNER_TEMP/delta_out.log" | cut -c1-200 > "$RUNNER_TEMP/delta_summary.log" || true
          cat "$RUNNER_TEMP/delta_summary.log"
          {
            echo "## 🗃️ legacy_delta_apply — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/delta_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { tail -n 5 "$RUNNER_TEMP/delta_out.log" | grep -E 'CommandError|Error|Exception' | cut -c1-200 || true; exit "$status"; }
      - name: 🔑 Köhnə sistem deltası — hesabat (şifrəli)
        id: delta_report
        if: always() && github.event.inputs.command == 'legacy_delta_apply'
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/delta-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in delta_out.log "legacy_delta_report_${GITHUB_RUN_ID}.json" "legacy_delta_names_${GITHUB_RUN_ID}.csv"; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/delta-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          fi
          rm -f "$RUNNER_TEMP/delta_out.log" "$RUNNER_TEMP/delta_summary.log" "$RUNNER_TEMP"/legacy_delta_*
      - name: 📦 Şifrəli köhnə sistem deltası hesabatı
        if: always() && steps.delta_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-delta-encrypted
          path: ${{ runner.temp }}/delta-out/
          retention-days: 1
      - name: 🧹 Köhnə sistem deltası — müvəqqəti faylları sil
        if: always() && github.event.inputs.command == 'legacy_delta_apply'
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -f /tmp/legacy_delta_*' || true
          rm -rf "$RUNNER_TEMP/delta-out" "$RUNNER_TEMP/delta.enc" "$RUNNER_TEMP/delta.json.gz" || true
      # ── ensure_parent_groups / blocked_accounts_report (ortaq ana qruplar + bloklanmış hesablar; öz addımları —
      #    digər əmrlərin axınına toxunmur). CSV hesabat şifrəli artifaktdadır (blocked_accounts.csv ŞƏXSİ datadır). ──
      - name: 👥 Ortaq ana qruplar / bloklanmış hesablar
        if: github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars'
        run: |
          set -euo pipefail
          report_dir="/tmp/groups_accounts_report_${GITHUB_RUN_ID}"
          args=(--org "$ORG" --report "$report_dir")
          case "$COMMAND" in
            ensure_parent_groups)
              report_csv=parent_groups.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing yalnız blocked_accounts_report üçündür" >&2; exit 2; }
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            blocked_accounts_report)
              report_csv=blocked_accounts.csv
              # Yeganə yazı: yükü olan bloklanmış müəllimin bloku (create_missing) — apply + confirm=APPLY ilə.
              if [ "$APPLY" = "true" ] || [ "$CREATE_MISSING" = "true" ]; then
                test "$APPLY" = "true" && test "$CREATE_MISSING" = "true" \
                  || { echo "blokdan açmaq üçün apply=true + confirm=APPLY + create_missing=true verin" >&2; exit 2; }
                actor="$(docker exec -i "$APP_CONTAINER" python manage.py shell -c \
                  "from django.contrib.auth import get_user_model as g; u=g().objects.filter(is_superuser=True, is_active=True).order_by('date_joined').first(); print(u.username if u else '')" | tail -n1)"
                test -n "$actor" || { echo "aktiv superadmin tapılmadı" >&2; exit 1; }
                echo "::add-mask::$actor"
                args+=(--apply-unblock-teachers-with-load --actor "$actor")
              fi
              ;;
            archive_junk_groups)
              # QA-2 F-16 (2026-10-17): test / zibil qruplar — yalnız istifadə olunmayan deaktiv, heç nə silinmir.
              report_csv=junk_groups.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing bu əmr üçün deyil" >&2; exit 2; }
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            shrink_avatars)
              # PERF-2 H5 (2026-10-17): mövcud avatarlar ≤512 px WebP; orijinallar SİLİNMİR (--delete-originals verilmir).
              report_csv=none.csv
              test "$CREATE_MISSING" != "true" || { echo "create_missing bu əmr üçün deyil" >&2; exit 2; }
              args=()
              test "$APPLY" != "true" || args+=(--apply)
              ;;
            *) echo "icazəsiz əmr: $COMMAND" >&2; exit 2 ;;
          esac
          if [ "$APPLY" = "true" ]; then
            echo "::group::💾 Ehtiyat nüsxə (postgres-backup /backup.sh)"
            docker exec "$BACKUP_CONTAINER" /backup.sh
            echo "::endgroup::"
          fi
          # Loga YALNIZ saylar (əmr ad çap etmir; yenə də süzülür); CSV şifrəli artifaktdadır.
          docker exec -i "$APP_CONTAINER" python manage.py "$COMMAND" "${args[@]}" > "$RUNNER_TEMP/ga_out.log" 2>&1 || status=$?
          if docker exec "$APP_CONTAINER" test -s "${report_dir}/${report_csv}"; then
            docker exec "$APP_CONTAINER" cat "${report_dir}/${report_csv}" > "$RUNNER_TEMP/ga_details.csv"
          fi
          grep -E '^(DRY-RUN \(heç nə yazılmadı\)|HESABAT \(heç nə yazılmadı\)|YAZILDI): [a-z_]+=[0-9]+( · [a-z_]+=[0-9]+)*$|^Hesabat: [a-z_]+\.csv \([0-9]+ sətir\)$|^(TƏTBİQ OLUNDU|QURU QAÇIŞ \(heç nə yazılmadı; --apply ilə yazılır\)): çevriləcək/çevrilən [0-9]+, ötürülən [0-9]+, fayl yoxdur [0-9]+, xəta [0-9]+; qənaət ≈ [0-9.]+ [KM]B$' \
            "$RUNNER_TEMP/ga_out.log" | cut -c1-600 > "$RUNNER_TEMP/ga_summary.log" || true
          cat "$RUNNER_TEMP/ga_summary.log"
          {
            echo "## 👥 ${COMMAND} — $([ "$APPLY" = "true" ] && echo APPLY || echo dry-run)"
            echo '```'
            cat "$RUNNER_TEMP/ga_summary.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${status:-0}" = 0 || { grep -Eo 'CommandError: [a-z_]+' "$RUNNER_TEMP/ga_out.log" | head -n 1 || true; exit "$status"; }
      - name: 🔑 Ortaq ana qruplar / bloklanmış hesablar hesabatı (şifrəli)
        id: ga_report
        if: always() && (github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars')
        env:
          STAFF_PLAN_KEY: ${{ secrets.STAFF_PLAN_KEY }}
        run: |
          set -euo pipefail
          enc() { openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt -pass env:STAFF_PLAN_KEY -in "$1" -out "$2"; }
          mkdir -p "$RUNNER_TEMP/ga-out"
          if [ -n "$STAFF_PLAN_KEY" ]; then
            for f in ga_out.log ga_details.csv; do
              if [ -s "$RUNNER_TEMP/$f" ]; then
                enc "$RUNNER_TEMP/$f" "$RUNNER_TEMP/ga-out/$f.enc"
                echo "saved=1" >> "$GITHUB_OUTPUT"
              fi
            done
          else
            echo "STAFF_PLAN_KEY sirri yoxdur — hesabat yüklənmir" >&2
          fi
          rm -f "$RUNNER_TEMP/ga_out.log" "$RUNNER_TEMP/ga_summary.log" "$RUNNER_TEMP/ga_details.csv"
      - name: 📦 Şifrəli ortaq ana qruplar / bloklanmış hesablar hesabatı
        if: always() && steps.ga_report.outputs.saved != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.inputs.command == 'blocked_accounts_report' && 'blocked-accounts-encrypted' || 'parent-groups-encrypted' }}
          path: ${{ runner.temp }}/ga-out/
          retention-days: 1
      - name: 🧹 Ortaq ana qruplar / bloklanmış hesablar — müvəqqəti faylları sil
        if: always() && (github.event.inputs.command == 'ensure_parent_groups' || github.event.inputs.command == 'blocked_accounts_report' || github.event.inputs.command == 'archive_junk_groups' || github.event.inputs.command == 'shrink_avatars')
        run: |
          docker exec -u 0 "$APP_CONTAINER" sh -c 'rm -rf /tmp/groups_accounts_report_*' || true
          rm -rf "$RUNNER_TEMP/ga-out" "$RUNNER_TEMP/ga_out.log" "$RUNNER_TEMP/ga_details.csv" || true

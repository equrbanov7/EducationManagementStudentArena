name: Fixed027/029 cycle-held syllabus body fingerprints (encrypted, read-only)
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Aktiv təşkilat superadmini; yalnız sabit027/029 oxu auditi"
        type: string
        required: true
      batch:
        description: "Müstəqil20kök; dövrə əlaqələri açıq saxlanılır"
        type: choice
        required: true
        options:
          - chair-cells-027
          - chair-cells-029
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Capture fixed20 bodies after deployed HEAD verification
        id: capture
        run: python3 scripts/ops/syllabus_forensic_export.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wcu-syllabus-forensic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.capture.outputs.artifact_dir }}/snapshot.enc.json
            ${{ steps.capture.outputs.artifact_dir }}/capture-manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove private temporary diagnostic artifacts
        if: always()
        run: |
          set -euo pipefail
          docker exec educationmanagementstudentarena-app-1 rm -rf -- "/tmp/wcu-syllabus-forensic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          rm -rf -- "$RUNNER_TEMP/syllabus-forensic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

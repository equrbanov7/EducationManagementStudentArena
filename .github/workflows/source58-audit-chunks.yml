name: Source58 full audit chunks (encrypted, read-only)
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Aktiv təşkilat superadmini; sabit Source58 audit sübutu; heç bir yazı yoxdur"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  export:
    runs-on: [self-hosted]
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify deployed HEAD and capture fixed encrypted audit metadata
        id: capture
        run: python3 scripts/ops/source58_audit_chunks_export.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wcu-source58-audit-chunks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.capture.outputs.artifact_dir }}/snapshot.enc.zip
            ${{ steps.capture.outputs.artifact_dir }}/capture-manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove private temporary ciphertext and public key
        if: always()
        run: |
          set -euo pipefail
          docker exec educationmanagementstudentarena-app-1 rm -rf -- "/tmp/wcu-source58-audit-chunks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          rm -rf -- "$RUNNER_TEMP/source58-audit-chunks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

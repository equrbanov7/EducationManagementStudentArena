# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA — Reusable: Code Quality / Lint
# ═══════════════════════════════════════════════════════════════════════════
# Runs Black, isort, and Flake8 checks.
# Called by ci.yml via workflow_call.
# ═══════════════════════════════════════════════════════════════════════════

name: 🔍 Lint (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.11"

jobs:
  lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements/local.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 📥 Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-bugbear black isort

      - name: 🖤 Check code formatting with Black
        run: |
          echo "::group::🖤 Black Format Check"
          black --check --diff --color . || {
            echo "::error::❌ Black formatting issues found! Run 'black .' locally to fix."
            exit 1
          }
          echo "✅ Black check passed!"
          echo "::endgroup::"

      - name: 📑 Check import sorting with isort
        run: |
          echo "::group::📑 isort Import Check"
          isort --check-only --diff --profile black . || {
            echo "::error::❌ Import sorting issues found! Run 'isort .' locally to fix."
            exit 1
          }
          echo "✅ isort check passed!"
          echo "::endgroup::"

      - name: 🔎 Lint with Flake8
        run: |
          echo "::group::🔎 Flake8 Linting"
          flake8 . \
            --count \
            --max-line-length=120 \
            --extend-ignore=E203,E266,E501,W503 \
            --exclude=.git,__pycache__,migrations,venv,.venv,env \
            --statistics \
            --show-source
          echo "✅ Flake8 check passed!"
          echo "::endgroup::"

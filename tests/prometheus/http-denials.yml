rule_files:
  - ../../docker/prometheus/alerts.yml
evaluation_interval: 30s

tests:
  - name: Aggregate login denials across replicas, methods and both role forms
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",instance="app-1",method="POST",path="/accounts/login/telebe/",status_code="401"}'
        values: '0+1x30'
      - series: 'http_requests_total{job="emsarena-app",instance="app-2",method="GET",path="/accounts/login/muellim/",status_code="403"}'
        values: '0+1x12 0+1x17'
      - series: 'http_requests_total{job="emsarena-app",instance="app-2",method="GET",path="/accounts/login/",status_code="429"}'
        values: '0+1x30'
      - series: 'http_requests_total{job="emsarena-app",instance="app-2",method="GET",path="/accounts/profile/",status_code="200"}'
        values: '0+1000x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: RoleLoginDenialBurst
        exp_alerts: []
      - eval_time: 12m
        alertname: RoleLoginDenialBurst
        exp_alerts:
          - &login_warning
            exp_labels: {job: emsarena-app, severity: warning}
            exp_annotations:
              summary: "Giriş səhifələrində HTTP rədləri artıb"
              description: "Tələbə, əməkdaş və giriş seçimi səhifələrində 401, 403 və 429 cavablarının cəmi 5 dəqiqədir həddi keçir."
      - eval_time: 12m
        alertname: ApplicationDenialBurst
        exp_alerts: []

  - name: One-off spike, sparse and unrelated traffic stay quiet
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/login/telebe/",status_code="401"}'
        values: '0+1x40'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="429"}'
        values: '0+0x10 100+0x29'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="404"}'
        values: '0+30x40'
      - series: 'http_requests_total{job="other-service",path="/accounts/profile/",status_code="403"}'
        values: '0+200x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: ApplicationDenialBurst
        exp_alerts: []
      - eval_time: 15m
        alertname: ApplicationDenialBurst
        exp_alerts: []
      - eval_time: 15m
        alertname: RoleLoginDenialBurst
        exp_alerts: []

  - name: Normal portal and dashboard traffic keep the proportional allowance
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/login/muellim/",status_code="403"}'
        values: '0+2x30'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/login/muellim/",status_code="200"}'
        values: '0+15x30'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="403"}'
        values: '0+8x30'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="200"}'
        values: '0+1000x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: RoleLoginDenialBurst
        exp_alerts: []
      - eval_time: 12m
        alertname: ApplicationDenialBurst
        exp_alerts: []

  - name: Sustained application denials fire and clear after recovery
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",instance="app-1",path="/accounts/profile/",status_code="403"}'
        values: '0+4x24 96+0x20'
      - series: 'http_requests_total{job="emsarena-app",instance="app-2",path="/accounts/profile/",status_code="429"}'
        values: '0+4x24 96+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApplicationDenialBurst
        exp_alerts:
          - &application_warning
            exp_labels: {job: emsarena-app, severity: warning}
            exp_annotations:
              summary: "Tətbiqdə HTTP rədləri artıb"
              description: "Giriş seçimi və rol üzrə giriş səhifələrindən kənarda 401, 403 və 429 cavablarının cəmi 5 dəqiqədir həddi keçir."
      - eval_time: 12m
        alertname: RoleLoginDenialBurst
        exp_alerts: []
      - eval_time: 20m
        alertname: ApplicationDenialBurst
        exp_alerts: []

  - name: High legitimate dashboard traffic cannot hide excessive absolute denials
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="200"}'
        values: '0+1400x30'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="403"}'
        values: '0+32x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApplicationDenialBurst
        exp_alerts: [*application_warning]

  - name: The allowance must be exceeded even at low volume
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/profile/",status_code="403"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApplicationDenialBurst
        exp_alerts: []

  - name: The login ceiling applies when the portal is busy
    interval: 30s
    input_series:
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/login/",status_code="200"}'
        values: '0+600x30'
      - series: 'http_requests_total{job="emsarena-app",path="/accounts/login/telebe/",status_code="429"}'
        values: '0+7x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: RoleLoginDenialBurst
        exp_alerts: [*login_warning]

# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — Prometheus alert qaydaları (Faza 1, audit 2026-07-02)
# Yoxlama: promtool check rules docker/prometheus/alerts.yml
# Metrik mənbələri:
#   http_requests_total / http_request_duration_seconds — core/metrics.py
#   pg_*   — postgres_exporter        node_* — node_exporter
# ═══════════════════════════════════════════════════════════════════════════
groups:
  - name: emsarena-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Monitorinq hədəfi əlçatmazdır: {{ $labels.job }}"
          description: "{{ $labels.instance }} ({{ $labels.job }}) 3 dəqiqədir scrape-ə cavab vermir."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL əlçatmazdır"
          description: "postgres_exporter verilənlər bazasına qoşula bilmir (pg_up == 0)."

  - name: emsarena-http
    rules:
      - alert: High5xxRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx nisbəti yüksəkdir (>2%)"
          description: "Son 5 dəqiqədə sorğuların {{ $value | humanizePercentage }}-i 5xx qaytarır."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 gecikmə 2 saniyəni keçir"
          description: "10 dəqiqədir p95 latency {{ $value }}s səviyyəsindədir."

      # İmtahan autosave/submit yolunda server xətaları — imtahan bütövlüyü
      # üçün kritik siqnal. path etiketi MetricsMiddleware tərəfindən
      # normalizə olunur: /exams/<slug>/attempt/<id>/
      - alert: ExamAttemptServerErrors
        expr: |
          sum(rate(http_requests_total{method="POST",
            path=~".*/attempt/<id>/.*", status_code=~"5.."}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "İmtahan cavab yazma (autosave/submit) 5xx qaytarır"
          description: "Son 10 dəqiqədə imtahan attempt POST sorğularında server xətaları davam edir."

  - name: emsarena-resources
    rules:
      - alert: PgConnectionsHigh
        expr: sum(pg_stat_activity_count) > 170
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL bağlantıları limitə yaxınlaşır"
          description: "Aktiv bağlantı sayı {{ $value }} (max_connections=200-ün 85%-i keçilib)."

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Host diskində yer azalır (<15%)"
          description: "Kök faylsistemində boş yer {{ $value | humanizePercentage }} qalıb. Docker log/backup rotasiyasını yoxlayın."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.92
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host yaddaş istifadəsi yüksəkdir (>92%)"
          description: "10 dəqiqədir yaddaş istifadəsi {{ $value | humanizePercentage }} səviyyəsindədir (Redis/postgres OOM riski)."

  # ═════════════════════════════════════════════════════════════════════════
  # Sistem Monitorinqi dalğası (2026-07-12): konteyner / redis / nginx /
  # blackbox / celery / backup / host qaydaları. Hədlər .env ilə deyil,
  # burada saxlanır (Prometheus rule-ları statikdir) — dəyişdirmək üçün bu
  # faylı redaktə edib prometheus-u reload edin (deploy bunu avtomatik edir).
  # ═════════════════════════════════════════════════════════════════════════
  - name: emsarena-host-extra
    rules:
      - alert: HostHighCpu
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU yüksəkdir (>85%, 5 dəq)"
          description: "Orta CPU istifadəsi 5 dəqiqədir 85%-dən yuxarıdır."

      - alert: HostCpuCritical
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m]))) > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host CPU kritikdir (>95%, 2 dəq)"
          description: "Orta CPU istifadəsi 2 dəqiqədir 95%-dən yuxarıdır."

      - alert: HostHighLoad
        expr: node_load5 > count(count(node_cpu_seconds_total) by (cpu)) * 1.0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load average nüvə sayını aşır (10 dəq)"
          description: "5 dəqiqəlik load {{ $value | printf \"%.1f\" }} — CPU nüvə sayından çoxdur."

      - alert: HostSwapHigh
        expr: >
          (node_memory_SwapTotal_bytes > 0)
          and ((1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.30)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Swap istifadəsi 30%-i keçdi"
          description: "Swap təzyiqi RAM çatışmazlığına işarədir."

      - alert: HostInodeLow
        expr: >
          (node_filesystem_files_free{fstype!~"tmpfs|overlay"}
           / node_filesystem_files{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Inode ehtiyatı azdır (<15%)"
          description: "{{ $labels.mountpoint }} üzərində inode-lar tükənir."

      - alert: HostDiskEmergency
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.03
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DISK FÖVQƏLADƏ: <3% boş yer"
          description: "Kök faylsistemində boş yer 3%-dən azdır — dərhal müdaxilə lazımdır."

  - name: emsarena-containers
    rules:
      - alert: ContainerDown
        expr: >
          time() - container_last_seen{name=~"emsarena-.+|educationmanagementstudentarena-.+"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Konteyner itib: {{ $labels.name }}"
          description: "{{ $labels.name }} 1 dəqiqədən çoxdur cAdvisor-da görünmür."

      - alert: ContainerRestartLoop
        expr: >
          increase(container_start_time_seconds{name=~"emsarena-.+|educationmanagementstudentarena-.+"}[10m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "Konteyner restart dövrəsindədir: {{ $labels.name }}"
          description: "{{ $labels.name }} son 10 dəqiqədə 3+ dəfə start olub."

      - alert: ContainerOOMKilled
        expr: >
          increase(container_oom_events_total{name=~"emsarena-.+|educationmanagementstudentarena-.+"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM: {{ $labels.name }}"
          description: "{{ $labels.name }} yaddaş limitinə görə öldürülüb."

      # 2026-09-15 istehsal tapıntısı: `container_memory_usage_bytes` səhifə keşini
      # (page cache) də sayır — postgres-backup dump yazanda keş limitə «yaxınlaşır»,
      # amma real RSS kiçikdir; alert hər 4 saatdan bir təkrarlanıb Brevo-ya gedirdi
      # (bounce/blocked statistikası → OTP məktubları növbəyə düşürdü). cgroup-un
      # OOM qərarı `working_set` (usage − inactive_file) üzərindəndir; onu ölçürük.
      - alert: ContainerMemoryNearLimit
        expr: >
          (container_memory_working_set_bytes{name=~"emsarena-.+|educationmanagementstudentarena-.+"}
           / container_spec_memory_limit_bytes{name=~"emsarena-.+|educationmanagementstudentarena-.+"} > 0.90)
          and (container_spec_memory_limit_bytes > 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Konteyner yaddaşı limitə yaxındır: {{ $labels.name }}"
          description: "{{ $labels.name }} yaddaş limitinin 90%-indən çoxunu istifadə edir (5 dəq)."

  - name: emsarena-redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis əlçatmazdır"
          description: "redis_exporter Redis-ə qoşula bilmir — cache, channel layer və Celery broker təsirlənir."

      - alert: RedisMemoryHigh
        expr: >
          (redis_memory_max_bytes > 0)
          and (redis_memory_used_bytes / redis_memory_max_bytes > 0.85)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis yaddaşı 85%-i keçdi"
          description: "maxmemory təyin olunubsa eviction riski var; Celery broker DB-si üçün təhlükəlidir."

      - alert: RedisEvictedKeys
        expr: increase(redis_evicted_keys_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Redis açar eviction-u baş verdi"
          description: "Eviction Celery broker mesajlarını silə bilər — dərhal yaddaş araşdırılmalıdır."

      - alert: RedisBlockedClients
        expr: redis_blocked_clients > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis-də bloklanmış klientlər var"
          description: "{{ $value }} klient bloklanıb (BLPOP və s.) — gecikmə artımına işarə ola bilər."

  - name: emsarena-nginx-blackbox
    rules:
      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx əlçatmazdır"
          description: "nginx_exporter stub_status-a çata bilmir."

      - alert: EndpointProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint probe uğursuzdur: {{ $labels.probe_target }}"
          description: "{{ $labels.probe_target }} 2 dəqiqədir blackbox yoxlamasından keçmir."

      - alert: EndpointSlowProbe
        expr: probe_duration_seconds > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Endpoint yavaş cavab verir: {{ $labels.probe_target }}"
          description: "Probe müddəti 5 saniyəni keçir (5 dəq)."

      - alert: TlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 30 * 24 * 3600
        labels:
          severity: warning
        annotations:
          summary: "TLS sertifikatının bitməsinə <30 gün qalır"
          description: "docker/nginx/certs/origin.crt yenilənməlidir (LAN self-signed: openssl ilə regen + nginx reload)."

      - alert: TlsCertExpiryCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) < 7 * 24 * 3600
        labels:
          severity: critical
        annotations:
          summary: "TLS sertifikatının bitməsinə <7 gün qalır"
          description: "Sertifikat dərhal yenilənməlidir, əks halda brauzer girişləri kəsiləcək."

  - name: emsarena-celery-backup
    rules:
      # Mənbə: apps/monitoring collectors (beat task → cache → /metrics/).
      - alert: CeleryWorkersDown
        expr: emsarena_celery_workers_online == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Heç bir Celery worker onlayn deyil"
          description: "Bildiriş, e-poçt və imtahan task-ları icra olunmur."

      - alert: CeleryBeatStale
        expr: time() - emsarena_celery_stats_collected_timestamp > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Celery Beat dayanıb və ya gecikir"
          description: "Monitorinq beat task-ı 5+ dəqiqədir statistika yeniləmir."

      # 2026-09-13 infra auditi P3-14: `for` 10m → 2m — imtahan günü 60 s
      # sweep-ləri (expire_overdue/expire_stale) yığılanda 10 dəqiqə gecdir.
      # Metrik artıq `queue` etiketlidir (P2-8) — bu qayda yalnız defolt
      # növbəni, aşağıdakı CeleryHeavyQueueBacklog isə heavy növbəni tutur.
      - alert: CeleryQueueBacklog
        expr: emsarena_celery_queue_length{queue="celery"} > 200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Celery növbəsi yığılır ({{ $value }} task)"
          description: "Broker `celery` növbəsi 2 dəqiqədir 200-dən çox task saxlayır (60 s sweep-lər gecikir)."

      # 2026-09-13 infra auditi P2-8: heavy növbə (OCR / AI / export) ayrıca
      # worker-də işləyir (celery_worker_heavy, concurrency 2, task 900 s).
      # Əvvəl yalnız `celery` növbəsi ölçülürdü — heavy worker ölsə və ya
      # OCR backlog-u yığılsa heç bir alert yanmırdı. Hədd kiçikdir: hər job
      # dəqiqələr çəkir, 20 gözləyən job ≈ 1+ saat gecikmə deməkdir.
      - alert: CeleryHeavyQueueBacklog
        expr: emsarena_celery_queue_length{queue="heavy"} > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery heavy növbəsi yığılır ({{ $value }} job)"
          description: "OCR/AI/export növbəsi 10 dəqiqədir 20-dən çox job saxlayır — celery_worker_heavy sağlamlığını yoxlayın."

      # 2026-09-13 infra auditi P2-8: `CeleryWorkersDown` ümumi worker sayına
      # baxır — heavy worker ölsə, defolt worker sağ olduğu üçün heç nə yanmır,
      # OCR/AI/export job-ları isə növbədə əbədi qalır (20 dəq sonra reaper
      # FAILED edir). `emsarena_celery_queue_workers{queue}` beat task-ının
      # `inspect.active_queues()` nəticəsidir (apps/monitoring/collectors.py).
      - alert: CeleryHeavyWorkerDown
        expr: emsarena_celery_queue_workers{queue="heavy"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Heavy növbəsini dinləyən Celery worker yoxdur"
          description: "celery_worker_heavy 3+ dəqiqədir onlayn deyil — OCR / AI generasiya / export job-ları icra olunmur."

      - alert: BackupTooOld
        expr: emsarena_backup_age_seconds > 26 * 3600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL backup 26 saatdan köhnədir"
          description: "postgres-backup servisi yoxlanmalıdır (gündəlik cədvəl pozulub)."

  # ═════════════════════════════════════════════════════════════════════════
  # 2026-09-13 infra auditi P1-3 — monitorinqin ÖZ sağlamlığı.
  # Lokal prod-like yığında Alertmanager e-poçtu «525 5.7.1 Unauthorized IP»
  # ilə 5+ gün səssiz uğursuz oldu, sonra prometheus/alertmanager/nginx
  # Exited(127) qaldı — heç kim bilmədi, çünki alert kanalının özünü izləyən
  # qayda yox idi. İki qayda:
  #   * AlertmanagerNotificationsFailing — çatdırılma (SMTP/webhook) uğursuzdur.
  #     Alertmanager öz `/metrics`-ini verir (job emsarena-alertmanager).
  #     Bu alert e-poçtla çatmaya bilər (kanal elə odur ki, xarabdır) — amma
  #     in-app webhook (ayrı inteqrasiya) və Grafana/Prometheus UI-da görünür.
  #   * Watchdog — HƏMİŞƏ yanan alert (deadman). Alertmanager-də ayrıca
  #     `heartbeat` marşrutu ilə dövri «hələ sağam» e-poçtu göndərilir;
  #     e-poçt KƏSİLSƏ Prometheus→Alertmanager→SMTP zəncirinin harasısa
  #     ölüb (prosesin özü, DNS, SMTP icazəsi). Bax SISTEM_MONITORINQI.md §8.1.
  # ═════════════════════════════════════════════════════════════════════════
  - name: emsarena-meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog: monitorinq zənciri işləyir (deadman siqnalı)"
          description: "Bu alert qəsdən həmişə yanır. Dövri heartbeat e-poçtu KƏSİLİBSƏ Prometheus/Alertmanager/SMTP zəncirini yoxlayın."

      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager bildirişləri çatdıra bilmir ({{ $labels.integration }})"
          description: "Son 15 dəqiqədə {{ $labels.integration }} inteqrasiyasında {{ $value | printf \"%.0f\" }} uğursuz göndəriş. E-poçt üçün Brevo «Authorised IPs», DNS və SMTP parolunu; webhook üçün nginx/app yolunu yoxlayın (SISTEM_MONITORINQI.md §8.1)."

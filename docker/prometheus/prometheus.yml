global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Faza 1 (audit 2026-07-02): alert qaydaları + Alertmanager marşrutu.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: emsarena-app
    metrics_path: /metrics/
    static_configs:
      - targets:
          - nginx:80

  - job_name: emsarena-postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: emsarena-node
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: emsarena-prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # ── Sistem Monitorinqi (superadmin mərkəzi) əlavə mənbələri ──────────────
  - job_name: emsarena-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: emsarena-redis
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: emsarena-nginx
    static_configs:
      - targets:
          - nginx_exporter:9113

  - job_name: emsarena-pgbouncer
    static_configs:
      - targets:
          - pgbouncer_exporter:9127

  - job_name: emsarena-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: emsarena-loki
    static_configs:
      - targets:
          - loki:3100

  # LAN endpoint sağlamlığı (blackbox): ping/health/login nginx üzərindən.
  - job_name: emsarena-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx_lan]
    static_configs:
      - targets:
          - https://nginx/ping/
          - https://nginx/health/
          - https://nginx/accounts/login/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_target
      - target_label: __address__
        replacement: blackbox_exporter:9115

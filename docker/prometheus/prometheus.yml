global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: emsarena-app
    metrics_path: /metrics/
    static_configs:
      - targets:
          - nginx:80

  - job_name: emsarena-postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: emsarena-prometheus
    static_configs:
      - targets:
          - prometheus:9090

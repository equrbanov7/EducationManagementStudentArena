# 2026-10-21 (sahib: «monitorinq sistemi yükləməsin»): 15 s → 30 s. Boş serverdə monitorinq yığını ən böyük
# CPU istehlakçısı idi (promtail 7 %, prometheus 2.7 %); 14 app replikasının /metrics/ scrape-i (multiproc
# registry birləşməsi app prosesində) və ~60 qaydanın qiymətləndirilməsi iki dəfə seyrəlir. Bütün qaydalar
# 30 s ilə işləyir: ən qısa pəncərə rate(...[2m]) (4 nümunə), ən qısa `for: 1m` (2 qiymətləndirmə); aşkarlama
# gecikməsi ən çox +15 s. Qrafiklərin ən incə addımı 30 s olur.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Faza 1 (audit 2026-07-02): alert qaydaları + Alertmanager marşrutu.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # 2026-09-13 infra auditi P2-2: əvvəl tək hədəf `nginx:80` idi — nginx hər
  # scrape-i round-robin ilə BAŞQA app replikasına ötürürdü (APP_REPLICAS=8),
  # hər replikanın isə öz multiproc registry-si var → eyni seriya altında 8
  # müstəqil sayğac qarışırdı (`rate()` counter-reset görür, High5xxRate /
  # HighLatencyP95 / ExamAttemptServerErrors yanlış hesablanırdı). İndi Compose
  # DNS-i (`app` adı bütün replika IP-lərini qaytarır — nginx də eyni
  # mexanizmi işlədir) ilə hər replika ayrıca `instance` olur; qaydalardakı
  # `sum(rate(...))` replikalar üzrə düzgün cəmlənir.
  #
  # Birbaşa scrape-də Django `Host: <ip>:8000` görür (ALLOWED_HOSTS-da yox →
  # 400) və XFP olmadan SECURE_SSL_REDIRECT 301 qaytarır. Django production-da
  # USE_X_FORWARDED_HOST=True olduğundan nginx `/metrics/` blokunun etdiyini
  # başlıqlarla təkrarlayırıq: X-Forwarded-Host=localhost (ALLOWED_HOSTS
  # `localhost` daxil etməlidir — app healthcheck də bunu tələb edir) və
  # X-Forwarded-Proto=https. `Host` başlığı Prometheus-da rezervdir, ona görə
  # X-Forwarded-Host işlədilir; Django settings dəyişməyib (`check --deploy`
  # təmiz qalır). nginx `/metrics/` bloku əl ilə yoxlama üçün qalır.
  - job_name: emsarena-app
    metrics_path: /metrics/
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 30s
    http_headers:
      X-Forwarded-Host:
        values: ["localhost"]
      X-Forwarded-Proto:
        values: ["https"]

  - job_name: emsarena-postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: emsarena-node
    static_configs:
      - targets:
          # 2026-10-04: node_exporter host şəbəkəsindədir (host NIC-ləri görünsün) və yalnız
          # docker körpüsünün gateway-inə bind olur — compose DNS adı yoxdur (bax compose şərhi).
          - 172.18.0.1:9100

  # 2026-10-21: monitorinq stekinin ÖZ metrikləri (prometheus/alertmanager/loki/cadvisor) minlərlə seriya verir,
  # amma alertlər / Monitorinq səhifəsi / Grafana / prod-audit (scripts/ops/prod_audit.sh, prod_logs_probe.py)
  # yalnız aşağıdakı ailələri oxuyur — qalanı scrape-də atılır (TSDB yaddaşı + ingest). `up` sintetikdir,
  # metric_relabel ona təsir etmir (TargetDown işləyir). Yeni sorğu/alert əlavə edəndə siyahını genişləndirin
  # (tests/test_infra_monitoring_load_2026_10_21.py hər istifadə olunan ailənin saxlanıldığını yoxlayır).
  - job_name: emsarena-prometheus
    static_configs:
      - targets:
          - prometheus:9090
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "prometheus_(tsdb_head_series|tsdb_storage_blocks_bytes|tsdb_head_samples_appended_total|rule_evaluation_failures_total|rule_group_last_duration_seconds|notifications_dropped_total|notifications_errors_total|config_last_reload_successful|target_scrapes_exceeded_sample_limit_total)"

  # ── Sistem Monitorinqi (superadmin mərkəzi) əlavə mənbələri ──────────────
  - job_name: emsarena-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    # 2026-10-21: cadvisor konteyner başına ~60 seriya verir (yaddaş təfərrüatı, fs, paket/xəta sayğacları,
    # spec, tasks_state …); istifadə olunan 8 ailədir (queries.py containers_section, summary_metrics,
    # alerts.yml emsarena-containers, prod_audit.sh). Yalnız bu layihənin konteynerləri saxlanılır — bütün
    # sorğular `name=~"emsarena-.+|educationmanagementstudentarena-.+"` ilə filtrlənir.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "container_(last_seen|cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|start_time_seconds|network_receive_bytes_total|network_transmit_bytes_total|oom_events_total)"
      - source_labels: [name]
        action: keep
        regex: "emsarena-.+|educationmanagementstudentarena-.+"

  - job_name: emsarena-redis
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: emsarena-nginx
    static_configs:
      - targets:
          - nginx_exporter:9113

  - job_name: emsarena-pgbouncer
    static_configs:
      - targets:
          - pgbouncer_exporter:9127

  - job_name: emsarena-alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "alertmanager_(notifications_total|notifications_failed_total|alerts|alerts_received_total|alerts_invalid_total|config_last_reload_successful|silences)"

  - job_name: emsarena-loki
    static_configs:
      - targets:
          - loki:3100
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "loki_(distributor_lines_received_total|distributor_bytes_received_total|discarded_samples_total|ingester_memory_streams|request_duration_seconds_bucket|request_duration_seconds_count|request_duration_seconds_sum)"

  # LAN endpoint sağlamlığı (blackbox): ping/health/login nginx üzərindən.
  - job_name: emsarena-blackbox
    metrics_path: /probe
    params:
      module: [http_2xx_lan]
    static_configs:
      - targets:
          - https://nginx/ping/
          - https://nginx/health/
          - https://nginx/accounts/login/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: probe_target
      - target_label: __address__
        replacement: blackbox_exporter:9115

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Faza 1 (audit 2026-07-02): alert qaydaları + Alertmanager marşrutu.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: emsarena-app
    metrics_path: /metrics/
    static_configs:
      - targets:
          - nginx:80

  - job_name: emsarena-postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: emsarena-node
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: emsarena-prometheus
    static_configs:
      - targets:
          - prometheus:9090

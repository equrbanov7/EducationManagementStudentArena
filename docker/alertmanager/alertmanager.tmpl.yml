# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — Alertmanager konfiqurasiya TEMPLATE-i (Faza 1)
#
# Bu fayl git-də saxlanır və SİRR DAŞIMIR. __PLACEHOLDER__ dəyərləri konteyner
# start olarkən docker-compose.prod.yml-dəki alertmanager servisi tərəfindən
# .env dəyişənlərindən (BREVO_SMTP_LOGIN/BREVO_SMTP_KEY/ALERT_EMAIL_TO/
# WATCHDOG_REPEAT_INTERVAL...)
# sed ilə doldurulur və nəticə /tmp/alertmanager.yml kimi istifadə olunur.
#
# QEYD: dəyərlərdə '|' və '&' simvolları olmamalıdır (sed əvəzləmə qaydası).
# ═══════════════════════════════════════════════════════════════════════════
global:
  smtp_smarthost: "__SMTP_HOST__:__SMTP_PORT__"
  smtp_from: "__ALERT_FROM__"
  smtp_auth_username: "__SMTP_USER__"
  smtp_auth_password: "__SMTP_PASS__"
  smtp_require_tls: true

route:
  receiver: ops-all
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  # Həll olunmamış alert 4 saatdan bir təkrar xatırladılır.
  repeat_interval: 4h
  routes:
    # 2026-09-13 infra auditi P1-3 (deadman): `Watchdog` qaydası həmişə yanır
    # (alerts.yml `emsarena-meta`). Bu marşrut onu ümumi ops axınından və
    # in-app webhook-dan AYIRIR — yalnız dövri «hələ sağam» e-poçtu gedir.
    # E-poçt kəsilibsə Prometheus→Alertmanager→SMTP zəncirinin harasısa
    # ölüb. Təkrar intervalı .env `WATCHDOG_REPEAT_INTERVAL` (defolt 24h).
    # Marşrut siyahının ƏVVƏLİNDƏ olmalıdır (ilk uyğunluq qalib gəlir).
    - receiver: heartbeat
      matchers:
        - alertname = "Watchdog"
      group_wait: 10s
      group_interval: 1m
      repeat_interval: __WATCHDOG_REPEAT__
    # Kritik alertlər daha tez-tez təkrarlanır.
    - receiver: ops-all
      matchers:
        - severity = "critical"
      repeat_interval: 1h

receivers:
  # E-poçt + EMSArena in-app insident axını (Sistem Monitorinqi mərkəzi).
  # Webhook Django-nun daxili endpoint-inə gedir; token .env-dən gəlir və
  # start zamanı compose sed-i ilə doldurulur (sirr git-ə düşmür).
  # Token `Authorization: Bearer` başlığı ilə göndərilir (2026-09-12, audit
  # P2-6) — URL-də olsa nginx/proxy access log-una düşürdü. Django tərəfi
  # `?token=` formasını artıq qəbul etmir; bu şablon dəyişəndə konteyner
  # yenidən yaradılmalıdır (sed start zamanı işləyir — bax remote_deploy.sh).
  - name: ops-all
    email_configs:
      - to: "__ALERT_TO__"
        send_resolved: true
    # 2026-09-13 infra auditi P2-1: URL birbaşa `app:8000` DEYİL, nginx
    # üzərindəndir. Birbaşa çağırışda Django `Host: app:8000` görür
    # (ALLOWED_HOSTS-da yoxdur → 400) və ya `X-Forwarded-Proto` olmadığı üçün
    # SECURE_SSL_REDIRECT 301 qaytarır (Alertmanager 3xx-i izləmir → uğursuz).
    # nginx-in daxili `location = /api/.../alertmanager-webhook/` bloku
    # (yalnız docker şəbəkəsinə açıq) `Host localhost` + XFP https ötürür.
    webhook_configs:
      - url: "http://nginx/api/superadmin/monitoring/alertmanager-webhook/"
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials: "__WEBHOOK_TOKEN__"

  # 2026-09-13 infra auditi P1-3: Watchdog heartbeat — YALNIZ e-poçt (in-app
  # webhook-a getmir ki, daimi «yanan» insident yaranmasın). Xarici deadman
  # xidməti (healthchecks.io və s.) istənərsə buraya `webhook_configs` əlavə
  # edin — bax docs/operations/SISTEM_MONITORINQI.md §8.1.
  - name: heartbeat
    email_configs:
      - to: "__ALERT_TO__"
        send_resolved: false
        headers:
          Subject: "[EMSArena] Watchdog heartbeat — monitorinq zənciri işləyir"

inhibit_rules:
  # Hədəf tamamilə əlçatmaz olanda (TargetDown) həmin job-un digər
  # alertlərini səssizləşdir — dublikat bildiriş yağışının qarşısını alır.
  - source_matchers:
      - alertname = "TargetDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["job"]

server_tokens off;
# EMS Arena - CI nginx reverse proxy
#
# The production nginx config also listens on 443 and requires origin TLS
# certificates that are intentionally not committed to the repository. CI smoke
# tests only exercise plain HTTP on localhost, so this config keeps the proxy
# behavior but avoids loading the production-only certificate files.

map $http_x_forwarded_proto $real_proto {
    default  $scheme;
    https    https;
    http     http;
}

# WebSocket-aware Connection header. Empty (not "close") for plain HTTP so the
# upstream keepalive pool below stays usable; "upgrade" only for real WS.
# ── Şəbəkə zonası (publik domen çıxışı, 2026-09-21) ──────────────────────
# Real müştəri IP-sinə görə internal/external. Django-ya X-EMS-Zone kimi gedir
# (müştəri başlığı proxy_set_header ilə ƏZİLİR). INTERNAL şəbəkələr dəyişəndə
# həm bura, həm .env INTERNAL_NETWORKS yenilənməlidir.
geo $ems_zone {
    default        external;
    127.0.0.0/8    internal;
    10.0.0.0/8     internal;
    172.16.0.0/12  internal;
    192.168.0.0/16 internal;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream emsarena_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location /media/post_images/ {
        alias /var/www/media/post_images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/course_covers/ {
        alias /var/www/media/course_covers/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://emsarena_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-EMS-Zone        $ems_zone;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location /internal_media/ {
        internal;
        alias /var/www/media/;
        expires off;
        add_header Cache-Control "private, no-store";
    }

    location / {
        # Kənar zonadan elektron jurnal və admin paneli kənar qatda da 403 (defense in depth).
        # Şəxsi cədvəl/təqvim/transkript jurnal deyil — kənardan açıqdır (Django
        # `network_zone.JOURNAL_EXTERNAL_OPEN_PATHS` ilə eyni siyahı; $uri normallaşdırılıb).
        set $ems_zone_path "$ems_zone:$uri";
        if ($ems_zone_path ~ "^external:/jurnal/(cedvel/|cedvel/export\.ics|teqvim/|transkript\.pdf)$") { set $ems_zone_path "open"; }
        if ($ems_zone_path ~ "^external:/(jurnal|manage)/") { return 403; }
        proxy_pass http://emsarena_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-EMS-Zone        $ems_zone;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;

        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }
}

# 2026-09-14 (audit P3-1): prod nginx healthcheck `:8081/stub_status`-a baxır;
# CI konfiqi eyni blokdaursa konteyner «unhealthy» görünür (smoke ondan asılı
# deyil, amma `docker compose ps` yanıltmasın).
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}

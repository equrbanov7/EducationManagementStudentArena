# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — Nginx reverse proxy configuration (production)
# ═══════════════════════════════════════════════════════════════════════════
# Nginx public direct-edge-dir: internet klienti TCP ilə birbaşa bu prosesə
# qoşulur və TLS burada terminasiya olunur. Arada CDN/load-balancer yoxdur.
#
# Trusted proxy sərhədi (audit: proxy/XFF spoof): inbound XFF/XFP heç vaxt
# etibarlı sayılmır. XFF aşağıda TCP peer-in ``$remote_addr`` dəyəri ilə
# overwrite olunur, protokol isə birbaşa bağlantının ``$scheme`` dəyəridir.
#
# All HTTP traffic reaches nginx first.  Static and media files are served
# directly from named Docker volumes.  Everything else is proxied to the
# Daphne ASGI server which handles both plain HTTP and WebSocket upgrades.
# ═══════════════════════════════════════════════════════════════════════════

limit_req_zone  $binary_remote_addr zone=emsarena_general:20m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=emsarena_conn:20m;

# Access log: $upstream_http_x_request_id Django request_id-si ilə app JSON
# loglarını birləşdirir (csrf_failure view dəqiq səbəbi loglayır).
log_format emsarena_main '$remote_addr peer=$realip_remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'req_id=$upstream_http_x_request_id rt=$request_time';

# Docker's embedded DNS returns scaled app container IPs with round-robin
# answers.  Use nginx's resolver at request time so app replicas added by
# `--scale app=N` receive traffic without hardcoding container names.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    access_log /var/log/nginx/access.log emsarena_main;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── HTTP/2 (Faza 4, audit 2026-07-02) ─────────────────────────────────
    # TLS bağlantılarında ALPN ilə h2 danışılır; WebSocket upgrade-lər
    # HTTP/1.1 üzərindən işləməyə davam edir (ALPN h2 seçilməyəndə).
    http2 on;

    # ── Dinamik cavablar üçün gzip (Faza 4) ───────────────────────────────
    # text/html avtomatik daxildir. Django-nun per-request maskalanan CSRF
    # tokeni BREACH hücumunu neytrallaşdırır, ona görə HTML sıxılması
    # təhlükəsizdir. Statiklər üçün gzip_static onsuz da aktivdir.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml application/xml;

    set $emsarena_app http://app:8000;

    # HTTP→HTTPS yönləndirməsi nginx-də edilmir: Django production-da
    # SECURE_SSL_REDIRECT ilə özü 301 qaytarır (X-Forwarded-Proto aşağıda
    # $scheme-dən ötürülür). CI smoke / lokal run-lar plain HTTP üzərində
    # işləməyə davam edir.

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn emsarena_conn 1000;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 60s;

    # PDF question imports can include scanned/image pages; Django still enforces
    # its own upload cap, but nginx must allow those files to reach the app.
    client_max_body_size 64M;

    # ── Static files ──────────────────────────────────────────────────────
    # Served directly from the shared Docker volume; no round-trip to Django.
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ── Media files ───────────────────────────────────────────────────────
    # Only publicly accessible media prefixes are served directly by nginx.
    # Private uploads (avatars, submissions, exam files, labs, etc.) must
    # be requested through Django's protected_media view, which performs
    # authentication/authorisation checks and returns an X-Accel-Redirect
    # header so that nginx handles the actual file delivery efficiently.
    location /media/post_images/ {
        alias /var/www/media/post_images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/course_covers/ {
        alias /var/www/media/course_covers/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Block direct browser access to all other /media/ paths.
    # Django's protected_media view is reached via the proxy location below
    # and will return X-Accel-Redirect to /internal_media/ for authorised
    # requests.  Unauthorised requests receive a 403/404 from Django.
    location /media/ {
        proxy_pass $emsarena_app;
        proxy_http_version 1.1;
        # $host (not "localhost"): Django must see the real host so that
        # ALLOWED_HOSTS validation and absolute URL building work correctly.
        proxy_set_header Host              $host;
        # XFF OVERWRITE olunur (append yox): client-in göndərdiyi saxta XFF
        # heç vaxt Django-ya çatmır — get_client_ip birinci elementi oxuyur.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Forward the resolved protocol so Django sees the correct scheme.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Prevent caching of auth-protected responses
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # Internal-only location used by X-Accel-Redirect.
    # Not accessible from outside nginx (internal directive).
    location /internal_media/ {
        internal;
        alias /var/www/media/;
        expires off;
        add_header Cache-Control "private, no-store";
    }

    # ── Internal metrics only ─────────────────────────────────────────────
    # Prometheus scrapes metrics through nginx over the private Docker network.
    # Allow only private networks and loopback so metrics are not exposed to
    # the public internet.
    location /metrics/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $emsarena_app;
        proxy_http_version 1.1;
        proxy_set_header Host              localhost;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Internal scrape traffic arrives over plain HTTP, but Django has
        # SECURE_SSL_REDIRECT enabled in production. Mark this private hop as
        # HTTPS to avoid a scrape-only redirect loop.
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Application (HTTP + WebSocket) ────────────────────────────────────
    location / {
        limit_req zone=emsarena_general burst=1000 nodelay;

        proxy_pass $emsarena_app;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers so Django sees the real client IP / scheme.
        # X-Forwarded-Proto = $scheme (nginx TLS terminatoru olduğu üçün
        # etibarlı mənbədir) — Django-nun SECURE_PROXY_SSL_HEADER-i HTTPS-i
        # düzgün tanıyır.
        proxy_set_header Host              $host;
        # XFF OVERWRITE olunur (append yox) — bax /media/ blokundakı qeyd.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        # HTTP timeouts. OCR imports for scanned PDFs can take several minutes.
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        # WebSocket connections must stay open for extended periods (live exams).
        # Set read timeout well above the longest expected idle interval.
        proxy_read_timeout    900s;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# Monitorinq: nginx stub_status — YALNIZ daxili Docker şəbəkəsi üçün.
# Port 8081 heç vaxt host-a publish olunmur; nginx_exporter buradan oxuyur.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}

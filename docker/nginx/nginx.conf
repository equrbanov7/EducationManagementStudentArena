# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — Nginx reverse proxy configuration (production)
# ═══════════════════════════════════════════════════════════════════════════
# TLS / SSL Architecture:
#   Cloudflare can forward HTTPS traffic to the origin over plain HTTP
#   (Flexible) or encrypted HTTPS (Full).  This nginx container listens on
#   both 80 and 443 so Cloudflare Full mode can reach the origin.
#
# All HTTP traffic reaches nginx first.  Static and media files are served
# directly from named Docker volumes.  Everything else is proxied to the
# Daphne ASGI server which handles both plain HTTP and WebSocket upgrades.
# ═══════════════════════════════════════════════════════════════════════════

# Resolve the real protocol as seen by the client.
# When the upstream Load Balancer sets X-Forwarded-Proto we trust it;
# otherwise we fall back to the scheme nginx itself received (useful for
# direct HTTP access during local / CI smoke testing).
map $http_x_forwarded_proto $real_proto {
    default  $scheme;
    https    https;
    http     http;
}

# Prefer Cloudflare's client IP header for rate/connection limiting when it is
# present; direct-origin traffic falls back to nginx's remote address.
map $http_cf_connecting_ip $emsarena_client_key {
    default  $http_cf_connecting_ip;
    ""       $binary_remote_addr;
}

limit_req_zone  $emsarena_client_key zone=emsarena_general:20m rate=200r/s;
limit_conn_zone $emsarena_client_key zone=emsarena_conn:20m;

# Docker's embedded DNS returns scaled app container IPs with round-robin
# answers.  Use nginx's resolver at request time so app replicas added by
# `--scale app=N` receive traffic without hardcoding container names.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    set $emsarena_app http://app:8000;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    # When the Load Balancer forwards an originally plain-HTTP request it sets
    # X-Forwarded-Proto: http.  We redirect those requests permanently so the
    # client upgrades to HTTPS.
    #
    # This check is intentionally based on $http_x_forwarded_proto rather
    # than $real_proto / $scheme: it only fires when the LB is present and
    # explicitly labels the request as plain HTTP.  Requests with no
    # X-Forwarded-Proto header (direct / CI traffic) are not redirected, so
    # the smoke test and local Docker runs continue to work over plain HTTP.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn emsarena_conn 1000;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 60s;

    # Written-answer uploads are intentionally capped below the generic Django
    # upload helper so exam submissions cannot exhaust memory/disk bandwidth.
    client_max_body_size 16M;

    # ── Static files ──────────────────────────────────────────────────────
    # Served directly from the shared Docker volume; no round-trip to Django.
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ── Media files ───────────────────────────────────────────────────────
    # Only publicly accessible media prefixes are served directly by nginx.
    # Private uploads (avatars, submissions, exam files, labs, etc.) must
    # be requested through Django's protected_media view, which performs
    # authentication/authorisation checks and returns an X-Accel-Redirect
    # header so that nginx handles the actual file delivery efficiently.
    location /media/post_images/ {
        alias /var/www/media/post_images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/course_covers/ {
        alias /var/www/media/course_covers/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Block direct browser access to all other /media/ paths.
    # Django's protected_media view is reached via the proxy location below
    # and will return X-Accel-Redirect to /internal_media/ for authorised
    # requests.  Unauthorised requests receive a 403/404 from Django.
    location /media/ {
        proxy_pass $emsarena_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Forward the resolved protocol so Django sees the correct scheme.
        proxy_set_header X-Forwarded-Proto $real_proto;
        # Prevent caching of auth-protected responses
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # Internal-only location used by X-Accel-Redirect.
    # Not accessible from outside nginx (internal directive).
    location /internal_media/ {
        internal;
        alias /var/www/media/;
        expires off;
        add_header Cache-Control "private, no-store";
    }

    # ── Application (HTTP + WebSocket) ────────────────────────────────────
    location / {
        limit_req zone=emsarena_general burst=1000 nodelay;

        proxy_pass $emsarena_app;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers so Django sees the real client IP / scheme.
        # X-Forwarded-Proto is set to $real_proto (resolved above from the
        # LB-provided header) so Django's SECURE_PROXY_SSL_HEADER setting
        # correctly identifies HTTPS requests terminated at the LB.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_proto;

        proxy_redirect off;

        # HTTP timeouts — keep reasonable for normal requests
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        # WebSocket connections must stay open for extended periods (live exams).
        # Set read timeout well above the longest expected idle interval.
        proxy_read_timeout    300s;
    }
}

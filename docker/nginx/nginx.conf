# ═══════════════════════════════════════════════════════════════════════════
# EMS Arena — Nginx reverse proxy configuration (production)
# ═══════════════════════════════════════════════════════════════════════════
# All HTTP traffic reaches nginx first.  Static and media files are served
# directly from named Docker volumes.  Everything else is proxied to the
# Daphne ASGI server which handles both plain HTTP and WebSocket upgrades.
# ═══════════════════════════════════════════════════════════════════════════

upstream emsarena_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Accept uploads up to the same limit as Django's FILE_UPLOAD_SECURITY_MAX_SIZE_MB
    client_max_body_size 25M;

    # ── Static files ──────────────────────────────────────────────────────
    # Served directly from the shared Docker volume; no round-trip to Django.
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # ── Media files ───────────────────────────────────────────────────────
    # Raw media is served by nginx.  Authenticated access to user-uploaded
    # files must go through Django's /media/download/<path>/ endpoint.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Application (HTTP + WebSocket) ────────────────────────────────────
    location / {
        proxy_pass http://emsarena_app;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers so Django sees the real client IP / scheme
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        # HTTP timeouts — keep reasonable for normal requests
        proxy_connect_timeout  60s;
        proxy_send_timeout     60s;
        # WebSocket connections must stay open for extended periods (live exams).
        # Set read timeout well above the longest expected idle interval.
        proxy_read_timeout    300s;
    }
}

# EMSArena — nginx ƏSAS konfiqi (image-in /etc/nginx/nginx.conf faylının üzərinə mount olunur).
#
# 2026-10-04 tutum auditi: nginx:1.27-alpine defoltu `worker_connections 1024` və fd limiti
# yox idi — 10 worker × 1024 / 2 ≈ 5 100 proxy bağlantısı; 5 000 canlı imtahan WS hədəfi
# üçün hardware-dən əvvəl doyan tavan bu idi. Virtual host / proxy / zona qaydaları əvvəlki
# kimi conf.d/default.conf-dadır (docker/nginx/nginx.conf) — bu fayl yalnız proses/hadisə
# səviyyəsini və `http` blokunun image defoltlarını təkrarlayır.
#
# Fərq image defoltundan: worker_rlimit_nofile, worker_connections 8192, multi_accept.
# Deploy: scripts/deploy/remote_deploy.sh hər iki faylın hash-ini yoxlayıb lazım olsa nginx-i
# yenidən yaradır (bind mount köhnə inode-a bağlı qalmasın).

user  nginx;
worker_processes  auto;
# Compose-da konteynerin `ulimits.nofile` 65536-dır; worker_connections bundan böyük ola bilməz.
worker_rlimit_nofile  65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Image defoltu — conf.d/default.conf öz `emsarena_main` formatını təyin edib işlədir.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

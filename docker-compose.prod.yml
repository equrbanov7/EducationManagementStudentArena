# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA - Production Stack
# ═══════════════════════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or export before running):
#   SECRET_KEY, DATABASE_URL (or POSTGRES_* vars), REDIS_PASSWORD,
#   ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, SITE_URL
#
# TLS / SSL Architecture — Option B (External Load Balancer termination):
#   SSL/TLS is terminated at the upstream Load Balancer (e.g. AWS ALB,
#   Cloudflare, or HAProxy).  The LB decrypts HTTPS traffic and forwards
#   plain HTTP to nginx on port 80, setting the X-Forwarded-Proto: https
#   header so that Django and nginx know the original connection was secure.
#   Nginx therefore only listens on port 80 inside the container; the LB
#   handles all certificate management and HTTPS redirection externally.
#   Do NOT add a 443 binding here — certificates live on the LB, not nginx.
#
# Security notes:
#   - Redis is NOT exposed externally; it is reachable only inside the
#     emsarena-network bridge network.
#   - Redis is password-protected via REDIS_PASSWORD.
#   - PostgreSQL is NOT exposed externally.
#   - Only nginx (port 80) is accessible from outside; the LB provides HTTPS.
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — primary data store
  # No external port binding; accessible only within emsarena-network.
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: emsarena-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — channel layer (DB 0) and cache (DB 1)
  # No external port binding; accessible only within emsarena-network.
  # Password enforced via --requirepass; REDISCLI_AUTH is set so the
  # health check can authenticate without passing the password on the
  # command line (which would be visible in process listings).
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: emsarena-redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # App — Daphne ASGI server (HTTP + WebSocket)
  # Runs database migrations on startup via prod-entrypoint.sh, then starts
  # Daphne. Not exposed externally; nginx proxies all traffic to it.
  # ─────────────────────────────────────────────────────────────────────────
  app:
    image: ${APP_IMAGE:-emsarena-prod:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: emsarena-app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SITE_URL: ${SITE_URL}
      ADMIN_URL_PREFIX: ${ADMIN_URL_PREFIX:-manage/}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
      ADMIN_LOGIN_RATE_LIMIT: ${ADMIN_LOGIN_RATE_LIMIT:-3/15m}
      ADMIN_2FA_REQUIRED: ${ADMIN_2FA_REQUIRED:-True}
      ADMIN_OTP_VERIFY_RATE_LIMIT: ${ADMIN_OTP_VERIFY_RATE_LIMIT:-5/10m}
      ADMIN_OTP_RESEND_RATE_LIMIT: ${ADMIN_OTP_RESEND_RATE_LIMIT:-3/10m}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_EMAIL: ${BREVO_EMAIL:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@emsarena.com}
      AUTH_OTP_EXPIRY_SECONDS: ${AUTH_OTP_EXPIRY_SECONDS:-300}
      AUTH_OTP_RESEND_COOLDOWN_SECONDS: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_MAX_SENDS_PER_HOUR: ${AUTH_OTP_MAX_SENDS_PER_HOUR:-5}
      SENTRY_DSN: ${SENTRY_DSN:-}
      MEDIA_ACCEL_REDIRECT_URL: /internal_media
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: ["/app/docker/prod-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 8000)); s.close()\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Celery worker — background task processing
  # Processes email delivery and other async tasks via Redis broker.
  # ─────────────────────────────────────────────────────────────────────────
  celery_worker:
    image: ${APP_IMAGE:-emsarena-prod:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: emsarena-celery-worker
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=2"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SITE_URL: ${SITE_URL}
      EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_EMAIL: ${BREVO_EMAIL:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@emsarena.com}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx — reverse proxy and static/media file server
  # The only service with external port bindings (80 and 443).
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: emsarena-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/staticfiles:ro
      - media_data:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emsarena-network

networks:
  emsarena-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

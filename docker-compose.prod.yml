# ═══════════════════════════════════════════════════════════════════════════
# EMS ARENA - Production Stack
# ═══════════════════════════════════════════════════════════════════════════
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or export before running):
#   SECRET_KEY, DATABASE_URL (or POSTGRES_* vars), REDIS_PASSWORD,
#   ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, SITE_URL, GRAFANA_ADMIN_PASSWORD
#   Alerting (e-mail): ALERT_EMAIL_TO (+ BREVO_SMTP_LOGIN / BREVO_SMTP_KEY)
#
# TLS / SSL Architecture:
#   Cloudflare can connect to the origin over plain HTTP (Flexible) or HTTPS
#   (Full).  This stack exposes both port 80 and 443 so Cloudflare Full mode
#   does not fail when the zone is configured to use encrypted origin pulls.
#   Certificates for origin HTTPS are mounted from docker/nginx/certs.
#
# Security notes:
#   - Redis is NOT exposed externally; it is reachable only inside the
#     emsarena-network bridge network.
#   - Redis is password-protected via REDIS_PASSWORD.
#   - PostgreSQL is NOT exposed externally.
#   - Only nginx (ports 80/443) is accessible from outside.
#
# Faza 1 (audit 2026-07-02):
#   - Hər serviste log rotasiyası (json-file 10m×3) və resurs limitləri
#     (env ilə tənzimlənə bilər — deploy.resources.limits).
#   - app healthcheck TCP əvəzinə real HTTP /health/ yoxlaması.
#   - celery_beat servisi (CELERY_BEAT_SCHEDULE üçün) əlavə olundu.
#   - node_exporter + alertmanager + Prometheus alert qaydaları əlavə olundu.
#   - app/celery env dublikatı x-app-env anchor-una yığıldı.
# ═══════════════════════════════════════════════════════════════════════════

# ─── Ortaq log rotasiyası: bütün servislərə tətbiq olunur ───────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ─── Ortaq build tərifi (app / celery_worker / celery_beat eyni image) ──────
x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile.prod
  args:
    APT_PRIMARY_MIRROR: ${APT_PRIMARY_MIRROR:-https://deb.debian.org/debian}
    APT_PRIMARY_SECURITY_MIRROR: ${APT_PRIMARY_SECURITY_MIRROR:-https://deb.debian.org/debian-security}
    APT_FALLBACK_MIRROR: ${APT_FALLBACK_MIRROR:-https://ftp.debian.org/debian}
    APT_FALLBACK_SECURITY_MIRROR: ${APT_FALLBACK_SECURITY_MIRROR:-https://security.debian.org/debian-security}

# ─── app + celery_worker + celery_beat üçün ORTAQ mühit dəyişənləri ─────────
# Servis-spesifik dəyişənlər (Daphne, admin, cookie, Piston client və s.)
# aşağıda hər servisin öz environment blokunda əlavə olunur.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-unknown}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
  DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-0}
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  SITE_URL: ${SITE_URL}
  EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
  BREVO_EMAIL: ${BREVO_EMAIL:-}
  BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
  BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@emsarena.com}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-4096}
  AI_RATE_LIMIT: ${AI_RATE_LIMIT:-100/1h}
  AI_ASSISTANT_RATE_LIMIT: ${AI_ASSISTANT_RATE_LIMIT:-25/1h}
  EXAM_AUTOSAVE_INTERVAL_MS: ${EXAM_AUTOSAVE_INTERVAL_MS:-300000}
  EXAM_AUTOSAVE_JITTER_MS: ${EXAM_AUTOSAVE_JITTER_MS:-60000}
  EXAM_AUTOSAVE_BINARY_UPLOADS_ENABLED: ${EXAM_AUTOSAVE_BINARY_UPLOADS_ENABLED:-false}
  EXAM_ANSWER_FILE_MAX_SIZE_MB: ${EXAM_ANSWER_FILE_MAX_SIZE_MB:-5}
  EXAM_ANSWER_MAX_FILES_PER_QUESTION: ${EXAM_ANSWER_MAX_FILES_PER_QUESTION:-3}
  EXAM_PAINT_MAX_BASE64_CHARS: ${EXAM_PAINT_MAX_BASE64_CHARS:-1500000}
  EXAM_START_GLOBAL_CONCURRENCY: ${EXAM_START_GLOBAL_CONCURRENCY:-12}
  EXAM_START_PER_EXAM_CONCURRENCY: ${EXAM_START_PER_EXAM_CONCURRENCY:-6}
  EXAM_START_WAIT_TIMEOUT_SECONDS: ${EXAM_START_WAIT_TIMEOUT_SECONDS:-30}
  EXAM_START_POLL_INTERVAL_SECONDS: ${EXAM_START_POLL_INTERVAL_SECONDS:-0.05}
  EXAM_START_LOCK_LEASE_SECONDS: ${EXAM_START_LOCK_LEASE_SECONDS:-120}
  EXAM_RANDOMIZER_USAGE_CACHE_SECONDS: ${EXAM_RANDOMIZER_USAGE_CACHE_SECONDS:-30}
  EXAM_PDF_OCR_ENABLED: ${EXAM_PDF_OCR_ENABLED:-true}
  EXAM_PDF_OCR_LANG: ${EXAM_PDF_OCR_LANG:-aze}
  EXAM_PDF_OCR_DPI: ${EXAM_PDF_OCR_DPI:-160}
  EXAM_PDF_OCR_MAX_PAGES: ${EXAM_PDF_OCR_MAX_PAGES:-90}
  EXAM_PDF_OCR_HIGHLIGHT: ${EXAM_PDF_OCR_HIGHLIGHT:-true}
  EXAM_PDF_OCR_HIGHLIGHT_MIN_RATIO: ${EXAM_PDF_OCR_HIGHLIGHT_MIN_RATIO:-0.08}
  REQUEST_QUEUE_GLOBAL_UNSAFE_LIMIT: ${REQUEST_QUEUE_GLOBAL_UNSAFE_LIMIT:-8}
  HEALTH_CHECK_CACHE_SECONDS: ${HEALTH_CHECK_CACHE_SECONDS:-2}
  METRICS_ALLOW_ANONYMOUS: ${METRICS_ALLOW_ANONYMOUS:-true}
  OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-false}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
  AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-true}
  AWS_QUERYSTRING_EXPIRE: ${AWS_QUERYSTRING_EXPIRE:-900}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0}
  # Heavy exam features stay off in production (also hard-coded in
  # config/settings/production.py — kept here for documentation parity).
  PRACTICAL_EXAMS_ENABLED: "false"
  EXAM_SUPERVISION_ENABLED: "false"
  CODING_EXECUTION_BACKEND: "disabled"

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — primary data store
  # No external port binding; accessible only within emsarena-network.
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: emsarena-postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
          memory: ${POSTGRES_MEM_LIMIT:-2048M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Postgres backup — daily pg_dump with local rotation (audit step 5).
  # Dumps land in ./backups/postgres (mounted on the host).  Off-site copy
  # (S3/B2/rsync) MUST be configured separately — see docs/deployment.md.
  # ─────────────────────────────────────────────────────────────────────────
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: emsarena-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --blobs"
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-3}
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${BACKUP_CPU_LIMIT:-0.5}"
          memory: ${BACKUP_MEM_LIMIT:-256M}
    # Son backup uğursuzdursa 200 qaytarmır → konteyner unhealthy görünür və
    # TargetDown/monitorinq üzərindən görünən siqnal yaranır.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # PgBouncer — PostgreSQL connection pooler
  # Keeps Daphne/Celery from opening unbounded backend connections to Postgres.
  # Session pooling is intentional because the app uses PostgreSQL session GUCs
  # for RLS tenant context.
  # ─────────────────────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: emsarena-pgbouncer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-session}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-4}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-20}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-60}
      SERVER_RESET_QUERY: ${PGBOUNCER_SERVER_RESET_QUERY:-DISCARD ALL}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.5}"
          memory: ${PGBOUNCER_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — channel layer (DB 0), cache (DB 1) and Celery broker (DB 2)
  # No external port binding; accessible only within emsarena-network.
  # Password enforced via --requirepass; REDISCLI_AUTH is set so the
  # health check can authenticate without passing the password on the
  # command line (which would be visible in process listings).
  # NOTE: maxmemory QƏSDƏN təyin edilməyib — Celery broker (DB 2) üçün
  # eviction təhlükəlidir. Host yaddaşı HostMemoryHigh alerti ilə izlənir.
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: emsarena-redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: ${REDIS_MEM_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # App — Daphne ASGI server (HTTP + WebSocket)
  # Not exposed externally; nginx proxies all traffic to it. The service is
  # scale-ready: run release tasks once, then set APP_REPLICAS=2/3/4 in deploy.
  # ─────────────────────────────────────────────────────────────────────────
  app:
    image: ${APP_IMAGE:-emsarena-prod:latest}
    build: *app-build
    environment:
      <<: *app-env
      RUN_RELEASE_ON_START: ${RUN_RELEASE_ON_START:-true}
      ASGI_THREADS: ${ASGI_THREADS:-8}
      DAPHNE_HTTP_TIMEOUT: ${DAPHNE_HTTP_TIMEOUT:-900}
      DAPHNE_APPLICATION_CLOSE_TIMEOUT: ${DAPHNE_APPLICATION_CLOSE_TIMEOUT:-120}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ADMIN_URL_PREFIX: ${ADMIN_URL_PREFIX:-manage/}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
      ADMIN_LOGIN_RATE_LIMIT: ${ADMIN_LOGIN_RATE_LIMIT:-3/15m}
      ADMIN_2FA_REQUIRED: ${ADMIN_2FA_REQUIRED:-True}
      ADMIN_OTP_VERIFY_RATE_LIMIT: ${ADMIN_OTP_VERIFY_RATE_LIMIT:-5/10m}
      ADMIN_OTP_RESEND_RATE_LIMIT: ${ADMIN_OTP_RESEND_RATE_LIMIT:-3/10m}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      AUTH_OTP_EXPIRY_SECONDS: ${AUTH_OTP_EXPIRY_SECONDS:-300}
      AUTH_OTP_RESEND_COOLDOWN_SECONDS: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_MAX_SENDS_PER_HOUR: ${AUTH_OTP_MAX_SENDS_PER_HOUR:-5}
      MEDIA_ACCEL_REDIRECT_URL: /internal_media
      # Practical/coding exams are disabled in production. Keep the settings
      # here for future controlled re-enable, but do not start Piston by
      # default or make app health depend on it.
      CODING_PISTON_URL: ${CODING_PISTON_URL:-http://piston:2000/api/v2}
      CODING_PISTON_AUTH_TOKEN: ${CODING_PISTON_AUTH_TOKEN:-}
      CODING_RUN_RATE_LIMIT_PER_MINUTE: ${CODING_RUN_RATE_LIMIT_PER_MINUTE:-600}
      CODING_RUN_MAX_CONCURRENT_PER_USER: ${CODING_RUN_MAX_CONCURRENT_PER_USER:-2}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: ["/app/docker/prod-entrypoint.sh"]
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.5}"
          memory: ${APP_MEM_LIMIT:-1536M}
    # Real HTTP yoxlaması: /health/ DB-ni yoxlayır (Redis problemi "degraded"
    # 207 qaytarır və sağlam sayılır). X-Forwarded-Proto: https başlığı
    # SECURE_SSL_REDIRECT yönləndirməsinin qarşısını alır (nginx /metrics/
    # scrape-i ilə eyni pattern). ALLOWED_HOSTS "localhost" daxil etməlidir —
    # server .env-də ALLOWED_HOSTS siyahısına localhost,127.0.0.1 daxil edin.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          req=urllib.request.Request('http://localhost:8000/health/',
          headers={'X-Forwarded-Proto': 'https'});
          resp=urllib.request.urlopen(req, timeout=5);
          sys.exit(0 if resp.status < 400 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Celery worker — background task processing
  # Processes email delivery and other async tasks via Redis broker.
  # ─────────────────────────────────────────────────────────────────────────
  celery_worker:
    image: ${APP_IMAGE:-emsarena-prod:latest}
    build: *app-build
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    environment:
      <<: *app-env
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
    volumes:
      - media_data:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${CELERY_CPU_LIMIT:-1.0}"
          memory: ${CELERY_MEM_LIMIT:-1024M}
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Celery beat — periodic task scheduler (Faza 1 / audit K5).
  # CELERY_BEAT_SCHEDULE (config/settings/components/celery_cache.py) yalnız
  # bu servis işləyəndə icra olunur. Schedule state /tmp-də saxlanır —
  # restart-da itməsi problemsizdir (interval task yenidən hesablanır).
  # ─────────────────────────────────────────────────────────────────────────
  celery_beat:
    image: ${APP_IMAGE:-emsarena-prod:latest}
    build: *app-build
    container_name: emsarena-celery-beat
    command: ["celery", "-A", "config", "beat", "-l", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${CELERY_BEAT_CPU_LIMIT:-0.25}"
          memory: ${CELERY_BEAT_MEM_LIMIT:-256M}
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL exporter — Prometheus metrics for DB pressure and slowdowns.
  # Bound only to the internal Docker network.
  # ─────────────────────────────────────────────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: emsarena-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PG_EXPORTER_CPU_LIMIT:-0.2}"
          memory: ${PG_EXPORTER_MEM_LIMIT:-128M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9187/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Node exporter — host disk/yaddaş/CPU metrikləri (disk-full alerti üçün).
  # Yalnız daxili şəbəkə; host kök faylsistemi read-only mount olunur.
  # ─────────────────────────────────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: emsarena-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.2}"
          memory: ${NODE_EXPORTER_MEM_LIMIT:-64M}
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Alertmanager — Prometheus alertlərini e-poçta (Brevo SMTP) göndərir.
  # Config template-i (git-də, sirsiz) start zamanı env dəyərləri ilə
  # doldurulur — sirlər yalnız .env-dən gəlir, fayl kimi commit olunmur.
  # UI yalnız localhost-dadır (SSH tuneli ilə: silence/inhibit üçün).
  # ─────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: emsarena-alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      SMTP_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${EMAIL_PORT:-587}
      SMTP_USER: ${BREVO_SMTP_LOGIN:-}
      SMTP_PASS: ${BREVO_SMTP_KEY:-}
      ALERT_FROM: ${ALERT_EMAIL_FROM:-no-reply@emsarena.com}
      ALERT_TO: ${ALERT_EMAIL_TO:-ops@example.invalid}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__SMTP_HOST__|$${SMTP_HOST}|g"
        -e "s|__SMTP_PORT__|$${SMTP_PORT}|g"
        -e "s|__SMTP_USER__|$${SMTP_USER}|g"
        -e "s|__SMTP_PASS__|$${SMTP_PASS}|g"
        -e "s|__ALERT_FROM__|$${ALERT_FROM}|g"
        -e "s|__ALERT_TO__|$${ALERT_TO}|g"
        /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${ALERTMANAGER_CPU_LIMIT:-0.2}"
          memory: ${ALERTMANAGER_MEM_LIMIT:-128M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — scrapes app replicas, database and node exporters; evaluates
  # alert rules (docker/prometheus/alerts.yml) and routes them to Alertmanager.
  # Exposed only on localhost; use SSH tunnel or a private admin network.
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: emsarena-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      postgres_exporter:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}"
          memory: ${PROMETHEUS_MEM_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — pre-provisioned with Prometheus datasource and EMS dashboard.
  # Exposed only on localhost. GRAFANA_ADMIN_PASSWORD is REQUIRED (fail-fast):
  # default parol ilə işə düşmə audit K-tapıntısı idi.
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.3.0
    container_name: emsarena-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-0.5}"
          memory: ${GRAFANA_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Piston — self-hosted code execution sandbox
  # Optional profile for practical/coding exams. Disabled in normal
  # production deploys so the code-execution sandbox does not consume RAM/CPU.
  # Used to run student-submitted code for practical/coding exams. The
  # official engineer-man/piston image bundles isolated runtimes for
  # Python, JavaScript, C++, Java and many more languages; it runs each
  # submission in its own cgroup-isolated nsjail with memory/CPU/PID
  # limits enforced by the Piston supervisor.
  #
  # Security:
  #   - Not exposed externally; only the Django app can reach port 2000
  #     over the internal emsarena-network bridge.
  #   - Privileged mode is required because Piston uses isolate/nsjail
  #     which needs cap_sys_admin to create user namespaces. This is the
  #     same trust boundary you would grant Docker itself.
  #   - The /piston volume holds installed language runtimes so we don't
  #     re-download them on every container restart.
  #
  # Capacity:
  #   - Each Piston worker handles ~1 submission at a time. Scale by
  #     increasing PISTON_MAX_CONCURRENT_JOBS (memory permitting) or by
  #     running multiple piston replicas behind an internal load balancer.
  # ─────────────────────────────────────────────────────────────────────────
  piston:
    profiles:
      - coding
    image: ghcr.io/engineer-man/piston:latest
    container_name: emsarena-piston
    restart: unless-stopped
    privileged: true
    tmpfs:
      - /tmp:exec,size=1g
    volumes:
      - piston_packages:/piston
    environment:
      # Tuning for ~100 concurrent students. Each in-flight submission
      # gets its own short-lived sandbox; idle memory cost is small.
      PISTON_MAX_CONCURRENT_JOBS: ${PISTON_MAX_CONCURRENT_JOBS:-16}
      PISTON_COMPILE_TIMEOUT: ${PISTON_COMPILE_TIMEOUT:-10000}
      PISTON_RUN_TIMEOUT: ${PISTON_RUN_TIMEOUT:-15000}
      PISTON_OUTPUT_MAX_SIZE: ${PISTON_OUTPUT_MAX_SIZE:-65536}
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${PISTON_CPU_LIMIT:-2.0}"
          memory: ${PISTON_MEM_LIMIT:-4096M}
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          node -e 'require("http").get("http://localhost:2000/api/v2/runtimes", r => process.exit(r.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - emsarena-network

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx — reverse proxy and static/media file server
  # The only service with external port bindings (80 and 443).
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: emsarena-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/staticfiles:ro
      - media_data:/var/www/media:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: ${NGINX_MEM_LIMIT:-256M}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - emsarena-network

networks:
  emsarena-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  piston_packages:

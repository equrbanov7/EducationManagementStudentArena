# ═══════════════════════════════════════════════════════════════════════════
# Gitleaks configuration — EMS Arena
# ═══════════════════════════════════════════════════════════════════════════
# Gitleaks scans git history for accidentally committed secrets.
# This baseline config extends the default rule-set and adds explicit
# allowlists for known false positives (CI placeholder values, test keys,
# and documentation examples that are not real credentials).
#
# Reference: https://github.com/gitleaks/gitleaks#configuration
# ═══════════════════════════════════════════════════════════════════════════

title = "EMS Arena Gitleaks Config"

# ── Extend the upstream default rule-set ────────────────────────────────
[extend]
useDefault = true

# ── Global allowlist ────────────────────────────────────────────────────
# Patterns listed here are never treated as secrets regardless of which
# rule triggered the match.  Only add entries that are provably NOT real
# credentials (e.g. CI dummy values, documentation examples, test keys).
[allowlist]
description = "Known CI placeholder values and test/documentation examples"

# Regex patterns that match the *entire* secret value captured by a rule.
# These are the dummy keys used in CI workflow steps and documented examples.
regexes = [
    # Django SECRET_KEY placeholders used in CI jobs
    '''^ci-build-placeholder-not-for-production$''',
    '''^ci-smoke-secret-key-not-for-production-use$''',
    '''^ci-deploy-check-QzNyXk9mVpLsJeWuHqRtGdFbAcOiMnKlYhTgPwEv2x8j5f3z7a4r6s1o0uBCDIU$''',
    '''^test-secret-key-for-ci-only-not-production$''',
    '''^build-check-secret-key$''',

    # Database / Redis passwords used exclusively in CI smoke tests
    '''^ci-smoke-postgres-password$''',
    '''^ci-smoke-redis-password$''',

    # SQLite paths used for build-time checks (no real DB)
    '''^sqlite:////tmp/build\.db$''',
    '''^sqlite:///db\.sqlite3$''',

    # AI assistant sanitizer tests use fake fixture values to prove redaction.
    '''^AIzaSyBvgGTd3zRxAuuymMcOSYZyCOB1uWf_7A0$''',
    '''^abcd1234efgh5678$''',

    # test_import_retention retention testi: `_bundle(token, age_hours=72 ...)`
    # sətrində `token` sözü `age_hours=72`-nin yanında durduğu üçün
    # generic-api-key qaydası tetiklənir. Tutulan dəyər sadəcə keyword
    # arqumentinin özüdür — credential deyil.
    '''^age_hours=72$''',

    # provision_student_credentials._PASSWORD_ALPHABET — readable (no-lookalike)
    # character set for random password generation, NOT a credential. The
    # generic-api-key rule matches on its length/entropy; explicitly allowlisted.
    '''^abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789$''',

    # AKADEMIK_OS_ANALIZI.md — legacy anti-pattern sitatı: myedudb-nin
    # `students_id='["9979"]'` JSON-mətn sütunu nümunəsi. Sənəd nümunəsidir,
    # credential deyil; generic-api-key qaydası `_id='...'` formasına tetiklənir.
    '''^\["9979"\]$''',
    '''students_id='\["9979"\]'$''',

    # Köçürülmüş hesabların istifadəçi adları (`myedu.student.<id>` /
    # `myedu.worker.<id>`) testlərdə və sənədlərdə görünür; credential deyil —
    # generic-api-key qaydası nöqtəli forma + rəqəm entropiyasına tetiklənir.
    '''^myedu\.(student|worker)\.\d+$''',
]

# Specific file paths to exclude entirely from scanning.
paths = [
    # Compiled translation files are binary and never contain secrets
    '''.*/locale/.*/LC_MESSAGES/django\.(mo|po)$''',
    # Python bytecode cache
    '''.*/__pycache__/.*''',
    # Generated coverage reports
    '''htmlcov/.*''',
    '''coverage\.xml''',
    # Arxitektura sənədləri — legacy anti-pattern kod sitatları (nümunə
    # dəyərlər), real credential daşımır; tək-tək regex əvəzinə yol səviyyəsində.
    '''docs/architecture/AKADEMIK_OS_ANALIZI\.md$''',
]

# ── Layihə qaydası: parollu PostgreSQL DSN (audit 2026-09-13, F-03) ─────────
# gitleaks-in default qayda dəsti `postgres://user:<parol>@host` formasını TUTMUR;
# QA klonunun (real istifadəçi məlumatının kopyası) iki işlək parolu məhz bu
# formada tracked fayllara düşmüşdü. Qayda parolu (2-ci qrup) sirr kimi tutur.
# Şablonlar (`${VAR}`, `$VAR`, `<parol>`, `%s`, `…`) simvol sinfi ilə istisna
# olunur; CI/sənəd placeholder-ləri və yerli birdəfəlik agent sandbox DSN-i
# (`emsarena_agent:emsarena_agent_password@127.0.0.1:55432`) aşağıda allow-list-dədir.
[[rules]]
id = "ems-postgres-dsn-password"
description = "PostgreSQL DSN with an embedded password (postgres://user:<pw>@host)"
regex = '''postgres(?:ql)?://([A-Za-z0-9_.\-]+):([^@\s"'<>$%{}`…]{8,})@[A-Za-z0-9_.\-]+(?::[0-9]+)?'''
secretGroup = 2
keywords = ["postgres://", "postgresql://"]

[[rules.allowlists]]
description = "Placeholder DSN parolları (CI, sənəd nümunələri, yerli agent sandbox-u)"
# Yerli birdəfəlik agent sandbox-u (docker-compose.agent.yml, docs/operations/CLAUDE_POSTGRES_SANDBOX.md)
# — real məlumat yoxdur, parol brifdə açıq verilir.
regexes = [
    '''^emsarena_agent_password$''',
    # CI workflow-larının smoke/test bazaları
    '''^(build|test|security|security_app|rls_ci)_password$''',
    # .env.example / README / test fixture nümunələri
    '''^CHANGE_ME$''',
    '''^replace-with-a-strong-postgres-password$''',
    '''^secretpw$''',
    '''^raw-password$''',
]
# Tarixi commit-lər: QA klon parolları bu commit-lərdə əlavə olunub və 2026-09-13
# (F-03) tracked fayllardan çıxarılıb; parollar rotasiya olunur (ops), tarix
# yenidən yazılmır (auditin qərarı: «rotasiya kifayətdir»). Yeni commit-lərdə
# qayda tam qüvvədədir.
commits = [

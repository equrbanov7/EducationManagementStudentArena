{% load i18n static %}
{% comment %}G4 (2026-07-04): review_submissions.html JS blokundan çıxarılıb; davranışsız extract.
   H1 (2026-07-24): inline skript → xarici projects/js/review_submissions_grade.js;
   config #project-review-config data-* atributları ilə ötürülür (CSP: no inline).{% endcomment %}
<div id="project-review-config"
     data-selected-submission-id="{{ selected_submission_id }}"
     data-can-delete="{% if can_delete_submissions %}1{% else %}0{% endif %}"
     data-i18n-no-content="{% trans 'no_content' context 'projects.review.js' %}"
     data-i18n-download="{% trans 'download' context 'projects.review.js' %}"
     data-i18n-sending="{% trans 'sending' context 'projects.review.js' %}"
     data-i18n-error-prefix="{% trans 'error_prefix' context 'projects.review.js' %}"
     data-i18n-unknown-error="{% trans 'unknown_error' context 'projects.review.js' %}"
     data-i18n-server-error="{% trans 'server_error' context 'projects.review.js' %}"
     data-i18n-grade-button="{% trans 'grade_button' context 'projects.review.js' %}"
     data-i18n-review-locked="{% trans 'Yoxlama bağlanıb. Bu cavab yalnız baxış üçündür.' %}"
     data-i18n-identity-window="{% trans 'Anonimlik pəncərəsi aktivdir. Tələbə adı 5 dəqiqə tamam olduqdan sonra görünəcək.' %}"
     data-i18n-recheck-window="{% trans 'Yenidən yoxlama pəncərəsi aktivdir. Bu müddətdə adı anonim qalır.' %}"
     data-i18n-review-now="{% trans 'Yoxla və yadda saxla' %}"
     data-i18n-review-again="{% trans 'Yenidən yoxla və yadda saxla' %}"
     data-i18n-confirm-title="{% trans 'Qiymətləndirməni təsdiqləyin' %}"
     data-i18n-confirm-message="{% trans 'Bu bal və rəyi saxlamaq istədiyinizə əminsiniz?' %}"
     hidden></div>
<script src="{% static 'projects/js/review_submissions_grade.js' %}"></script>

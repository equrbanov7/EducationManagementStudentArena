{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'az' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Exam | {{ session.pin }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/live_avatar.css' %}">
    <link rel="stylesheet" href="{% static 'css/live_theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/player.css' %}">
</head>
<body class="live-player-page" data-live-theme="{{ session_settings.theme_key|default:'aurora' }}">
    <div class="live-player-shell">
        <div class="live-player-bg" aria-hidden="true">
            <span class="live-player-bg__blob live-player-bg__blob--one"></span>
            <span class="live-player-bg__blob live-player-bg__blob--two"></span>
            <span class="live-player-bg__blob live-player-bg__blob--three"></span>
            <span class="live-player-bg__grid"></span>
            <span class="live-player-bg__spark live-player-bg__spark--one"></span>
            <span class="live-player-bg__spark live-player-bg__spark--two"></span>
            <span class="live-player-bg__spark live-player-bg__spark--three"></span>
        </div>

        <header class="live-player-header">
            <div class="live-player-chip live-player-chip--question" id="questionChip">Question</div>
            <div class="live-player-header__status">
                <div class="live-player-timer" id="timerBox">
                    <i class="fa-solid fa-stopwatch"></i>
                    <span id="timerText">--:--</span>
                </div>
            </div>
        </header>

        <main class="live-player-stage">
            <section class="phase-panel" id="phasePanel" aria-live="polite">
                <div class="phase-panel__inner" id="phasePanelInner"></div>
            </section>

            <section class="options-shell" id="optionsShell">
                <div class="options-grid" id="optionsContainer"></div>
                <div class="multi-actions" id="multiActions">
                    <div class="select-counter" id="selectCounter">Select your answers</div>
                    <button class="submit-btn" id="submitBtn" type="button" disabled>
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Submit answer</span>
                    </button>
                </div>
            </section>
        </main>

        <footer class="live-player-footer">
            <div class="live-player-identity">
                <div class="live-player-identity__avatar" id="playerAvatar"></div>
                <div class="live-player-identity__meta">
                    <div class="live-player-identity__name" id="playerName">{{ player.nickname }}</div>
                    <div class="live-player-identity__scoreline">
                        <span class="live-player-identity__score" id="playerScore">{{ player.score|default:0 }}</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    {{ session_settings|json_script:"playerSessionSettings" }}
    <script nonce="{{ request.csp_nonce }}">
        window.LIVE_EXAM_PLAYER_BOOTSTRAP = {
            pin: "{{ session.pin }}",
            csrf: "{{ csrf_token }}",
            quizTitle: "{{ session.exam.title|default:'Quiz'|escapejs }}",
            stateUrl: "{% url 'liveExam:state_json' session.pin %}",
            answerUrl: "{% url 'liveExam:answer_submit' session.pin %}",
            sessionSettings: JSON.parse(document.getElementById("playerSessionSettings").textContent),
            waitingMessages: [
                "Easy does it!",
                "Nice move!",
                "Let's see how you did!",
                "Good call!",
                "Locked in!"
            ],
            player: {
                id: {{ player.id }},
                nickname: "{{ player.nickname|escapejs }}",
                avatar_key: "{{ player.avatar_key|escapejs }}",
                accessory_key: "{{ player.accessory_key|escapejs }}",
                score: {{ player.score|default:0 }}
            }
        };
        window.LIVE_EXAM_PLAYER_I18N = {
            connectionOnline: "Online",
            connectionOffline: "Offline",
            connectionConnecting: "Connecting",
            questionLabel: "Question",
            waitingForHost: "Waiting for the host to start the next round.",
            getReadyTitle: "Get ready",
            getReadyBody: "Loading the first question...",
            introHint: "Read the question. Answers are about to appear.",
            introHintMainScreen: "Look at the main screen. Answers unlock soon.",
            introUnlocking: "Answers unlock in",
            questionPrompt: "Pick your answer before the timer runs out.",
            questionHiddenBody: "The question is on the main screen.",
            optionHiddenBody: "Match this answer on the main screen.",
            multiPrompt: "Choose up to {max} answers.",
            submitAnswer: "Submit answer",
            answerSending: "Locking in your answer...",
            answerLocked: "Answer locked in",
            answerTimeout: "Time is up. Waiting for the round to close.",
            waitingBody: "Hold tight while the rest of the class answers.",
            waitingProgress: "{answered} of {total} answered",
            resultCorrect: "Correct",
            resultIncorrect: "Incorrect",
            resultNoAnswer: "No answer submitted",
            resultEarned: "Earned",
            resultAnswered: "You answered",
            resultTotal: "Total score",
            resultNoRank: "No rank",
            scoreboardTitle: "Leaderboard",
            scoreboardSubtitle: "Updated totals after this round.",
            scoreboardTopFive: "Top 5 players",
            scoreboardMovementUp: "Moved up",
            scoreboardMovementNew: "New in top 5",
            scoreboardRank: "Rank",
            scoreboardScore: "Total",
            finalTitle: "Final results",
            finalBody: "The live exam is complete.",
            leaderboardTitle: "Top players",
            pointsSuffix: "pts"
        };
    </script>
    <script src="{% static 'js/live_avatar_catalog.js' %}"></script>
    <script src="{% static 'js/live_avatar_renderer.js' %}"></script>
    <script src="{% static 'js/player.js' %}?v=live-http-fallback-20260428"></script>
</body>
</html>

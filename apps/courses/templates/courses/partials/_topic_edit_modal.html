{% load i18n %}
{% load static %}

<!-- MODAL: Mövzu Redaktə Etmə -->
<link rel="stylesheet" href="{% static 'courses/css/topic_edit_modal.css' %}">

<div id="topicEditModalConfig" hidden
     data-i18n-topic-id-not-found="{% trans 'msg_topic_id_not_found' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-updating="{% trans 'msg_updating' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-topic-updated="{% trans 'msg_topic_updated' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-error-retry="{% trans 'msg_error_retry' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-error="{% trans 'msg_error' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-errors-header="{% trans 'msg_errors_header' context 'courses.partial.topic_edit_modal' %}"
     data-log-modal-not-found="{% trans '⚠️ topicEditModal və ya topicEditForm tapılmadı!' %}"
     data-log-modal-opened="{% trans '✓ Modal açıldı, data yazılır:' %}"
     data-log-edit-topic-called="{% trans '→ editTopic çağırıldı:' %}"
     data-log-error="{% trans 'Xəta:' %}"></div>

<div class="modal fade" id="topicEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="topicEditModalLabel">
                    <i class="fas fa-edit"></i> {% trans "title_edit_topic" context "courses.partial.topic_edit_modal" %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'aria_close' context 'courses.partial.topic_edit_modal' %}"></button>
            </div>
            
            <!-- Body -->
            <div class="modal-body">
                <form id="topicEditForm" method="post">
                    {% csrf_token %}
                    
                    <!-- Hidden Topic ID -->
                    <input type="hidden" id="editTopicId" name="topic_id">
                    
                    <!-- Title Field -->
                    <div class="mb-3">
                        <label for="editTopicTitle" class="form-label">
                            <strong>{% trans "field_topic_name" context "courses.partial.topic_edit_modal" %}</strong>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="editTopicTitle" 
                               name="title" required>
                    </div>
                    
                    <!-- Description Field -->
                    <div class="mb-3">
                        <label for="editTopicDescription" class="form-label">
                            <strong>{% trans "field_topic_description" context "courses.partial.topic_edit_modal" %}</strong>
                        </label>
                        <textarea class="form-control" id="editTopicDescription" 
                                  name="description" rows="3"></textarea>
                    </div>
                    
                    <!-- Error Messages Container -->
                    <div id="topicEditErrors" class="alert alert-danger d-none" role="alert"></div>
                    
                    <!-- Submit Button -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning flex-grow-1">
                            <i class="fas fa-save"></i> {% trans "action_save" context "courses.partial.topic_edit_modal" %}
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> {% trans "action_cancel" context "courses.partial.topic_edit_modal" %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'courses/js/topic_edit_modal.js' %}"></script>

{% load i18n %}
{% load static %}

<!-- MODAL: Mövzu Redaktə Etmə (görünüş: course_dialogs.css) -->
<div id="topicEditModalConfig" hidden
     data-i18n-topic-id-not-found="{% trans 'msg_topic_id_not_found' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-updating="{% trans 'msg_updating' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-topic-updated="{% trans 'msg_topic_updated' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-error-retry="{% trans 'msg_error_retry' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-error="{% trans 'msg_error' context 'courses.partial.topic_edit_modal' %}"
     data-i18n-errors-header="{% trans 'msg_errors_header' context 'courses.partial.topic_edit_modal' %}"
     data-log-modal-not-found="{% trans '⚠️ topicEditModal və ya topicEditForm tapılmadı!' %}"
     data-log-modal-opened="{% trans '✓ Modal açıldı, data yazılır:' %}"
     data-log-edit-topic-called="{% trans '→ editTopic çağırıldı:' %}"
     data-log-error="{% trans 'Xəta:' %}"></div>

<div class="modal fade ems-bsd" id="topicEditModal" tabindex="-1" aria-hidden="true" aria-labelledby="topicEditModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header ems-bsd__head">
                <span class="ems-bsd__ic ems-bsd__ic--edit" aria-hidden="true">{% include "courses/partials/_cd_icon.html" with icon="edit" size=20 %}</span>
                <div class="ems-bsd__tx">
                    <h5 class="modal-title" id="topicEditModalLabel">{% trans "title_edit_topic" context "courses.partial.topic_edit_modal" %}</h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'aria_close' context 'courses.partial.topic_edit_modal' %}"></button>
            </div>

            <form id="topicEditForm" method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" id="editTopicId" name="topic_id">
                <div class="ems-bsd__body ems-bsd__fields">
                    <div class="ems-field">
                        <label for="editTopicTitle" class="ems-field__label">{% trans "field_topic_name" context "courses.partial.topic_edit_modal" %} <span class="ems-field__req" aria-hidden="true">*</span></label>
                        <input type="text" class="ems-input" id="editTopicTitle" name="title" maxlength="255" required autocomplete="off">
                    </div>
                    <div class="ems-field">
                        <label for="editTopicDescription" class="ems-field__label">{% trans "field_topic_description" context "courses.partial.topic_edit_modal" %}</label>
                        <textarea class="ems-textarea" id="editTopicDescription" name="description" rows="3"></textarea>
                    </div>
                    <div id="topicEditErrors" class="ems-msg ems-msg--error ems-bsd__errors d-none" role="alert"></div>
                </div>
                <div class="modal-footer ems-bsd__foot">
                    <button type="button" class="ems-btn" data-bs-dismiss="modal">{% trans "action_cancel" context "courses.partial.topic_edit_modal" %}</button>
                    <button type="submit" class="ems-btn ems-btn--primary">
                        <i class="fas fa-save" aria-hidden="true"></i> {% trans "action_save" context "courses.partial.topic_edit_modal" %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'courses/js/topic_edit_modal.js' %}" defer></script>

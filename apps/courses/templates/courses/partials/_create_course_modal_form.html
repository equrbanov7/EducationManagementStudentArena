{% load i18n %}
{% comment %}
  AJAX modal forması. Sahələr ortaq partial-dan gəlir (_course_form_fields.html).
  `.ems-cc` scope ilə dizayn stilləri modal daxilində də tətbiq olunur.
{% endcomment %}

<form id="createCourseModalForm"
      class="ems-cc"
      method="post"
      action="{% url 'courses:create_course' %}?modal=1"
      enctype="multipart/form-data"
      data-ems-course-form
      novalidate>
  {% csrf_token %}

  {% include "courses/partials/_course_form_fields.html" %}

  <div class="course-modal-actions">
    <button type="button" class="course-modal-cancel-btn js-close-create-course">
      {% trans "action_cancel" context "courses.partial.create_modal_form" %}
    </button>
    <button type="submit" class="course-modal-confirm-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      {% trans "action_create_course" context "courses.partial.create_modal_form" %}
    </button>
  </div>
</form>

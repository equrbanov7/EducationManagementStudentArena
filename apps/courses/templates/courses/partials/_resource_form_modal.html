<!-- MODAL: Resurs Əlavə Etmə (Updated with Topic Context) -->
<!-- courses/templates/courses/partials/_resource_form_modal.html -->

<div class="modal fade" id="resourceFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <!-- Header -->
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-file-upload"></i> Yeni Resurs Əlavə Et
                    <span id="resourceModalTopicName" class="text-white-50"></span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <!-- Body -->
            <div class="modal-body">
                <form id="resourceForm" method="post" action="{% url 'courses:add_resource' course.id %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- Resource Type Selection -->
                    <div class="mb-3">
                        <label class="form-label">
                            <strong>Resurs Tipi</strong>
                            <span class="text-danger">*</span>
                        </label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="resource_type" 
                                   id="typeFile" value="file" checked>
                            <label class="btn btn-outline-primary" for="typeFile">
                                <i class="fas fa-file-pdf"></i> Fayl
                            </label>
                            
                            <input type="radio" class="btn-check" name="resource_type" 
                                   id="typeLink" value="link">
                            <label class="btn btn-outline-primary" for="typeLink">
                                <i class="fas fa-link"></i> Link
                            </label>
                            
                            <input type="radio" class="btn-check" name="resource_type" 
                                   id="typeVideo" value="video">
                            <label class="btn btn-outline-primary" for="typeVideo">
                                <i class="fas fa-video"></i> Video
                            </label>
                            
                            <input type="radio" class="btn-check" name="resource_type" 
                                   id="typeDocument" value="document">
                            <label class="btn btn-outline-primary" for="typeDocument">
                                <i class="fas fa-file-alt"></i> Sənəd
                            </label>
                        </div>
                    </div>
                    
                    <!-- Title Field -->
                    <div class="mb-3">
                        <label for="resourceTitle" class="form-label">
                            <strong>Resurs Başlığı</strong>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="resourceTitle" 
                               name="title" placeholder="Məs: Mühazirə 1 - Giriş"
                               required>
                    </div>
                    
                    <!-- Topic Selection -->
                    <div class="mb-3">
                        <label for="resourceTopic" class="form-label">
                            <strong>Mövzu</strong>
                        </label>
                        <select class="form-select" id="resourceTopic" name="topic">
                            <option value="">Mövzu seçilməyib (kurs səviyyəsi)</option>
                            {% for topic in topics %}
                                <option value="{{ topic.id }}">{{ topic.order }}. {{ topic.title }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">
                            Opsional: Resursu konkret mövzuya bağlayın
                        </small>
                    </div>
                    
                    <!-- Description Field -->
                    <div class="mb-3">
                        <label for="resourceDescription" class="form-label">
                            <strong>Açıqlama</strong>
                        </label>
                        <textarea class="form-control" id="resourceDescription" 
                                  name="description" rows="2" 
                                  placeholder="Bu resurs haqqında qısa məlumat"></textarea>
                    </div>
                    
                    <!-- File Upload (conditional) -->
                    <div class="mb-3" id="fileUploadSection">
                        <label for="resourceFile" class="form-label">
                            <strong>Fayl</strong>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="file" class="form-control" id="resourceFile" name="file">
                        <small class="text-muted">
                            Dəstəklənən formatlar: PDF, ZIP, DOC, DOCX, PPT, PPTX, XLS, XLSX
                        </small>
                    </div>
                    
                    <!-- URL Input (conditional) -->
                    <div class="mb-3 d-none" id="urlInputSection">
                        <label for="resourceUrl" class="form-label">
                            <strong>URL Linki</strong>
                            <span class="text-danger">*</span>
                        </label>
                        <input type="url" class="form-control" id="resourceUrl" 
                               name="url" placeholder="https://example.com">
                        <small class="text-muted">
                            Xarici resurs linki (YouTube, Google Drive və s.)
                        </small>
                    </div>
                    
                    <!-- Error Messages Container -->
                    <div id="resourceErrors" class="alert alert-danger d-none" role="alert"></div>
                    
                    <!-- Submit Button -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1">
                            <i class="fas fa-save"></i> Resurs Əlavə Et
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> Ləğv Et
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// Toggle file/url sections based on resource type
document.querySelectorAll('input[name="resource_type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        const fileSection = document.getElementById('fileUploadSection');
        const urlSection = document.getElementById('urlInputSection');
        const fileInput = document.getElementById('resourceFile');
        const urlInput = document.getElementById('resourceUrl');
        
        if (this.value === 'file' || this.value === 'document' || this.value === 'video') {
            fileSection.classList.remove('d-none');
            urlSection.classList.add('d-none');
            fileInput.required = true;
            urlInput.required = false;
        } else {
            fileSection.classList.add('d-none');
            urlSection.classList.remove('d-none');
            fileInput.required = false;
            urlInput.required = true;
        }
    });
});

// Resource Form Submit
document.getElementById('resourceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const actionUrl = this.action;
    
    // Loading state
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Yüklənir...';
    
    fetch(actionUrl, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Close modal
            bootstrap.Modal.getInstance(document.getElementById('resourceFormModal')).hide();
            
            // Clear form
            document.getElementById('resourceForm').reset();
            document.getElementById('resourceModalTopicName').textContent = '';
            
            // Show success message
            notify(data.message, 'success');
            
            // Reload page
            setTimeout(() => {
                location.reload();
            }, 1000);
        } else {
            showFormErrors('resourceErrors', data.errors);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        notify('Xəta baş verdi. Lütfən yenidən cəhd edin.', 'error');
    })
    .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    });
});

// Clear modal on close
document.getElementById('resourceFormModal').addEventListener('hidden.bs.modal', function () {
    document.getElementById('resourceForm').reset();
    document.getElementById('resourceModalTopicName').textContent = '';
    document.getElementById('resourceErrors').classList.add('d-none');
});
</script>

{% extends "base.html" %}
{% load i18n %}

{% block title %}Create Question{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 840px;">
  <div class="mb-4">
    <h1 class="mb-2">Create Question</h1>
    <p class="text-muted mb-0">Yeni sual yaradın və kimlərin görə biləcəyini seçin.</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Question</button>
          <a href="{% url 'my_questions' %}" class="btn btn-outline-secondary">My Questions</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

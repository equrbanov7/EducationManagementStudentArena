{% if request.user.is_teacher %}

<!-- ADD ASSIGNMENT MODAL -->
<div class="modal fade" id="addAssignmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Yeni Sərbəst İş</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="createAssignmentForm">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Başlıq <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="active">Aktiv</option>
                                <option value="inactive">Deaktiv</option>
                                <option value="archived">Arxivləndi</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Təsvir</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Başlanğıc <span class="text-danger">*</span></label>
                            <input type="datetime-local" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Son tarix <span class="text-danger">*</span></label>
                            <input type="datetime-local" name="deadline" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Maks. cəhd</label>
                            <input type="number" name="max_attempts" class="form-control" value="3" min="1">
                        </div>
                    </div>
                    
                    <hr>
                    
                    <!-- QRUPLAR VƏ TƏLƏBƏLƏR - YAN YANA -->
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">İcazəli Qruplar</label>
                            <input type="text" class="form-control mb-2" id="addAsnGroupSearch" placeholder="Qrup axtar...">
                            <div id="addAsnGroupList" class="border rounded" style="max-height:250px;overflow-y:auto;"></div>
                            <small class="text-muted">Seçilib: <span id="addAsnGroupCount">0</span></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">İcazəli Tələbələr</label>
                            <input type="text" class="form-control mb-2" id="addAsnStudentSearch" placeholder="Tələbə axtar...">
                            <div id="addAsnStudentList" class="border rounded" style="max-height:250px;overflow-y:auto;">
                                <p class="text-muted text-center py-3">Əvvəlcə qrup seçin</p>
                            </div>
                            <small class="text-muted">Seçilib: <span id="addAsnStudentCount">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bağla</button>
                    <button type="submit" class="btn btn-warning"><i class="bi bi-check"></i> Əlavə Et</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- EDIT ASSIGNMENT MODAL -->
<div class="modal fade" id="editAssignmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-pencil"></i> Redaktə Et</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editAssignmentForm">
                {% csrf_token %}
                <input type="hidden" id="editAsnId" name="assignment_id">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Başlıq <span class="text-danger">*</span></label>
                            <input type="text" id="editAsnTitle" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select id="editAsnStatus" name="status" class="form-select">
                                <option value="active">Aktiv</option>
                                <option value="inactive">Deaktiv</option>
                                <option value="archived">Arxivləndi</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Təsvir</label>
                        <textarea id="editAsnDescription" name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Başlanğıc <span class="text-danger">*</span></label>
                            <input type="datetime-local" id="editAsnStartDate" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Son tarix <span class="text-danger">*</span></label>
                            <input type="datetime-local" id="editAsnDeadline" name="deadline" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Maks. cəhd</label>
                            <input type="number" id="editAsnMaxAttempts" name="max_attempts" class="form-control" min="1">
                        </div>
                    </div>
                    
                    <hr>
                    
                    <!-- QRUPLAR VƏ TƏLƏBƏLƏR - YAN YANA -->
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">İcazəli Qruplar</label>
                            <input type="text" class="form-control mb-2" id="editAsnGroupSearch" placeholder="Qrup axtar...">
                            <div id="editAsnGroupList" class="border rounded" style="max-height:250px;overflow-y:auto;"></div>
                            <small class="text-muted">Seçilib: <span id="editAsnGroupCount">0</span></small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">İcazəli Tələbələr</label>
                            <input type="text" class="form-control mb-2" id="editAsnStudentSearch" placeholder="Tələbə axtar...">
                            <div id="editAsnStudentList" class="border rounded" style="max-height:250px;overflow-y:auto;">
                                <p class="text-muted text-center py-3">Əvvəlcə qrup seçin</p>
                            </div>
                            <small class="text-muted">Seçilib: <span id="editAsnStudentCount">0</span></small>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Bağla</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Yadda Saxla</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endif %}

<style>
.asn-chk-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}
.asn-chk-row:hover{background:#f5f9ff}
.asn-chk-row:last-child{border-bottom:none}
.asn-chk-row input{width:18px;height:18px;margin-right:10px;flex-shrink:0}
.asn-chk-row label{margin:0;flex:1;cursor:pointer;font-weight:500}
.asn-chk-row .badge{margin-left:auto;flex-shrink:0}
</style>

<script>
(function(){
    if(window._ASN_MODAL_V2) return;
    window._ASN_MODAL_V2 = true;

    const COURSE_ID = {{ course.id }};
    const CSRF = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
    const $ = id => document.getElementById(id);

    // STATE
    let editSavedStudentIds = new Set();

    // HELPERS
    const esc = s => s ? String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'})[c]) : '';
    
    const toLocal = dt => {
        if(!dt) return '';
        const d = new Date(dt);
        if(isNaN(d)) return '';
        const p = n => String(n).padStart(2,'0');
        return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    const updateCount = mode => {
        const gc = document.querySelectorAll(`#${mode}AsnGroupList input:checked`).length;
        const sc = document.querySelectorAll(`#${mode}AsnStudentList input:checked`).length;
        if($(mode+'AsnGroupCount')) $(mode+'AsnGroupCount').textContent = gc;
        if($(mode+'AsnStudentCount')) $(mode+'AsnStudentCount').textContent = sc;
    };

    // ═══════════════════════════════════════════════════════════
    // LOAD GROUPS
    // ═══════════════════════════════════════════════════════════
    
    function loadGroups(mode, checkedGroups = []) {
        const container = $(mode + 'AsnGroupList');
        container.innerHTML = '<p class="text-muted text-center py-3">Yüklənir...</p>';

        fetch(`/assignments/search-groups/?course_id=${COURSE_ID}`)
            .then(r => r.json())
            .then(data => {
                const groups = data.results || [];
                if(!groups.length) {
                    container.innerHTML = '<p class="text-muted text-center py-3">Qrup yoxdur</p>';
                    return;
                }

                container.innerHTML = groups.map(g => `
                    <div class="asn-chk-row">
                        <input type="checkbox" id="${mode}AsnG${g.id}" name="group_names[]" value="${esc(g.text)}" 
                               data-group="${esc(g.text)}" ${checkedGroups.includes(g.text)?'checked':''}>
                        <label for="${mode}AsnG${g.id}">${esc(g.text)}</label>
                    </div>
                `).join('');

                container.querySelectorAll('input').forEach(cb => {
                    cb.addEventListener('change', () => {
                        updateCount(mode);
                        loadStudents(mode);
                    });
                });

                updateCount(mode);
                if(checkedGroups.length) loadStudents(mode);
            })
            .catch(() => {
                container.innerHTML = '<p class="text-danger text-center py-3">Xəta</p>';
            });
    }

    // ═══════════════════════════════════════════════════════════
    // LOAD STUDENTS
    // ═══════════════════════════════════════════════════════════
    
    function loadStudents(mode) {
        const container = $(mode + 'AsnStudentList');
        
        const groups = Array.from(document.querySelectorAll(`#${mode}AsnGroupList input:checked`))
                           .map(cb => cb.dataset.group);

        if(!groups.length) {
            container.innerHTML = '<p class="text-muted text-center py-3">Əvvəlcə qrup seçin</p>';
            updateCount(mode);
            return;
        }

        container.innerHTML = '<p class="text-muted text-center py-3">Yüklənir...</p>';

        fetch(`/assignments/students-by-groups/?course_id=${COURSE_ID}&groups=${encodeURIComponent(groups.join(','))}`)
            .then(r => r.json())
            .then(data => {
                const students = data.students || [];
                if(!students.length) {
                    container.innerHTML = '<p class="text-muted text-center py-3">Tələbə yoxdur</p>';
                    updateCount(mode);
                    return;
                }

                container.innerHTML = students.map(s => {
                    let isChecked = '';
                    if(mode === 'edit' && editSavedStudentIds.has(s.id)) {
                        isChecked = 'checked';
                    }
                    
                    return `
                        <div class="asn-chk-row">
                            <input type="checkbox" id="${mode}AsnS${s.id}" name="students[]" value="${s.id}" ${isChecked}>
                            <label for="${mode}AsnS${s.id}">${esc(s.name)}</label>
                            <span class="badge bg-secondary">${esc(s.group_name)}</span>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('input').forEach(cb => {
                    cb.addEventListener('change', () => updateCount(mode));
                });

                updateCount(mode);
            })
            .catch(() => {
                container.innerHTML = '<p class="text-danger text-center py-3">Xəta</p>';
            });
    }

    // ═══════════════════════════════════════════════════════════
    // SEARCH
    // ═══════════════════════════════════════════════════════════
    
    ['add','edit'].forEach(mode => {
        $(mode+'AsnGroupSearch')?.addEventListener('input', e => {
            const t = e.target.value.toLowerCase();
            document.querySelectorAll(`#${mode}AsnGroupList .asn-chk-row`).forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(t) ? '' : 'none';
            });
        });
        $(mode+'AsnStudentSearch')?.addEventListener('input', e => {
            const t = e.target.value.toLowerCase();
            document.querySelectorAll(`#${mode}AsnStudentList .asn-chk-row`).forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(t) ? '' : 'none';
            });
        });
    });

    // ═══════════════════════════════════════════════════════════
    // ADD MODAL
    // ═══════════════════════════════════════════════════════════
    
    $('addAssignmentModal')?.addEventListener('shown.bs.modal', () => {
        $('addAsnStudentList').innerHTML = '<p class="text-muted text-center py-3">Əvvəlcə qrup seçin</p>';
        loadGroups('add');
    });

    $('addAssignmentModal')?.addEventListener('hidden.bs.modal', () => {
        $('createAssignmentForm').reset();
    });

    $('createAssignmentForm')?.addEventListener('submit', e => {
        e.preventDefault();
        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        fetch(`/assignments/create/${COURSE_ID}/`, {
            method: 'POST',
            body: new FormData(e.target),
            headers: {'X-CSRFToken': CSRF, 'X-Requested-With': 'XMLHttpRequest'}
        })
        .then(r => r.json())
        .then(d => d.success ? location.reload() : alert('Xəta: ' + (d.error||'')))
        .catch(() => alert('Server xətası'))
        .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check"></i> Əlavə Et'; });
    });

    // ═══════════════════════════════════════════════════════════
    // EDIT MODAL
    // ═══════════════════════════════════════════════════════════
    
    document.addEventListener('click', e => {
        const btn = e.target.closest('.js-edit-assignment');
        if(!btn) return;
        e.preventDefault();

        const url = btn.dataset.url;
        
        editSavedStudentIds.clear();
        $('editAsnGroupList').innerHTML = '<p class="text-muted text-center py-3">Yüklənir...</p>';
        $('editAsnStudentList').innerHTML = '<p class="text-muted text-center py-3">Yüklənir...</p>';

        bootstrap.Modal.getOrCreateInstance($('editAssignmentModal')).show();

        fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}})
            .then(r => r.json())
            .then(res => {
                if(!res.success) return alert('Məlumat alınmadı');
                
                const d = res.data;
                
                $('editAsnId').value = d.id;
                $('editAsnTitle').value = d.title || '';
                $('editAsnDescription').value = d.description || '';
                $('editAsnStartDate').value = toLocal(d.start_date);
                $('editAsnDeadline').value = toLocal(d.deadline);
                $('editAsnMaxAttempts').value = d.max_attempts || 3;
                $('editAsnStatus').value = d.status || 'active';

                // Serverdən gələn tələbə ID-lərini saxla
                editSavedStudentIds = new Set(d.student_ids || []);
                
                loadGroups('edit', d.group_names || []);
            })
            .catch(() => alert('Xəta'));
    });

    $('editAssignmentForm')?.addEventListener('submit', e => {
        e.preventDefault();
        const assignmentId = $('editAsnId').value;
        if(!assignmentId) return;

        const btn = e.target.querySelector('[type=submit]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        fetch(`/assignments/${assignmentId}/edit/`, {
            method: 'POST',
            body: new FormData(e.target),
            headers: {'X-CSRFToken': CSRF, 'X-Requested-With': 'XMLHttpRequest'}
        })
        .then(r => r.json())
        .then(d => d.success ? location.reload() : alert('Xəta: ' + (d.error||'')))
        .catch(() => alert('Server xətası'))
        .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check"></i> Yadda Saxla'; });
    });

    // ═══════════════════════════════════════════════════════════
    // DELETE
    // ═══════════════════════════════════════════════════════════
    
    document.addEventListener('click', e => {
        const btn = e.target.closest('.js-delete-assignment');
        if(!btn) return;
        e.preventDefault();
        if(!confirm('Silmək istədiyinizə əminsiniz?')) return;

        fetch(btn.dataset.url, {
            method: 'POST',
            headers: {'X-CSRFToken': CSRF, 'X-Requested-With': 'XMLHttpRequest'}
        })
        .then(r => r.json())
        .then(d => d.success ? location.reload() : alert('Xəta'))
        .catch(() => alert('Server xətası'));
    });

})();
</script>

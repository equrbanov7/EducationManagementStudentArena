{% load i18n %}
{% load static %}
{% comment %}G4: review_submissions.html JS blokundan çıxarılıb; davranışsız extract → review_submissions.js.{% endcomment %}
<div id="reviewSubmissionsConfig" hidden
     data-selected-submission-id="{{ selected_submission_id }}"
     data-can-delete="{% if can_delete_submissions %}1{% else %}0{% endif %}"
     data-i18n-no-text="{% trans 'no_text' context 'assignment.review_submissions' %}"
     data-i18n-download="{% trans 'download' context 'assignment.review_submissions' %}"
     data-i18n-submitting="{% trans 'submitting' context 'assignment.review_submissions' %}"
     data-i18n-error-prefix="{% trans 'error_prefix' context 'assignment.review_submissions' %}"
     data-i18n-unknown-error="{% trans 'unknown_error' context 'assignment.review_submissions' %}"
     data-i18n-server-error="{% trans 'server_error' context 'assignment.review_submissions' %}"
     data-i18n-grade-submit="{% trans 'grade_submit' context 'assignment.review_submissions' %}"
     data-i18n-review-locked="{% trans 'Yoxlama bağlanıb. Bu cavab yalnız baxış üçündür.' %}"
     data-i18n-identity-window="{% trans 'Anonimlik pəncərəsi aktivdir. Tələbə adı 5 dəqiqə tamam olduqdan sonra görünəcək.' %}"
     data-i18n-recheck-window="{% trans 'Yenidən yoxlama pəncərəsi aktivdir. Bu müddətdə adı anonim qalır.' %}"
     data-i18n-review-now="{% trans 'Yoxla və yadda saxla' %}"
     data-i18n-review-again="{% trans 'Yenidən yoxla və yadda saxla' %}"
     data-i18n-confirm-title="{% trans 'Qiymətləndirməni təsdiqləyin' %}"
     data-i18n-confirm-message="{% trans 'Bu bal və rəyi saxlamaq istədiyinizə əminsiniz?' %}"></div>
<script src="{% static 'assignment/js/review_submissions.js' %}"></script>

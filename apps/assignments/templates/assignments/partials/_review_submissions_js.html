{% load i18n %}
{% comment %}G4 (2026-07-04): review_submissions.html JS blokundan çıxarılıb; davranışsız extract.{% endcomment %}
<script nonce="{{ request.csp_nonce }}">
const reviewI18n = {
    noText: "{% trans 'no_text' context 'assignment.review_submissions' %}",
    download: "{% trans 'download' context 'assignment.review_submissions' %}",
    submitting: "{% trans 'submitting' context 'assignment.review_submissions' %}",
    errorPrefix: "{% trans 'error_prefix' context 'assignment.review_submissions' %}",
    unknownError: "{% trans 'unknown_error' context 'assignment.review_submissions' %}",
    serverError: "{% trans 'server_error' context 'assignment.review_submissions' %}",
    gradeSubmit: "{% trans 'grade_submit' context 'assignment.review_submissions' %}",
    reviewLocked: "{% trans 'Yoxlama bağlanıb. Bu cavab yalnız baxış üçündür.' %}",
    identityWindow: "{% trans 'Anonimlik pəncərəsi aktivdir. Tələbə adı 5 dəqiqə tamam olduqdan sonra görünəcək.' %}",
    recheckWindow: "{% trans 'Yenidən yoxlama pəncərəsi aktivdir. Bu müddətdə adı anonim qalır.' %}",
    reviewNow: "{% trans 'Yoxla və yadda saxla' %}",
    reviewAgain: "{% trans 'Yenidən yoxla və yadda saxla' %}",
    confirmTitle: "{% trans 'Qiymətləndirməni təsdiqləyin' %}",
    confirmMessage: "{% trans 'Bu bal və rəyi saxlamaq istədiyinizə əminsiniz?' %}"
};

function parseIntegerGrade(rawValue) {
    const normalized = (rawValue || '').trim().replace(',', '.');
    if (!normalized) return null;
    const match = normalized.match(/^-?\d+/);
    if (!match) return null;
    const parsed = parseInt(match[0], 10);
    return Number.isNaN(parsed) ? null : parsed;
}

function normalizeGradeInput(input) {
    if (!input) return;
    const max = parseInt(input.getAttribute('max') || '0', 10);
    const parsed = parseIntegerGrade(input.value);
    if (parsed === null) {
        input.value = '';
        return;
    }
    let nextValue = parsed;
    if (nextValue < 0) nextValue = 0;
    if (!Number.isNaN(max) && max > 0 && nextValue > max) nextValue = max;
    input.value = String(nextValue);
}

function setupReviewCountdowns() {
    document.querySelectorAll('[data-review-countdown]').forEach(function (node) {
        let secondsLeft = parseInt(node.getAttribute('data-review-countdown'), 10);
        if (Number.isNaN(secondsLeft) || secondsLeft <= 0) {
            node.textContent = '00:00:00';
            return;
        }

        function render() {
            const hours = Math.floor(secondsLeft / 3600);
            const minutes = Math.floor((secondsLeft % 3600) / 60);
            const seconds = secondsLeft % 60;
            node.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        render();
        window.setInterval(function () {
            secondsLeft = Math.max(0, secondsLeft - 1);
            render();
        }, 1000);
    });
}

function openSubmission(button) {
    if (!button) return;

    const submissionId = button.dataset.id;
    const student = button.dataset.student;
    const content = button.dataset.content;
    const file = button.dataset.file;
    const filename = button.dataset.filename;
    const grade = button.dataset.grade;
    const feedback = button.dataset.feedback;
    const canEdit = button.dataset.canEdit === '1';
    const actionCode = button.dataset.actionCode;
    const countdownMode = button.dataset.countdownMode;

    const gradeInput = document.getElementById('grade-input');
    const feedbackInput = document.getElementById('feedback-input');
    const submitButton = document.getElementById('gradeSubmitButton');
    const reviewNote = document.getElementById('modal-review-note');

    document.getElementById('submission-id').value = submissionId;
    document.getElementById('modal-student').textContent = student;
    document.getElementById('modal-content').textContent = content || '(' + reviewI18n.noText + ')';
    gradeInput.value = grade || '';
    feedbackInput.value = feedback;
    normalizeGradeInput(gradeInput);
    gradeInput.disabled = !canEdit;
    feedbackInput.disabled = !canEdit;
    submitButton.classList.toggle('d-none', !canEdit);
    submitButton.innerHTML = '<i class="fa-solid fa-check-circle"></i> ' + (
        actionCode === 'recheck' ? reviewI18n.reviewAgain : reviewI18n.reviewNow
    );

    reviewNote.className = 'alert d-none';
    reviewNote.textContent = '';
    if (!canEdit) {
        reviewNote.className = 'alert alert-secondary';
        reviewNote.textContent = reviewI18n.reviewLocked;
    } else if (countdownMode === 'recheck') {
        reviewNote.className = 'alert alert-warning';
        reviewNote.textContent = reviewI18n.recheckWindow;
    } else if (countdownMode === 'identity') {
        reviewNote.className = 'alert alert-warning';
        reviewNote.textContent = reviewI18n.identityWindow;
    }

    if (file) {
        document.getElementById('modal-file-container').style.display = 'block';
        document.getElementById('modal-file-link').href = file;
        document.getElementById('modal-file-name').textContent = filename || reviewI18n.download;
    } else {
        document.getElementById('modal-file-container').style.display = 'none';
    }
}

document.querySelectorAll('.view-submission-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        openSubmission(this);
    });
});

const assignmentGradeInput = document.getElementById('grade-input');
if (assignmentGradeInput) {
    assignmentGradeInput.addEventListener('blur', function () {
        normalizeGradeInput(this);
    });
}

setupReviewCountdowns();

const selectedSubmissionId = "{{ selected_submission_id }}";
if (selectedSubmissionId) {
    const targetButton = document.querySelector('.view-submission-btn[data-id="' + selectedSubmissionId + '"]');
    if (targetButton) {
        openSubmission(targetButton);
        if (window.bootstrap && window.bootstrap.Modal) {
            const modal = window.bootstrap.Modal.getOrCreateInstance(document.getElementById('submissionModal'));
            modal.show();
        } else {
            targetButton.click();
        }
    }
}

function submitGradeForm() {
    const submissionId = document.getElementById('submission-id').value;
    const gradeForm = document.getElementById('gradeForm');
    if (!gradeForm) {
        return Promise.resolve(false);
    }
    normalizeGradeInput(document.getElementById('grade-input'));
    const formData = new FormData(gradeForm);
    const btn = document.getElementById('gradeSubmitButton');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> ' + reviewI18n.submitting;

    return fetch(`/assignments/submission/${submissionId}/grade/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: formData
    })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                location.reload();
                return true;
            } else {
                alert(reviewI18n.errorPrefix + ': ' + (data.error || reviewI18n.unknownError));
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> ' + reviewI18n.gradeSubmit;
                return false;
            }
        })
        .catch(err => {
            console.error(err);
            alert(reviewI18n.serverError);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> ' + reviewI18n.gradeSubmit;
            return false;
        });
}

document.getElementById('gradeForm')?.addEventListener('submit', function(e) {
    e.preventDefault();

    if (typeof window.openActionConfirmModal === 'function') {
        window.openActionConfirmModal({
            title: reviewI18n.confirmTitle,
            message: reviewI18n.confirmMessage,
            confirmLabel: document.getElementById('gradeSubmitButton')?.textContent.trim() || reviewI18n.gradeSubmit,
            confirmButtonClass: 'btn btn-success',
            onConfirm: submitGradeForm
        });
        return;
    }

    submitGradeForm();
});

{% if can_delete_submissions %}
window.initResultsBulkActions({
    checkboxSelector: '.js-assignment-submission-checkbox',
    selectedCountSelector: '#selectedAssignmentCount',
    selectAllSelector: '#selectAllAssignmentsBtn',
    clearSelector: '#clearAssignmentsBtn',
    deleteSelectedSelector: '#deleteSelectedAssignmentsBtn',
    singleDeleteSelector: '.js-single-delete-assignment-submission',
    deleteFormSelector: '#deleteAssignmentsForm',
    deleteInputsSelector: '#deleteAssignmentsInputs',
    confirmButtonSelector: '#confirmDeleteAssignmentsBtn',
    confirmModalSelector: '#deleteAssignmentsConfirmModal',
    inputName: 'submission_ids',
    singleDeleteDataAttribute: 'submissionId'
});
{% endif %}
</script>

{% load i18n %}
{# «Tapşırıq yoxlaması» — fənn qovluqlarına göndərilən işlər (müəllim). #}
{% if "subject-folder-review" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=subject-folder-review"
       data-section="subject-folder-review"
       data-title="{% trans 'Tapşırıq yoxlaması' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'subject-folder-review' %}active{% endif %}">
        <i class="fas fa-file-circle-check sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Tapşırıq yoxlaması" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

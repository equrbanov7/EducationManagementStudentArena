{% load i18n %}
{# «Fənn qovluqları» — müəllimin fənn qovluqları (apps.subject_folder). #}
{% if "subject-folders" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=subject-folders"
       data-section="subject-folders"
       data-title="{% trans 'Fənn qovluqları' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'subject-folders' %}active{% endif %}">
        <i class="fas fa-folder-tree sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Fənn qovluqları" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

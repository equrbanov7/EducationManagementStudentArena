{% load i18n %}
{# «Fənlərim» — tələbənin akademik fənn kabineti (universitet rejimi). #}
{% if "my-subjects" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=my-subjects"
       data-section="my-subjects"
       data-title="{% trans 'my_subjects' context 'profile.section' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'my-subjects' %}active{% endif %}">
        <i class="fas fa-book-open sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "my_subjects" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

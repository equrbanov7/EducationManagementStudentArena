{% load i18n %}
{# «Apellyasiyalarım» — `can_view_student_assignments` VƏ `can_view_my_appeals` (köhnə iç-içə şərt olduğu kimi). #}
{% if can_view_student_assignments and role_capabilities.can_view_my_appeals %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=my-appeals"
       data-section="my-appeals"
       data-title="{% trans 'Apellyasiyalarım' context 'appeals.template' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'my-appeals' %}active{% endif %}">
        <i class="fas fa-gavel sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Apellyasiyalarım" context "appeals.template" %}</span>
    </a>
</li>
{% endif %}

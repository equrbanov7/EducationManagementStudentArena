{% load i18n %}
{# «Akademik təqvim» — universitet rejimində aktiv təşkilat konteksti olan hər kəs. #}
{% if "academic-calendar" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=academic-calendar"
       data-section="academic-calendar"
       data-title="{% trans 'Akademik təqvim' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'academic-calendar' %}active{% endif %}">
        <i class="fas fa-calendar-days sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Akademik təqvim" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

{% load i18n %}
{# «Yoxlanılacaq» — müəllimin yoxlama növbəsi. #}
{% if 'pending-review' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=pending-review"
       data-section="pending-review"
       data-title="{% trans 'pending_review' context 'profile.section' %}"
       data-source-url="{% url 'accounts:pending_review' %}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'pending-review' %}active{% endif %}">
        <i class="fas fa-tasks sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "pending_review" context "profile.sidebar" %}</span>
        {% if pending_review_count > 0 %}
        <span class="sidebar-menu-badge sidebar-menu-badge--warning sidebar-menu-badge--pulse" data-badge-key="pending_review_count">{{ pending_review_count }}</span>
        {% endif %}
    </a>
</li>
{% endif %}

{% load i18n %}
{# «Dərs cədvəli» — yalnız-oxu həftə görünüşü (idarəetmə ayrıca `schedule-manage` bəndidir). #}
{% if "my-schedule" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=my-schedule"
       data-section="my-schedule"
       data-title="{% trans 'Dərs cədvəli' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'my-schedule' %}active{% endif %}">
        <i class="fas fa-calendar-week sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Dərs cədvəli" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

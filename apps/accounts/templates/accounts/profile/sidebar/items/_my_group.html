{% load i18n nav_icons %}
{# «Qrupum» — baş tələbənin öz akademik qrupu (rol auditi 2026-10-13 B10; qapı `rbac_my_group`). #}
{% if "my-group" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=my-group"
       data-section="my-group"
       data-title="{% trans 'Qrupum' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'my-group' %}active{% endif %}">
        {% nav_icon "users-round" "sidebar-menu-icon" %}
        <span class="sidebar-menu-text">{% trans "Qrupum" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

{% if "overall-academic" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=overall-academic"
       data-section="overall-academic"
       data-title="{% trans 'Ümumi tədris məlumatı' context 'profile.sidebar' %}"

        <span class="sidebar-menu-text">{% trans "Ümumi tədris məlumatı" context "profile.sidebar" %}</span>

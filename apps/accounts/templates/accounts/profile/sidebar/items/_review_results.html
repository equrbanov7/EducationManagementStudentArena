{% load i18n %}
{# «Dəyərləndirilmiş nəticələr». #}
{% if 'review-results' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=review-results"
       data-section="review-results"
       data-title="{% trans 'review_results' context 'profile.section' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'review-results' %}active{% endif %}">
        <i class="fas fa-table sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "review_results" context "profile.sidebar" %}</span>
        {% if evaluated_review_count > 0 %}
        <span class="sidebar-menu-badge" data-badge-key="evaluated_review_count">{{ evaluated_review_count }}</span>
        {% endif %}
    </a>
</li>
{% endif %}

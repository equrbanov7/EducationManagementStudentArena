{% load i18n %}
{# «Gözləmədə olan cavablar» — qapı `can_view_student_assignments`. #}
{% if can_view_student_assignments %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=pending-answers"
       data-section="pending-answers"
       data-title="{% trans 'section_title' context 'accounts.pending_answers' %}"
       data-source-url="{% url 'accounts:pending_answers' %}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'pending-answers' %}active{% endif %}">
        <i class="fas fa-hourglass-half sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "section_title" context "accounts.pending_answers" %}</span>
        {% if pending_answers_count > 0 %}<span class="sidebar-menu-badge sidebar-menu-badge--warning" data-badge-key="pending_answers_count">{{ pending_answers_count }}</span>{% endif %}
    </a>
</li>
{% endif %}

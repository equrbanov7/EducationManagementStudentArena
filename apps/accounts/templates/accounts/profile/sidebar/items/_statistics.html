{% load i18n %}
{# «Statistika» — tam səhifə naviqasiyası (`data-force-navigation`): qrafik skriptləri AJAX swap-da yenidən qurulmur. #}
{% if 'statistics' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=statistics"
       data-section="statistics"
       data-title="{% trans 'statistics' context 'profile.section' %}"
       data-force-navigation="true"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'statistics' %}active{% endif %}">
        <i class="fas fa-chart-bar sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "statistics" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

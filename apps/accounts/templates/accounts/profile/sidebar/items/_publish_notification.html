{% load i18n nav_icons %}
{# «Bildiriş göndər» — müəllim, imtahan mərkəzi, HR, org admin (bax rbac.py). #}
{% if 'publish-notification' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=publish-notification"
       data-section="publish-notification"
       data-title="{% trans 'title' context 'profile.publish_notification' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'publish-notification' %}active{% endif %}">
        {% nav_icon "send" "sidebar-menu-icon" %}
        <span class="sidebar-menu-text">{% trans "title" context "profile.publish_notification" %}</span>
    </a>
</li>
{% endif %}

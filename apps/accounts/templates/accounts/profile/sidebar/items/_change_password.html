{% load i18n nav_icons %}
{# «Şifrəni dəyiş» — «Tənzimləmələr» qrupu (sahib 2026-09-30; əvvəl header menyusunda idi). #}
{% if 'change-password' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=change-password"
       data-section="change-password"
       data-title="{% trans 'change_password' context 'profile.section' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'change-password' %}active{% endif %}">
        {% nav_icon "lock-keyhole" "sidebar-menu-icon" %}
        <span class="sidebar-menu-text">{% trans "change_password" context "profile.section" %}</span>
    </a>
</li>
{% endif %}

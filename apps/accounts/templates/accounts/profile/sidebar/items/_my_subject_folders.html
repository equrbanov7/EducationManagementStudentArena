{% load i18n %}
{# «Fənn qovluqlarım» — tələbənin fənn qovluqları: materiallar, sərbəst iş, ev tapşırığı. #}
{% if "my-subject-folders" in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=my-subject-folders"
       data-section="my-subject-folders"
       data-title="{% trans 'Fənn qovluqlarım' context 'profile.sidebar' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'my-subject-folders' %}active{% endif %}">
        <i class="fas fa-folder-open sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "Fənn qovluqlarım" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

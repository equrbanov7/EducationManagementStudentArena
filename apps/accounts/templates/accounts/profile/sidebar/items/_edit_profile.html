{% load i18n %}
{# «Profili redaktə et» — «Tənzimləmələr» qrupu (sahib 2026-09-30; əvvəl header menyusunda idi). #}
{% if 'edit-profile' in allowed_sections %}
<li class="sidebar-menu-item">
    <a href="{{ profile_base_url }}?section=edit-profile"
       data-section="edit-profile"
       data-title="{% trans 'edit_profile' context 'profile.section' %}"
       data-source-url="{{ profile_base_url }}"
       class="sidebar-menu-link js-profile-section-link {% if active_section == 'edit-profile' %}active{% endif %}">
        <i class="fas fa-user-pen sidebar-menu-icon" aria-hidden="true"></i>
        <span class="sidebar-menu-text">{% trans "edit_profile" context "profile.sidebar" %}</span>
    </a>
</li>
{% endif %}

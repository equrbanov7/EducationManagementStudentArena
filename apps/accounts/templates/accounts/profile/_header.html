{% load i18n %}
<div class="profile-header">
    <button type="button"
            class="profile-mobile-sidebar-trigger is-hidden"
            id="profileMobileSidebarTrigger"
            aria-controls="profileSidebar"
            aria-expanded="true"
            aria-label="{% trans 'toggle_open' context 'profile.sidebar' %}"
            title="{% trans 'toggle_open_or_close' context 'profile.sidebar' %}">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
    </button>
    <h1 class="profile-title" id="profileSectionTitle">{{ active_section_title }}</h1>

    {% if 'faq' in allowed_sections %}
    <a class="ems-btn ems-btn--sm" data-cabinet-section-help data-pattern="{% url 'accounts:faq_section_help' section='SECTIONKEY' %}" href="{% url 'accounts:faq_section_help' section=active_section|default:'dashboard' %}{% if active_section == 'system-settings' and request.GET.ss_group %}?ss_group={{ request.GET.ss_group|urlencode }}{% endif %}" {% if active_section == 'faq' %}hidden{% endif %}>{% translate "Bölmənin videosu" %}</a>
    {% endif %}

    {# "View as" seçim paneli — yalnız səlahiyyətli rollar üçün #}
    {% include "accounts/profile/_view_as_panel.html" %}
</div>

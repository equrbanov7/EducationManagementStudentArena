{% load static i18n %}
<section class="profile-section-panel profile-section--system-monitoring {% if active_section == 'system-monitoring' %}is-active{% endif %}"
         data-profile-section-panel="system-monitoring">
  <link rel="stylesheet"
        href="{% static 'accounts/css/profile/sections/system_monitoring.css' %}?v=20260716-3">

  <div class="smx" id="smx-root"
       data-api-base="/api/superadmin/monitoring/"
       data-csrf="{{ csrf_token }}">
    <div class="smx-head">
      <div>
        <h2 class="smx-title">
          <i class="fas fa-heartbeat"></i>
          {% trans "Sistem Monitorinqi" context "monitoring" %}
        </h2>
        <p class="smx-sub">
          {% trans "Server, infrastruktur, tətbiq və təhlükəsizlik — canlı vəziyyət" context "monitoring" %}
        </p>
      </div>
      <div class="smx-controls">
        <div class="bootstrap-single-select">
          <select id="smx-range" class="smx-select bootstrap-single-select__native js-bootstrap-single-select"
                  data-bootstrap-select
                  aria-label="{% trans 'Vaxt aralığı' context 'monitoring' %}">
            <option value="300">5 dəq</option>
            <option value="900">15 dəq</option>
            <option value="3600" selected>1 saat</option>
            <option value="21600">6 saat</option>
            <option value="86400">24 saat</option>
            <option value="604800">7 gün</option>
            <option value="2592000">30 gün</option>
          </select>
        </div>
        <button type="button" id="smx-refresh" class="smx-btn"
                title="{% trans 'Yenilə' context 'monitoring' %}">
          <i class="fas fa-rotate"></i>
        </button>
        <label class="smx-auto">
          <input type="checkbox" id="smx-auto" checked>
          {% trans "Avto" context "monitoring" %}
        </label>
        <span class="smx-updated" id="smx-updated">—</span>
      </div>
    </div>

    <div class="smx-tabs" role="tablist">
      <button class="smx-tab active" data-tab="overview">{% trans "İcmal" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="server">{% trans "Server" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="containers">{% trans "Konteynerlər" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="application">{% trans "Tətbiq" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="database">{% trans "Baza" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="redis-celery">Redis · Celery</button>
      <button class="smx-tab" data-tab="exams">{% trans "İmtahanlar" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="security-events">{% trans "Təhlükəsizlik" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="logs">{% trans "Loglar" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="alerts">{% trans "Alertlər" context "monitoring" %}</button>
      <button class="smx-tab" data-tab="incidents">{% trans "İnsidentlər" context "monitoring" %}</button>
    </div>

    <div id="smx-degraded" class="smx-degraded" hidden>
      <i class="fas fa-triangle-exclamation"></i>
      <span id="smx-degraded-text"></span>
    </div>
    <div id="smx-body" class="smx-body" aria-live="polite">
      <div class="smx-cards" aria-hidden="true">
        {% for i in "12345678" %}
        <div class="smx-card">
          <span class="skeleton skeleton-line skeleton-line--sm"></span>
          <span class="skeleton skeleton-line skeleton-line--lg" style="margin-top:8px"></span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <script defer src="{% static 'accounts/js/monitoring/system_monitoring_renderers.js' %}?v=20260716-3"
          nonce="{{ request.csp_nonce }}"></script>
  <script defer src="{% static 'accounts/js/monitoring/system_monitoring.js' %}?v=20260716-3"
          nonce="{{ request.csp_nonce }}"></script>
</section>

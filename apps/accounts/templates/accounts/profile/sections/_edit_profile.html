{% if 'edit-profile' in allowed_sections %}
<section class="profile-section-panel profile-section--edit-profile {% if active_section == 'edit-profile' %}is-active{% endif %}" data-profile-section-panel="edit-profile">
    <div class="section-card">
        <div class="section-title">
            <i class="fas fa-user-edit"></i>
            Profili Redaktə Et
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="profile_form" value="edit-profile">
            <input type="hidden" name="section" value="edit-profile">

            <div class="info-grid profile-form-grid">
                <div class="info-item">
                    <label class="info-label" for="first_name">Ad *</label>
                    <input type="text" class="form-control" id="first_name" name="first_name"
                           value="{{ user.first_name }}" required>
                </div>
                <div class="info-item">
                    <label class="info-label" for="last_name">Soyad *</label>
                    <input type="text" class="form-control" id="last_name" name="last_name"
                           value="{{ user.last_name }}" required>
                </div>
                <div class="info-item">
                    <label class="info-label" for="email">Email *</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ user.email }}" required>
                </div>
                <div class="info-item">
                    <label class="info-label" for="phone">Telefon</label>
                    <input type="tel" class="form-control" id="phone" name="phone"
                           value="{{ profile.phone|default:'' }}" placeholder="+994 XX XXX XX XX">
                </div>
                <div class="info-item">
                    <label class="info-label" for="location">Yer</label>
                    <input type="text" class="form-control" id="location" name="location"
                           value="{{ profile.location|default:'' }}" placeholder="Bakı, Azərbaycan">
                </div>
                <div class="info-item">
                    <label class="info-label" for="avatar">Avatar</label>
                    <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                </div>
                <div class="info-item">
                    <label class="info-label" for="student_university_name">Müəssisə adı</label>
                    <input type="text" class="form-control" id="student_university_name" name="student_university_name"
                           value="{{ profile.student_university_name|default:'' }}" placeholder="Universitet / Məktəb / Kurs mərkəzi">
                </div>
                <div class="info-item">
                    <label class="info-label" for="student_school_identifier">Məktəb nömrəsi / kodu</label>
                    <input type="text" class="form-control" id="student_school_identifier" name="student_school_identifier"
                           value="{{ profile.student_school_identifier|default:'' }}" placeholder="Məktəb kodu/nömrəsi">
                </div>
            </div>

            <div class="info-item profile-form-grid">
                <label class="info-label" for="bio">Haqqında</label>
                <textarea class="form-control" id="bio" name="bio" rows="4"
                          placeholder="Özünüz haqqında qısa məlumat...">{{ profile.bio|default:'' }}</textarea>
            </div>

            <div class="profile-form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Yadda Saxla
                </button>
                <a href="{{ profile_base_url }}?section=profile-info" class="btn btn-secondary js-profile-section-link"
                   data-section="profile-info" data-title="Profil Məlumatları">
                    <i class="fas fa-times"></i> Ləğv et
                </a>
            </div>
        </form>
    </div>
</section>
{% endif %}

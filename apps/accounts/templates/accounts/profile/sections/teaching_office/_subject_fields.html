{% load i18n %}
{% comment %}Fənn yaratma/redaktə sahələri — `_form_dialog.html` gövdəsi.
Saat bölgüsü (mühazirə/seminar/laboratoriya) BURADA YOXDUR: o, tədris planı
sətrindədir, çünki kredit ixtisasa görə dəyişir (Mərhələ 2).{% endcomment %}
<div class="tof-form">
    <div class="ems-field">
        <label class="ems-field__label" for="tof-sb-code">{% trans "Reyestr kodu" context "accounts.catalog" %} <span class="ems-field__req" aria-hidden="true">*</span></label>
        <input class="ems-input" type="text" id="tof-sb-code" name="code" maxlength="32" required>
    </div>
    <div class="ems-field">
        <label class="ems-field__label" for="tof-sb-ects">{% trans "Kredit (ECTS)" context "accounts.catalog" %}</label>
        <input class="ems-input" type="number" id="tof-sb-ects" name="ects" min="1" max="60" step="1">
    </div>
    <div class="ems-field tof-form__full">
        <label class="ems-field__label" for="tof-sb-name">{% trans "Fənnin adı" context "accounts.catalog" %} <span class="ems-field__req" aria-hidden="true">*</span></label>
        <input class="ems-input" type="text" id="tof-sb-name" name="name" maxlength="255" required>
    </div>
    <div class="ems-field">
        <label class="ems-field__label" for="tof-sb-kind">{% trans "Fənn növü" context "accounts.catalog" %} <span class="ems-field__req" aria-hidden="true">*</span></label>
        <div class="bootstrap-single-select bootstrap-single-select--ems">
            <select class="ems-select bootstrap-single-select__native" id="tof-sb-kind" name="kind" required data-bootstrap-select>
                {% for option in subject_catalog_section.kind_options %}
                    <option value="{{ option.value }}">{{ option.label }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="ems-field">
        <label class="ems-field__label" for="tof-sb-chair">{% trans "Sahibi kafedra" context "accounts.catalog" %}</label>
        <div class="bootstrap-single-select bootstrap-single-select--ems">
            <select class="ems-select bootstrap-single-select__native" id="tof-sb-chair" name="chair_unit"
                    data-bootstrap-select data-live-search="true"
                    data-live-search-placeholder="{% trans 'Kafedra adı ilə axtar…' context 'accounts.catalog' %}"
                    data-live-search-empty="{% trans 'Uyğun kafedra tapılmadı' context 'accounts.catalog' %}">
                <option value="">{% trans "Təyin edilməyib" context "accounts.catalog" %}</option>
                {% for option in subject_catalog_section.chair_options %}
                    <option value="{{ option.value }}">{{ option.label }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
</div>

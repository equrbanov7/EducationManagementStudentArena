{% load i18n %}
{# PR4 (2026-07-04): _notifications.html-in JS blokundan çıxarılıb; davranışsız extract. #}
<script nonce="{{ request.csp_nonce }}">
(function () {
    'use strict';

    var panelEl = document.querySelector('[data-profile-section-panel="notifications"]');
    var modalEl = document.getElementById('profileNotifModal');
    if (!modalEl) return;

    // ── Bulk action bar ──
    var bulkBar = document.getElementById('profileNotifBulkBar');
    var bulkDeleteBtn = document.getElementById('profileNotifBulkDeleteBtn');
    var selectAllCb = document.getElementById('profileNotifSelectAll');
    var bulkIdsContainer = document.getElementById('profileNotifBulkIds');
    var currentFilter = panelEl ? (panelEl.getAttribute('data-current-filter') || 'all') : 'all';

    function getNotificationCheckboxes() {
        return document.querySelectorAll('.profile-notif-checkbox');
    }

    function syncUnreadBadges(inAppUnreadCount, totalUnreadCount) {
        if (panelEl) {
            panelEl.setAttribute('data-in-app-unread-count', String(inAppUnreadCount));
            panelEl.setAttribute('data-total-unread-count', String(totalUnreadCount));
        }

        var panelBadge = document.querySelector('[data-profile-notif-unread-badge]');
        if (panelBadge) {
            if (inAppUnreadCount > 0) {
                panelBadge.textContent = String(inAppUnreadCount);
            } else {
                panelBadge.remove();
            }
        }

        var filterBadge = document.querySelector('[data-profile-notif-filter-badge]');
        if (filterBadge) {
            if (inAppUnreadCount > 0) {
                filterBadge.textContent = String(inAppUnreadCount);
            } else {
                filterBadge.remove();
            }
        }

        var sidebarBadge = document.querySelector('.sidebar-menu-link[data-section="notifications"] .sidebar-menu-badge');
        if (sidebarBadge) {
            if (totalUnreadCount > 0) {
                sidebarBadge.textContent = String(totalUnreadCount);
            } else {
                sidebarBadge.remove();
            }
        }
    }

    function markNotificationItemRead(body, item) {
        body.setAttribute('data-notif-is-read', '1');
        if (item) {
            item.classList.remove('profile-notif-item--unread');
            var badge = item.querySelector('.notif-new-badge');
            if (badge) badge.remove();
            var strong = item.querySelector('.profile-notif-title strong');
            if (strong) {
                var sp = document.createElement('span');
                sp.textContent = strong.textContent;
                strong.replaceWith(sp);
            }
            var mrForm = item.querySelector('form[action*="mark-read"]');
            if (mrForm) mrForm.remove();
        }

        var currentInAppUnread = panelEl ? parseInt(panelEl.getAttribute('data-in-app-unread-count') || '0', 10) : 0;
        var currentTotalUnread = panelEl ? parseInt(panelEl.getAttribute('data-total-unread-count') || '0', 10) : 0;
        syncUnreadBadges(
            Math.max(0, currentInAppUnread - 1),
            Math.max(0, currentTotalUnread - 1)
        );

        if (currentFilter === 'unread' && item) {
            item.remove();
            updateBulkState();
            if (!document.querySelector('.profile-notif-item')) {
                window.location.reload();
            }
        }
    }

    function updateBulkState() {
        var checkboxes = getNotificationCheckboxes();
        var checked = document.querySelectorAll('.profile-notif-checkbox:checked');
        if (bulkDeleteBtn) bulkDeleteBtn.disabled = checked.length === 0;
        if (bulkIdsContainer) {
            bulkIdsContainer.innerHTML = '';
            checked.forEach(function (cb) {
                var inp = document.createElement('input');
                inp.type = 'hidden';
                inp.name = 'ids[]';
                inp.value = cb.value;
                bulkIdsContainer.appendChild(inp);
            });
        }
        if (selectAllCb) {
            selectAllCb.checked = checked.length === checkboxes.length && checkboxes.length > 0;
            selectAllCb.indeterminate = checked.length > 0 && checked.length < checkboxes.length;
        }
    }

    if (bulkBar) {
        bulkBar.style.removeProperty('display');
        if (selectAllCb) {
            selectAllCb.addEventListener('change', function () {
                var checkboxes = getNotificationCheckboxes();
                checkboxes.forEach(function (cb) { cb.checked = selectAllCb.checked; });
                updateBulkState();
            });
        }
        getNotificationCheckboxes().forEach(function (cb) { cb.addEventListener('change', updateBulkState); });
    }

    // ── Modal: open notification detail via manual Bootstrap trigger ──
    document.querySelectorAll('.profile-notif-body.js-notif-open').forEach(function (body) {
        body.addEventListener('click', function () {
            function decodeEscapedAttribute(value) {
                if (!value) {
                    return '';
                }

                return value
                    .replace(/\\u([0-9a-fA-F]{4})/g, function (_match, code) {
                        return String.fromCharCode(parseInt(code, 16));
                    })
                    .replace(/\\n/g, '\n')
                    .replace(/\\r/g, '\r')
                    .replace(/\\t/g, '\t');
            }

            var title   = decodeEscapedAttribute(body.getAttribute('data-notif-title') || '');
            var message = decodeEscapedAttribute(body.getAttribute('data-notif-message') || '');
            var time    = decodeEscapedAttribute(body.getAttribute('data-notif-time') || '');
            var type    = decodeEscapedAttribute(body.getAttribute('data-notif-type') || '');
            var link    = decodeEscapedAttribute(body.getAttribute('data-notif-link') || '');
            var linkLabel = decodeEscapedAttribute(body.getAttribute('data-notif-link-label') || '');
            var image   = decodeEscapedAttribute(body.getAttribute('data-notif-image') || '');
            var isRead  = body.getAttribute('data-notif-is-read') === '1';
            var markUrl = body.getAttribute('data-mark-read-url') || '';

            // Populate modal content safely (textContent prevents XSS)
            document.getElementById('profileNotifModalTitle').textContent = title;
            document.getElementById('profileNotifModalMeta').textContent =
                (type ? type + ' — ' : '') + time;
            document.getElementById('profileNotifModalMessage').textContent = message || '';

            // Image
            var imgWrap = document.getElementById('profileNotifModalImage');
            var imgEl   = document.getElementById('profileNotifModalImageEl');
            if (image) {
                imgEl.src = image;
                imgWrap.style.display = '';
            } else {
                imgWrap.style.display = 'none';
                imgEl.src = '';
            }

            // Link (built with createElement for XSS safety)
            var linkEl = document.getElementById('profileNotifModalLink');
            while (linkEl.firstChild) { linkEl.removeChild(linkEl.firstChild); }
            if (link) {
                var a = document.createElement('a');
                a.href = link;
                a.className = 'btn btn-sm btn-outline-primary';
                if (link.charAt(0) !== '/') {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                }
                var icon = document.createElement('i');
                icon.className = 'fas fa-external-link-alt me-1';
                a.appendChild(icon);
                a.appendChild(document.createTextNode(linkLabel || '{% trans "go_to_link" context "profile.notifications" %}'));
                linkEl.appendChild(a);
            }

            // Show modal via Bootstrap API
            var bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
            bsModal.show();

            // Auto mark as read via AJAX after modal opens
            if (!isRead && markUrl) {
                var csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
                var csrf = (csrfInput && csrfInput.value) || (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
                fetch(markUrl, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrf, 'X-Requested-With': 'XMLHttpRequest' },
                }).then(function (resp) {
                    if (resp.ok) {
                        markNotificationItemRead(body, body.closest('.profile-notif-item'));
                    }
                }).catch(function () {});
            }
        });
    });

    // ── Delete confirmation modal (single + bulk) ──
    var deleteModalEl = document.getElementById('profileNotifDeleteConfirmModal');
    var deleteConfirmBtn = document.getElementById('profileNotifDeleteConfirmBtn');
    var deleteMessageEl = document.getElementById('profileNotifDeleteConfirmMessage');
    var pendingDeleteForm = null;
    var defaultDeleteMessage = deleteMessageEl ? deleteMessageEl.textContent : '';
    var bulkDeleteMessage = "{% filter escapejs %}{% trans 'Seçilmiş bütün bildirişləri silmək istədiyinizə əminsiniz? Bu əməliyyat geri qaytarıla bilməz.' %}{% endfilter %}" || defaultDeleteMessage;

    function showDeleteConfirm(form, isBulk) {
        if (!deleteModalEl || !form) { return; }
        pendingDeleteForm = form;
        if (deleteMessageEl) {
            deleteMessageEl.textContent = isBulk ? bulkDeleteMessage : defaultDeleteMessage;
        }
        var bsModal = bootstrap.Modal.getOrCreateInstance(deleteModalEl);
        bsModal.show();
    }

    // Tək notification silmə formları — bütün `.profile-notif-actions` daxilindəki delete form-lar.
    document.querySelectorAll('.profile-notif-actions form[action*="delete"]').forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (form.dataset.confirmed === '1') { return; }
            event.preventDefault();
            showDeleteConfirm(form, false);
        });
    });

    // Bulk delete form
    var bulkDeleteForm = document.getElementById('profileNotifBulkDeleteForm');
    if (bulkDeleteForm) {
        bulkDeleteForm.addEventListener('submit', function (event) {
            if (bulkDeleteForm.dataset.confirmed === '1') { return; }
            var checked = document.querySelectorAll('.profile-notif-checkbox:checked');
            if (!checked.length) {
                event.preventDefault();
                return;
            }
            event.preventDefault();
            showDeleteConfirm(bulkDeleteForm, true);
        });
    }

    if (deleteConfirmBtn) {
        deleteConfirmBtn.addEventListener('click', function () {
            if (!pendingDeleteForm) { return; }
            pendingDeleteForm.dataset.confirmed = '1';
            var bsModal = bootstrap.Modal.getOrCreateInstance(deleteModalEl);
            bsModal.hide();
            // Form-u yenidən submit et — bu dəfə guard keçər.
            if (typeof pendingDeleteForm.requestSubmit === 'function') {
                pendingDeleteForm.requestSubmit();
            } else {
                pendingDeleteForm.submit();
            }
            pendingDeleteForm = null;
        });
    }
})();
</script>

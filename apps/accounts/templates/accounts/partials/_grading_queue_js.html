{% load i18n %}
{% comment %}G4 (2026-07-04): grading_queue.html JS blokundan çıxarılıb; davranışsız extract.{% endcomment %}
<script nonce="{{ request.csp_nonce }}">
    const gradeQueueSuccessMessage = "{% trans 'toast_success' context 'accounts.grading_queue_page' %}";
    const gradeQueueGenericErrorMessage = "{% trans 'toast_error_generic' context 'accounts.grading_queue_page' %}";
    const gradeQueueErrorPrefix = "{% trans 'toast_error_prefix' context 'accounts.grading_queue_page' %}";

    function submitGrade(event, submissionId, goToNext) {
        event.preventDefault();
        
        const form = event.target.closest('form');
        const formData = new FormData(form);
        const row = form.closest('tr');
        const gradeUrl = form.getAttribute('action');
        
        // Show loading
        document.getElementById('loadingSpinner').classList.add('active');
        
        // AJAX submission
        fetch(gradeUrl, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value,
                'X-Requested-With': 'XMLHttpRequest',
            }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('loadingSpinner').classList.remove('active');
            
            if (data.success) {
                // Remove the row
                row.style.transition = 'opacity 0.3s';
                row.style.opacity = '0';
                setTimeout(() => row.remove(), 300);
                
                // Update stats
                updateStats();
                
                // Show success message
                showMessage('success', gradeQueueSuccessMessage);
                
                if (goToNext) {
                    // Scroll to next submission
                    const nextRow = row.nextElementSibling;
                    if (nextRow) {
                        nextRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        nextRow.querySelector('.grade-input').focus();
                    }
                }
            } else {
                showMessage('error', data.error || gradeQueueGenericErrorMessage);
            }
        })
        .catch(error => {
            document.getElementById('loadingSpinner').classList.remove('active');
            showMessage('error', gradeQueueErrorPrefix + ': ' + error.message);
        });
    }
    
    function updateStats() {
        // Reload page to update stats
        // In production, this should be an AJAX call
        setTimeout(() => location.reload(), 1000);
    }
    
    function showMessage(type, message) {
        // Create toast notification
        const toast = document.createElement('div');
        toast.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show`;

        const icon = document.createElement('i');
        icon.className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2`;

        const messageNode = document.createTextNode(message);

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'btn-close';
        closeBtn.setAttribute('data-bs-dismiss', 'alert');

        toast.appendChild(icon);
        toast.appendChild(messageNode);
        toast.appendChild(closeBtn);
        
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
    
    function viewSubmission(button) {
        const submissionId = button.dataset.submissionId;
        const contentTemplate = document.getElementById(`submission-content-${submissionId}`);
        const content = contentTemplate ? contentTemplate.textContent.trim() : '';

        document.getElementById('submissionPreviewTitle').textContent = button.dataset.assignment || '';
        document.getElementById('submissionPreviewStudent').textContent = button.dataset.student || '';
        document.getElementById('submissionPreviewContent').textContent = content;

        if (window.bootstrap && window.bootstrap.Modal) {
            const modal = window.bootstrap.Modal.getOrCreateInstance(document.getElementById('submissionPreviewModal'));
            modal.show();
        }
    }

    document.querySelectorAll('.js-view-submission').forEach((button) => {
        button.addEventListener('click', function(event) {
            event.preventDefault();
            viewSubmission(this);
        });
    });
    
    // Auto-submit on course selection change
    document.getElementById('course').addEventListener('change', function() {
        // Load assignments for selected course via AJAX
        // For now, just submit the form
        // document.getElementById('filterForm').submit();
    });
</script>

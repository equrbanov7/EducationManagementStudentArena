<script nonce="{{ request.csp_nonce }}">
    document.addEventListener("DOMContentLoaded", function () {
        // ── Görünüş keçidi (siyahı / şəbəkə) — localStorage-da yadda saxlanılır.
        const list = document.querySelector("[data-exam-list]");
        const results = document.querySelector("[data-exam-results]");
        const toggle = document.querySelector("[data-view-toggle]");
        const toolbarForm = document.querySelector(".exam-toolbar");
        const VIEW_KEY = "ems-exam-view-v2";
        let submitAfterLoading = false;

        function showExamLoading() {
            if (results) {
                results.classList.add("is-loading");
            }
        }

        function navigateWithLoading(url) {
            showExamLoading();
            window.requestAnimationFrame(function () {
                window.location.href = url;
            });
        }

        function applyView(view) {
            if (list) {
                list.classList.toggle("grid", view === "grid");
            }
            if (toggle) {
                toggle.querySelectorAll("button[data-view]").forEach(function (btn) {
                    btn.classList.toggle("on", btn.dataset.view === view);
                });
            }
        }

        let savedView = "grid";
        try { savedView = localStorage.getItem(VIEW_KEY) || "grid"; } catch (e) {}
        applyView(savedView === "grid" ? "grid" : "list");

        if (toggle) {
            toggle.addEventListener("click", function (event) {
                const btn = event.target.closest("button[data-view]");
                if (!btn) { return; }
                applyView(btn.dataset.view);
                try { localStorage.setItem(VIEW_KEY, btn.dataset.view); } catch (e) {}
            });
        }

        document.querySelectorAll("[data-exam-filter-link]").forEach(function (link) {
            link.addEventListener("click", function (event) {
                if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                    return;
                }
                event.preventDefault();
                navigateWithLoading(link.href);
            });
        });

        if (toolbarForm) {
            toolbarForm.addEventListener("submit", function (event) {
                if (submitAfterLoading) {
                    return;
                }
                event.preventDefault();
                showExamLoading();
                submitAfterLoading = true;
                window.requestAnimationFrame(function () {
                    toolbarForm.submit();
                });
            });
        }

        window.addEventListener("pageshow", function () {
            if (results) {
                results.classList.remove("is-loading");
            }
            submitAfterLoading = false;
        });

        // ── Sıralama dəyişəndə formanı avtomatik göndər (səhifə nömrəsini sıfırlamaqla).
        const sortSelect = document.querySelector("[data-ex-sort]");
        if (sortSelect && sortSelect.form) {
            sortSelect.addEventListener("change", function () {
                showExamLoading();
                if (sortSelect.form.requestSubmit) {
                    sortSelect.form.requestSubmit();
                } else {
                    sortSelect.form.submit();
                }
            });
        }
    });
</script>

{% load i18n %}
<script nonce="{{ request.csp_nonce }}">
{% trans "action_delete" context "exams.template.create_question_bank" as qbank_action_delete %}
{% trans "label_block_name" context "exams.template.create_question_bank" as qbank_label_block_name %}
{% trans "label_block_time_minutes" context "exams.template.create_question_bank" as qbank_label_block_time_minutes %}
{% trans "placeholder_unlimited" context "exams.template.create_question_bank" as qbank_placeholder_unlimited %}
{% trans "label_questions_copy_paste" context "exams.template.create_question_bank" as qbank_label_questions_copy_paste %}
{% trans "placeholder_question_text" context "exams.template.create_question_bank" as qbank_placeholder_question_text %}
{% trans "help_question_formats" context "exams.template.create_question_bank" as qbank_help_question_formats %}
{% trans "label_block_enable_paint" context "exams.template.create_question_bank" as qbank_label_block_enable_paint %}
{% trans "help_block_enable_paint" context "exams.template.create_question_bank" as qbank_help_block_enable_paint %}
{% trans "alert_duplicate_block_name" context "exams.template.create_question_bank" as qbank_alert_duplicate_block_name %}
{% trans "block_default" context "exams.template.create_question_bank" as qbank_block_default %}
{% trans "AI ilə bu blok üçün sual yarat" context "exams.template.ai_question_bank" as ai_qbank_block_title %}
{% trans "Mühazirə faylı və ya prompt əsasında suallar hazırlanacaq və bu blokun mətn sahəsinə əlavə olunacaq." context "exams.template.ai_question_bank" as ai_qbank_block_desc %}
{% trans "Prompt / mövzu" context "exams.template.ai_question_bank" as ai_qbank_prompt_topic %}
{% trans "Məsələn: {block_name} üçün 5 yazılı sual yarat" context "exams.template.ai_question_bank" as ai_qbank_dynamic_placeholder %}
{% trans "Mühazirə faylı" context "exams.template.ai_question_bank" as ai_qbank_lecture_file %}
{% trans "Fayl seç" context "exams.template.ai_question_bank" as ai_qbank_choose_file %}
{% trans "Fayl seçilməyib" context "exams.template.ai_question_bank" as ai_qbank_no_file_selected %}
{% trans "Sual sayı" context "exams.template.ai_question_bank" as ai_qbank_question_count %}
{% trans "Çətinlik" context "exams.template.ai_question_bank" as ai_qbank_difficulty %}
{% trans "Orta" context "exams.template.ai_question_bank" as ai_qbank_medium %}
{% trans "Asan" context "exams.template.ai_question_bank" as ai_qbank_easy %}
{% trans "Çətin" context "exams.template.ai_question_bank" as ai_qbank_hard %}
{% trans "Qarışıq" context "exams.template.ai_question_bank" as ai_qbank_mixed %}
{% trans "Mətnin sonuna əlavə et" context "exams.template.ai_question_bank" as ai_qbank_append_mode %}
{% trans "Mətn sahəsini əvəz et" context "exams.template.ai_question_bank" as ai_qbank_replace_mode %}
{% trans "AI mətn yerləşdirmə rejimi" context "exams.template.ai_question_bank" as ai_qbank_insert_mode_label %}
{% trans "AI ilə yarat" context "exams.template.ai_question_bank" as ai_qbank_generate %}
{% trans "Yaradılır..." context "exams.template.ai_question_bank" as ai_i18n_generating %}
{% trans "AI endpoint tapılmadı." context "exams.template.ai_question_bank" as ai_i18n_endpoint_missing %}
{% trans "Prompt yazın və ya fayl yükləyin." context "exams.template.ai_question_bank" as ai_i18n_empty_input %}
{% trans "Gemini 2.5 Pro sualları hazırlayır..." context "exams.template.ai_question_bank" as ai_i18n_loading %}
{% trans "AI sual yaratma alınmadı." context "exams.template.ai_question_bank" as ai_i18n_generate_failed %}
{% trans "Qalan sorğu" context "exams.template.ai_question_bank" as ai_i18n_remaining_requests %}
{% trans "{count} sual hazırdır. Önizləmə ilə yoxlayın." context "exams.template.ai_question_bank" as ai_i18n_ready_template %}
{% trans "Mətn sahəsi tapılmadı." context "exams.template.ai_question_bank" as ai_i18n_target_missing %}
{% trans "AI boş cavab qaytardı." context "exams.template.ai_question_bank" as ai_i18n_empty_response %}
const I18N_QBANK = {
    actionDelete: "{{ qbank_action_delete|escapejs }}",
    labelBlockName: "{{ qbank_label_block_name|escapejs }}",
    labelBlockTimeMinutes: "{{ qbank_label_block_time_minutes|escapejs }}",
    placeholderUnlimited: "{{ qbank_placeholder_unlimited|escapejs }}",
    labelBlockEnablePaint: "{{ qbank_label_block_enable_paint|escapejs }}",
    helpBlockEnablePaint: "{{ qbank_help_block_enable_paint|escapejs }}",
    labelQuestionsCopyPaste: "{{ qbank_label_questions_copy_paste|escapejs }}",
    placeholderQuestionText: "{{ qbank_placeholder_question_text|escapejs }}",
    helpQuestionFormats: "{{ qbank_help_question_formats|escapejs }}",
    alertDuplicateBlockName: "{{ qbank_alert_duplicate_block_name|escapejs }}",
    blockDefault: "{{ qbank_block_default|escapejs }}",
    aiBlockTitle: "{{ ai_qbank_block_title|escapejs }}",
    aiBlockDesc: "{{ ai_qbank_block_desc|escapejs }}",
    aiPromptTopic: "{{ ai_qbank_prompt_topic|escapejs }}",
    aiDynamicPlaceholder: "{{ ai_qbank_dynamic_placeholder|escapejs }}",
    aiLectureFile: "{{ ai_qbank_lecture_file|escapejs }}",
    aiChooseFile: "{{ ai_qbank_choose_file|escapejs }}",
    aiNoFileSelected: "{{ ai_qbank_no_file_selected|escapejs }}",
    aiQuestionCount: "{{ ai_qbank_question_count|escapejs }}",
    aiDifficulty: "{{ ai_qbank_difficulty|escapejs }}",
    aiMedium: "{{ ai_qbank_medium|escapejs }}",
    aiEasy: "{{ ai_qbank_easy|escapejs }}",
    aiHard: "{{ ai_qbank_hard|escapejs }}",
    aiMixed: "{{ ai_qbank_mixed|escapejs }}",
    aiAppendMode: "{{ ai_qbank_append_mode|escapejs }}",
    aiReplaceMode: "{{ ai_qbank_replace_mode|escapejs }}",
    aiInsertModeLabel: "{{ ai_qbank_insert_mode_label|escapejs }}",
    aiGenerate: "{{ ai_qbank_generate|escapejs }}"
};
window.AI_QUESTION_BANK_I18N = {
    generating: "{{ ai_i18n_generating|escapejs }}",
    endpointMissing: "{{ ai_i18n_endpoint_missing|escapejs }}",
    emptyInput: "{{ ai_i18n_empty_input|escapejs }}",
    loading: "{{ ai_i18n_loading|escapejs }}",
    generateFailed: "{{ ai_i18n_generate_failed|escapejs }}",
    remainingRequests: "{{ ai_i18n_remaining_requests|escapejs }}",
    readyTemplate: "{{ ai_i18n_ready_template|escapejs }}",
    targetMissing: "{{ ai_i18n_target_missing|escapejs }}",
    emptyResponse: "{{ ai_i18n_empty_response|escapejs }}",
    noFileSelected: "{{ ai_qbank_no_file_selected|escapejs }}"
};
const QBANK_DEFAULT_BLOCK_PAINT_ENABLED = {% if exam.enable_paint %}true{% else %}false{% endif %};
const QBANK_SHOW_BLOCK_PAINT = {% if exam.exam_type == "written" %}true{% else %}false{% endif %};

let blockToDelete = null;
let blockCounter = {{ blocks_data|length|default:1 }};
if (blockCounter === 0) blockCounter = 1;

function escapeHtml(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function renderAiBlockPanel(uniqueID, defaultTitle) {
    const fileInputId = `writtenAiSourceFile${uniqueID}`;
    const promptPlaceholder = escapeHtml(
        I18N_QBANK.aiDynamicPlaceholder.replace("{block_name}", defaultTitle)
    );

    return `
        <div class="ai-block-panel"
             data-ai-question-form
             data-ai-context="written"
             data-ai-url="{% url 'exams:ai_generate_question_bank' exam.slug %}"
             data-extract-url="{% url 'exams:start_text_extraction' %}">
            <div class="ai-block-panel__head">
                <span class="ai-block-panel__icon"><i class="fas fa-robot"></i></span>
                <div>
                    <h6>${I18N_QBANK.aiBlockTitle}</h6>
                    <p>${I18N_QBANK.aiBlockDesc}</p>
                </div>
            </div>
            <div class="ai-block-grid">
                <label class="ai-block-field ai-block-field--wide">
                    <span>${I18N_QBANK.aiPromptTopic}</span>
                    <textarea name="prompt" rows="2" placeholder="${promptPlaceholder}"></textarea>
                </label>
                <label class="ai-block-field ai-file-field" for="${fileInputId}">
                    <span>${I18N_QBANK.aiLectureFile}</span>
                    <input id="${fileInputId}" class="ai-file-input" data-ai-file-input type="file" name="source_file" accept=".pdf,.txt,.png,.jpg,.jpeg">
                    <span class="ai-file-picker">
                        <i class="fas fa-upload"></i>
                        <strong>${I18N_QBANK.aiChooseFile}</strong>
                    </span>
                    <small class="ai-file-name" data-ai-file-name-for="${fileInputId}">${I18N_QBANK.aiNoFileSelected}</small>
                </label>
                <label class="ai-block-field">
                    <span>${I18N_QBANK.aiQuestionCount}</span>
                    <input type="number" name="question_count" min="1" max="50" value="5">
                </label>
                <label class="ai-block-field">
                    <span>${I18N_QBANK.aiDifficulty}</span>
                    <div class="bootstrap-single-select ai-difficulty-select">
                        <select name="difficulty" class="form-select bootstrap-single-select__native" data-bootstrap-select>
                            <option value="medium" selected>${I18N_QBANK.aiMedium}</option>
                            <option value="easy">${I18N_QBANK.aiEasy}</option>
                            <option value="hard">${I18N_QBANK.aiHard}</option>
                            <option value="mixed">${I18N_QBANK.aiMixed}</option>
                        </select>
                    </div>
                </label>
                <div class="ai-block-actions">
                    <div class="ai-insert-toggle" aria-label="${I18N_QBANK.aiInsertModeLabel}">
                        <label>
                            <input type="radio" name="ai_insert_mode_${uniqueID}" data-ai-insert-mode value="append" checked>
                            <span>${I18N_QBANK.aiAppendMode}</span>
                        </label>
                        <label>
                            <input type="radio" name="ai_insert_mode_${uniqueID}" data-ai-insert-mode value="replace">
                            <span>${I18N_QBANK.aiReplaceMode}</span>
                        </label>
                    </div>
                    <button type="button" class="ai-generate-btn" data-ai-question-submit>
                        <i class="fas fa-magic"></i> ${I18N_QBANK.aiGenerate}
                    </button>
                    <span class="ai-question-status" data-ai-question-status role="status" aria-live="polite"></span>
                </div>
            </div>
        </div>
    `;
}

document.addEventListener('DOMContentLoaded', function() {
    const wrapper = document.getElementById('blocks-wrapper');
    const addBtn = document.getElementById('add-new-block-btn');

    function updateBlockTitle(block) {
        if (!block) return;

        const input = block.querySelector('.block-name-input');
        const title = block.querySelector('.block-title-text');
        if (!input || !title) return;

        const fallbackTitle = block.getAttribute('data-default-title') || I18N_QBANK.blockDefault;
        title.textContent = input.value.trim() || fallbackTitle;
    }

    addBtn.addEventListener('click', function() {
        blockCounter++;
        const uniqueID = Date.now();
        const defaultTitle = `${I18N_QBANK.blockDefault} ${blockCounter}`;

	    const newBlockHTML = `
	            <div class="block-card block-item" id="block-card-${uniqueID}" data-default-title="${defaultTitle}">
                <div class="block-header">
                    <h5 class="block-title"><i class="fas fa-cube"></i> <span class="block-title-text">${defaultTitle}</span></h5>
                    <input type="hidden" class="block-db-id" name="block_db_id_${uniqueID}" value="">
                    <button type="button" class="btn-delete" data-delete-block-trigger>
                        <i class="fas fa-trash"></i> ${I18N_QBANK.actionDelete}
                    </button>
                </div>
                <div class="block-body">
                    <div class="form-group">
                        <label>${I18N_QBANK.labelBlockName}:</label>
                        <input type="text" name="block_name_${uniqueID}" value="${defaultTitle}"
                               class="form-control-custom block-name-input" required>
                    </div>
                    <div class="form-group time-input-group">
                        <label><i class="far fa-clock"></i> ${I18N_QBANK.labelBlockTimeMinutes}:</label>
                        <input type="number" name="block_time_${uniqueID}" class="form-control-custom" placeholder="${I18N_QBANK.placeholderUnlimited}">
                    </div>
	                    ${QBANK_SHOW_BLOCK_PAINT ? `
	                        <div class="form-group">
	                            <label class="paint-setting-row">
	                                <input type="checkbox" name="block_enable_paint_${uniqueID}" ${QBANK_DEFAULT_BLOCK_PAINT_ENABLED ? 'checked' : ''}>
	                                <span class="paint-setting-check" aria-hidden="true">
	                                    <i class="fas fa-paint-brush"></i>
	                                </span>
	                                <span class="paint-setting-copy">
	                                    <span class="paint-setting-label">${I18N_QBANK.labelBlockEnablePaint}</span>
	                                    <span class="paint-setting-help">${I18N_QBANK.helpBlockEnablePaint}</span>
	                                </span>
	                            </label>
	                        </div>
	                    ` : ''}
                    ${renderAiBlockPanel(uniqueID, defaultTitle)}
                    <div class="form-group">
                        <label>${I18N_QBANK.labelQuestionsCopyPaste}:</label>
                        <textarea name="block_content_${uniqueID}" class="form-control-custom"
                                  data-written-question-textarea
                                  placeholder="${I18N_QBANK.placeholderQuestionText}"></textarea>
                        <small class="form-help-text">${I18N_QBANK.helpQuestionFormats}</small>
                    </div>
                </div>
            </div>
        `;

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = newBlockHTML.trim();
        const newBlock = tempDiv.firstElementChild;
        wrapper.appendChild(newBlock);

        if (window.initAiQuestionBankPanel) {
            newBlock.querySelectorAll('[data-ai-question-form]').forEach(window.initAiQuestionBankPanel);
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    wrapper.addEventListener('input', function(event) {
        if (event.target.classList.contains('block-name-input')) {
            updateBlockTitle(event.target.closest('.block-item'));
        }
    });

    wrapper.querySelectorAll('.block-item').forEach(updateBlockTitle);

    document.getElementById('bankForm').addEventListener('submit', function(e) {
        const inputs = document.querySelectorAll('.block-name-input');
        const names = [];
        let hasDuplicate = false;

        inputs.forEach(input => {
            const parentBlock = input.closest('.block-item');
            if (!parentBlock) return;

            const val = input.value.trim().toLowerCase();
            if (!val) return;

            if (names.includes(val)) {
                hasDuplicate = true;
                input.style.borderColor = 'red';
                alert(
                    I18N_QBANK.alertDuplicateBlockName
                        .replace("{block_name}", input.value)
                        .replace("{name}", input.value)
                );
            } else {
                input.style.borderColor = '#dfe6e9';
                names.push(val);
            }
        });

        if (hasDuplicate) e.preventDefault();
    });
});

function openDeleteModal(btn) {
    blockToDelete = btn.closest('.block-item');
    document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
    document.getElementById('deleteModal').style.display = 'none';
    blockToDelete = null;
}

function confirmDelete() {
    if (!blockToDelete) return;

    const dbIdInput = blockToDelete.querySelector('.block-db-id');
    const dbId = dbIdInput ? dbIdInput.value : '';

    if (dbId) {
        const deletedInput = document.getElementById('deleted_block_ids');
        const currentIds = deletedInput.value ? deletedInput.value.split(',') : [];
        currentIds.push(dbId);
        deletedInput.value = currentIds.join(',');
    }

    blockToDelete.remove();
    closeDeleteModal();
}

window.addEventListener('click', function(event) {
    const modal = document.getElementById('deleteModal');
    if (event.target === modal) closeDeleteModal();
});
</script>

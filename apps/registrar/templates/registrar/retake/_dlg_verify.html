{% load i18n %}
<p class="rt-dialog__subject" data-rt-text="who"></p>
<div class="ems-field">
    <label class="ems-field__label" for="rtVerifyRef">{% trans "Bank arayışı / ödəniş nömrəsi" context "registrar.retake" %} <span class="ems-field__opt">{% trans "(istəyə bağlı)" context "ui.dialog" %}</span></label>
    <input class="ems-input" type="text" id="rtVerifyRef" name="payment_reference" maxlength="120" autocomplete="off">
</div>
<div class="ems-field">
    <label class="ems-field__label" for="rtVerifyNote">{% trans "Qeyd" context "registrar.retake" %} <span class="ems-field__opt">{% trans "(istəyə bağlı)" context "ui.dialog" %}</span></label>
    <textarea class="ems-textarea" id="rtVerifyNote" name="note" rows="3" maxlength="2000"></textarea>
</div>

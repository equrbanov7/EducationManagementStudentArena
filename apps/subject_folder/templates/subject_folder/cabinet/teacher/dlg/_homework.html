{% load i18n %}
<div class="ems-field">
    <label class="ems-field__label" for="sfHwTitle">{% trans "Başlıq" context "subject_folder.ui" %} <span class="ems-field__req" aria-hidden="true">*</span></label>
    <input class="ems-input" type="text" id="sfHwTitle" name="title" maxlength="255" required>
</div>
{% include "subject_folder/cabinet/teacher/dlg/_topic_select.html" with topic_select_id="sfHwTopic" %}
<div class="ems-field">
    <label class="ems-field__label" for="sfHwText">{% trans "Tapşırığın şərti" context "subject_folder.ui" %}</label>
    <textarea class="ems-textarea" id="sfHwText" name="instructions" rows="6"></textarea>
</div>
{% include "subject_folder/cabinet/teacher/dlg/_limits.html" with limits_prefix="sfHw" %}
<label class="sfc-check">
    <input type="checkbox" name="is_published" value="1">
    <span>{% trans "Dərhal dərc et (təyin olunmuş qruplara bildiriş gedir)" context "subject_folder.ui" %}</span>
</label>

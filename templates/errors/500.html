<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Xətası | EMSArena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #ede9fe;
            --primary-dark: #4c1d95;
            --accent: #a78bfa;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #faf5ff 0%, #ede9fe 60%, #e0e7ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .error-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.1), 0 4px 20px rgba(0,0,0,0.06);
            padding: 3rem 2.5rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--primary);
        }

        .error-code {
            font-size: clamp(5rem, 18vw, 8rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .error-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }

        .error-desc {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-home {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-home:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
        }

        .btn-retry {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 0.75rem;
            padding: 0.7rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
        }

        .btn-retry:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        @media (max-width: 576px) {
            .error-card { padding: 2rem 1.25rem; border-radius: 1rem; }
            .btn-row { flex-direction: column; }
            .btn-home, .btn-retry { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="error-card mx-3">
        <div class="error-icon">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <div class="error-code">500</div>
        <h1 class="error-title">Server Xətası</h1>
        <p class="error-desc">
            Serverdə gözlənilməz bir xəta baş verdi.<br>
            Bir az sonra yenidən cəhd edin. Problem davam edərsə administrator ilə əlaqə saxlayın.
        </p>
        <div class="d-flex gap-3 flex-wrap justify-content-center btn-row">
            <a href="/" class="btn-home">
                <i class="fas fa-home"></i> Ana Səhifəyə Qayıt
            </a>
            <button onclick="location.reload()" class="btn-retry">
                <i class="fas fa-rotate-right"></i> Yenidən Cəhd Et
            </button>
        </div>
    </div>
</body>
</html>

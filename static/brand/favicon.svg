<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EMSArena">
  <defs>
    <linearGradient id="fvBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fvCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- White rounded tile background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#ffffff"/>
  <!-- Stadium/arena base -->
  <path d="M6 46 Q32 36 58 46 L54 56 Q32 47 10 56 Z" fill="url(#fvBase)"/>
  <!-- Graduation cap (big, central, bold silhouette) -->
  <polygon points="32,12 60,26 32,40 4,26" fill="url(#fvCap)"/>
  <rect x="22" y="36" width="20" height="9" rx="1.5" fill="url(#fvCap)"/>
  <!-- Tassel -->
  <line x1="56" y1="27" x2="56" y2="42" stroke="#1E3A8A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="56" cy="43.5" r="2.3" fill="#1E3A8A"/>
</svg>
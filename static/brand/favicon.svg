<?xml version="1.0" encoding="UTF-8"?>
<!--
  EMSArena — simplified favicon mark.
  Optimized to remain legible at 16×16 / 32×32 in browser tabs:
   - removed dashed network arc (vanishes at small sizes)
   - solid (non-gradient) stroke fills for crisp downscaling
   - thicker graduation cap, larger book/stage to fill viewBox
   - generous padding so anti-aliasing doesn't clip edges
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EMSArena">
  <defs>
    <linearGradient id="fvBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fvCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Rounded background tile for clarity on light & dark browser themes -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#ffffff"/>

  <!-- Stadium / arena base -->
  <path d="M8 44 Q32 34 56 44 L52 54 Q32 45 12 54 Z"
        fill="url(#fvBase)"/>

  <!-- Graduation cap (centered, bold silhouette) -->
  <polygon points="32,16 56,26 32,36 8,26" fill="url(#fvCap)"/>
  <rect x="26" y="32" width="12" height="8" rx="1.5" fill="url(#fvCap)"/>

  <!-- Tassel -->
  <line x1="52" y1="27" x2="52" y2="40" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="41.5" r="2" fill="#1E3A8A"/>
</svg>

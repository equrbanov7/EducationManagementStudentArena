# EMS Arena — Staging Inspection PostgreSQL
#
# Dedicated PostgreSQL instance for browsing legacy-migration rehearsal data
# through the real EMS Arena UI (see scripts/staging_inspect.sh and
# config/settings/staging_inspect.py).
#
# Deliberately a SEPARATE compose project from docker-compose.agent.yml:
# the agent sandbox's `clean` command runs `docker compose down -v` and must
# never be able to wipe rehearsal data. It also stays away from the repository
# .env contract by using STAGING_* variables with safe local defaults.
#
# The port is bound to 127.0.0.1 only — this database is never reachable from
# the LAN.

name: emsarena-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: emsarena-staging-pg
    # PERF-1 F-17 (2026-10-17): planlaşdırıcı parametrləri prod ilə EYNİ (docker-compose.prod.yml) — klonda
    # alınan EXPLAIN / QA vaxtları prod-a uyğun olsun. Defolt `random_page_cost=4` ilə jurnalın legacy-excuse
    # sorğusu 305 k sətirlik paralel seq scan seçirdi (14 ms; prod parametrləri ilə indeks, 0,7 ms). Yalnız
    # planlaşdırıcı / sorğu yaddaşı — `shared_buffers` kimi RAM ayıran parametrlər QƏSDƏN yoxdur.
    # Tətbiq: `docker compose -f docker-compose.staging.yml up -d` (konteyner yenidən yaranır, volume qalır).
    command:
      - postgres
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - effective_cache_size=${STAGING_POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${STAGING_POSTGRES_WORK_MEM:-16MB}
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-emsarena_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-emsarena_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD təyin edilməyib (.claude/staging.env)}
    ports:
      - "127.0.0.1:${STAGING_POSTGRES_PORT:-55433}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - emsarena-staging-network

networks:
  emsarena-staging-network:
    driver: bridge

volumes:
  staging_postgres_data:

[project]
name = "emsarena"
version = "0.1.0"
description = "EMS Arena Django application"
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 120
target-version = ['py311']
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | migrations
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations", "venv", ".venv", "__pycache__"]
known_django = ["django"]
known_first_party = ["apps", "core", "config"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "apps", "core"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    # PostgreSQL-only tests. RLS policies (and their fail-closed behaviour)
    # cannot be exercised on SQLite, so these tests must run against the
    # PostgreSQL service in CI. They also self-skip on non-PostgreSQL backends.
    #   Run only these:  pytest -m postgres
    #   Skip these:      pytest -m "not postgres"
    "postgres: test requires a PostgreSQL database (RLS / DB-engine specific)",
]

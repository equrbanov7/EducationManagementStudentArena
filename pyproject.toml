[project]
name = "emsarena"
version = "0.1.0"
description = "EMS Arena Django application"
requires-python = ">=3.11,<3.13"

[tool.black]
line-length = 120
target-version = ['py311']
extend-exclude = '''
/(
    \.git
    | \.claude
    | \.venv
    | venv
    | migrations
    | apps/syllabus/tests/e2e
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations", "venv", ".venv", "__pycache__"]
known_django = ["django"]
known_first_party = ["apps", "core", "config"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "apps", "core"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    # PostgreSQL-only tests. RLS policies (and their fail-closed behaviour)
    # cannot be exercised on SQLite, so these tests must run against the
    # PostgreSQL service in CI. They also self-skip on non-PostgreSQL backends.
    #   Run only these:  pytest -m postgres
    #   Skip these:      pytest -m "not postgres"
    "postgres: test requires a PostgreSQL database (RLS / DB-engine specific)",
    "mariadb: test requires a disposable MariaDB instance on loopback",
]

# ── Coverage measurement (FAZA 11) ─────────────────────────────────────────
# The global gate stays at 60% (see CI _unit-tests.yml --cov-fail-under). This
# section makes the measurement honest by excluding non-product code, and
# documents which modules are SECURITY-CRITICAL and should be held to a far
# higher bar during review (tenant isolation, RBAC, exam scoring, AI scoping).
[tool.coverage.run]
branch = true
source = ["apps", "core", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "*/__pycache__/*",
    "*/venv/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# SECURITY-CRITICAL modules — reviewers should require ~90%+ here even though
# the CI gate is a project-wide 60%:
#   core/rls.py                         — RLS context helpers
#   apps/organizations/middleware.py    — tenant resolution
#   apps/organizations/permissions.py   — RBAC permission checks
#   apps/exams/services/result_calculation.py — exam scoring
#   apps/ai_assistant/security.py       — AI input/output guards
#   apps/ai_assistant/context_builder.py — AI permission-scoped context
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
